学药品可自行处理。","o":{},"a":["错误"],"e":"成分不明的过期药品可能剧毒或易爆，自行丢弃会污染环境、伤人，应交学校统一收集处置。"},{"id":1228,"c":"化学安全","l":"II","t":2,"q":"国际劳工组织1990年6月通过的《作业场所安全使用化学品公约》即《170号公约》就化学品的危险性鉴别与分类、登记注册、加贴安全标签、向用户提供（安全技术）说明书,以及企业的责任和义务、工人的权利和义务、操作控制、培训、化学品转移、出口、废弃物处置等问题做出了具体的规定。","o":{},"a":["正确"],"e":"《170号公约》对化学品分类、标签、安全技术说明书、企业责任、工人培训及废弃物处置等作出了规定。"},{"id":1229,"c":"化学安全","l":"II","t":2,"q":"管内物质时,管口应朝向自己,以便看清楚反应过程。","o":{},"a":["错误"],"e":"与加热试管同理，管口朝向自己时喷出的热液会烫伤面部，应斜向无人处并微微开口。"},{"id":1230,"c":"化学安全","l":"II","t":2,"q":"购买剧毒物品要到校保卫处领取申请表,经批准后到化学品库领取","o":{},"a":["正确"],"e":"剧毒品采购须经保卫处审批、到化学品库领取并登记，全程受控可防止流入非法渠道。"},{"id":1231,"c":"化学安全","l":"II","t":2,"q":"购买剧毒化学品应通过保卫处审批,由后勤集团技术物资服务中心报公安部门批准后,实行采购、双人领用。","o":{},"a":["正确"],"e":"剧毒化学品属管制物品，采购要经保卫处审批、后勤报公安批准，且必须双人领用，防止流失中毒。"},{"id":1232,"c":"化学安全","l":"II","t":2,"q":"汞是一种可以在生物体内积累的毒物,它很容易被皮肤以及呼吸和消化道吸收。","o":{},"a":["正确"],"e":"汞排出慢，易在肝、肾、脑蓄积；汞蒸气经呼吸道吸收，也可经皮肤和消化道进入人体。"},{"id":1233,"c":"化学安全","l":"II","t":2,"q":"汞剂、苯胺类、硝基苯等可通过皮肤或粘膜吸收而使人中毒。","o":{},"a":["正确"],"e":"汞剂、苯胺、硝基苯都是脂溶性毒物，能穿透完整皮肤和黏膜入血，所以必须戴手套、防接触。"},{"id":1234,"c":"化学安全","l":"II","t":2,"q":"汞及其化合物、砷及其无机化合物、黄磷、碘甲烷、甲基丙烯酸甲酯、氰化物等具有剧毒性。","o":{},"a":["正确"],"e":"这些物质少量即可致严重中毒甚至死亡，属剧毒化学品，须按剧毒品管理、专柜双人保管。"},{"id":1235,"c":"化学安全","l":"II","t":2,"q":"汞、苯、铬酸盐和氰化物属于对人体具有极度危害的物质。","o":{},"a":["正确"],"e":"汞、苯、铬酸盐、氰化物都被列为极度危害物质，长期接触可致癌或损伤神经、造血系统。"},{"id":1236,"c":"化学安全","l":"II","t":2,"q":"工业生产中,酒精的危害主要为易燃性。","o":{},"a":["正确"],"e":"乙醇闪点低、蒸气易爆，工业使用中最主要的危险是火灾爆炸，毒性相对次要。"},{"id":1237,"c":"化学安全","l":"II","t":2,"q":"给液体加热时,可以先开始加热,等接近沸腾时才加入沸石","o":{},"a":["错误"],"e":"沸石必须加热前加。中途补加时液体已过热，投入的沸石会骤然汽化暴沸，带出热液伤人。"},{"id":1238,"c":"化学安全","l":"II","t":2,"q":"铬化合物中六价Cr毒性最大,有强刺激性,引起蛋白变性,干扰酶系统。","o":{},"a":["正确"],"e":"六价铬氧化性强、刺激腐蚀重，能使蛋白质变性并抑制酶活性，毒性远高于三价铬。"},{"id":1239,"c":"化学安全","l":"II","t":2,"q":"铬化合物中 Cr＋6毒性最大,有强刺激性,引起蛋白变性,干扰酶系统。","o":{},"a":["正确"],"e":"Cr⁶⁺即六价铬，强氧化、强刺激，会让蛋白变性、干扰酶系统，是铬化物中毒性最大的一种。"},{"id":1240,"c":"化学安全","l":"II","t":2,"q":"各种易燃、易爆、剧毒和腐蚀性的试剂,存量不应过多,最多不超过一周用量,严格领取手续,专人负责,登记造册,分类存放、防止丢失;","o":{},"a":["正确"],"e":"危险试剂存量大风险大，故限量一周用量、专人专账、分类存放，减少泄漏丢失和混存反应。"},{"id":1241,"c":"化学安全","l":"II","t":2,"q":"各种爆炸品的化学组成和性质决定了它具有发生爆炸的可能性,但如果没有必要的外界作用,爆炸也会发生。","o":{},"a":["错误"],"e":"爆炸需要外界作用（撞击、摩擦、热、火花）提供起爆能，没有外界作用不会自行爆炸。"},{"id":1242,"c":"化学安全","l":"II","t":2,"q":"各严格执行剧毒品“五双”管理制度,即使实验在进行中,也必须在取出实验使用量后立即存入保险柜,做好记录,严防疏漏。","o":{},"a":["正确"],"e":"剧毒品实行双人保管、双人收发、双人使用、双把锁、双本账的“五双”制度，余量须立即回柜。"},{"id":1243,"c":"化学安全","l":"II","t":2,"q":"各实验室在运送化学废弃物到各校区临时收集中转仓库之前,不得堆放在走廊、过道以及其它公共区域。","o":{},"a":["正确"],"e":"化学废弃物在送中转站前应放实验室指定暂存点，走廊过道属公共区域，堆放会妨碍疏散、污染环境。"},{"id":1244,"c":"化学安全","l":"II","t":2,"q":"各实验室对所产生的化学废弃物必须要实行集中分类存放,贴好标签,然后送学校中转站,统一处置。","o":{},"a":["正确"],"e":"废液废物要按性质分类收集、贴标签写明成分，集中送学校中转站统一处置，不得自行倾倒。"},{"id":1245,"c":"化学安全","l":"II","t":2,"q":"各单位不得私自购买、运输剧毒物品。","o":{},"a":["正确"],"e":"剧毒物品购销运输受公安管制，单位私自购买运输属违法，须审批后由有资质单位办理。"},{"id":1246,"c":"化学安全","l":"II","t":2,"q":"个人可以通过邮寄向危险化学品经营单位购买危险化学品。","o":{},"a":["错误"],"e":"危险化学品禁止邮寄，个人也不能随意购买，须由持证经营单位按规定渠道销售和运输。"},{"id":1247,"c":"化学安全","l":"II","t":2,"q":"个人不得购买剧毒化学品,也不可以购买灭鼠药、杀虫剂等农药产品","o":{},"a":["错误"],"e":"前半句对，但灭鼠药、杀虫剂等农药个人可按规定购买，并非一律禁止，所以整句表述错误。"},{"id":1248,"c":"化学安全","l":"II","t":2,"q":"高速离心机各转头有其使用的额定转速,使用时不能超过其额定转速","o":{},"a":["正确"],"e":"转速超过额定值，转头会因离心力过大而变形、破裂飞溅，必须按各转头标定转速使用。"},{"id":1249,"c":"化学安全","l":"II","t":2,"q":"钢瓶应放在通风避阳光处,并加以固定。","o":{},"a":["正确"],"e":"钢瓶受晒受热压力升高易爆，应放阴凉通风处并用链条或支架固定，防止倾倒砸坏瓶阀。"},{"id":1250,"c":"化学安全","l":"II","t":2,"q":"干燥箱和恒温箱的使用温度不能超过最高允许温度。","o":{},"a":["正确"],"e":"超温会损坏温控元件、烤焦样品甚至引起火灾，使用温度必须低于设备标称的最高允许温度。"},{"id":1251,"c":"化学安全","l":"II","t":2,"q":"腐蚀和刺激性药品,如强酸、强碱、氨水、过氧化氢、冰醋酸等,取用时尽可能戴上橡皮手套和防护眼镜,倾倒时,切勿直对容器口俯视,吸取时,应该使用橡皮球。开启有毒气体容器时应戴防毒用具。禁止手直接拿取上述物品","o":{},"a":["正确"],"e":"酸碱等腐蚀品伤人重，取用要戴手套眼镜、不俯视瓶口、用洗耳球吸取，禁止手直接接触。"},{"id":1252,"c":"化学安全","l":"II","t":2,"q":"酚与皮肤发生接触者,应立即脱去被污染的衣物,用10％酒精反复擦拭,再用大量清水冲洗,直至无酚味为止,然后用饱和硫酸钠湿敷。灼伤面积大,且酚在皮肤表面滞留时间较长者,应注意是否存在吸人中毒的问题,并积极处理。","o":{},"a":["正确"],"e":"酚易溶于酒精又能透皮吸收，先用酒精擦去再大量水冲，硫酸钠促其成盐；面积大要警惕吸收中毒。"},{"id":1253,"c":"化学安全","l":"II","t":2,"q":"分光光度计的一对比色皿坏了一只,可以借用其他仪器上的一只比色皿代替","o":{},"a":["错误"],"e":"比色皿必须成对匹配，同材质、同光程、透过率一致；随便借用会让空白和样品条件不一致，结果失真。"},{"id":1254,"c":"化学安全","l":"II","t":2,"q":"废物、 浓酸或浓碱废液等倒入水槽, 只要加大量的自来水将之冲稀即可。","o":{},"a":["错误"],"e":"浓酸浓碱倒水槽会腐蚀管道并剧烈放热，废物应分类收集交专门处置，不能靠加水冲稀了事。"},{"id":1255,"c":"化学安全","l":"II","t":2,"q":"凡涉及有害或有刺激性气体的实验应在通风柜内进行。","o":{},"a":["正确"],"e":"通风柜能把有毒蒸气及时排走，涉及有害、刺激性气体的操作都应在柜内进行并保证面风速。"},{"id":1256,"c":"化学安全","l":"II","t":2,"q":"发生危险化学品事故后,应该向上风方向疏散。","o":{},"a":["正确"],"e":"上风方向毒气浓度低，顺风跑会一直处在污染气流中，所以疏散要往风来的方向走。"},{"id":1257,"c":"化学安全","l":"II","t":2,"q":"发生剧毒化学品被盗、丢失、误售、误用后必须立即向当地公安部门报告而触犯刑律的,否则对负有责任的主管人员和其他直接责任人员依照刑法追究刑事责任。","o":{},"a":["正确"],"e":"剧毒品被盗、丢失、误售、误用须立即报公安；隐瞒不报造成后果的，责任人依刑法追究刑责。"},{"id":1258,"c":"化学安全","l":"II","t":2,"q":"发生化学事故后,应向上风或侧上风方向迅速撤离现场。","o":{},"a":["正确"],"e":"侧上风方向既避开毒气扩散带又便于快速转移，是化学事故撤离的通行原则。"},{"id":1259,"c":"化学安全","l":"II","t":2,"q":"二氧化硫、三氧化硫、挥发性酸类、氨水对皮肤粘膜和眼、鼻、喉粘膜都有很强的刺激性。","o":{},"a":["正确"],"e":"这些气体多呈强酸性或强碱性，遇黏膜水分即造成灼伤和炎症，故对眼、鼻、喉刺激很强。"},{"id":1260,"c":"化学安全","l":"II","t":2,"q":"对于易燃化学品,在往容器中倾倒时应保持一定速度,不可过快,避免产生静电。","o":{},"a":["正确"],"e":"快速倾倒易产生静电积聚，放电遇易燃蒸气就着火，控制流速能减少静电产生。"},{"id":1261,"c":"化学安全","l":"II","t":2,"q":"对于易产生粉尘、蒸汽、腐蚀性气体的库房,应使用密闭的防护措施","o":{},"a":["正确"],"e":"粉尘、蒸气、腐蚀性气体必须密闭或局部排风，防止外逸污染环境、腐蚀设备、危害人员。"},{"id":1262,"c":"化学安全","l":"II","t":2,"q":"对于无机酸类废液,实验室可以收集后进行如下处理:将废酸慢慢倒入过量的含碳酸钠或氢氧化钙的水溶液中（或用废碱）互相中和,再用大量水冲洗。","o":{},"a":["正确"],"e":"废酸用碳酸钠、氢氧化钙或废碱中和至近中性，再大量水稀释，可避免腐蚀下水道。"},{"id":1263,"c":"化学安全","l":"II","t":2,"q":"对于氢氧化钠、氨水等废液可以进行如下处理:用6mol/L盐酸水溶液中和,再用大量水冲洗。","o":{},"a":["正确"],"e":"用6 mol/L盐酸中和氢氧化钠、氨水等碱液，边加边测pH到中性，再大量水稀释排放。"},{"id":1264,"c":"化学安全","l":"II","t":2,"q":"对于含氰废液可以进行处理:加入氢氧化钠使pH值10以上,加入过量的高锰酸钾（3%）溶液,使CN根氧化分解。CN根含量高时,可加入过量的次氯酸钙和氢氧化钠溶液。","o":{},"a":["正确"],"e":"pH 10以上时次氯酸钙或高锰酸钾把CN⁻氧化为氰酸盐，消除剧毒，操作须在通风柜内进行。"},{"id":1265,"c":"化学安全","l":"II","t":2,"q":"对于含汞、砷、锑、铋等离子的废液,实验室可以先进行如下处理:控制酸度0.3mol/L[H+],使其生成硫化物沉淀。","o":{},"a":["正确"],"e":"控制酸度约0.3 mol/L后加硫化钠或通硫化氢，使汞、砷、锑、铋生成难溶硫化物沉淀除去。"},{"id":1266,"c":"化学安全","l":"II","t":2,"q":"对于含氟废液可以进行如下处理:加入石灰使生成氟化钙沉淀。","o":{},"a":["正确"],"e":"石灰中的钙与氟生成难溶的氟化钙沉淀，可把废液中氟离子降下来再排放。"},{"id":1267,"c":"化学安全","l":"II","t":2,"q":"对化（实）验室的各种设备,应经常检查、测定、调试、防止因仪器,仪表失灵发生事故;","o":{},"a":["正确"],"e":"仪器仪表失灵是常见事故隐患，定期检查、测定、调试能及早发现问题，保证设备安全运行。"},{"id":1268,"c":"化学安全","l":"II","t":2,"q":"对含有悬浮物质的溶液加热时,应加沸石或玻璃珠,以避免爆沸现象产生。","o":{},"a":["正确"],"e":"沸石、玻璃珠提供汽化中心，让沸腾平稳，防止过热液体突然暴沸冲出伤人。"},{"id":1269,"c":"化学安全","l":"II","t":2,"q":"对固态酸、碱可用手直接操作。","o":{},"a":["错误"],"e":"固态酸碱同样腐蚀皮肤，遇汗液溶解后更强，必须用镊子、药匙等工具取用，不能用手。"},{"id":1270,"c":"化学安全","l":"II","t":2,"q":"对固态的酸、碱进行处理时,必须使用工具辅助操作,不得用手直接操作","o":{},"a":["正确"],"e":"用镊子、药匙取固体酸碱，既防手被腐蚀灼伤，也避免手上的汗液污物污染试剂。"},{"id":1271,"c":"化学安全","l":"II","t":2,"q":"当移液器吸头中含有液体时,可以将移液器水平放置。","o":{},"a":["错误"],"e":"吸头有液体时水平放，液体会倒流进移液器内部，腐蚀污染活塞，应垂直挂在架上。"},{"id":1272,"c":"化学安全","l":"II","t":2,"q":"当酸或碱溅入眼睛时,不必采取应急处理,只要立即送附近医院救治。","o":{},"a":["错误"],"e":"溅入眼睛必须立即用大量清水冲洗至少15分钟再去医院；只送医不冲洗会加重灼伤。"},{"id":1273,"c":"化学安全","l":"II","t":2,"q":"当水银仪器破损时,应尽量将洒落的水银收集起来,并在残迹处洒上硫磺粉","o":{},"a":["正确"],"e":"汞珠用吸管、锡箔收集，残迹撒硫磺粉使其生成硫化汞，减少蒸发吸入。"},{"id":1274,"c":"化学安全","l":"II","t":2,"q":"当皮肤沾上浓硫酸时,应立即用水冲洗,再用 3%-5%的碳酸氢钠溶液洗,最后用水洗。","o":{},"a":["错误"],"e":"浓硫酸遇水放出大量热，直接冲水会加重灼伤，应先用干布吸去再大量流水冲，不能先中和。"},{"id":1275,"c":"化学安全","l":"II","t":2,"q":"当可燃烧液体呈流淌状燃烧时,应将灭火剂的喷流对准火焰根部由近而远并左右扫射,向前快速推进,直至火焰扑灭","o":{},"a":["正确"],"e":"流淌火要顺流淌方向由近及远、左右扫射根部推进，逐步压缩火区，防止复燃。"},{"id":1276,"c":"化学安全","l":"II","t":2,"q":"当可燃气体、可燃液体的蒸气（或可燃粉尘）在空气中达到一定浓度时,遇到火源就会发生爆炸。这个能够发生爆炸的浓度范围,叫做爆炸极限。","o":{},"a":["正确"],"e":"可燃气体、蒸气或粉尘只有在一定浓度范围内遇火源才爆炸，这个范围就是爆炸极限。"},{"id":1277,"c":"化学安全","l":"II","t":2,"q":"当发生强碱溅洒事故时,应用固体硼酸粉撒盖溅洒区,扫净并报告有关工作人员。","o":{},"a":["正确"],"e":"强碱可用弱酸性硼酸粉中和，撒盖后清扫并报告，避免残液继续腐蚀地面或伤人。"},{"id":1278,"c":"化学安全","l":"II","t":2,"q":"氮的氧化物、二氧化硫、三氧化硫、挥发性酸类、氨水对皮肤粘膜和眼、鼻、喉粘膜都有很强的刺激性。","o":{},"a":["正确"],"e":"氮氧化物、硫氧化物、挥发性酸和氨水都是强刺激性气体，对眼、鼻、喉黏膜损伤明显。"},{"id":1279,"c":"化学安全","l":"II","t":2,"q":"打开易挥发或浓酸、浓碱试剂的瓶塞时,瓶口不要对着脸部或其他人,宜在通风橱中进行。","o":{},"a":["正确"],"e":"开瓶塞瞬间会逸出蒸气，瓶口对人易喷溅伤人，所以要在通风橱内开、瓶口朝无人处。"},{"id":1280,"c":"化学安全","l":"II","t":2,"q":"打开封闭管或紧密塞着的容器时,注意其内部是否有压力,容器口不得对人,避免发生喷液或爆炸事故。","o":{},"a":["正确"],"e":"封闭容器内可能有压力，开盖前先确认，让瓶口避开人并缓慢泄压，防喷液或爆裂。"},{"id":1281,"c":"化学安全","l":"II","t":2,"q":"打开氨水、硝酸、盐酸等药品瓶封口时,应先盖上湿布,用冷水冷却后再开瓶塞,以防溅出,尤其在夏天更应注意。","o":{},"a":["正确"],"e":"氨水、硝酸、盐酸挥发性强，夏天瓶内压力大，先盖湿布、冷水降温再开塞可防喷溅。"},{"id":1282,"c":"化学安全","l":"II","t":2,"q":"存有易燃易爆物品的实验室禁止使用明火,如需加热可使用封闭式电炉、加热套或可加热磁力搅拌器","o":{},"a":["正确"],"e":"明火易点燃易燃蒸气，改用封闭式电炉、加热套或加热磁力搅拌器，无裸露电热丝更安全。"},{"id":1283,"c":"化学安全","l":"II","t":2,"q":"醋酸蒸汽与空气混合不会在热源的诱发下引起爆炸。","o":{},"a":["错误"],"e":"醋酸蒸气与空气能形成爆炸性混合气，遇热源、火花可闪燃爆炸，它属于可燃蒸气。"},{"id":1284,"c":"化学安全","l":"II","t":2,"q":"从事严重有毒作业和特别繁重体力劳动的工种,应适当缩短工作时间,一般每天要实行4至6小时工作制","o":{},"a":["正确"],"e":"有毒和特别繁重体力岗位应缩短工时，一般每天4至6小时，减少毒物累积和疲劳损伤。"},{"id":1285,"c":"化学安全","l":"II","t":2,"q":"从事化（实）验的人员,应熟悉各种化学试剂的名称、性质和使用、保管方法,掌握化（实）验过程中的操作顺序和方法,以及化（实）验室内各种仪器、仪表等设备的性能;","o":{},"a":["正确"],"e":"实验人员要懂试剂性质、操作顺序和设备性能，才能预判风险、正确处理异常情况。"},{"id":1286,"c":"化学安全","l":"II","t":2,"q":"储存在冰箱内的所有容器,应当清楚地标明内装物品的品名、储存日期和储存者的姓名。","o":{},"a":["正确"],"e":"冰箱内容器易混淆，标明品名、日期和姓名便于识别追溯，防止误用和超期存放。"},{"id":1287,"c":"化学安全","l":"II","t":2,"q":"储存化学危险物品,应当 （1）化学危险物品应按性质分类存放,架与垛之间应当留有一定安全距离,不得超量储存; （2）遇火、遇潮容易燃烧、爆炸或生产有毒气体的化学危险物品,不得在露天、潮湿、漏雨和低洼容易积水的地点存放; （3）受阳光照射容易燃烧、爆炸或产生有毒气体的化学危险物品和桶装、缸装等易燃液体、气体应当在阴凉通风地点存放; （4）化学性质或防护、灭火方法相互抵触的化学危险物品,不得在同一仓库或同一储存室内存放。","o":{},"a":["正确"],"e":"危化品储存要分类、限量、留间距，避火避潮避晒，性质抵触的不得同库，防止相互反应。"},{"id":1288,"c":"化学安全","l":"II","t":2,"q":"除非有防爆措施,否则冰箱内不能放置易燃、易爆物品,冰箱门上应注明这一点。","o":{},"a":["正确"],"e":"普通冰箱内部有电火花，易燃蒸气积聚遇火花会爆炸；无防爆措施不得存放，门上应注明。"},{"id":1289,"c":"化学安全","l":"II","t":2,"q":"常用的化学试剂如:苯、乙醚、甲苯、汽油、丙酮、甲醇和煤油均属于易燃物质","o":{},"a":["正确"],"e":"苯、乙醚、甲苯、汽油、丙酮、甲醇、煤油闪点低、易挥发，都是易燃液体，须远离火源。"},{"id":1290,"c":"化学安全","l":"II","t":2,"q":"常见的引起呼吸道中毒的物质,一般是易挥发的有机溶剂（如:乙醚、丙酮、甲苯等）或化学反应所产生的有毒气体（如:氰化氢、氯气、一氧化碳等）。","o":{},"a":["正确"],"e":"易挥发有机溶剂蒸气和反应生成的有毒气体经呼吸道吸入，是实验室中毒最常见的途径。"},{"id":1291,"c":"化学安全","l":"II","t":2,"q":"采取有毒、有腐蚀性、有刺激性的样品,必须戴防毒面具,置换气体应注意排至室外,防止中毒。进容器内取样,应有人监护。 取样时,人应站在下风向侧面。取样后,应将阀门关严。","o":{},"a":["错误"],"e":"取样应站在上风向，让风把毒气吹离人体；站下风向侧面正好吸入逸出的有毒气体。"},{"id":1292,"c":"化学安全","l":"II","t":2,"q":"不要向浓酸特别是浓硫酸中注水,这是由于过量产生的热会导致喷溅或玻璃容器破裂。","o":{},"a":["正确"],"e":"浓硫酸稀释放出大量热，水入酸会局部沸腾飞溅，正确做法是把酸缓慢倒入水中并搅拌。"},{"id":1293,"c":"化学安全","l":"II","t":2,"q":"不能在纸上称量过氧化钠","o":{},"a":["正确"],"e":"过氧化钠强氧化，遇水或有机物剧烈反应，纸上称量摩擦生热可能引燃，应用玻璃器皿称。"},{"id":1294,"c":"化学安全","l":"II","t":2,"q":"不能在敞口容器中存放易燃易爆物质。","o":{},"a":["正确"],"e":"敞口存放时易燃液体不断挥发，与空气形成爆炸性混合气，遇火源即着火爆炸。"},{"id":1295,"c":"化学安全","l":"II","t":2,"q":"不能将乙醚等易挥发品放入普通冰箱,否则由于挥发气体不断溢出,而普通冰箱启动时有电火花出现,就有可能引起火灾。","o":{},"a":["正确"],"e":"乙醚沸点低、蒸气重且易燃，普通冰箱启动产生电火花，可能点燃积聚的乙醚蒸气。"},{"id":1296,"c":"化学安全","l":"II","t":2,"q":"不得使用过期、未经检验和不合格的气体钢瓶。","o":{},"a":["正确"],"e":"超期、未检或不合格钢瓶耐压没保证，可能泄漏甚至爆炸，必须定期检验合格才能使用。"},{"id":1297,"c":"化学安全","l":"II","t":2,"q":"玻璃器皿都可以加热使用。","o":{},"a":["错误"],"e":"玻璃器皿分硬质和普通，量筒、普通玻璃瓶不宜加热，受热不均会炸裂，加热要用耐热烧器。"},{"id":1298,"c":"化学安全","l":"II","t":2,"q":"玻璃电极初次使用前,必须在蒸馏水中浸泡数日,平时也应浸泡在蒸馏水中备用。","o":{},"a":["正确"],"e":"玻璃电极球泡需水化形成水化层才有响应，干放会失活，首次和平时都应浸泡在蒸馏水中。"},{"id":1299,"c":"化学安全","l":"II","t":2,"q":"玻璃电极不要与强吸水的溶剂接触太久。在强碱溶液中,应快速操作,用毕立即用水冲。","o":{},"a":["正确"],"e":"强吸水溶剂会破坏电极水化层，强碱腐蚀玻璃膜，所以接触要快、用后立即用水冲净。"},{"id":1300,"c":"化学安全","l":"II","t":2,"q":"丙酮、氢氧化钠、氨等具有低毒性。","o":{},"a":["正确"],"e":"丙酮、氢氧化钠、氨属低毒或刺激性物质，但仍有刺激和吸入风险，需通风、避免直接接触。"},{"id":1301,"c":"化学安全","l":"II","t":2,"q":"冰箱内禁止存放危险化学物品,如果确需存放,则必须注意容器绝对密封,严防泄漏","o":{},"a":["正确"],"e":"冰箱密闭又有电火花，危险化学品挥发易积聚，确需存放必须容器绝对密封、严防泄漏。"},{"id":1302,"c":"化学安全","l":"II","t":2,"q":"比较常见的引起呼吸道中毒的物质,一般是易挥发的有机溶剂（如:乙醚、丙酮、甲苯等）或化学反应所产生的有毒气体（如:氰化氢、氯气、一氧化碳等）","o":{},"a":["正确"],"e":"易挥发有机溶剂，以及氰化氢、氯气、一氧化碳等有毒气体，是呼吸道中毒的主要来源。"},{"id":1303,"c":"化学安全","l":"II","t":2,"q":"苯乙烯、甲醇、甲苯、二甲苯、三氯乙烯、苯酚等具有中等毒性。","o":{},"a":["正确"],"e":"苯乙烯、甲醇、甲苯、二甲苯、三氯乙烯、苯酚属中等毒性，可经呼吸道和皮肤吸收。"},{"id":1304,"c":"化学安全","l":"II","t":2,"q":"苯胺类、硝基苯等可通过皮肤或粘膜吸收而使人中毒。","o":{},"a":["正确"],"e":"苯胺、硝基苯是脂溶性毒物，能透过皮肤和黏膜吸收，是典型的经皮中毒物质。"},{"id":1305,"c":"化学安全","l":"II","t":2,"q":"苯、四氯化碳、乙醚、硝基苯等蒸汽经常久吸会使人嗅觉减弱","o":{},"a":["正确"],"e":"长期吸入苯、四氯化碳、乙醚、硝基苯蒸气会损害嗅神经，使人嗅觉迟钝甚至丧失。"},{"id":1306,"c":"化学安全","l":"II","t":2,"q":"苯、三硝基甲苯、二硫化碳、丙烯腈、四氯化碳、甲醛、苯胺、氯丙烯、溴甲烷、环氧氯丙烷、光气、一氧化碳等具有高毒性。","o":{},"a":["正确"],"e":"这些物质毒性高，可损害血液、肝、肾和神经系统，须密闭操作、严格个体防护。"},{"id":1307,"c":"化学安全","l":"II","t":2,"q":"被酸灼伤后立即用大量流动清水冲洗,冲洗时间一般不少于15min。彻底冲洗后,可用2％～5％碳酸氢钠溶液、淡石灰水、肥皂水等进行中和,切忌未经大量流水彻底冲洗,就用碱性药物在皮肤上直接中和,这会加重皮肤的损伤。处理以后创面治疗按灼伤处理原则进行。","o":{},"a":["正确"],"e":"酸灼伤先大量流水冲15分钟以上再考虑中和；没冲净就用药中和会放热，反而加重损伤。"},{"id":1308,"c":"化学安全","l":"II","t":2,"q":"爆炸是所有化学危险品的一个重要性质。","o":{},"a":["错误"],"e":"爆炸只是爆炸品、易燃气体等部分危险品的性质，并不是所有化学危险品都具爆炸性。"},{"id":1309,"c":"化学安全","l":"II","t":2,"q":"半数致死量(LD50)又称为半数致死浓度,是指药物能引起一群实验动物50%死亡所需的剂量或浓度,用于药物的毒性分级,单位为mg/kg。","o":{},"a":["正确"],"e":"LD50是以死亡为终点的半数致死量，数值越小毒性越大，用于毒物分级。"},{"id":1310,"c":"化学安全","l":"II","t":2,"q":"按国家有关规定处理有毒、带菌、腐蚀性的废气、废水和废物,集中统一处理放射性废物,谨防污染环境。","o":{},"a":["正确"],"e":"有毒、带菌、腐蚀性废物及放射性废物须按规定分类收集、集中处置，防止污染环境。"},{"id":1311,"c":"化学安全","l":"II","t":2,"q":"安瓿瓶最好在超低温冰柜或干冰中保存。","o":{},"a":["正确"],"e":"安瓿熔封后内容物受温度影响易变化，放超低温冰柜或干冰中保存可保持稳定、减少分解。"},{"id":1312,"c":"化学安全","l":"II","t":2,"q":"SO2易溶于水,大量吸入会引起喉水肿,肺水肿、窒息。","o":{},"a":["正确"],"e":"SO2易溶于水生成亚硫酸，大量吸入可引起喉水肿、肺水肿甚至窒息，操作须通风防护。"},{"id":1313,"c":"化学安全","l":"II","t":2,"q":"SnCl2、FeSO4、Na2SO3 与空气接触易逐渐被氧化,须密封保存。","o":{},"a":["正确"],"e":"SnCl2、FeSO4、Na2SO3有还原性，接触空气会逐渐被氧化变质，必须密封隔绝空气保存。"},{"id":1314,"c":"化学安全","l":"II","t":2,"q":"NO2 比较稳定,不易溶于水,室温下无色","o":{},"a":["错误"],"e":"NO2是红棕色、有刺激性气味的气体，易溶于水生成硝酸和亚硝酸，性质活泼，并非无色稳定。"},{"id":1315,"c":"化学安全","l":"II","t":2,"q":"NH4NO3受热后易分解,但放出的气体无害。","o":{},"a":["错误"],"e":"硝酸铵受热分解会放出氮氧化物、氨等有毒气体，量大或密闭时还可能爆炸，气体并非无害。"},{"id":1316,"c":"化学安全","l":"II","t":2,"q":"NaCN、KCN、As2O3、HgO、Na3P、BaCl2、BaSO4、BeO、BeCl2、V2O5都是剧毒化学试剂。","o":{},"a":["错误"],"e":"BaSO4难溶、基本无毒，不是剧毒品；只有可溶性钡盐才剧毒，把它列进剧毒品清单不对。"},{"id":1317,"c":"化学安全","l":"II","t":2,"q":"Na、K、电石、金属氢化物不能与水及空气接触,须密闭保存。","o":{},"a":["正确"],"e":"钠、钾、电石、金属氢化物遇水放出氢或乙炔并放热，易着火爆炸，须密闭隔绝水汽保存。"},{"id":1318,"c":"化学安全","l":"II","t":2,"q":"Hg中毒会引起失眠、多梦、抑郁、胸闷、心悸、多汗、恶心、牙龈出血。","o":{},"a":["正确"],"e":"慢性汞中毒典型表现是易兴奋、失眠多梦、心悸多汗、牙龈出血，还可有肾损害。"},{"id":1319,"c":"化学安全","l":"II","t":2,"q":"Hg通常经过皮肤和消化道进入人体","o":{},"a":["错误"],"e":"金属汞主要经呼吸道吸入汞蒸气进入人体，皮肤和消化道的吸收量很少，说法颠倒了。"},{"id":1320,"c":"化学安全","l":"II","t":2,"q":"Hg、As、Pb等急性中毒会引起牙龈出血、牙齿松动、恶心、呕吐、腹痛、腹泻等症状。","o":{},"a":["正确"],"e":"汞、砷、铅急性中毒常见口腔炎、牙龈出血、牙齿松动，以及恶心呕吐、腹痛腹泻等。"},{"id":1321,"c":"化学安全","l":"II","t":2,"q":"Hg 中毒严重时会导致震颤、动作困难、肢体抖动。","o":{},"a":["正确"],"e":"汞中毒累及小脑和神经，严重时出现震颤、写字和精细动作困难、肢体抖动。"},{"id":1322,"c":"化学安全","l":"II","t":2,"q":"Hg 中毒会引起失眠、多梦、抑郁、胸闷、心悸、多汗、恶心、牙龈出血。","o":{},"a":["正确"],"e":"慢性汞中毒可有失眠多梦、情绪抑郁、胸闷心悸、多汗和牙龈出血等神经精神症状。"},{"id":1323,"c":"化学安全","l":"II","t":2,"q":"HCN进入机体,抑制呼吸酶作用,造成细胞内窒息,从而引起组织中毒性缺氧,全身性中毒症状。","o":{},"a":["正确"],"e":"HCN抑制细胞色素氧化酶，阻断电子传递，造成细胞内窒息和组织缺氧，全身中毒进展快。"},{"id":1324,"c":"化学安全","l":"II","t":2,"q":"H2O2、AgNO3、AgCl、KMnO4、草酸见光易分解,应置于棕色瓶内,放在阴凉避光处。","o":{},"a":["正确"],"e":"这些试剂见光容易分解变质，须盛于棕色瓶并放在阴凉避光处保存，避免阳光直射。"},{"id":1325,"c":"化学安全","l":"II","t":2,"q":"Cl2和CO作用生成的光气毒性比Cl2大。","o":{},"a":["正确"],"e":"光气（COCl2）毒性远高于氯气，吸入后潜伏期长，可致肺水肿，属窒息性毒气。"},{"id":1326,"c":"化学安全","l":"II","t":2,"q":"4—二硝基苯甲醚、萘、二硝基萘等是能升华的易燃固体,受热发出易燃蒸气。火灾时可用雾状水、泡沫扑救并切断火势蔓延途径,但不能以为明火被扑灭即已完成灭火工作,因为受热以后升华的易燃蒸气能在不知不觉中飘逸,在上层与空气形成爆炸性混合物,尤其是在室内,极易发生爆炸。因此,扑救这类物品火灾时千万不能被假象所迷惑,在扑救过程中应不时向燃烧区域的上空及周围喷射雾状水,并用水浇灭燃烧区域及其周围的一切火源。","o":{},"a":["正确"],"e":"这类固体受热升华出易燃蒸气，明火扑灭后蒸气仍可能积聚爆炸，所以要持续喷水冷却、清除火源。"},{"id":1327,"c":"机械安全","l":"II","t":0,"q":"装卸刀具和切削工件时均要先锁紧（ ）。","o":{"A":"尾座","B":"尾座套筒","C":"方刀架"},"a":["C"],"e":"装刀、夹工件前都要把方刀架锁紧，否则刀架受切削力会转动，刀具或工件突然移位，容易撞伤手和机床。"},{"id":1328,"c":"机械安全","l":"II","t":0,"q":"在铣削中清理切屑时,应使用（ ）。","o":{"A":"手","B":"毛刷","C":"棉丝","D":"吹气"},"a":["B"],"e":"铣削切屑锋利还可能带热，用手抓易割伤，吹气会把铁屑吹进眼睛，棉丝易被刀具卷住，用毛刷清理最安全。"},{"id":1329,"c":"机械安全","l":"II","t":0,"q":"在铣床上装卸工件时,工作台位置应保证（ ）。","o":{"A":"刀具在工件左方","B":"刀具在工件右方","C":"刀具尽量远离工件","D":"在对刀位置"},"a":["C"],"e":"装夹时把工作台移开，让刀具尽量远离工件，手在装夹时才不会碰到旋转刀具，也不会被突然进给撞伤。"},{"id":1330,"c":"机械安全","l":"II","t":0,"q":"在铣床快速进给时,应注意（ ）。","o":{"A":"刻度盘","B":"主轴转速","C":"刀具与工件的位置","D":"刀具旋转方向"},"a":["C"],"e":"快速进给速度快、行程大，必须盯住刀具与工件的相对位置，位置不当会撞刀撞工件，损坏机床甚至崩出碎片伤人。"},{"id":1331,"c":"机械安全","l":"II","t":0,"q":"铣削不规则工件时,不规则工件的（ ）应尽量放在夹具中间部位。","o":{"A":"窄端","B":"宽端","C":"中心","D":"重心"},"a":["D"],"e":"把不规则工件的重心落在夹具中间，夹紧后受力均衡，工件不易翘起或甩动，加工更稳，也能防止工件飞出伤人。"},{"id":1332,"c":"机械安全","l":"II","t":0,"q":"铣床对刀时,应保证（ ）。","o":{"A":"刀具静止,工件快速进给","B":"刀具旋转,工件慢速手动进给","C":"刀具静止,工件慢速进给","D":"刀具旋转,工件快速手动进给"},"a":["B"],"e":"对刀要让刀具先转起来才能判断接触情况，工件只能慢速手动靠近，进给快了容易撞刀、崩刃伤人。"},{"id":1333,"c":"机械安全","l":"II","t":0,"q":"数控电火花线切割机床在正常加工时突然钼丝折断,应（ ）。","o":{"A":"关闭机床总电源","B":"关闭运丝电源","C":"关闭实验室总电源"},"a":["B"],"e":"钼丝折断后立即切断运丝电源，丝筒停转，避免断丝乱甩或继续放电，再报告老师处理；不必关总电源。"},{"id":1334,"c":"机械安全","l":"II","t":0,"q":"数控电火花线切割机床在正常加工时,突然有烧焦气味从机床电器柜中传出,应（ ）。","o":{"A":"顺着烧焦味道查找","B":"用专用灭火器向电器柜喷射","C":"不与理睬继续加工","D":"关闭机床总电源后查找原因"},"a":["D"],"e":"电器柜冒焦味多是短路或过热，先切断总电源阻止起火和触电，再排查原因；带电查找或盲目喷射都很危险。"},{"id":1335,"c":"机械安全","l":"II","t":0,"q":"焊接实习场地应按（ ）标准建设。","o":{"A":"工业环境标准的规定","B":"实验室环境标准规定","C":"人居环境标准的规定"},"a":["B"],"e":"教学焊接实习属于实验室场所，按实验室环境标准建设，通风、排烟、消防等设施才能满足师生安全需要。"},{"id":1336,"c":"机械安全","l":"II","t":0,"q":"电弧焊的焊接电源输出空载电压大于（ ）。","o":{"A":"电压220伏","B":"电压110伏","C":"安全电压36伏","D":"绝对安全电压12伏"},"a":["C"],"e":"电弧焊空载电压通常在六十到九十伏，远高于三十六伏安全电压，所以焊工必须穿绝缘鞋、戴手套，防止触电。"},{"id":1337,"c":"机械安全","l":"II","t":0,"q":"当发现眼睛可能进了铁屑,应（ ）。","o":{"A":"坚持实习,下班后上医院","B":"先告诉指导教师,尽快上医院检查","C":"坚持实习,不是特别难受就不上医院"},"a":["B"],"e":"铁屑入眼不能揉也不能硬撑，先报告指导教师，尽快由医生取出，自己处理容易划伤角膜、造成感染。"},{"id":1338,"c":"机械安全","l":"II","t":0,"q":"车削开始前要进行极限位置检查的原因是（ ）。","o":{"A":"防止卡盘与刀架或车刀相撞","B":"防止工件伸出长度不够","C":"防止工件因装卡不正而跳动"},"a":["A"],"e":"开车前试走极限位置，确认卡盘、刀架和车刀不会相撞，可避免高速旋转时撞车、崩刀伤人。"},{"id":1339,"c":"机械安全","l":"II","t":0,"q":"安装细长工件应配合采用（ ）,防止工件弯曲伤人。","o":{"A":"跟刀架","B":"尾架","C":"中心架"},"a":["B"],"e":"细长工件刚性差，一端用尾架顶尖顶住，能减少弯曲和振动，防止工件甩弯、飞出伤人。"},{"id":1340,"c":"机械安全","l":"II","t":1,"q":"自动加工前应先做好（ ）。","o":{"A":"装夹工件","B":"传输程序","C":"设置工件坐标系","D":"模拟加工"},"a":["A","B","C","D"],"e":"自动加工前四步都要做：先装夹工件，再传输程序、设定工件坐标系，最后模拟走刀确认无误，缺一不可。"},{"id":1341,"c":"机械安全","l":"II","t":1,"q":"在刀具旋转加工时,以下的操作中不允许的是（ ）。","o":{"A":"用手触摸刀具","B":"翻转工件","C":"夹压工件","D":"测量工件"},"a":["A","B","C","D"],"e":"刀具旋转时手碰刀具会被割伤，翻转、夹压、测量工件也都得停车，任何靠近旋转刀具的动作都不允许。"},{"id":1342,"c":"机械安全","l":"II","t":1,"q":"下列是焊接场地环境的有害因素的有（ ）。","o":{"A":"弧光辐射","B":"电磁辐射","C":"焊接烟尘","D":"噪声"},"a":["A","B","C","D"],"e":"焊接时弧光、电磁辐射、烟尘和噪声同时存在，四项都是焊接场地的职业有害因素，需通风、遮光、降噪防护。"},{"id":1343,"c":"机械安全","l":"II","t":1,"q":"机床切削时禁止用手摸（ ）。","o":{"A":"工件","B":"刀具","C":"主轴旋转部位","D":"床身"},"a":["A","B","C"],"e":"工件、刀具和主轴旋转部位都在运动，手一碰就会卷入或割伤；床身不转，可以接触，所以不选床身。"},{"id":1344,"c":"机械安全","l":"II","t":1,"q":"焊接电弧是电弧焊方法采用的焊接热源,它所产生的弧光辐射可造成（ ）。","o":{"A":"对人体眼睛的伤害","B":"对人体皮肤的灼伤","C":"场地火灾事故","D":"急性电光性眼炎"},"a":["A","B","D"],"e":"弧光中的紫外线和强光会灼伤眼睛和皮肤，引起电光性眼炎；火灾是火花、熔渣引起的，不属于弧光辐射的危害。"},{"id":1345,"c":"机械安全","l":"II","t":1,"q":"焊工防护面罩可有效防护（ ）。","o":{"A":"焊接电弧","B":"对人体眼睛的伤害","C":"金属飞溅","D":"对人体的烫伤"},"a":["A","B","C","D"],"e":"焊工面罩带滤光镜和罩体，既挡弧光保护眼睛，又挡住飞溅的金属颗粒，防止面部烫伤，四项都对。"},{"id":1346,"c":"机械安全","l":"II","t":1,"q":"操作机床前必须检查（ ）。","o":{"A":"灯光","B":"润滑油位","C":"刀具安装是否牢固","D":"夹具安装是否牢固"},"a":["C","D"],"e":"刀具和夹具直接承受切削力，装不牢最易飞出或松动伤人，操作前必须确认；灯光、油位属于日常保养内容。"},{"id":1347,"c":"机械安全","l":"II","t":2,"q":"装卸铣刀时应用手握住铣刀刃,将刀柄装入主轴。","o":{},"a":["错误"],"e":"铣刀刃口很锋利，直接握刃口容易割破手；应握住刀柄、避开刃口慢慢装入主轴，必要时垫布防护。"},{"id":1348,"c":"机械安全","l":"II","t":2,"q":"在钻床上钻削小工件,可以直接用手拿,而不必一定使用工具夹持。","o":{},"a":["错误"],"e":"钻头旋转时会带着工件一起转，手拿小工件极易被卷住、划伤，必须用台虎钳或夹具夹牢后再钻。"},{"id":1349,"c":"机械安全","l":"II","t":2,"q":"在钻床上使用手动进刀时,应逐步增加或逐步减小压力,以免用力不当引发事故。","o":{},"a":["正确"],"e":"手动进刀要平稳地逐渐加压或减压，突然用力会使钻头折断、工件移位，逐步进给才能控制切削、避免事故。"},{"id":1350,"c":"机械安全","l":"II","t":2,"q":"在钻床上工作时,为保护双手,可以戴手套进行工作。","o":{},"a":["错误"],"e":"手套容易被旋转的钻头或主轴缠住，把手卷进机器，钻床操作严禁戴手套，长发和袖口也要收紧。"},{"id":1351,"c":"机械安全","l":"II","t":2,"q":"在钻床上工作时,如果钻头上缠有长铁屑,应停车清理,用手拉断长铁屑。","o":{},"a":["错误"],"e":"钻头上缠长铁屑要先停车，再用钩子或刷子清除；用手拉会被锋利铁屑割伤，甚至被带进钻头。"},{"id":1352,"c":"机械安全","l":"II","t":2,"q":"在确保线切割机床正常时方可操作机床,如果对机床的某个运动部分的安全性有怀疑,应立即停机检查。","o":{},"a":["正确"],"e":"机床带病运行最危险，凡对某个运动部位的安全性有怀疑，就应立即停机检查，排除隐患后再继续。"},{"id":1353,"c":"机械安全","l":"II","t":2,"q":"在清洁、维修线切割机床时,应先断电并确保无人能开启机床后,方可进行。","o":{},"a":["正确"],"e":"清洁、维修时手会伸进运动部件，必须先切断电源并挂警示牌或锁闸，确认无人能开机后再动手，防止误启动。"},{"id":1354,"c":"机械安全","l":"II","t":2,"q":"在机床快速进给时,要把手轮离合器打开,以防手轮快速旋转伤人。","o":{},"a":["正确"],"e":"快速进给时手轮会跟着高速旋转，打开离合器让它脱开，手轮就不转，可防止衣袖或手被带住打伤。"},{"id":1355,"c":"机械安全","l":"II","t":2,"q":"严禁用手拿工件进行磨削。","o":{},"a":["正确"],"e":"磨削时砂轮高速旋转，手拿工件一旦打滑或工件被带入，手就会碰到砂轮，必须用夹具或工具夹持。"},{"id":1356,"c":"机械安全","l":"II","t":2,"q":"严格按照要求摆放造型工具,使用完的造型工具应及时放入工具箱。","o":{},"a":["正确"],"e":"造型工具乱放容易绊倒人，也可能被埋进型砂，用完及时放回工具箱，现场整洁，取用方便，还能减少磕碰伤害。"},{"id":1357,"c":"机械安全","l":"II","t":2,"q":"箱式电阻炉的加热元件及其点源连接点需保持良好的绝缘性能,操作人员使用前应检查","o":{},"a":["正确"],"e":"加热元件和电源接点绝缘一旦破损就会漏电，操作前检查绝缘和接线，确认完好再通电，可防止触电。"},{"id":1358,"c":"机械安全","l":"II","t":2,"q":"铣削加工可在机床运行中根据需要随时更换主轴转速。","o":{},"a":["错误"],"e":"机床运转中变速，齿轮容易打齿损坏，也可能伤人；必须停车后再调整主轴转速，不能随时换挡。"},{"id":1359,"c":"机械安全","l":"II","t":2,"q":"铣床加工工作结束后,工作台应停在中央位置,升降台应落到最低位置。","o":{},"a":["正确"],"e":"工作台回中央、升降台降到最低，重心稳、占地小，方便下次装夹，也能防止他人碰伤或丝杠变形。"},{"id":1360,"c":"机械安全","l":"II","t":2,"q":"钨极氩弧焊采用高频高压引燃电弧时,其辐射作用可破坏人体植入的心脏起搏器的正常功能。","o":{},"a":["正确"],"e":"钨极氩弧焊高频引弧产生的高频电磁场会干扰心脏起搏器的正常工作，装起搏器的人不能靠近操作。"},{"id":1361,"c":"机械安全","l":"II","t":2,"q":"数控电火花线切割机床在加工时,可以用手触摸钼丝。","o":{},"a":["错误"],"e":"钼丝带电且高速运动，手一碰就会触电、割伤，还可能造成断丝，任何情况下都不能用手触摸。"},{"id":1362,"c":"机械安全","l":"II","t":2,"q":"使用钻床时,如果工件材料较硬或钻孔较深时,应在工作过程中不断将钻头抽出孔外,排出铁屑,防止钻头过热,同时应使用冷却液润滑,必要时采用保护性卡头。","o":{},"a":["正确"],"e":"钻硬材料或深孔时切屑不易排出、温度又高，要经常退钻排屑，加冷却液润滑，必要时用保护性卡头，防止钻头折断。"},{"id":1363,"c":"机械安全","l":"II","t":2,"q":"使用钻床工作时,应全面检查钻床、工具、夹具等,确认无误后方可进行。","o":{},"a":["正确"],"e":"钻床、工具、夹具都要先检查，确认装夹牢固、运转正常再开始，把隐患排除在开机之前。"},{"id":1364,"c":"机械安全","l":"II","t":2,"q":"使用摇臂钻床时,不准在横臂回转范围内站非操作人员,应清除所有障碍物。工作时应夹紧横臂。","o":{},"a":["正确"],"e":"横臂回转范围内站人会被撞伤，杂物会绊人或卡住工件，工作时夹紧横臂可防止它移动，所以必须做到。"},{"id":1365,"c":"机械安全","l":"II","t":2,"q":"使用摇臂钻床工作结束时,将横臂降到最低位置,主轴箱靠近主轴,并且要夹紧。","o":{},"a":["正确"],"e":"收工时把横臂降到最低、主轴箱移近主轴并夹紧，机床重心低、占地小，也防止横臂自行滑落伤人。"},{"id":1366,"c":"机械安全","l":"II","t":2,"q":"使用手锤、榔头之前,要检查锤头安装是否可靠。","o":{},"a":["正确"],"e":"锤头松动，挥锤时可能飞出砸伤人，所以使用前要检查锤头是否装紧、锤柄有无裂纹。"},{"id":1367,"c":"机械安全","l":"II","t":2,"q":"使用车床,钻床时不要带手套操作。","o":{},"a":["正确"],"e":"车床、钻床都有旋转的主轴和刀具，手套易被缠住把手卷入，操作时不能戴手套，袖口要扣紧。"},{"id":1368,"c":"机械安全","l":"II","t":2,"q":"气体保护电弧焊的气体流量计装置是供气系统的安全装置。","o":{},"a":["错误"],"e":"流量计只是用来显示和调节气体流量，保证焊接质量；回火防止器、减压器才是供气系统的安全装置。"},{"id":1369,"c":"机械安全","l":"II","t":2,"q":"磨平面时,应检查磁盘吸力是否正常,工件要吸牢,接触面较小的工件,前后要放挡块、加档板,按工件磨削长度调整好限位挡铁。","o":{},"a":["正确"],"e":"电磁吸盘吸力不足工件会飞出；接触面小的工件要加挡块挡板，限位挡铁按磨削长度调好，防止工件被砂轮带出。"},{"id":1370,"c":"机械安全","l":"II","t":2,"q":"开始操作前,应认真检查防护装置的完好性以及离合器和制动装置的灵活性和安全性。","o":{},"a":["正确"],"e":"防护装置完好才能挡住飞屑和运动部件，离合器和制动器灵活可靠才能及时停车，开机前都要确认。"},{"id":1371,"c":"机械安全","l":"II","t":2,"q":"开始操作前,可不清理干净工作台上的物件。","o":{},"a":["错误"],"e":"工作台上的工具、杂物会被卷入或顶住工件，影响装夹和加工，开机前必须清理干净，不能省略。"},{"id":1372,"c":"机械安全","l":"II","t":2,"q":"开车前应检查车床各手柄是否处于正常位置。","o":{},"a":["正确"],"e":"手柄位置不对，一开机床就可能出现意外进给或变速，先逐项确认手柄在正常位置，再启动。"},{"id":1373,"c":"机械安全","l":"II","t":2,"q":"开车前应对车床进行加油润滑。","o":{},"a":["正确"],"e":"各滑动面、油孔先加油润滑，可减少磨损、防止研伤，机床运转轻快，也避免因缺油卡死出事故。"},{"id":1374,"c":"机械安全","l":"II","t":2,"q":"开车后不准离开机床,且要精神集中。","o":{},"a":["正确"],"e":"机床运转中随时可能出现异常，操作者离开或分心，出了事来不及停车，所以必须守在机床旁、集中注意力。"},{"id":1375,"c":"机械安全","l":"II","t":2,"q":"精加工工件时,应在加工中随时测量工件尺寸。","o":{},"a":["错误"],"e":"工件和刀具都在运动，伸手测量会被卷入或割伤；应停车后再量，或使用专用量具在安全位置测量。"},{"id":1376,"c":"机械安全","l":"II","t":2,"q":"焊接场地在10米内,禁止堆放易燃和易爆物质。","o":{},"a":["正确"],"e":"焊接火花和熔渣能飞出很远，十米范围内堆放易燃易爆物品容易被引燃引爆，必须清空或采取隔离措施。"},{"id":1377,"c":"机械安全","l":"II","t":2,"q":"多人操作时,可以由多人控制脚踏开关的使用。","o":{},"a":["错误"],"e":"多人操作时若几个人都能踩脚踏开关，配合不默契就会误动作压伤手，必须由一人专门控制并约定信号。"},{"id":1378,"c":"机械安全","l":"II","t":2,"q":"电阻焊瞬间的焊接电流达数千安培至数万安培,它产生的强磁场辐射效应可危及心脏起搏器的正常使用。","o":{},"a":["正确"],"e":"电阻焊瞬时电流达数千至数万安培，产生很强的磁场，会干扰心脏起搏器，装起搏器者应远离。"},{"id":1379,"c":"机械安全","l":"II","t":2,"q":"电动机试机时,可以一起动马上就按停机按钮。","o":{},"a":["错误"],"e":"刚起动就按停机，电机还没运转起来，既查不出问题，频繁启停还容易烧坏绕组；应运转观察后再停。"},{"id":1380,"c":"机械安全","l":"II","t":2,"q":"当工件卡在模具中时,禁止用手将工件取出。","o":{},"a":["正确"],"e":"模具或滑块可能突然动作，用手伸进去取工件会被压伤，应停车后用工具取出。"},{"id":1381,"c":"机械安全","l":"II","t":2,"q":"锉削时,如果暂时不使用锉刀,应将锉刀放在台虎钳工作台的右面,其手柄不可露出工作台面。","o":{},"a":["正确"],"e":"锉刀放在工作台右面、手柄不伸出桌边，既不会被碰落砸脚，也不会钩住衣服，取用也顺手。"},{"id":1382,"c":"机械安全","l":"II","t":2,"q":"锉削时,禁止使用没有装手柄或手柄裂开的锉刀,也不可将锉刀当作拆卸工具或锤子使用。","o":{},"a":["正确"],"e":"锉刀无柄或柄裂，用力时尾尖会扎进手心；当锤或撬具用会折断锉刀，碎片飞溅伤人。"},{"id":1383,"c":"机械安全","l":"II","t":2,"q":"车削时,应及时用手清除切削产生的带状切屑和螺旋状长切屑。","o":{},"a":["错误"],"e":"带状、螺旋状切屑锋利且可能很热，用手抓会被割伤或烫伤，应停车后用钩子、刷子清除。"},{"id":1384,"c":"机械安全","l":"II","t":2,"q":"操作数控电火花线切割机床时必须佩带专用的防护眼镜,以免被放电加工时飞溅的火花烫伤眼睛。","o":{},"a":["错误"],"e":"线切割放电发生在工作液里，火花被液体包围，基本不会飞溅伤眼，因此不要求佩戴专用防护眼镜。"},{"id":1385,"c":"机械安全","l":"II","t":2,"q":"操作数控电火花线切割机床必须佩带专用防护手套,以免被工作液将手腐蚀造成皮肤损伤。","o":{},"a":["错误"],"e":"线切割工作液多为水基乳化液，不会腐蚀手；戴手套反而有被丝筒卷入的危险，所以不要求专用防护手套。"},{"id":1386,"c":"机械安全","l":"II","t":2,"q":"操作时,必须穿戴好必要的防护用品,如工作服、手套、防护眼镜等。","o":{},"a":["正确"],"e":"不同岗位按操作需要选用防护用品，工作服、手套、护目镜能挡住飞屑、粉尘和药液，该戴的必须戴好。"},{"id":1387,"c":"机械安全","l":"II","t":2,"q":"操作机床前要穿好工作服,袖口扣紧,上衣下摆不能敞开, 严禁戴手套,不得在开动的机床旁穿、脱换衣服,防止机器绞伤。","o":{},"a":["正确"],"e":"宽松衣角、袖口和手套都可能被旋转部件缠住，所以袖口要扣紧、下摆不敞、严禁戴手套，也不在开动的机床旁穿脱衣服。"},{"id":1388,"c":"机械安全","l":"II","t":2,"q":"操作高速旋转的实验仪器时,为防止切削伤手,可以戴手套","o":{},"a":["错误"],"e":"手套容易被旋转部件缠住，把手一起卷进去，比切削伤手更危险，操作高速旋转设备时必须摘掉手套。"},{"id":1389,"c":"机械安全","l":"II","t":2,"q":"操作高速旋转的实验仪器时,留长发的女生要戴安全防护帽","o":{},"a":["正确"],"e":"长发垂下来会被旋转部件或皮带缠住，造成头皮撕脱等严重伤害，必须把头发盘起塞进防护帽。"},{"id":1390,"c":"机械安全","l":"II","t":2,"q":"安装折弯模具时可以开动折弯机试加工。","o":{},"a":["错误"],"e":"装模具时手在模具之间，开机试加工一旦滑块下行就会压手，必须装好、确认无误并停机调整后再试。"},{"id":1391,"c":"机械安全","l":"II","t":2,"q":"安装较大工件时,应在机床床身上放置木制垫板。","o":{},"a":["正确"],"e":"大工件重量大，直接放在床身上容易砸伤床面或滑落砸脚，垫木板可缓冲防滑，也能保护导轨。"},{"id":1392,"c":"机械安全","l":"II","t":2,"q":"安装工件时,工件要装正、夹紧,装、卸工件后必须及时取下卡盘扳手。","o":{},"a":["正确"],"e":"工件不正不紧会飞出；卡盘扳手忘在卡盘上，开车时会被甩出砸人，所以装夹后必须马上取下。"},{"id":1393,"c":"机械安全","l":"II","t":2,"q":"安装刀具时,要正确使用扳手,防止扳手滑脱伤人。","o":{},"a":["正确"],"e":"扳手要选合适规格、卡稳螺母再用力，扳手滑脱会磕伤手或撞到机床，正确使用才能避免。"},{"id":1394,"c":"生物安全","l":"II","t":0,"q":"以下止血方法中,哪种不作为首选应用？","o":{"A":"直接压迫止血法","B":"止血点压迫止血法","C":"填塞止血法","D":"止血带止血法"},"a":["D"],"e":"止血带会阻断肢体远端血供，时间一长易致组织坏死，只在其他方法无效、四肢大动脉喷射性出血时作最后手段，所以不作首选。"},{"id":1395,"c":"生物安全","l":"II","t":0,"q":"以下哪项不属于死亡的特征？","o":{"A":"呼之不应","B":"呼吸停止","C":"心跳停止","D":"双侧瞳孔散大固定"},"a":["A"],"e":"死亡的核心特征是呼吸停止、心跳停止和双侧瞳孔散大固定；呼之不应只是意识丧失，昏迷、休克的人也会出现，不能作为死亡特征。"},{"id":1396,"c":"生物安全","l":"II","t":0,"q":"以下哪项不是呼吸、心跳停止的表现？","o":{"A":"意识忽然丧失","B":"颈动脉搏动不能触及","C":"面色苍白转而紫绀","D":"瞳孔缩小"},"a":["D"],"e":"呼吸心跳停止后脑部缺血缺氧，瞳孔是散大固定而不是缩小；意识忽然丧失、摸不到颈动脉搏动、面色苍白转紫绀都符合。"},{"id":1397,"c":"生物安全","l":"II","t":0,"q":"以下符合急救与防护“四先四后”原则的是:","o":{"A":"先抢后救","B":"先轻后重","C":"先缓后急","D":"先病后伤"},"a":["A"],"e":"四先四后是先抢后救、先重后轻、先急后缓、先伤后病，核心是先把人从危险环境抢出来，再按轻重缓急处置。"},{"id":1398,"c":"生物安全","l":"II","t":0,"q":"实验中如遇刺激性及神经性中毒,先服牛奶或鸡蛋白使之缓和,再服用:","o":{"A":"氢氧化铝膏,鸡蛋白","B":"硫酸铜溶液（30g溶于一杯水中）催吐","C":"乙酸果汁,鸡蛋白"},"a":["B"],"e":"牛奶或鸡蛋白先覆盖胃黏膜、缓和刺激，再用硫酸铜溶液催吐把毒物排出；氢氧化铝膏没有催吐作用，果汁也不对症。"},{"id":1399,"c":"生物安全","l":"II","t":0,"q":"实验中被玻璃划伤,应首先如何处理？","o":{"A":"大量水冲洗","B":"先止血","C":"应先把碎玻璃从伤处挑出","D":"立刻就医"},"a":["C"],"e":"伤口里的碎玻璃必须先清除，否则直接止血包扎会把玻璃压向深处，造成二次损伤，取净后再止血、冲洗并就医。"},{"id":1400,"c":"生物安全","l":"II","t":0,"q":"实验室人员发生触电时,下例哪种行为是不正确的？","o":{"A":"应迅速切断电源,将触电者上衣解开,取出口中异物,然后进行人工呼吸","B":"应迅速注射兴奋剂","C":"当患者伤势严重时,应立即送医院强救"},"a":["B"],"e":"触电急救靠迅速脱离电源、心肺复苏和送医院，兴奋剂对已经停跳的心脏没有作用，还可能加重紊乱，现场不能随意注射。"},{"id":1401,"c":"生物安全","l":"II","t":0,"q":"如果触电者伤势严重,呼吸停止或心脏停止跳动,应先竭力采用胸外心脏挤压和 方法进行施救。","o":{"A":"按摩","B":"点穴","C":"人工呼吸","D":"送医院"},"a":["C"],"e":"呼吸和心跳都停了就是心脏骤停，胸外按压必须配合人工呼吸供氧，单靠按摩、点穴或等送医院都救不回来。"},{"id":1402,"c":"生物安全","l":"II","t":0,"q":"对（ ）人员进行紧急救护时不能进行人工呼吸。","o":{"A":"有毒气体中毒","B":"触电假死","C":"溺水"},"a":["A"],"e":"有毒气体中毒者呼出的气里仍带毒物，口对口吹气会让施救者一起中毒，应先脱离有毒环境、给氧并尽快送医。"},{"id":1403,"c":"生物安全","l":"II","t":2,"q":"中毒事故中救护人员进入现场,应先抢救中毒者,再采取措施切断毒物来源。","o":{},"a":["错误"],"e":"顺序反了，必须先切断毒物来源、做好自身防护，再把中毒者救出，否则毒物持续泄漏，救人的和被救的都要中毒。"},{"id":1404,"c":"生物安全","l":"II","t":2,"q":"在触电现场,若触电者已经没有呼吸或脉搏的表现,此时可以判定触电者已经死亡,可以放弃抢救。","o":{},"a":["错误"],"e":"没有呼吸和脉搏只说明临床死亡，脑细胞尚未坏死，立刻心肺复苏仍有救回的可能，不能据此判定死亡而放弃抢救。"},{"id":1405,"c":"生物安全","l":"II","t":2,"q":"在触电现场,若触电者已经没有呼吸或脉搏,此时可以判定触电者已经死亡,可以放弃抢救。","o":{},"a":["错误"],"e":"呼吸脉搏消失不等于死亡，这属于临床死亡阶段，坚持胸外按压和人工呼吸才有生还可能，放弃抢救是错的。"},{"id":1406,"c":"生物安全","l":"II","t":2,"q":"因运动量过度产生的酸疼,可以通过减量、休息、按摩、热敷等方法来帮助机体积极恢复。","o":{},"a":["正确"],"e":"这种酸痛多是乳酸堆积和肌纤维轻微损伤，减量休息、按摩、热敷能改善循环、加快代谢产物排出，帮助机体恢复。"},{"id":1407,"c":"生物安全","l":"II","t":2,"q":"眼睛溅入化学试剂时,应以大量清水冲洗,然后送医院诊治。","o":{},"a":["正确"],"e":"眼部化学伤抢的就是时间，要就近用大量清水持续冲洗十几分钟，把试剂稀释冲走，冲洗后再送医院进一步处理。"},{"id":1408,"c":"生物安全","l":"II","t":2,"q":"血压升高,目光无神,情绪烦躁,面色苍白等,如果是因锻炼造成的,则都是运动不足的征兆。","o":{},"a":["错误"],"e":"血压升高、目光无神、烦躁、面色苍白是过度疲劳或身体异常的信号，与运动不足无关，出现时应停止运动并就医。"},{"id":1409,"c":"生物安全","l":"II","t":2,"q":"心脏骤停者应立即行胸外心脏按摩术,同时拨打120。现场抢救成功的心肺复苏患者或重症患者,如昏迷、惊厥、休克、深度青紫等,应立即送医院治疗。","o":{},"a":["正确"],"e":"心脏骤停要一边胸外按压一边呼救，按压能维持脑供血；复苏成功或仍昏迷、惊厥、休克、青紫者都必须送院监护。"},{"id":1410,"c":"生物安全","l":"II","t":2,"q":"现场触电急救可以打强心针。","o":{},"a":["错误"],"e":"触电常引起心室颤动，强心针会加重心律失常，现场只做脱离电源和心肺复苏，用不用药由医生判断。"},{"id":1411,"c":"生物安全","l":"II","t":2,"q":"实施急救的顺序:若有呼吸心跳停止的,先行复苏,然后是止血、包扎、骨折固定或脱臼复位（固定）、搬运","o":{},"a":["正确"],"e":"呼吸心跳停止几分钟就会脑死亡，所以先复苏保命，再止血、包扎、固定，最后搬运，体现先救命后治伤。"},{"id":1412,"c":"生物安全","l":"II","t":2,"q":"若宿舍门外已被大火封死,要紧闭房门,用湿毛巾等堵塞门缝,在室内等待救援。（ ）","o":{},"a":["正确"],"e":"门外已是大火，开门会把高温烟气引进房间；应关紧房门、湿毛巾堵缝、泼水降温，到窗口示警等待救援。"},{"id":1413,"c":"生物安全","l":"II","t":2,"q":"如遇呼吸道吸进有毒气体、蒸气、烟雾而引起呼吸系统中毒时,应立即将病人移至室外空气新鲜的地方,解开衣领,使之温暖和安静,切勿随便进行人工呼吸。","o":{},"a":["正确"],"e":"吸入性中毒的关键是脱离毒源、通风给氧；伤者呼出气仍含毒物，随意口对口吹气会让施救者中毒，故不主张。"},{"id":1414,"c":"生物安全","l":"II","t":2,"q":"如遇刺激性及神经性中毒,先服牛奶或鸡蛋白使之缓和,再服用硫酸铜溶液（30g溶于一杯水中）催吐。也可以用手指伸入喉部催吐后,立即送往医院。","o":{},"a":["正确"],"e":"先用牛奶、蛋清保护黏膜，再用硫酸铜或手指刺激咽喉催吐，把胃内毒物排出后立即送医，是这类中毒的规范处理。"},{"id":1415,"c":"生物安全","l":"II","t":2,"q":"人工呼吸的方法是捏紧伤者鼻孔,深吸一口气后紧贴伤者的口向口内吹气,时间约为2秒钟,吹气完毕后,立即松开伤者的鼻孔,让他自行呼气,时间约3秒钟。如此以每分钟约12次的速度进行。","o":{},"a":["正确"],"e":"捏鼻是防止漏气，口对口吹气约两秒，松鼻让其自行呼气约三秒，每分钟十二次左右，与胸外按压配合即心肺复苏。"},{"id":1416,"c":"生物安全","l":"II","t":2,"q":"皮肤烧伤后如有水泡,应及时将水泡刺破,以利于其恢复。","o":{},"a":["错误"],"e":"水泡表皮是天然的保护屏障，刺破会让创面暴露、细菌侵入引起感染，应保留水泡、清洁包扎，让它自行吸收。"},{"id":1417,"c":"生物安全","l":"II","t":2,"q":"溅入口中已下咽的毒物,应根据毒物的性质服解毒剂,并立即送医院。","o":{},"a":["正确"],"e":"已经咽下的毒物催吐意义有限，应按毒物性质服用相应解毒剂或吸附剂减少吸收，同时尽快送医院处理。"},{"id":1418,"c":"生物安全","l":"II","t":2,"q":"急性中毒发生时,救护人员在抢救前要做好自身呼吸系统和皮肤的防护,以免自身中毒、使事故扩大。","o":{},"a":["正确"],"e":"施救者不防护就冲进毒区，往往自己先中毒倒下，反而扩大事故，所以要先戴好呼吸和皮肤防护再救人。"},{"id":1419,"c":"生物安全","l":"II","t":2,"q":"急救时伤口包扎越紧越好。","o":{},"a":["错误"],"e":"包扎过紧会压迫血管和神经，阻断远端血液循环，时间久了可致肢体缺血坏死，正确做法是松紧适度。"},{"id":1420,"c":"生物安全","l":"II","t":2,"q":"急救时伤口包扎松劲适度,不可过紧或过松,以防滑脱或压迫神经和血管,影响远端血液循环,甚至造成肢体坏死。","o":{},"a":["正确"],"e":"过松敷料会滑脱，起不到压迫止血作用；过紧则压迫神经血管、影响远端血供甚至坏死，所以要松紧适度并观察指端。"},{"id":1421,"c":"生物安全","l":"II","t":2,"q":"踝关节韧带扭伤以后立即冷敷,加压包扎固定。","o":{},"a":["正确"],"e":"刚扭伤时局部小血管破裂出血肿胀，立即冷敷收缩血管、加压包扎减少渗出并固定关节，能明显减轻肿痛。"},{"id":1422,"c":"生物安全","l":"II","t":2,"q":"护送病人时,应取掉口中异物,采用平卧位,头部稍低,保持呼吸畅通。","o":{},"a":["正确"],"e":"取出口中异物和假牙可防止误吸窒息，平卧而头稍低有利于脑部供血，同时保持呼吸道通畅，便于途中观察。"},{"id":1423,"c":"生物安全","l":"II","t":2,"q":"发生意外后先对伤员进行必要的止血、包扎、固定等处理,然后尽可能用担架搬运,搬运时病人始终处脚朝前,头朝后,以便于随时观察伤者情况变化,及时实施急救处理。","o":{},"a":["正确"],"e":"搬运时头在后、脚在前，走在后面的人能随时看到伤员的面色和呼吸变化，发现异常可立即停下急救。"},{"id":1424,"c":"生物安全","l":"II","t":2,"q":"发生触电事故时,在保证救护者本身安全的同时,必须首先设法使触电者迅速脱离电源,然后进行以下抢修工作。 （1） 解开妨碍触电者呼吸的紧身衣服。 （2） 检查触电者的口腔,清理口腔的粘液,如有假牙,则取下。 （3） 立即就地进行抢救,如呼吸停止,采用口对口人工呼吸法抢救,若心脏停止跳动或不规则颤动,可进行人工胸外挤压法抢救。决不能无故中断。 如果现场除救护者之外,还有第二人在场,则还应立即进行以下工作: 1） 提供急救用的工具和设备。 2） 劝退现场闲杂人员。 3） 保持现场有足够的照明和保持空","o":{},"a":["正确"],"e":"先脱离电源再查呼吸心跳，解开衣领、清理口腔、取下假牙保持气道通畅，呼吸停做口对口，心跳停做胸外按压，不能无故中断。"},{"id":1425,"c":"生物安全","l":"II","t":2,"q":"发生触电时,应对患者进行人工呼吸,可以适量使用兴奋剂。","o":{},"a":["错误"],"e":"兴奋剂替代不了人工呼吸和胸外按压，还会增加心脏负担、诱发心律失常，现场急救不应使用，应坚持心肺复苏。"},{"id":1426,"c":"生物安全","l":"II","t":2,"q":"当有人呼吸系统中毒时,应迅速使中毒者离开现场,移到通风良好的环境,令中毒者呼吸新鲜空气,情况严重者应及时送医院治疗。","o":{},"a":["正确"],"e":"留在现场就会持续吸入毒物，越快脱离并呼吸新鲜空气，进入血液的毒物越少，症状重者再及时送医院治疗。"},{"id":1427,"c":"生物安全","l":"II","t":2,"q":"当被烧伤时,正确的急救方法应该是以最快的速度用冷水冲洗烧伤部位。","o":{},"a":["正确"],"e":"烧伤后立刻用冷水冲淋能带走余热，阻止热力继续向深层组织损伤，还能减轻疼痛和水肿，是现场首要处理。"},{"id":1428,"c":"生物安全","l":"II","t":2,"q":"创伤伤口内有玻璃碎片等大块异物时,应在去医院救治前尽快取出。","o":{},"a":["错误"],"e":"大块异物可能正压着破裂的血管起堵塞作用，贸然拔出会引起大出血，应保留异物、固定后连人一起送医院处理。"},{"id":1429,"c":"生物安全","l":"II","t":2,"q":"触电紧急救护时,首先应使触电者脱离电源,然后立即进行人工呼吸。","o":{},"a":["正确"],"e":"带电施救会让救人的也触电，必须先断电或用绝缘物挑开电源，确认脱离后再判断呼吸心跳，随后做人工呼吸。"},{"id":1430,"c":"生物安全","l":"II","t":2,"q":"出现内伤如挫伤、肌肉拉伤、关节扭伤、滑囊炎、腱鞘炎等24小时内一般用冷敷,加压包扎,抬高受伤的肢体等方法,尽可能减少受伤部位的出血。","o":{},"a":["正确"],"e":"伤后二十四小时内冷敷可收缩血管，加压包扎能压迫止血，抬高患肢利于回流，都是为减少伤处出血和肿胀。"},{"id":1431,"c":"生物安全","l":"II","t":2,"q":"出现肌肉痉挛（抽筋）,常见的缓解法是拉长痉挛的肌肉,同时配合局部按摩和点压穴位等方法促进缓解。","o":{},"a":["正确"],"e":"抽筋是肌肉不自主的强直收缩，缓慢牵拉把肌肉拉长可打断痉挛，再配合按摩、点压穴位促进局部血液循环。"},{"id":1432,"c":"生物安全","l":"II","t":2,"q":"不论误食酸或碱,都可以灌注牛奶,不要吃呕吐剂。","o":{},"a":["正确"],"e":"牛奶能稀释并覆盖保护被腐蚀的黏膜；酸或碱灼伤后催吐，会让腐蚀性物质再次灼伤食道和口腔，所以不主张催吐。"},{"id":1433,"c":"特种设备安全","l":"II","t":0,"q":"永久气体气瓶余压应不小于","o":{"A":"0.1MPA","B":"0.05MPA","C":"0.01MPA"},"a":["B"],"e":"气瓶内必须留有余压，永久气体余压不得低于0.05MPa，可防止空气和杂质倒灌污染瓶内气体，也便于确认瓶内装的是什么介质。"},{"id":1434,"c":"特种设备安全","l":"II","t":0,"q":"氧气气瓶的瓶身颜色为（ ）","o":{"A":"棕","B":"蓝","C":"黑"},"a":["B"],"e":"按规定氧气瓶涂淡蓝色瓶身、标黑字“氧”，蓝色便于与其他气体区分，防止误接误用；棕色、黑色都不是氧气瓶的标记色。"},{"id":1435,"c":"特种设备安全","l":"II","t":0,"q":"氧气瓶与乙炔发生器间距不得小于多少米,二者距明火不应小于（ ）米","o":{"A":"5 10","B":"3 6","C":"2 4","D":"1 2"},"a":["A"],"e":"氧气瓶与乙炔发生器（瓶）间距至少5米，两者与明火的距离至少10米，可防止回火和火焰引燃，其他几个组合数值都偏小。"},{"id":1436,"c":"特种设备安全","l":"II","t":0,"q":"压力表用红、黄、绿三色表示压力容器内部的压力情况,当指针指在红色区域表示（ ）:","o":{"A":"正常","B":"偏高","C":"偏低"},"a":["B"],"e":"红区表示压力偏高，指针进入红区说明已接近或超过允许压力，应立即停止加压并泄压；绿区才是正常，黄区提示需要注意。"},{"id":1437,"c":"特种设备安全","l":"II","t":0,"q":"压力表的检定要按照规定进行,下列说法错误的是（ ）。","o":{"A":"由于科学技术的高速发展和制造技术的精良,压力表的质量越来越好,完全可以不必经过检定而直接投入使用","B":"新安装的压力容器,在投入使用前必须先检定压力表,否则不能投入使用","C":"压力表至少每半年检定一次","D":"不得使用未经检定的压力表"},"a":["A"],"e":"压力表属强制检定计量器具，质量再好也必须检定合格才能用，且至少每半年检定一次，所以“不必检定”的说法是错的。"},{"id":1438,"c":"特种设备安全","l":"II","t":0,"q":"下列关于氢气钢瓶的使用方法不正确大是（ ）","o":{"A":"氢气瓶应放在远离实验室的专用小屋内","B":"必须使用专用的氢气减压阀,开启气瓶时,操作者应站在阀口的侧后方,动作要轻缓。","C":"直接在反应装置旁边使用","D":"并安装一个防止回火的装置才可以使用"},"a":["C"],"e":"氢气极易扩散、遇火即爆，气瓶须放在远离实验室的专用小间固定，经专用减压阀和回火防止器使用；直接在反应装置旁用，泄漏就爆燃。"},{"id":1439,"c":"特种设备安全","l":"II","t":0,"q":"我国气体钢瓶常用的颜色标记中,氮气的瓶身和标字颜色分别为（ ）。","o":{"A":"黑 蓝","B":"黄 黑","C":"黑 黄","D":"蓝 黑"},"a":["C"],"e":"氮气瓶为黑色瓶身、黄色字样，这是国内常用配色；氧气是淡蓝黑字、氢气是淡绿红字，认清瓶色可避免接错气体。"},{"id":1440,"c":"特种设备安全","l":"II","t":0,"q":"实验室高压气瓶摆放应（ ）","o":{"A":"气瓶直立","B":"气瓶直立固定","C":"气瓶平放","D":"气瓶平放固定"},"a":["B"],"e":"气瓶必须直立并用链条或气瓶架固定，防止倾倒砸坏瓶阀、高压气体喷出伤人；只直立不固定或平放都不安全。"},{"id":1441,"c":"特种设备安全","l":"II","t":0,"q":"可燃和助燃气体的气瓶之间的距离、与明火的距离都不得小于","o":{"A":"3米","B":"5米","C":"10米","D":"15米"},"a":["C"],"e":"可燃气体瓶与助燃气瓶（如乙炔与氧气）之间、它们与明火的距离都不得小于10米，避免泄漏后相互引燃或回火爆炸。"},{"id":1442,"c":"特种设备安全","l":"II","t":0,"q":"检查钢瓶气用具是否漏气时,通常采用（ ）来寻找漏气点。","o":{"A":"涂抹肥皂水","B":"划火柴","C":"闻气味"},"a":["A"],"e":"把肥皂水涂在接口和阀门处，漏气处会连续起泡，方法安全又直观；划火柴、闻气味可能直接引燃或中毒，绝不能用。"},{"id":1443,"c":"特种设备安全","l":"II","t":0,"q":"关于租用压力气瓶,下列说法错误的是要（ ）。","o":{"A":"应到国家认定的具有压力气瓶充装和租赁资质的单位租用压力气瓶和充装相应介质,校内任何单位不得使用自行购置的压力气瓶,也不允许自行充装任何介质","B":"根据国家质量监督检验检疫总局 2003 年第 46 号令 《气瓶安全监察规定》 的要求,气瓶充装单位全面负责所提供气瓶的安全,气瓶的定期检验、报废、销 毁等事宜均由气瓶充装单位安排进行","C":"任何单位和个人均可使用自行购置的压力气瓶,自行充装任何介质,他人不得干涉"},"a":["C"],"e":"气瓶必须由有资质的单位充装和租赁，定期检验、报废也由充装单位负责；自行购置、自行充装任何介质都属违规，所以C错。"},{"id":1444,"c":"特种设备安全","l":"II","t":0,"q":"当气瓶内的气量不足时,下列做法正确的是（ ）。","o":{"A":"放在热水中加热","B":"换气","C":"不断摇晃气罐"},"a":["B"],"e":"气量不足时正确做法是换气，瓶内应留有余压；用热水加热、火烤或不断摇晃会使瓶内压力骤升，可能引起爆炸。"},{"id":1445,"c":"特种设备安全","l":"II","t":1,"q":"正确使用气体钢瓶的原则是（ ）。","o":{"A":"在钢瓶上装上配套的减压阀。检查减压阀是否关紧,方法是逆时针旋转调压手柄至螺杆松动为止","B":"打开钢瓶总阀门,此时高压表显示出瓶内贮气总压力","C":"慢慢地顺时针转动调压手柄,至低压表显示出实验所需压力为止","D":"停止使用时,先关闭总阀门,待减压阀中余气逸尽后,再关闭减压阀"},"a":["A","B","C","D"],"e":"四步都对：装配套减压阀并逆时针旋松手柄确认关闭，开总阀读高压表，顺时针调至所需低压，停用先关总阀放尽余气再关减压阀。"},{"id":1446,"c":"特种设备安全","l":"II","t":1,"q":"怎样正确使用压力气瓶？","o":{"A":"压力气瓶要有效固定、放置稳固、防止倾倒,要避免碰撞、烘烤和曝晒,受射线辐照易发生化学反应介质的压力气瓶应远离放射源或采取屏蔽措施。","B":"不得对压力气瓶进行焊接或改造;不得更改气瓶的钢印或颜色标记;不得使用已报废的气瓶;气瓶内的残液不能自行处理;气瓶内的介质不能向其它容器充装。","C":"易燃、易爆或有毒介质的压力气瓶,可以放心地安放在室内使用,不必担心出问题。","D":"易燃和助燃气瓶要保持距离、分开存放,这是不必要的。","E":"气瓶内的介质不能不能用尽,要留有剩余压力。","F":".开阀时要慢慢开启,防止附件升压过快。"},"a":["A","B","E","F"],"e":"ABEF正确：气瓶要固定、防倒防曝晒，禁焊接改造、禁用报废瓶，用后留余压，开阀要缓慢；C、D把室内存放和混放说成没问题，明显错误。"},{"id":1447,"c":"特种设备安全","l":"II","t":1,"q":"在使用压缩气瓶之前应该这样操作","o":{"A":"辨认和确定气瓶的有效标签","B":"指使学生搬运压缩气瓶","C":"识别压缩气体的特性","D":"气瓶调节器的扳手应放在气瓶输出阀上"},"a":["A","C","D"],"e":"用前要核对气瓶标签确认气体种类，了解其易燃、助燃、有毒等特性，把调节器扳手放在输出阀上以便应急关阀；指使学生搬运属违规。"},{"id":1448,"c":"特种设备安全","l":"II","t":1,"q":"以下对几种实验室常用气体描述正确的是( )","o":{"A":"乙炔是极易燃烧、容易爆炸的气体,当其燃烧时绝对禁止使用四氯化碳灭火","B":"氢气密度小,易泄露,扩散速度很快,易和其他气体混合,严禁放在实验室内。","C":"氧气是强烈的助燃气体,温度不变而压力增加时,可和油类发生急剧反应,引起燃烧和爆炸","D":"氧化亚氮具有麻醉兴奋作用,俗称笑气,受热不易分解。"},"a":["A","B","C"],"e":"乙炔易爆且燃烧禁用四氯化碳，氢气轻、扩散快须专库存放，氧气遇油加压会剧烈氧化；D错在氧化亚氮受热易分解，不是“不易分解”。"},{"id":1449,"c":"特种设备安全","l":"II","t":1,"q":"乙炔瓶贮存间可以配置下列哪些灭火器( )。","o":{"A":"BC型干粉灭火器","B":"二氧化碳灭火器","C":"四氯化碳灭火器","D":"ABC型干粉灭火器"},"a":["A","B","D"],"e":"乙炔瓶库可配BC型、ABC型干粉和二氧化碳灭火器；四氯化碳遇高温会产生剧毒光气，与乙炔燃烧反应也危险，严禁使用。"},{"id":1450,"c":"特种设备安全","l":"II","t":1,"q":"实验室中常常用到一些压力容器（如高压反应釜、气体钢瓶等） ,下列被严格禁止的行为是（ ）。","o":{"A":"带压拆卸压紧螺栓","B":"气体钢瓶螺栓受冻,不能拧开,可以用火烧烤","C":"在搬动、存放、更换气体钢瓶时不安装防震垫圈","D":"学生在没有经过培训、没有老师在场知道的情况下使用气瓶"},"a":["A","B","C","D"],"e":"四种都禁止：带压拆螺栓、用火烤冻住的瓶阀、不装防震圈搬运、学生无培训且老师不在场时用气瓶，都可能直接导致爆炸伤人。"},{"id":1451,"c":"特种设备安全","l":"II","t":1,"q":"实验室内使用乙炔气时,说法不正确的是（ ）。","o":{"A":"室内不可有明火,不可有产生电火花的电器","B":"房间应密闭","C":"室内应有高湿度","D":"乙炔气可用铜管道输送"},"a":["B","C","D"],"e":"密闭房间会让泄漏的乙炔积聚，高湿度无益反而腐蚀设备，铜管与乙炔会生成爆炸性乙炔铜；只有A正确，B、C、D都不对。"},{"id":1452,"c":"特种设备安全","l":"II","t":1,"q":"气瓶室设置应考虑这些因素:","o":{"A":"采用阻燃材料堵塞穿墙孔洞","B":"易燃气体与助燃气体隔开","C":"应布置在大型实验室附近","D":"有单独通向室外的事故排烟"},"a":["A","B","D"],"e":"气瓶室要用阻燃材料封堵穿墙孔洞、易燃与助燃气体分开存放、设独立通向室外的事故排烟；C把气瓶室设在大型实验室附近，人员密集风险更大。"},{"id":1453,"c":"特种设备安全","l":"II","t":1,"q":"气瓶搬运过程中应该:","o":{"A":"轻装轻卸","B":"防止震动","C":"使用专用手推车","D":"用电磁起重机吊装"},"a":["A","B","C"],"e":"搬运应轻装轻卸、防止震动碰撞，并使用专用手推车；用电磁起重机吊装会因撞击、电火花引发事故，严禁使用。"},{"id":1454,"c":"特种设备安全","l":"II","t":1,"q":"气焊气割作业时,","o":{"A":"氧气瓶乙炔瓶不能同时存放使用,距明火100米以外","B":"氧气瓶与乙炔瓶间距大于5m,乙炔瓶不能倒放","C":"推拉闸刀开关时,脸部不能面对电源","D":"电焊机应设置单独的开关箱"},"a":["A","C","D"],"e":"A、C、D正确：气瓶与明火保持足够距离，推拉闸刀时脸不要正对电源，电焊机单独设开关箱；B关于瓶间距的说法与安全间距规定不符。"},{"id":1455,"c":"特种设备安全","l":"II","t":1,"q":"接收气瓶时,应对气瓶进行哪些方面的检查验收（ ）","o":{"A":"气瓶外观是否正常且瓶身涂色与种类是否一致","B":"气瓶附件（防震圈、瓶帽、瓶阀）是否齐全、完好","C":"气瓶是否在检验周期内","D":"气瓶是否有出厂合格证"},"a":["A","B","C","D"],"e":"验收要看外观和瓶身颜色是否与介质相符、防震圈瓶帽瓶阀是否齐全完好、是否在检验周期内、有无出厂合格证，缺一项都不能接收。"},{"id":1456,"c":"特种设备安全","l":"II","t":1,"q":"关于氧气钢瓶上的压力表说法正确的是（）。","o":{"A":"氧气瓶上通常都会安装两个气压表","B":"高压表显示氧气瓶中氧气的气压","C":"低压表显示输出的氧气压力","D":"输出的氧气压力可以使用减压阀来调整的"},"a":["A","B","C","D"],"e":"氧气瓶一般装高低压两只表：高压表显示瓶内压力，低压表显示输出压力，输出压力由减压阀调节，四项说法都对。"},{"id":1457,"c":"特种设备安全","l":"II","t":1,"q":"高压电容器,实验结束后或闲置时,处理不合适的有哪些( )？","o":{"A":"电极接地","B":"负电极接地","C":"双电极接地","D":"双电极短接"},"a":["A","B","C"],"e":"停用后应把双电极短接，让两极间的电荷中和放电；只把一极或两电极分别接地，极间仍可能残留高压，所以A、B、C都不合适。"},{"id":1458,"c":"特种设备安全","l":"II","t":1,"q":"大型仪器设备应认真填写（ ）。","o":{"A":"开机时间","B":"实验内容","C":"操作人员","D":"使用维修情况"},"a":["A","B","C","D"],"e":"大型仪器要记录开机时间、实验内容、操作人员和使用维修情况，便于追溯设备状态、核算机时和排查故障。"},{"id":1459,"c":"特种设备安全","l":"II","t":1,"q":"存放可燃性及有毒气体钢瓶的地方应注意（ ）。","o":{"A":"阴凉通风","B":"严禁明火","C":"有防爆设施","D":"密闭","E":"单独并固定存放"},"a":["A","B","C","E"],"e":"可燃、有毒气瓶应存于阴凉通风处，严禁明火，配防爆设施并单独固定存放；D密闭会让泄漏气体聚集，遇火即爆。"},{"id":1460,"c":"特种设备安全","l":"II","t":2,"q":"在使用高压灭菌锅、烤箱等高压加热设备时,必须有人值守。","o":{},"a":["正确"],"e":"高压灭菌锅、烤箱运行时温度压力都在升高，一旦失控或干烧必须马上处理，所以必须有人值守，不能离人。"},{"id":1461,"c":"特种设备安全","l":"II","t":2,"q":"允许使用无减压器的氧气瓶。","o":{},"a":["错误"],"e":"氧气瓶必须经减压器降压后才能使用，直接开阀出来的是十几兆帕高压氧，会冲坏管路，遇油脂还会着火爆炸。"},{"id":1462,"c":"特种设备安全","l":"II","t":2,"q":"永久气体、二氧化碳气体等气瓶上多装有爆破片,需要定期更换。","o":{},"a":["正确"],"e":"永久气体和二氧化碳瓶多装爆破片作超压保护，爆破片会疲劳、腐蚀，必须按规定周期更换，失效就起不到泄压作用。"},{"id":1463,"c":"特种设备安全","l":"II","t":2,"q":"乙炔瓶禁止卧放使用,以防丙酮液体泄漏流出。","o":{},"a":["正确"],"e":"乙炔瓶内是丙酮溶解乙炔，卧放会使丙酮流出，既降低溶解能力又可能堵塞管路、引起燃烧爆炸，只能直立使用。"},{"id":1464,"c":"特种设备安全","l":"II","t":2,"q":"氧气瓶与乙炔瓶使用的安全距离应不少于5米,并不能同室存放。","o":{},"a":["正确"],"e":"氧气瓶与乙炔瓶间距不得小于5米，而且必须分室存放，防止乙炔泄漏后遇氧回火，造成连锁爆炸。"},{"id":1465,"c":"特种设备安全","l":"II","t":2,"q":"氧气瓶内的氧气不应用尽,氧气瓶压力降至0.196MPa时应停止使用,并标写“空瓶”标志。","o":{},"a":["正确"],"e":"氧气不能用尽，压力降到0.196MPa左右就应停用并挂“空瓶”标志，留余压可防杂质倒灌，也便于充装单位检查。"},{"id":1466,"c":"特种设备安全","l":"II","t":2,"q":"氧气瓶库房和氧气使用现场应备有氮气、二氧化碳、1211和干粉等灭火器材,附近应设置消火栓及干砂。","o":{},"a":["正确"],"e":"氧气本身助燃，现场要备氮气、二氧化碳、1211、干粉等灭火器材，并设消火栓和干砂，起火时才能及时扑救。"},{"id":1467,"c":"特种设备安全","l":"II","t":2,"q":"氧气瓶禁止与油脂接触。","o":{},"a":["正确"],"e":"高压氧与油脂接触会剧烈氧化甚至自燃爆炸，所以瓶阀、减压器和操作者的手、工具都不能沾油。"},{"id":1468,"c":"特种设备安全","l":"II","t":2,"q":"氧气瓶减压器如发生自动燃烧,应迅速把氧气瓶的阀门关闭。","o":{},"a":["正确"],"e":"减压器着火多是接口漏气在燃烧，迅速关闭瓶阀切断气源是首要动作，火会随之熄灭，再处理减压器。"},{"id":1469,"c":"特种设备安全","l":"II","t":2,"q":"氧气瓶、乙炔气瓶可以吊至高处作业并使用,但操作时须注意安全。","o":{},"a":["错误"],"e":"气瓶严禁吊运到高处使用，吊装中易碰撞、坠落损坏瓶阀，高处也无法固定，一旦泄漏后果严重。"},{"id":1470,"c":"特种设备安全","l":"II","t":2,"q":"氧气钢瓶瓶身颜色是绿色。","o":{},"a":["错误"],"e":"氧气瓶瓶身是淡蓝色、黑字，不是绿色；绿色（淡绿）通常用于氢气瓶，认错颜色就可能接错气体。"},{"id":1471,"c":"特种设备安全","l":"II","t":2,"q":"箱式电阻炉的使用必须按需使用,不需要特别经过管理员的同意。","o":{},"a":["错误"],"e":"箱式电阻炉功率大、温度高，使用须经管理员同意并登记，按规程操作，私自开炉容易超温、触电或引发火灾。"},{"id":1472,"c":"特种设备安全","l":"II","t":2,"q":"停止使用高压气瓶时,应先关闭总阀。","o":{},"a":["正确"],"e":"停用气瓶先关总阀，再放尽减压阀内余气后关减压阀，这样瓶内气体不会继续进入管路，也不会损坏减压阀。"},{"id":1473,"c":"特种设备安全","l":"II","t":2,"q":"特种设备上使用的压力表的定期校验周期为半年。","o":{},"a":["正确"],"e":"特种设备用压力表属强制检定，校验周期为半年，超期或未检的表不能继续使用，否则读数失准会误判压力。"},{"id":1474,"c":"特种设备安全","l":"II","t":2,"q":"使用氧-乙炔火焰气焊与气割前,应检查是否配置了回火保险装置","o":{},"a":["正确"],"e":"氧-乙炔火焰速度很快，回火时火焰会沿管路倒窜，必须装回火保险装置，作业前要确认它完好有效。"},{"id":1475,"c":"特种设备安全","l":"II","t":2,"q":"使用气瓶时,应远离高温、明火、熔融金属飞溅物、可燃易爆物质等,其使用时安全距离应在10m以上。","o":{},"a":["正确"],"e":"气瓶使用时要远离高温、明火、熔融金属飞溅物和易燃易爆物，安全距离在10米以上，防止受热升压或被引燃。"},{"id":1476,"c":"特种设备安全","l":"II","t":2,"q":"使用离心机时应避免穿戴宽松衣服,长发应盘好","o":{},"a":["正确"],"e":"离心机转速高，宽松衣袖和长发容易被卷入转轴，应穿紧身工作服、把长发盘好，并盖好盖子再启动。"},{"id":1477,"c":"特种设备安全","l":"II","t":2,"q":"使用钢瓶中的气体时,要用减压阀（气压表） ,各种气体的气压表不得混用,以防爆炸。","o":{},"a":["正确"],"e":"不同气体必须用对应的减压阀和气压表，混用会因密封材料不兼容（如氧气遇油脂）引起燃烧爆炸。"},{"id":1478,"c":"特种设备安全","l":"II","t":2,"q":"盛装腐蚀性介质的气瓶,每 2 年检验一次。","o":{},"a":["正确"],"e":"盛装腐蚀性介质的气瓶受腐蚀快，检验周期定为每2年一次，以便及时发现壁厚减薄、裂纹等隐患。"},{"id":1479,"c":"特种设备安全","l":"II","t":2,"q":"盛装惰性气体和无腐蚀高纯气体的气瓶,每 5 年检验一次。","o":{},"a":["正确"],"e":"惰性气体和无腐蚀高纯气体对瓶体影响小，检验周期可放宽到每5年一次，但仍须按期送检。"},{"id":1480,"c":"特种设备安全","l":"II","t":2,"q":"氢气在不纯的氧气中点燃会发生爆炸,此种爆炸属于化学爆炸。","o":{},"a":["正确"],"e":"氢气在不纯的氧气中点燃，氢与氧迅速化合放热、压力骤升，是化学反应引起的化学爆炸，不是物理爆炸。"},{"id":1481,"c":"特种设备安全","l":"II","t":2,"q":"氢气钢瓶瓶身颜色是蓝色。","o":{},"a":["错误"],"e":"氢气瓶瓶身是淡绿色、红字，蓝色（淡蓝）是氧气瓶的颜色；颜色标记混淆会造成气体误用。"},{"id":1482,"c":"特种设备安全","l":"II","t":2,"q":"氢气钢瓶必须使用专用的氢气减压阀,开启气瓶时,操作者应站在阀口的侧后方,动作要轻缓。","o":{},"a":["正确"],"e":"氢气渗透性强、易回火，必须用专用氢气减压阀；开阀时人站在阀口侧后方、缓慢开启，避免气流冲击伤人。"},{"id":1483,"c":"特种设备安全","l":"II","t":2,"q":"气瓶开启之前应先检查减压阀,逆时针旋转调压手柄至螺杆松动,此时减压阀的状态为关闭","o":{},"a":["正确"],"e":"逆时针旋松调压手柄，弹簧不受压，减压阀处于关闭状态，此时开总阀不会有气体输出，确认后再逐步调压。"},{"id":1484,"c":"特种设备安全","l":"II","t":2,"q":"气瓶操作者不能穿有油污过多的工作服,不能用手、油手套和油工具接触氧气瓶及其附件。","o":{},"a":["正确"],"e":"氧气遇油脂会自燃，操作者不能穿油污过多的工作服，也不能用沾油的手、油手套和油工具接触氧气瓶及附件。"},{"id":1485,"c":"特种设备安全","l":"II","t":2,"q":"气瓶必须定期进行安全检验合格,压力表定期校验合格。","o":{},"a":["正确"],"e":"气瓶要定期做安全检验，压力表也要定期校验，两者都在有效期内，才能保证承压安全和读数准确。"},{"id":1486,"c":"特种设备安全","l":"II","t":2,"q":"气焊与气割操作时,不必调整气体调压器的工作压力","o":{},"a":["错误"],"e":"气焊气割要根据材料和板厚调整调压器的输出压力，压力过高会脱火、回火，过低则火焰无力、无法正常工作。"},{"id":1487,"c":"特种设备安全","l":"II","t":2,"q":"检查漏气,应使用肥皂水,不得使用明火。","o":{},"a":["正确"],"e":"查漏只能用肥皂水，起泡处就是漏点；用明火接触泄漏气体极易引燃爆炸，绝对禁止。"},{"id":1488,"c":"特种设备安全","l":"II","t":2,"q":"烘箱（干燥箱）在加热时,门可以开启。","o":{},"a":["错误"],"e":"烘箱加热时开门会散失热量、温度骤降，还可能烫伤人和使样品受潮污染，必须停机降温后再开门。"},{"id":1489,"c":"特种设备安全","l":"II","t":2,"q":"国家（标准(GB2893-82)中规定的四种安全色是红、蓝、黄、绿。","o":{},"a":["正确"],"e":"GB2893规定的四种安全色就是红、蓝、黄、绿，分别表示禁止、指令、警告和安全状态提示。"},{"id":1490,"c":"特种设备安全","l":"II","t":2,"q":"购买、更换气瓶时,瓶体外观有缺陷、无瓶帽和防震胶圈的气瓶一律不予更换,以确保安全。","o":{},"a":["正确"],"e":"瓶体有缺陷、缺瓶帽和防震圈的气瓶在运输使用中容易损坏瓶阀，一律不接收、不更换，从源头控制风险。"},{"id":1491,"c":"特种设备安全","l":"II","t":2,"q":"高压氧气瓶使用时应保持瓶内压力在 0.5MPa 以上。","o":{},"a":["正确"],"e":"气瓶使用中要留余压，高压氧气瓶一般保持0.5MPa以上，防止外界杂质倒灌污染，也避免用尽后充装困难。"},{"id":1492,"c":"特种设备安全","l":"II","t":2,"q":"高温马弗炉使用结束断电后应该待其缓慢冷却后再打开炉门、取出烘干的样品","o":{},"a":["正确"],"e":"马弗炉断电后炉膛温度仍很高，必须缓慢冷却再开炉门取样，急开会让样品骤冷炸裂、热浪灼伤人员。"},{"id":1493,"c":"特种设备安全","l":"II","t":2,"q":"高电压实验时,实验人员必须3人以上。","o":{},"a":["错误"],"e":"高压电实验要求两人以上，一人操作、一人监护即可；说必须3人以上没有依据，人数并非越多越安全。"},{"id":1494,"c":"特种设备安全","l":"II","t":2,"q":"二氧化碳钢瓶瓶身颜色是铝白色。","o":{},"a":["正确"],"e":"二氧化碳气瓶瓶身涂铝白色、标黑字，与氧气、氮气等区分开，避免错接造成窒息或超压。"},{"id":1495,"c":"特种设备安全","l":"II","t":2,"q":"对氢气和有毒气体等钢瓶应贴有明显标志,放在远离火源,靠近门口处,均须有专人保管,使用后要及时登记备查。","o":{},"a":["正确"],"e":"氢气、有毒气体瓶要贴明显标志，放在远离火源、靠近门口便于疏散处，专人保管并登记使用情况。"},{"id":1496,"c":"特种设备安全","l":"II","t":2,"q":"对高压气体钢瓶要分类保管,直立固定。严禁将氯气与氨气,氢气与氧气,乙炔与氧气混放在一个房间","o":{},"a":["正确"],"e":"气瓶要分类保管、直立固定，氯与氨、氢与氧、乙炔与氧相遇会剧烈反应或爆炸，绝不能放在同一房间。"},{"id":1497,"c":"特种设备安全","l":"II","t":2,"q":"对高压气体钢瓶要分类保管,直立固定。若将氢气,氧气,乙炔混放在一个房间时,钢瓶之间需相隔一米的距离。","o":{},"a":["错误"],"e":"氢气、氧气、乙炔属禁忌介质，必须分室存放，相隔一米远远不够，混放一旦泄漏就会爆炸。"},{"id":1498,"c":"特种设备安全","l":"II","t":2,"q":"冬季使用气瓶时,瓶阀或减压器可能出现结霜、冻现象。可用热水或蒸汽解陈,严禁用火焰烘烤或用铁器敲打瓶筒。","o":{},"a":["正确"],"e":"瓶阀结霜冻结可用热水或蒸汽解冻，用火焰烘烤、铁器敲打会使瓶体受热升压或受损，可能引起爆炸。"},{"id":1499,"c":"特种设备安全","l":"II","t":2,"q":"大型仪器一般都使用计算机进行控制。对该计算机除了在性能上能满足要求,还必须专机专用。","o":{},"a":["正确"],"e":"大型仪器由计算机控制，该机要专机专用，不能装无关软件或联网，避免病毒和误操作影响仪器与数据。"},{"id":1500,"c":"特种设备安全","l":"II","t":2,"q":"操作高速离心机时可以戴手套","o":{},"a":["错误"],"e":"高速离心机运转时戴手套，手套容易被卷入转子或甩出，应徒手操作，并等转子完全停稳再开盖。"},{"id":1501,"c":"特种设备安全","l":"II","t":2,"q":"爆炸现象的最主要特征是压力急剧升高。","o":{},"a":["正确"],"e":"爆炸最本质的特征是压力急剧升高，瞬间释放大量能量产生冲击波，温度和声响都是伴生现象。"},{"id":1502,"c":"特种设备安全","l":"II","t":2,"q":"氨气瓶瓶身黄色,标字黑色的是氨气。","o":{},"a":["正确"],"e":"氨气瓶瓶身黄色、标黑色“氨”字，靠颜色加字样识别介质，防止把氨当氮气等误用。"},{"id":1503,"c":"特种设备安全","l":"II","t":2,"q":"2002年4月7日,浙江平湖市一个五金修理店的学徒工在用沾满油污的双手开启氧气瓶阀时,氧气瓶发生爆炸,造成该学徒工死亡,死者双手被炸飞。其原因可能是瓶阀漏气,高压氧遇油脂在有静电或明火时发生爆炸。","o":{},"a":["正确"],"e":"高压氧遇油脂会剧烈氧化，瓶阀漏气时油脂在静电或明火作用下即可引燃爆炸，双手被炸飞也符合高压气体爆裂特征。"},{"id":1504,"c":"特种设备安全","l":"II","t":2,"q":"《特种设备安全监察条例》自2005年6月1日起施行。","o":{},"a":["错误"],"e":"《特种设备安全监察条例》自2003年6月1日起施行，不是2005年，记准施行时间才能不误判。"}];
</script>

  // 本地存储可能被微信/QQ 内置浏览器或隐私模式禁用：探测一次，失败则只保留内存态并提示
  var storeOK = true;
  try { localStorage.setItem('__probe__', '1'); localStorage.removeItem('__probe__'); } catch (e) { storeOK = false; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { storeOK = false; return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { storeOK = false; return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  var defSave = { done: 0, wrongIds: [], favIds: [], cat: '', type: 'all', mode: 'order', wrongScope: 'wrong', size: 0 };
  var save;
  try {
    var raw = lsGet(KEY);
    save = raw ? Object.assign({}, defSave, JSON.parse(raw)) : Object.assign({}, defSave);
  } catch (e) { save = Object.assign({}, defSave); }
  if (!storeOK) $('storewarn').style.display = 'block';

  // 页面内确认框（原生 confirm 在部分 QQ/微信内置浏览器会被拦截或直接返回 false）
  function ask(title, msg, okText, cancelText) {
    return new Promise(function (resolve) {
      var mask = $('askMask');
      $('askTitle').textContent = title || '请确认';
      $('askMsg').textContent = msg || '';
      $('askOk').textContent = okText || '确定';
      $('askCancel').textContent = cancelText || '取消';
      mask.classList.add('show');
      function done(v) {
        mask.classList.remove('show');
        $('askOk').onclick = null; $('askCancel').onclick = null; mask.onclick = null;
        resolve(v);
      }
      $('askOk').onclick = function () { done(true); };
      $('askCancel').onclick = function () { done(false); };
      mask.onclick = function (e) { if (e.target === mask) done(false); };
    });
  }
  if (!Array.isArray(save.wrongIds)) save.wrongIds = [];
  if (!Array.isArray(save.favIds)) save.favIds = [];
  if (['wrong', 'fav', 'both'].indexOf(save.wrongScope) < 0) save.wrongScope = 'wrong';

  function persist() {
    lsSet(KEY, JSON.stringify(save));
  }

  // 未完成练习的暂存（题目顺序、当前题号、已答结果、用时）
  var SKEY = 'safety_quiz_session_v1';
  function loadSession() {
    try { var r = lsGet(SKEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  }
  function saveSession() {
    if (!S.list.length) return;
    lsSet(SKEY, JSON.stringify({
      ids: S.list.map(function (q) { return q.id; }),
      idx: S.idx, results: S.results, elapsed: S.elapsed, at: Date.now()
    }));
  }
  function clearSession() { lsDel(SKEY); }

  var CATS = [];
  BANK.forEach(function (q) { if (CATS.indexOf(q.c) < 0) CATS.push(q.c); });
  var BYID = {};
  BANK.forEach(function (q) { BYID[q.id] = q; });

  var S = { list: [], idx: 0, sel: [], locked: false, results: [], timer: null, elapsed: 0 };

  function fmtTime(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function screen(id) {
    var all = document.querySelectorAll('.screen');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    $(id).classList.add('active');
    window.scrollTo(0, 0);
  }
  function correct(q, sel) {
    var a = q.a.slice().sort().join(',');
    var s = sel.slice().sort().join(',');
    return a === s && s.length > 0;
  }
  function answerText(q) {
    if (q.t === 2) return q.a.join('');
    return q.a.map(function (k) { return k + '. ' + (q.o[k] || ''); }).join('；');
  }

  // ---------- 首页 ----------
  function renderHome() {
    var sel = $('fCat');
    sel.innerHTML = '';
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '全部分类（共 ' + BANK.length + ' 题）'; sel.appendChild(o0);
    CATS.forEach(function (c) {
      var n = 0; BANK.forEach(function (q) { if (q.c === c) n++; });
      var o = document.createElement('option'); o.value = c; o.textContent = c + '（' + n + ' 题）'; sel.appendChild(o);
    });
    sel.value = CATS.indexOf(save.cat) >= 0 ? save.cat : '';
    $('fSize').value = save.size || 0;
    $('sTotal').textContent = BANK.length;
    $('sDone').textContent = save.done;
    $('sWrong').textContent = save.wrongIds.length;
    $('sFav').textContent = save.favIds.length;
    [['fType', save.type], ['fMode', save.mode], ['fWrongScope', save.wrongScope]].forEach(function (pair) {
      var id = pair[0], want = pair[1];
      var btns = $(id).querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      var target = $(id).querySelector('button[data-v="' + want + '"]') || $(id).querySelector('button');
      if (target) target.classList.add('active');
    });
    $('fWrongScope').style.display = save.mode === 'wrong' ? 'flex' : 'none';
    var ss = loadSession();
    var rb = $('resumeBtn');
    if (ss && ss.ids && ss.ids.length && (ss.results ? ss.results.length : 0) < ss.ids.length) {
      rb.style.display = '';
      rb.textContent = '继续上次练习（第 ' + ((ss.idx || 0) + 1) + '/' + ss.ids.length + ' 题，已答 ' + (ss.results ? ss.results.length : 0) + ' 题）';
    } else {
      rb.style.display = 'none';
    }
    screen('home');
  }

  ['fType', 'fMode', 'fWrongScope'].forEach(function (id) {
    $(id).addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var group = $(id).querySelectorAll('button');
      for (var i = 0; i < group.length; i++) group[i].classList.remove('active');
      b.classList.add('active');
      if (id === 'fMode') $('fWrongScope').style.display = b.getAttribute('data-v') === 'wrong' ? 'flex' : 'none';
    });
  });

  $('startBtn').onclick = async function () {
    if (!BANK.length) { showError('题库数据为空，请检查文件是否完整。'); return; }
    var last = loadSession();
    if (last && last.ids && last.ids.length) {
      var doneN = last.results ? last.results.length : 0;
      if (doneN < last.ids.length) {
        var left = last.ids.length - doneN;
        var goOn = await ask('上一轮还没答完',
          '上一轮还有 ' + left + ' 题没答完。开始新练习会覆盖那一轮的进度。\n\n想接着上次做，点「取消」，再回首页点「继续上次练习」。',
          '开始新练习', '取消');
        if (!goOn) return;
      }
    }
    save.cat = $('fCat').value;
    save.type = $('fType').querySelector('button.active').getAttribute('data-v');
    save.mode = $('fMode').querySelector('button.active').getAttribute('data-v');
    save.wrongScope = $('fWrongScope').querySelector('button.active').getAttribute('data-v');
    var size = parseInt($('fSize').value, 10);
    save.size = isNaN(size) || size < 0 ? 0 : Math.min(size, 1504);
    persist();

    var pool = BANK.filter(function (q) {
      if (save.cat && q.c !== save.cat) return false;
      if (save.type !== 'all' && TYPE_NAME[q.t] !== save.type) return false;
      if (save.mode === 'wrong') {
        var inW = save.wrongIds.indexOf(q.id) >= 0;
        var inF = save.favIds.indexOf(q.id) >= 0;
        var wantIt = save.wrongScope === 'fav' ? inF : (save.wrongScope === 'both' ? (inW || inF) : inW);
        if (!wantIt) return false;
      }
      return true;
    });
    if (!pool.length) {
      if (save.mode === 'wrong') {
        showError(save.wrongScope === 'fav' ? '还没有收藏的题目，做题时点题目右上角的“☆ 收藏”即可加入。'
          : (save.wrongScope === 'both' ? '错题本和收藏本都还是空的，先做一组题吧。' : '还没有错题，先做一组题吧。'));
      } else {
        showError('该条件下没有题目，请换个分类或题型。');
      }
      return;
    }
    if (save.mode === 'random' || save.mode === 'wrong') shuffle(pool);
    if (save.size > 0 && pool.length > save.size) pool = pool.slice(0, save.size);

    S.list = pool; S.idx = 0; S.results = []; S.elapsed = 0;
    startTimer();
    renderQuiz();
  };

  $('resumeBtn').onclick = function () {
    var ss = loadSession();
    if (!ss || !ss.ids || !ss.ids.length) { clearSession(); renderHome(); return; }
    var list = [];
    ss.ids.forEach(function (id) { if (BYID[id]) list.push(BYID[id]); });
    if (!list.length) { clearSession(); renderHome(); return; }
    S.list = list;
    S.idx = Math.min(Math.max(parseInt(ss.idx, 10) || 0, 0), list.length - 1);
    S.results = Array.isArray(ss.results) ? ss.results : [];
    S.elapsed = parseInt(ss.elapsed, 10) || 0;
    S.sel = []; S.locked = false;
    startTimer();
    renderQuiz();
  };

  $('clearBtn').onclick = async function () {
    if (!await ask('清除本机记录', '累计练习、错题本、收藏本都会清空，此操作不可恢复。确定清除吗？', '清除', '取消')) return;
    save = Object.assign({}, defSave); persist(); clearSession(); renderHome();
  };

  // ---------- 答题 ----------
  function startTimer() {
    stopTimer();
    S.timer = setInterval(function () { S.elapsed++; $('timer').textContent = fmtTime(S.elapsed); }, 1000);
  }
  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

  function updateFavBtn(q) {
    var on = save.favIds.indexOf(q.id) >= 0;
    var b = $('favBtn');
    b.textContent = on ? '★ 已收藏' : '☆ 收藏';
    b.className = 'favbtn' + (on ? ' on' : '');
    b.title = on ? '再点一下取消收藏' : '把这道题加入收藏本';
  }

  function renderQuiz() {
    screen('quiz');
    var q = S.list[S.idx];
    var total = S.list.length;
    $('qCounter').textContent = '第 ' + (S.idx + 1) + ' / ' + total + ' 题';
    $('timer').textContent = fmtTime(S.elapsed);
    var answered = S.results.length;
    var right = 0; S.results.forEach(function (r) { if (r.ok) right++; });
    $('pDone').textContent = '已答 ' + answered;
    $('pRight').textContent = '答对 ' + right;
    $('pbarFill').style.width = (total ? (answered / total * 100) : 0) + '%';

    $('qMeta').innerHTML = '';
    [TYPE_NAME[q.t], q.l + ' 级', q.c].forEach(function (t, i) {
      var s = document.createElement('span');
      s.className = 'chip' + (i === 0 ? '' : (i === 1 ? ' gray' : ''));
      s.textContent = t; $('qMeta').appendChild(s);
    });
    $('qStem').textContent = (S.idx + 1) + '. ' + q.q;
    updateFavBtn(q);
    $('qOptions').innerHTML = '';
    $('qFeedback').innerHTML = '';

    var prev = S.results[S.idx];
    S.sel = prev ? prev.sel.slice() : [];
    S.locked = !!prev;
    drawOptions(q);
    if (prev) showFeedback(q, prev.ok);
    updateButtons();
    saveSession();
  }

  function renderOverview() {
    var total = S.list.length, answered = S.results.length;
    $('ovStat').textContent = '已答 ' + answered + ' / ' + total + ' 题，未答 ' + (total - answered) + ' 题';
    var g = $('ovGrid');
    g.innerHTML = '';
    for (var i = 0; i < total; i++) {
      (function (i) {
        var b = document.createElement('button');
        b.className = 'ovb';
        var r = S.results[i];
        b.classList.add(r ? (r.ok ? 'ok' : 'no') : 'todo');
        if (i === S.idx) b.classList.add('cur');
        b.textContent = String(i + 1);
        b.onclick = function () {
          S.idx = i;
          closeOverview();
          renderQuiz();
        };
        g.appendChild(b);
      })(i);
    }
  }

  function openOverview() {
    renderOverview();
    $('ovMask').style.display = 'block';
    $('ovPanel').style.display = 'flex';
  }

  function closeOverview() {
    $('ovMask').style.display = 'none';
    $('ovPanel').style.display = 'none';
  }

  function optionList(q) {
    var arr = [];
    if (q.t === 2) {
      arr.push({ k: '正确', circle: '√', v: '正确' }); arr.push({ k: '错误', circle: '×', v: '错误' });
    } else {
      Object.keys(q.o).sort().forEach(function (k) { arr.push({ k: k, circle: k, v: q.o[k] }); });
    }
    return arr;
  }

  function drawOptions(q) {
    var box = $('qOptions'); box.innerHTML = '';
    optionList(q).forEach(function (o) {
      var el = document.createElement('div');
      el.className = 'opt';
      var picked = S.sel.indexOf(o.k) >= 0;
      if (picked) el.classList.add('sel');
      if (S.locked) {
        el.classList.remove('sel');
        if (q.a.indexOf(o.k) >= 0) el.classList.add('right');
        else if (picked) el.classList.add('wrong');
      }
      var k = document.createElement('div'); k.className = 'k'; k.textContent = o.circle || o.k;
      var v = document.createElement('div'); v.className = 'v'; v.textContent = o.v;
      el.appendChild(k); el.appendChild(v);
      el.onclick = function () {
        if (S.locked) return;
        if (q.t === 1) {
          var i = S.sel.indexOf(o.k);
          if (i >= 0) S.sel.splice(i, 1); else S.sel.push(o.k);
        } else {
          S.sel = [o.k];
        }
        drawOptions(q); updateButtons();
      };
      box.appendChild(el);
    });
  }

  function updateButtons() {
    var prev = S.results[S.idx];
    $('prevBtn').disabled = S.idx === 0;
    $('submitBtn').style.display = prev ? 'none' : '';
    $('nextBtn').style.display = prev ? '' : 'none';
    $('submitBtn').disabled = S.sel.length === 0;
    $('nextBtn').textContent = (S.idx === S.list.length - 1) ? '查看结果' : '下一题';
  }

  function showFeedback(q, ok) {
    var fb = $('qFeedback');
    fb.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'fb ' + (ok ? 'ok' : 'no');
    var head = document.createElement('div');
    head.textContent = ok ? '回答正确' : '回答错误';
    var ans = document.createElement('div'); ans.className = 'ans';
    ans.textContent = '正确答案（原文档）：' + answerText(q);
    var mine = document.createElement('div'); mine.className = 'txt';
    mine.textContent = '你的答案：' + (S.sel.length ? S.sel.join(' / ') : '未作答');
    d.appendChild(head); d.appendChild(ans); d.appendChild(mine);
    fb.appendChild(d);

    if (q.e) {
      var ex = document.createElement('div');
      ex.className = 'explain';
      var ti = document.createElement('div'); ti.className = 'etitle';
      ti.textContent = ok ? '解析（顺便巩固一下）' : '错题解析（记牢它）';
      var tx = document.createElement('div'); tx.textContent = q.e;
      ex.appendChild(ti); ex.appendChild(tx);
      fb.appendChild(ex);
    }
  }

  $('submitBtn').onclick = function () {
    var q = S.list[S.idx];
    if (!S.sel.length) return;
    var ok = correct(q, S.sel);
    S.results[S.idx] = { id: q.id, sel: S.sel.slice(), ok: ok };
    save.done++;
    var wi = save.wrongIds.indexOf(q.id);
    if (ok) { if (wi >= 0) save.wrongIds.splice(wi, 1); }
    else if (wi < 0) save.wrongIds.push(q.id);
    persist();
    S.locked = true;
    drawOptions(q); showFeedback(q, ok); updateButtons();
    $('pDone').textContent = '已答 ' + S.results.length;
    var right = 0; S.results.forEach(function (r) { if (r.ok) right++; });
    $('pRight').textContent = '答对 ' + right;
    $('pbarFill').style.width = (S.results.length / S.list.length * 100) + '%';
    $('sWrong').textContent = save.wrongIds.length;
    saveSession();
  };

  $('favBtn').onclick = function () {
    var q = S.list[S.idx]; if (!q) return;
    var i = save.favIds.indexOf(q.id);
    if (i >= 0) save.favIds.splice(i, 1); else save.favIds.push(q.id);
    persist();
    updateFavBtn(q);
    $('sFav').textContent = save.favIds.length;
  };

  $('nextBtn').onclick = function () {
    if (S.idx < S.list.length - 1) { S.idx++; renderQuiz(); }
    else finish();
  };
  $('prevBtn').onclick = function () { if (S.idx > 0) { S.idx--; renderQuiz(); } };
  $('ovBtn').onclick = openOverview;
  $('ovClose').onclick = closeOverview;
  $('ovMask').onclick = closeOverview;
  $('quitBtn').onclick = async function () {
    if (!await ask('退出练习', '退出后进度会暂存，下次可在首页点「继续上次练习」接着做。确定退出吗？', '退出', '继续答题')) return;
    saveSession(); stopTimer(); renderHome();
  };

  // ---------- 结果 ----------
  function finish() {
    stopTimer();
    clearSession();
    var right = 0;
    S.results.forEach(function (r) { if (r.ok) right++; });
    var total = S.list.length;
    var score = total ? Math.round(right / total * 100) : 0;
    $('rScore').textContent = score;
    $('rTip').textContent = score >= 90 ? '很棒，继续保持！' : (score >= 60 ? '不错，把错题解析再过一遍。' : '建议先把错题和解析过一遍。');
    $('rTotal').textContent = total;
    $('rRight').textContent = right;
    $('rWrong').textContent = total - right;
    $('rTimer').textContent = fmtTime(S.elapsed);

    var list = $('reviewList'); list.innerHTML = '';
    S.list.forEach(function (q, i) {
      var r = S.results[i]; if (!r) return;
      var d = document.createElement('details');
      var sm = document.createElement('summary');
      sm.textContent = (i + 1) + '. ' + (r.ok ? '✓ ' : '✗ ') + q.q.slice(0, 22) + (q.q.length > 22 ? '…' : '');
      d.appendChild(sm);
      var line1 = document.createElement('div'); line1.className = 'dline';
      line1.textContent = '你的答案：' + r.sel.join(' / ') + '　｜　正确答案（原文档）：' + q.a.join(' / ');
      var line2 = document.createElement('div'); line2.className = 'dline';
      line2.textContent = q.q;
      var line3 = document.createElement('div'); line3.className = 'dline';
      line3.textContent = answerText(q);
      d.appendChild(line1); d.appendChild(line2); d.appendChild(line3);
      if (q.e) {
        var line4 = document.createElement('div'); line4.className = 'dline';
        line4.textContent = '解析：' + q.e;
        d.appendChild(line4);
      }
      list.appendChild(d);
    });
    screen('result');
  }

  $('backHomeBtn').onclick = function () { renderHome(); };
  $('againWrongBtn').onclick = function () {
    var ids = {}; S.list.forEach(function (q, i) { if (!S.results[i] || !S.results[i].ok) ids[q.id] = 1; });
    var pool = BANK.filter(function (q) { return ids[q.id] || save.wrongIds.indexOf(q.id) >= 0; });
    if (!pool.length) { showError('没有错题可练。'); return; }
    shuffle(pool);
    S.list = pool; S.idx = 0; S.results = []; S.elapsed = 0; startTimer(); renderQuiz();
  };
  $('againNewBtn').onclick = function () { $('startBtn').click(); };

  // ---------- 错题本 ----------
  function renderWrongbook() {
    var ids = save.wrongIds.filter(function (id) { return BYID[id]; });
    $('wbCount').textContent = ids.length + ' 题';
    var box = $('wbList'); box.innerHTML = '';
    if (!ids.length) {
      var p = document.createElement('div');
      p.className = 'mini';
      p.textContent = '还没有错题。去练一组，答错的题会自动进来。';
      box.appendChild(p);
      screen('wrongbook');
      return;
    }
    ids.forEach(function (id) {
      var q = BYID[id];
      var item = document.createElement('div'); item.className = 'wb-item';
      var wq = document.createElement('div'); wq.className = 'wq';
      wq.textContent = '[' + TYPE_NAME[q.t] + '] ' + q.q;
      item.appendChild(wq);
      if (q.t !== 2) {
        Object.keys(q.o).sort().forEach(function (k) {
          var o = document.createElement('div');
          o.className = 'wo' + (q.a.indexOf(k) >= 0 ? ' hit' : '');
          o.textContent = k + '. ' + q.o[k];
          item.appendChild(o);
        });
      }
      var wa = document.createElement('div'); wa.className = 'wa';
      wa.textContent = '正确答案（原文档）：' + answerText(q);
      item.appendChild(wa);
      if (q.e) {
        var we = document.createElement('div'); we.className = 'we';
        we.textContent = '解析：' + q.e;
        item.appendChild(we);
      }
      var rm = document.createElement('button'); rm.className = 'rm';
      rm.textContent = '移出错题本';
      rm.onclick = function () {
        var i = save.wrongIds.indexOf(id);
        if (i >= 0) save.wrongIds.splice(i, 1);
        persist(); renderWrongbook(); $('sWrong').textContent = save.wrongIds.length;
      };
      item.appendChild(rm);
      box.appendChild(item);
    });
    screen('wrongbook');
  }
  $('wrongbookBtn').onclick = renderWrongbook;
  $('wbBack').onclick = renderHome;

  // ---------- 收藏本 ----------
  function renderFavbook() {
    var ids = save.favIds.filter(function (id) { return BYID[id]; });
    $('fbCount').textContent = ids.length + ' 题';
    var box = $('fbList'); box.innerHTML = '';
    if (!ids.length) {
      var p = document.createElement('div');
      p.className = 'mini';
      p.textContent = '还没有收藏。做题时点题目右上角的“☆ 收藏”，题目就会进到这里。';
      box.appendChild(p);
      screen('favbook');
      return;
    }
    ids.forEach(function (id) {
      var q = BYID[id];
      var item = document.createElement('div'); item.className = 'wb-item';
      var wq = document.createElement('div'); wq.className = 'wq';
      wq.textContent = '[' + TYPE_NAME[q.t] + '] ' + q.q;
      item.appendChild(wq);
      if (q.t !== 2) {
        Object.keys(q.o).sort().forEach(function (k) {
          var o = document.createElement('div');
          o.className = 'wo' + (q.a.indexOf(k) >= 0 ? ' hit' : '');
          o.textContent = k + '. ' + q.o[k];
          item.appendChild(o);
        });
      }
      var wa = document.createElement('div'); wa.className = 'wa';
      wa.textContent = '正确答案（原文档）：' + answerText(q);
      item.appendChild(wa);
      if (q.e) {
        var we = document.createElement('div'); we.className = 'we';
        we.textContent = '解析：' + q.e;
        item.appendChild(we);
      }
      var rm = document.createElement('button'); rm.className = 'rm';
      rm.textContent = '移出收藏本';
      rm.onclick = function () {
        var i = save.favIds.indexOf(id);
        if (i >= 0) save.favIds.splice(i, 1);
        persist(); renderFavbook(); $('sFav').textContent = save.favIds.length;
      };
      item.appendChild(rm);
      box.appendChild(item);
    });
    screen('favbook');
  }
  $('favbookBtn').onclick = renderFavbook;
  $('fbBack').onclick = renderHome;

  if (!BANK.length) showError('题库数据未加载，请确认文件完整。');
  renderHome();
})();
</script>
</body>
</html>
