搬运，呼吸心跳停止几分钟就会致命，顺序弄反会耽误救命。"},{"id":340,"c":"安全通识","l":"I","t":2,"q":"实验大楼出现火情时千万不要乘电梯,因为电梯可能因停电或失控,同时又因“烟囱效应”,电梯井常常成为浓烟的流通道。","o":{},"a":["正确"],"e":"火灾时电梯可能断电困人或失控，电梯井又是“烟囱”，浓烟上窜，逃生必须走楼梯。"},{"id":341,"c":"安全通识","l":"I","t":2,"q":"实验大楼因出现火情发生浓烟时应迅速离开,当浓烟已弥漫实验室内和走廊看不清楚时,要一手湿巾捂鼻,另一个手靠墙壁,沿地面和楼梯边缘匍匐下楼、当到门口时,不要站立开门,而是举手过头顶开门,以避免被大量浓烟熏倒","o":{},"a":["正确"],"e":"浓烟中贴地匍匐、湿巾捂鼻，到门口举手过头顶开门，可避免开门瞬间被热烟气流熏倒。"},{"id":342,"c":"安全通识","l":"I","t":2,"q":"实验过程中如发生意外或事故,应冷静妥善地处理,尽量把事故解决在萌芽状态。如事故较为严重,有危及人身安全可能时,应及时撤离现场,并通知邻近实验室工作人员迅速撤离,并尽快报警。","o":{},"a":["正确"],"e":"小事故冷静处置争取消灭在萌芽，危及人身安全时果断撤离、通知邻室并报警，人命优先。"},{"id":343,"c":"安全通识","l":"I","t":2,"q":"实验过程中严禁经口使用吸管;但身边没有胶水胶棒等可以用口舔标签用以粘贴。","o":{},"a":["错误"],"e":"错。实验室严禁一切经口操作，用嘴舔标签同样可能摄入化学品，粘贴应使用胶水胶棒。"},{"id":344,"c":"安全通识","l":"I","t":2,"q":"实验过程中应尽量避免实验仪器在夜间无人看管的情况下连续运转,如果必须在夜间使用,应严格检查实验仪器的漏电保护装置及空气开关等工作正常。","o":{},"a":["正确"],"e":"仪器夜间无人看守连续运转，要先确认漏电保护、空气开关正常，否则出事没人及时发现。"},{"id":345,"c":"安全通识","l":"I","t":2,"q":"实验过程中应仔细观察实验现象并及时做好实验记录,原始记录要完整、真实、准确、清楚。","o":{},"a":["正确"],"e":"实验现象要及时记录，原始记录必须完整真实准确清楚，事后补记或涂改都会让数据失去价值。"},{"id":346,"c":"安全通识","l":"I","t":2,"q":"实验结束,离开实验室时要检查水、电、和门窗,确保安全。","o":{},"a":["正确"],"e":"实验结束离开时查水、电、门窗，是防止跑水、短路和失窃的最后一道关口。"},{"id":347,"c":"安全通识","l":"I","t":2,"q":"实验结束后,要关闭设备,断开电源,并将有关实验用品整理好。","o":{},"a":["正确"],"e":"实验做完要关设备、断电源、整理用品，既保护仪器，也让下一位使用者有个安全环境。"},{"id":348,"c":"安全通识","l":"I","t":2,"q":"实验结束后,应该打扫卫生、整理或运走废弃的试样或物品。","o":{},"a":["正确"],"e":"实验后打扫卫生、把废弃试样和物品清走，残留物可能挥发、腐蚀或污染，不能留在台面上。"},{"id":349,"c":"安全通识","l":"I","t":2,"q":"实验进行前要了解实验仪器的使用说明及注意事项,实验过程中要严格按照操作规程进行操作。","o":{},"a":["正确"],"e":"上机前读懂使用说明和注意事项，过程中严格按规程操作，很多事故就出在“想当然”上。"},{"id":350,"c":"安全通识","l":"I","t":2,"q":"实验人员不得脱岗,进行危险实验时须有2人同时在场","o":{},"a":["正确"],"e":"实验人员不得脱岗，危险性实验必须两人同时在场，一人出事另一人能及时处置求救。"},{"id":351,"c":"安全通识","l":"I","t":2,"q":"实验时,应先连接好电路后才接通电源。实验结束时,先拆线路再切断电源。","o":{},"a":["错误"],"e":"错在后半句。结束时也应先切断电源再拆线路，带电拆线容易短路打火、触电伤人。"},{"id":352,"c":"安全通识","l":"I","t":2,"q":"实验室安全工作的中心任务是防止发生人员伤亡、财产和科研资料损失。","o":{},"a":["正确"],"e":"实验室安全工作的中心任务，就是防止人员伤亡和财产、科研资料损失，各项措施都围绕这个目标。"},{"id":353,"c":"安全通识","l":"I","t":2,"q":"实验室安全与卫生工作应坚持“安全第一,预防为主”。","o":{},"a":["正确"],"e":"“安全第一，预防为主”是实验室安全卫生工作的基本方针，重在日常防范而非事后补救。"},{"id":354,"c":"安全通识","l":"I","t":2,"q":"实验室安全与卫生检查内容主要包括实验室布置、卫生、水电安全、冰箱与烘箱使用管理、危险品使用与保管、化学与生物废弃物（气、液、固态物）的处置、排污管理、气体钢瓶安全、放射性安全等。","o":{},"a":["正确"],"e":"安全检查覆盖布置卫生、水电、冰箱烘箱、危险品、废弃物、气瓶、放射源等，缺一项就留一个漏洞。"},{"id":355,"c":"安全通识","l":"I","t":2,"q":"实验室必须配备符合本室要求的消防器材,消防器材要放置在明显或便于拿取的位置。严禁任何人以任何借口把消防器材移作它用。","o":{},"a":["正确"],"e":"实验室要配足适用的消防器材，放在明显易取处，任何人不得以任何借口挪作他用。"},{"id":356,"c":"安全通识","l":"I","t":2,"q":"实验室必须妥善保管消防器材和防盗装置,并定期检查。消防器材不得移作它用,周围禁止堆放杂物。","o":{},"a":["正确"],"e":"消防器材和防盗装置要妥善保管、定期检查，周围不得堆放杂物，被挡住或失效的器材等于没有。"},{"id":357,"c":"安全通识","l":"I","t":2,"q":"实验室不得乱拉电线,套接接线板。","o":{},"a":["正确"],"e":"乱拉电线和接线板套接容易过载、接触不良发热，是实验室电气火灾的常见源头。"},{"id":358,"c":"安全通识","l":"I","t":2,"q":"实验室常用的灭火方法:用水灭火、砂土灭火、灭火器。","o":{},"a":["正确"],"e":"水、砂土、灭火器是实验室常用的三种灭火手段，按起火物性质选用，不能一概用水。"},{"id":359,"c":"安全通识","l":"I","t":2,"q":"实验室的电源总闸没有必要每天离开时都关闭,只要关闭常用电器的电源即可,经常开关总闸会缩短闸的使用寿命。","o":{},"a":["错误"],"e":"错。离开实验室应关闭电源总闸，只关常用电器消除不了待机和老化的线路隐患。"},{"id":360,"c":"安全通识","l":"I","t":2,"q":"实验室的接线板远离可能有水的位置和高温环境。","o":{},"a":["正确"],"e":"接线板要远离水源和高温，受潮会漏电，靠近热源则加速绝缘老化甚至引燃。"},{"id":361,"c":"安全通识","l":"I","t":2,"q":"实验室地面出现溢水的主要原因之一是忘记关闭水龙头,尤其停水时忘关水龙头,因此离开实验室时要认真检查。","o":{},"a":["正确"],"e":"地面溢水多半是忘关水龙头，尤其停水时开着龙头，来水后无人察觉，离开前务必检查。"},{"id":362,"c":"安全通识","l":"I","t":2,"q":"实验室发生非火灾类事故,应立即报告单位负责人和学校保卫处,设立警戒区并撤离无关人员,以减轻潜在危害。","o":{},"a":["正确"],"e":"非火灾类事故也要立即报告负责人和保卫处，设立警戒区撤出无关人员，防止二次伤害。"},{"id":363,"c":"安全通识","l":"I","t":2,"q":"实验室发生火警、火灾时,应立即采取措施灭火,并报保卫处或119。","o":{},"a":["正确"],"e":"起火初期先就近取灭火器扑救，同时报保卫处或119；火势大了立刻撤离，别恋战。"},{"id":364,"c":"安全通识","l":"I","t":2,"q":"实验室工作必须保持严肃、严密、严格、严谨;室内保持整洁有序,不准喧哗、打闹、抽烟。","o":{},"a":["正确"],"e":"实验室讲究严肃、严密、严格、严谨，室内整洁有序、不喧哗打闹不抽烟，注意力集中才不出错。"},{"id":365,"c":"安全通识","l":"I","t":2,"q":"实验室禁止私拉乱接电线,实验过程中自制非标设备时,应报请实验室负责人批准,然后请电气专业人员按照标准安全的连接。","o":{},"a":["正确"],"e":"禁止私拉乱接电线；自制非标设备须先报实验室负责人批准，再由电气专业人员按标准接线。"},{"id":366,"c":"安全通识","l":"I","t":2,"q":"实验室门口应张贴实验室安全信息牌。","o":{},"a":["正确"],"e":"实验室门口应张贴安全信息牌，标明危险类别、责任人和应急电话，便于识别和救援。"},{"id":367,"c":"安全通识","l":"I","t":2,"q":"实验室灭火的方法要针对起因选用合适的方法。一般小火可用湿布、石棉布或沙子覆盖燃烧物即可灭火。","o":{},"a":["正确"],"e":"灭火要因物施策，一般小火用湿布、石棉布或沙土覆盖隔绝空气就能压灭，不必动用灭火器。"},{"id":368,"c":"安全通识","l":"I","t":2,"q":"实验室内彼此保持安静,不得进行娱乐活动。","o":{},"a":["正确"],"e":"实验室内保持安静、不进行娱乐活动，既防分心出错，也避免干扰他人实验。"},{"id":369,"c":"安全通识","l":"I","t":2,"q":"实验室内不得使用明火取暖。必须使用明火进行实验的场所,须经批准后,方可进行实验","o":{},"a":["正确"],"e":"实验室内禁止用明火取暖；确需使用明火实验的场所，必须经批准后按规程进行。"},{"id":370,"c":"安全通识","l":"I","t":2,"q":"实验室内不得停放电动车。","o":{},"a":["正确"],"e":"电动车电池易起火且燃烧迅猛、毒烟大，实验室内不得停放，更不得充电。"},{"id":371,"c":"安全通识","l":"I","t":2,"q":"实验室内出现火情,若被困在室内时,应迅速打开水龙头,将所有可盛水的容器装满水,并把毛巾打湿。用湿毛巾捂嘴,可以遮住部分浓烟不被吸入。","o":{},"a":["正确"],"e":"被困室内先蓄水、打湿毛巾捂住口鼻，减少浓烟吸入，同时设法报警呼救等待救援。"},{"id":372,"c":"安全通识","l":"I","t":2,"q":"实验室内出现火情逃到室外走廊时,要尽量做到随手关门,这样一来可阻挡火势随人运动而迅速蔓延,增加逃生的有效时间。","o":{},"a":["正确"],"e":"逃生时随手关门能阻挡火和烟随人蔓延，为后续逃生和救援多争取宝贵时间。"},{"id":373,"c":"安全通识","l":"I","t":2,"q":"实验室内的电线、开关、灯头、插头、插座等一切电器用具,要经常检查是否完好,有无漏电、潮湿、霉烂等情况。一旦有问题应立即报修。","o":{},"a":["正确"],"e":"电线、开关、灯头、插座要经常检查有无破损、漏电、受潮霉烂，一旦有问题立即报修，不能凑合用。"},{"id":374,"c":"安全通识","l":"I","t":2,"q":"实验室内电源根据需要可自行拆装、改线。","o":{},"a":["错误"],"e":"电源线路必须由专业电工按规范施工，任何人不得自行拆装改线，私改线路极易留下触电火灾隐患。"},{"id":375,"c":"安全通识","l":"I","t":2,"q":"实验室内禁止抽烟、饮食。","o":{},"a":["正确"],"e":"实验室内禁止抽烟和饮食，化学品可经口、呼吸道进入体内，烟头还是明火源。"},{"id":376,"c":"安全通识","l":"I","t":2,"q":"实验室内可以堆放个人物品。","o":{},"a":["错误"],"e":"实验室通道和台面不得堆放个人物品，既占空间妨碍操作，也影响紧急疏散和救援。"},{"id":377,"c":"安全通识","l":"I","t":2,"q":"实验室内可以使用电炉、微波炉、电磁炉、电饭煲等取暖、做饭。","o":{},"a":["错误"],"e":"电炉、微波炉、电磁炉、电饭煲在实验室做饭取暖，既超负荷用电又带入明火高温，明令禁止。"},{"id":378,"c":"安全通识","l":"I","t":2,"q":"实验室内可以使用木制配电板、闸刀开关、花线电线。","o":{},"a":["错误"],"e":"木制配电板、闸刀开关、花线电线都属淘汰的不安全电料，易短路起火，应改用空气开关和合格导线。"},{"id":379,"c":"安全通识","l":"I","t":2,"q":"实验室内应使用空气开关,并配备必要的漏电保护器;电气设备应配备足够的用电功率和电线,不得超负荷用电;电气设备和大型仪器须接地良好,对电线老化等隐患要定期检查并及时排除。","o":{},"a":["正确"],"e":"配空气开关和漏电保护器、不超负荷、设备接地良好、定期排查老化线路，这四方面都要到位。"},{"id":380,"c":"安全通识","l":"I","t":2,"q":"实验室全体人员要熟悉实验室的逃生路径、消防设施及自救逃生的方法,平时积极参与应急逃生演练","o":{},"a":["正确"],"e":"全体人员都要熟悉逃生路线、消防设施和自救方法，平时积极参加演练，真遇险才不慌。"},{"id":381,"c":"安全通识","l":"I","t":2,"q":"实验室人员必须定期检查设备、水电线路、门窗等是否完好,如发现问题,必须及时进行维修。","o":{},"a":["正确"],"e":"设备、线路、门窗都是事故的源头，定期巡查能把小毛病掐灭在萌芽里，发现破损立即报修，别拖成大隐患。"},{"id":382,"c":"安全通识","l":"I","t":2,"q":"实验室人员发生触电时,应迅速切断电源,将触电者上衣解开,取出口中异物,然后进行人工呼吸。当患者恢复呼吸时,应立即送医院。","o":{},"a":["正确"],"e":"触电急救先断电，再解开上衣、清出口中异物做人工呼吸；呼吸一恢复也不能松劲，马上送医院继续观察。"},{"id":383,"c":"安全通识","l":"I","t":2,"q":"实验室如发现存在安全隐患,要采取措施进行整改。","o":{},"a":["正确"],"e":"隐患不整改就等于埋雷，发现一处改一处，落实责任人和整改期限，改完还要复查确认才算闭环。"},{"id":384,"c":"安全通识","l":"I","t":2,"q":"实验室一旦发生起火,不要惊慌失措,应利用消防器材,采取有效措施控制、扑灭火灾。","o":{},"a":["正确"],"e":"起火先别慌，判断火情后用灭火器、消火栓等器材对准火源扑救，火势大就撤离并报警，别硬拼。"},{"id":385,"c":"安全通识","l":"I","t":2,"q":"实验室应保持整洁有序,不准喧哗、打闹、抽烟。","o":{},"a":["正确"],"e":"实验室是干活的地方，地面台面保持清爽，不喧哗打闹，更不许抽烟，一个烟头就可能引燃溶剂。"},{"id":386,"c":"安全通识","l":"I","t":2,"q":"实验室应对仪器设备加强维护保养,定期校验和检修。","o":{},"a":["正确"],"e":"仪器也像人一样要体检，定期保养、校验、检修，才能保证数据准、不漏电、不突然罢工。"},{"id":387,"c":"安全通识","l":"I","t":2,"q":"实验室应将相应的规章制度和操作规程挂到墙上或便于取阅的地方。","o":{},"a":["正确"],"e":"制度和规程挂上墙、放在随手能翻的地方，遇事照着做，比凭记忆、凭感觉靠谱得多。"},{"id":388,"c":"安全通识","l":"I","t":2,"q":"实验室应配备相应的消防器材。参加实验人员要熟悉其存放位置及使用方法并掌握有关的灭火知识。","o":{},"a":["正确"],"e":"消防器材要配齐，更要知道放在哪、怎么用；灭火器、消火栓和逃生通道的位置平时就得心里有数。"},{"id":389,"c":"安全通识","l":"I","t":2,"q":"实验危险废弃物不得倒入自来水下水道或普通垃圾箱等处。","o":{},"a":["正确"],"e":"危险废液废渣有专门收集容器，倒下水道会污染水体、腐蚀管道，扔普通垃圾箱可能伤人，必须分类交处置。"},{"id":390,"c":"安全通识","l":"I","t":2,"q":"实验仪器使用时要有人在场,不得擅自离开。","o":{},"a":["正确"],"e":"仪器通电运行就有风险，人走机不停最容易出事，必须有人守着，离开前先停机断电。"},{"id":391,"c":"安全通识","l":"I","t":2,"q":"实验之前要检查线路连接是否正确。经教师检查同意后方可接通电源。","o":{},"a":["正确"],"e":"接线先自查，再请老师确认无误才合闸，这一步多花两分钟，能避免短路、触电和烧设备。"},{"id":392,"c":"安全通识","l":"I","t":2,"q":"实验中,进行高温操作时,必须佩戴防高温手套。","o":{},"a":["正确"],"e":"高温台、马弗炉、加热板都是烫伤源，拿取物件必须戴防高温手套，别图快用手或湿布去碰。"},{"id":393,"c":"安全通识","l":"I","t":2,"q":"实验中遇到严重割伤,可在伤口上部10cm处用沙布扎紧,减慢流血,并立即送医院。","o":{},"a":["正确"],"e":"严重出血先在伤口上方约十厘米处加压扎紧减缓失血，记住扎带时间，然后尽快送医，别自己处理完就算。"},{"id":394,"c":"安全通识","l":"I","t":2,"q":"实验中遇到一般割伤,应立即取出伤口内的异物,保持伤口干净,并用酒精棉清除伤口周围的污物,涂上外伤膏或消炎粉。","o":{},"a":["正确"],"e":"一般割伤先冲净、取出可见异物，用酒精棉从伤口周围向外消毒，再涂药包扎，别让脏东西留在伤口里。"},{"id":395,"c":"安全通识","l":"I","t":2,"q":"实验中遇到一般烫伤和烧伤,不要弄破水泡,在伤口处用95%的酒精轻涂伤口,涂上烫伤膏或涂一层凡士林油,再用纱布包扎。","o":{},"a":["错误"],"e":"错在用95%酒精涂伤口，酒精刺激创面还会加重损伤；正确做法是冷水冲洗降温、保护水泡，再涂烫伤膏包扎。"},{"id":396,"c":"安全通识","l":"I","t":2,"q":"使用U盘拷贝资料,应先对U盘杀毒,防止病毒感染 。","o":{},"a":["正确"],"e":"U盘是病毒搬运工，插进实验室电脑前先杀毒，外来文件别急着双击，能少一次大面积中招。"},{"id":397,"c":"安全通识","l":"I","t":2,"q":"使用电器时可以用两眼插头代替三眼插头。","o":{},"a":["错误"],"e":"三眼插头多出的那根是接地线，换成两眼插头外壳就失去保护，一旦漏电，人就成了电流的通路。"},{"id":398,"c":"安全通识","l":"I","t":2,"q":"使用电子门禁的大楼和实验室,应对各类人员设置相应的级别,对于门禁卡丢失、人员调动或离校等情况应及时采取措施,办理报失或移交手续。","o":{},"a":["正确"],"e":"门禁要按人员分级授权，卡丢了、人走了立即挂失或收回，不然一张旧卡就是一把万能钥匙。"},{"id":399,"c":"安全通识","l":"I","t":2,"q":"使用过的实验服脱下后,不得与日常衣服放在一起,也不得放在洁净区域。","o":{},"a":["正确"],"e":"实验服沾着试剂和微生物，脱下来单独挂放，别和日常衣服混，也别带进洁净区或休息区。"},{"id":400,"c":"安全通识","l":"I","t":2,"q":"使用精密仪器时,必须严格按照操作规程进行操作,细心谨慎,避免因粗心大意而损坏仪器。如发现仪器有故障,应立即停止使用,报告教师,及时排除故障。使用后必须自觉填写登记本。","o":{},"a":["正确"],"e":"精密仪器娇贵，按规程细心操作，出故障先停机再报告，用完如实登记，既护设备也方便追溯。"},{"id":401,"c":"安全通识","l":"I","t":2,"q":"使用手提灭火器时,拨掉保险销,握住胶管前端,对准燃烧物根部用力压下压把,灭火剂喷出,就可灭火。","o":{},"a":["正确"],"e":"口诀是提拔握压：拔保险销、握胶管、对准火焰根部、压下压把，站在上风方向由近及远喷。"},{"id":402,"c":"安全通识","l":"I","t":2,"q":"事故发生后,应迅速将警戒区内与事故无关的人员撤离,以减轻潜在危害。","o":{},"a":["正确"],"e":"事故一发生先把无关人员撤到安全区，划出警戒线，人少了伤亡就少，救援也才展得开。"},{"id":403,"c":"安全通识","l":"I","t":2,"q":"试验结束后,应该打扫卫生并运走废弃的试样或物品。","o":{},"a":["正确"],"e":"实验收尾同样重要，台面打扫干净，剩余试样和废弃物分类运走，不给下一个人留隐患。"},{"id":404,"c":"安全通识","l":"I","t":2,"q":"室内发生电气火灾,应立即报警然后进行扑救。","o":{},"a":["错误"],"e":"错在顺序，电气火灾第一步是切断电源，带电扑救可能触电；断电后再报警、用干粉或气体灭火器扑救。"},{"id":405,"c":"安全通识","l":"I","t":2,"q":"水具有导电性,不宜扑救带电设备的火灾,不能扑救遇水燃烧物质或非水溶性燃烧液体的火灾。","o":{},"a":["正确"],"e":"水能导电，浇带电设备等于把电引到人身上；遇水燃烧的物质和非水溶性液体着火，用水还会扩大火势。"},{"id":406,"c":"安全通识","l":"I","t":2,"q":"水蒸汽具有潜热,当水蒸汽与被灭菌的物品接触时,可凝结成水而放出潜热,使温度迅速升高,加强灭菌效果。","o":{},"a":["正确"],"e":"蒸汽灭菌靠的就是潜热，高温蒸汽碰到冷物品凝结放热，温度瞬间上去，菌才被杀透。"},{"id":407,"c":"安全通识","l":"I","t":2,"q":"通常有害药品经呼吸器官、消化器官或皮肤吸入体内,引起中毒。因此,我们切忌口尝、鼻嗅及用手触摸药品。","o":{},"a":["正确"],"e":"毒物三条路进人体：呼吸、吞咽、皮肤渗入，所以不口尝、不凑近直闻、不用手摸，闻气味要用手扇。"},{"id":408,"c":"安全通识","l":"I","t":2,"q":"通风控制措施就是借助于有效的通风,使气体、蒸气或粉尘的浓度低于最高容许浓度。","o":{},"a":["正确"],"e":"通风就是把有害气体、蒸气、粉尘稀释排走，控制在最高容许浓度以下，人待在里头才安全。"},{"id":409,"c":"安全通识","l":"I","t":2,"q":"突发性不可抗拒的雷电、水灾、地震、房屋垮塌等自然灾害事故发生后,应在领导小组的指挥下,马上组织疏散、抢救现场工作人员或进行人员自助自救,以确保人员的人身安全,作好善后工作。","o":{},"a":["正确"],"e":"雷电、水灾、地震等不可抗灾害，听领导小组统一指挥，先疏散救人、再自救互救，最后处理善后。"},{"id":410,"c":"安全通识","l":"I","t":2,"q":"危险化学品用完后就可以将安全标签撕下。","o":{},"a":["错误"],"e":"标签是化学品的身份证，空桶仍有残液和蒸气，撕了标签别人就不知道里面是什么，应保留到处置完。"},{"id":411,"c":"安全通识","l":"I","t":2,"q":"为保证安全用电,配电箱内所用的保险丝应该尽量粗。","o":{},"a":["错误"],"e":"保险丝不是越粗越好，选粗了电流超限也不熔断，线路照样过热起火，必须按额定电流匹配。"},{"id":412,"c":"安全通识","l":"I","t":2,"q":"为避免皮肤受到化学品伤害,可通过穿防毒衣,戴防护手套,穿雨衣、雨鞋等方法进行防护。","o":{},"a":["正确"],"e":"防毒衣、手套、雨衣雨鞋能把皮肤和化学品隔开，接触腐蚀、有毒物质时该穿就穿，别嫌麻烦。"},{"id":413,"c":"安全通识","l":"I","t":2,"q":"为避免线路负荷过大,而引起火灾,功率1000瓦以上的设备不得共用一个接线板。","o":{},"a":["正确"],"e":"一千瓦以上算大功率，几个一起插在一个接线板上，线径和插板都扛不住，容易发热起火。"},{"id":414,"c":"安全通识","l":"I","t":2,"q":"为防止食物腐败变质,可将食物储藏在储有化学药品之冰箱或储藏柜内。","o":{},"a":["错误"],"e":"化学品冰箱不是食品柜，试剂挥发会污染食物，误食等于慢性中毒，吃喝的东西一律不许放进去。"},{"id":415,"c":"安全通识","l":"I","t":2,"q":"为了防止触电可采用绝缘、防护、隔离等技术措施以保障安全。","o":{},"a":["正确"],"e":"绝缘把人和电隔开，防护用具和隔离栅栏再加一层，几道措施叠起来，触电概率才降得下来。"},{"id":416,"c":"安全通识","l":"I","t":2,"q":"为了防止盗窃事件的发生,临时离开实验室必须关门。","o":{},"a":["正确"],"e":"哪怕只离开几分钟也要关门，实验室里有试剂、仪器和数据，门一开就是给顺手牵羊留机会。"},{"id":417,"c":"安全通识","l":"I","t":2,"q":"为了防止污染,有些实验需要戴一次性手套。所以在进入实验室就要戴手套,并一直戴着做所有事情。","o":{},"a":["错误"],"e":"错在一戴到底，手套会沾污也会破，接触不同物品要换，开门、接电话、离开都得摘，否则污染扩散。"},{"id":418,"c":"安全通识","l":"I","t":2,"q":"为了预防电击（触电）,电气设备的金属外壳须接地,最好是埋设接地电阻很小专用地线。","o":{},"a":["正确"],"e":"金属外壳接地后，一旦漏电电流走地线，人碰到也不会被电，专用地线电阻越小保护越可靠。"},{"id":419,"c":"安全通识","l":"I","t":2,"q":"未经允许不得随意拆卸实验仪器和设备。","o":{},"a":["正确"],"e":"仪器内部有高压、高温或精密结构，私自拆开容易损坏、触电，出问题交给管理人员处理。"},{"id":420,"c":"安全通识","l":"I","t":2,"q":"未经指导教师许可,不得搬弄仪器、设备,以及擅自开始实验。实验时,应注意安全,按要求操作,如发现异常立即停止。","o":{},"a":["正确"],"e":"没经老师同意不动设备、不擅自开实验，运行时盯着，出现异常立刻停机，这是最基本的规矩。"},{"id":421,"c":"安全通识","l":"I","t":2,"q":"我感到进出专人管理的设备房间不方便,可以自己配制一把钥匙。","o":{},"a":["错误"],"e":"专人管理的房间钥匙不能私配，私自配钥匙等于绕开门禁，丢了东西、出了事故都说不清。"},{"id":422,"c":"安全通识","l":"I","t":2,"q":"污染的（感染的）锋利物品,如注射针头、解剖刀片和碎玻璃;应当放置到不容易被刺破的带盖的容器中,把它们当作传染性物质处理。","o":{},"a":["正确"],"e":"污染针头、刀片、碎玻璃要丢进耐扎带盖的利器盒，按传染性废物处理，徒手收拾最容易扎伤。"},{"id":423,"c":"安全通识","l":"I","t":2,"q":"误食了有毒化学品,要吃适量催吐剂尽快将其吐出来。","o":{},"a":["错误"],"e":"错在乱吃催吐剂，腐蚀性物质吐出来会二次灼伤食道，石油类误吸还会伤肺；应带上包装尽快就医。"},{"id":424,"c":"安全通识","l":"I","t":2,"q":"夏季天气热时可以在实验室工作区穿露有脚趾的鞋。","o":{},"a":["错误"],"e":"再热也不能穿露脚趾的鞋，试剂滴落、玻璃砸落都直接伤脚，进实验室就穿包脚防滑的鞋。"},{"id":425,"c":"安全通识","l":"I","t":2,"q":"消防工作的方针是:“预防为主,防消结合”,实行消防安全责任制。","o":{},"a":["正确"],"e":"消防方针就八个字：预防为主、防消结合，单位层层落实消防安全责任制，谁主管谁负责。"},{"id":426,"c":"安全通识","l":"I","t":2,"q":"胸外心脏挤压法:救护者跪在触电者一侧或骑跪在其腰部两侧,两手相迭,手掌根部放在伤者心窝上方、胸骨下,掌根用力垂直向下挤压,压出心脏里面的血液,挤压后迅速松开,胸部自动复原,血液充满心脏,以每分钟60次速度进行。","o":{},"a":["正确"],"e":"按压位置在胸骨下半段，掌根垂直下压，压完让胸廓回弹，按规范频率持续进行，直到专业救援接手。"},{"id":427,"c":"安全通识","l":"I","t":2,"q":"学生、新教师进实验室之前要参加安全教育和培训,经培训、考核合格后方可进入实验室学习与工作;学生要在老师指导下开展实验研究。","o":{},"a":["正确"],"e":"进实验室先培训再考核，合格才准入；学生做实验要有老师指导，没上过课就上手最容易出乱子。"},{"id":428,"c":"安全通识","l":"I","t":2,"q":"学生进入实验室首先要了解实验室的安全注意事项。","o":{},"a":["正确"],"e":"进门前先搞清楚哪里有洗眼器、灭火器、逃生通道，哪些能做哪些不能做，心里有数才动手。"},{"id":429,"c":"安全通识","l":"I","t":2,"q":"学生进入实验室学习、工作前应接受安全教育或培训,并通过考核。","o":{},"a":["正确"],"e":"安全教育和培训是准入证，学完还要考核通过，证明你确实知道怎么保护自己，才能进实验室。"},{"id":430,"c":"安全通识","l":"I","t":2,"q":"学生晚上回宿舍时,其在实验室的计算机主机应关闭,显示器一般不用关闭。","o":{},"a":["错误"],"e":"错在只关主机不关显示器，显示器待机也带电、也有火灾风险，人走应把主机和显示器一起断电。"},{"id":431,"c":"安全通识","l":"I","t":2,"q":"要保持实验室环境整洁,做到地面、桌面、设备三整洁,减少安全隐患。","o":{},"a":["正确"],"e":"地面、桌面、设备三整洁，通道不堆杂物，试剂用完归位，隐患自然少一半，找东西也快。"},{"id":432,"c":"安全通识","l":"I","t":2,"q":"要加强实验室排污处理装置（系统）的建设和管理,做到达标排放。实验废弃物不得倒入自来水下水道或普通垃圾箱等处。","o":{},"a":["正确"],"e":"排污要建好处理设施并达标排放，废液废渣走专门回收渠道，倒下水道、扔垃圾箱都违规又害人。"},{"id":433,"c":"安全通识","l":"I","t":2,"q":"要经常保持实验室环境的整洁卫生,做到地面、桌面、设备三清洁。","o":{},"a":["正确"],"e":"卫生不是突击打扫，而是天天保持，地面、桌面、设备三清洁，长期坚持才不出事。"},{"id":434,"c":"安全通识","l":"I","t":2,"q":"液体着火时,应用灭火器灭火,不能用水扑救或其它物品扑打","o":{},"a":["正确"],"e":"液体着火用水浇会让油浮在水面到处流，火跟着蔓延；用灭火器或灭火毯覆盖，也别拿东西乱扑打。"},{"id":435,"c":"安全通识","l":"I","t":2,"q":"一定程度的电场,磁场,电磁场都可能对人有损害。","o":{},"a":["正确"],"e":"一定强度的电场、磁场、电磁场都可能影响人体，尤其是长期近距离接触，能屏蔽就屏蔽、能远离就远离。"},{"id":436,"c":"安全通识","l":"I","t":2,"q":"仪器设备发生故障后,必须及时报告管理人员,并详细登记。","o":{},"a":["正确"],"e":"设备坏了别自己捣鼓，及时报告管理人员并如实登记故障现象，方便维修也避免别人误用。"},{"id":437,"c":"安全通识","l":"I","t":2,"q":"移动某些非固定安装的电气设备时(如电风扇,照明灯),可以不必切断电源。","o":{},"a":["错误"],"e":"错在以为不拔电也能挪，移动时线缆受力可能拉脱、破皮，带电搬动很容易触电，先断电再动。"},{"id":438,"c":"安全通识","l":"I","t":2,"q":"应避免独自一人在实验室做有危险的实验。","o":{},"a":["正确"],"e":"危险实验最好两人以上在场，一个人出事没人帮忙也没人报警，独自操作是拿命去赌。"},{"id":439,"c":"安全通识","l":"I","t":2,"q":"应增强信息安全的意识,注意保护教学科研活动中实验技术参数、观测数据、实验分析结果及新的科学发现等资料。","o":{},"a":["正确"],"e":"实验参数、原始数据、分析结果都是心血，也可能是涉密信息，别乱传乱存，做好权限管理和备份。"},{"id":440,"c":"安全通识","l":"I","t":2,"q":"用电安全的基本要素有:电气绝缘良好、保证安全距离、线路与插座容量与设备功率相适宜、不使用三无产品。","o":{},"a":["正确"],"e":"用电安全看四条：绝缘完好、保持安全距离、容量与功率匹配、不用三无产品，条条都是保命的。"},{"id":441,"c":"安全通识","l":"I","t":2,"q":"用电安全要求:在操作闸刀开关、磁力开关时,必须将盖盖好。","o":{},"a":["正确"],"e":"闸刀、磁力开关操作时盖好盖，防止电弧喷出和异物落入，也防止手误碰带电部位。"},{"id":442,"c":"安全通识","l":"I","t":2,"q":"用电设备在长时间不用时,应该断开电源。","o":{},"a":["正确"],"e":"设备长期不用还插着电，既待机耗电又可能老化起火，拔掉插头或断开开关最稳妥。"},{"id":443,"c":"安全通识","l":"I","t":2,"q":"由于紫外线透过物质能力很差,不适于室内空气或物体表面消毒。","o":{},"a":["错误"],"e":"错在结论，紫外线穿透力差恰恰适合空气和物体表面消毒，因为它照不到深处，正好杀表面微生物。"},{"id":444,"c":"安全通识","l":"I","t":2,"q":"有“严禁烟火”警示牌的大楼和实验室,可不必配置必要的消防、冲淋、洗眼、报警和逃生设施和有明显标志。","o":{},"a":["错误"],"e":"错在可不必，越是严禁烟火的地方越要配齐消防、冲淋、洗眼、报警和逃生设施，还要有醒目标志。"},{"id":445,"c":"安全通识","l":"I","t":2,"q":"有关涉密资料的制作、保管的电脑可在建立病毒防护系统后上网。","o":{},"a":["错误"],"e":"涉密资料电脑必须物理隔离，装了杀毒软件也不能上网，一联网就有被窃取和摆渡攻击的风险。"},{"id":446,"c":"安全通识","l":"I","t":2,"q":"有人低压触电时,应该立即伸手将他拉开。","o":{},"a":["错误"],"e":"错在伸手去拉，人也是导体，一拉自己也触电；应先断电，或用干燥木棍等绝缘物把人挑开。"},{"id":447,"c":"安全通识","l":"I","t":2,"q":"与工作无关的外来人员不得进入实验室。","o":{},"a":["正确"],"e":"实验室不是随便逛的地方，与工作无关的人不得入内，来访要登记，还要有专人陪同。"},{"id":448,"c":"安全通识","l":"I","t":2,"q":"遇到停电停水等情况,实验室人员必须检查电源和水源是否关闭,避免重新来电来水时发生相关安全事故。","o":{},"a":["正确"],"e":"停电停水时设备可能停在半路，走前把电源水源关掉，再来电来水才不会淹了、烧了实验室。"},{"id":449,"c":"安全通识","l":"I","t":2,"q":"在潮湿或高温或有导电灰尘的场所,应该用正常电压供电。","o":{},"a":["错误"],"e":"错在正常电压，潮湿、高温、导电灰尘场所绝缘容易失效，应改用安全电压供电并加漏电保护。"},{"id":450,"c":"安全通识","l":"I","t":2,"q":"在触电现场,若触电者已经没有呼吸或脉搏,此时可以判定触电者已经死亡,可以放弃抢救。","o":{},"a":["错误"],"e":"没有呼吸脉搏不等于死亡，可能是假死，要立即心肺复苏并呼救，坚持到专业急救到场，绝不能放弃。"},{"id":451,"c":"安全通识","l":"I","t":2,"q":"在电动机使用过程中,如发现有不正常声响,局部温升或嗅到绝缘漆过热产生的焦味,电机倒转,应立即切断电源,并报告教师进行检查。","o":{},"a":["正确"],"e":"电动机异响、局部发热、焦味、倒转都是故障信号，立即断电停机并报告老师检查，别带病运行。"},{"id":452,"c":"安全通识","l":"I","t":2,"q":"在电器仪表使用过程中,如发现有不正常声响,局部温升或嗅到绝缘漆过热产生的焦味,应加强观察。","o":{},"a":["错误"],"e":"错在只加强观察，异响、温升、焦味说明绝缘可能已损坏，继续用会烧设备甚至起火，应立即断电报修。"},{"id":453,"c":"安全通识","l":"I","t":2,"q":"在附近无水源,身上着火来不及脱衣服时,应就地打滚,将火苗压灭进行自救。","o":{},"a":["正确"],"e":"身上着火别跑，跑动等于给火扇风，就地打滚压灭火焰，或用厚衣物覆盖，附近有水源再冲洗降温。"},{"id":454,"c":"安全通识","l":"I","t":2,"q":"在进入实验室进行实验操作前,女士必须将长发整理好,以免头发垂下导致危险事故发生","o":{},"a":["正确"],"e":"长发、围巾、宽松衣袖都容易被卷入转动设备或沾到火焰，进实验室先扎好头发、收紧衣角。"},{"id":455,"c":"安全通识","l":"I","t":2,"q":"在距离线路或变压器较近,有可能误攀登的建筑物上,必须挂有“禁止攀登,有电危险”的标示牌。","o":{},"a":["正确"],"e":"靠近线路、变压器的建筑物可能被人误爬，挂上禁止攀登、有电危险的牌子，提醒也是一种保护。"},{"id":456,"c":"安全通识","l":"I","t":2,"q":"在开放实验室,外来人员可随便操作实验室仪器设备。","o":{},"a":["错误"],"e":"开放实验室不等于随便动，外来人员未经许可不得操作仪器，需要使用时必须有人指导。"},{"id":457,"c":"安全通识","l":"I","t":2,"q":"在扑灭电气火灾的明火时,用干粉灭火器扑灭。","o":{},"a":["正确"],"e":"电气火灾明火可以用干粉灭火器，干粉不导电、灭火快，但要注意别让粉尘影响精密设备。"},{"id":458,"c":"安全通识","l":"I","t":2,"q":"在扑灭电气火灾的明火时,用气体灭火器扑灭。","o":{},"a":["正确"],"e":"气体灭火器如二氧化碳不导电、不留残渣，适合扑灭电气火灾，使用时注意通风防窒息和冻伤。"},{"id":459,"c":"安全通识","l":"I","t":2,"q":"在清洁、维修仪器时,应先断电并确保无人能开启仪器。","o":{},"a":["正确"],"e":"清洁维修前先断电，还要挂警示牌或上锁，防止别人误合闸，让机器突然转起来伤人。"},{"id":460,"c":"安全通识","l":"I","t":2,"q":"在实验室不可配戴隐形眼镜,应使用一般眼镜。","o":{},"a":["正确"],"e":"实验室不建议戴隐形眼镜，试剂蒸气、飞溅物一旦入眼，镜片会加重损伤且难取出，普通眼镜还能挡一下。"},{"id":461,"c":"安全通识","l":"I","t":2,"q":"在实验室发生事故时,现场人员应迅速组织、指挥,切断事故源,尽量阻止事态蔓延、保护现场;及时有序地疏散学生等人员,对现场已受伤人员作好自助自救、保护人身及财产。","o":{},"a":["正确"],"e":"事故现场要有人组织：先切断事故源、控制蔓延，再有序疏散人员、救护伤员并保护现场。"},{"id":462,"c":"安全通识","l":"I","t":2,"q":"在实验室工作的人员务必遵守学校及实验室的各项规章制度和仪器设备的操作规程;做好安全防护。","o":{},"a":["正确"],"e":"规章制度和操作规程不是摆设，照着做、把防护穿戴好，才是对自己和同事负责。"},{"id":463,"c":"安全通识","l":"I","t":2,"q":"在实验室同时使用多种电器设备时,应计算所有用电的总容量,它应小于实验室的设计容量。","o":{},"a":["正确"],"e":"多个设备同时开，总功率不能超过实验室设计容量，超了线路发热、跳闸甚至起火。"},{"id":464,"c":"安全通识","l":"I","t":2,"q":"在试验设备工作期间,可以离开去学习一会儿。","o":{},"a":["错误"],"e":"错在可以离开，设备运行中必须有人看管，出异常能第一时间停机，人一走小故障就变大事故。"},{"id":465,"c":"安全通识","l":"I","t":2,"q":"在熟睡时,听到火警信号后正确的做法是:1、用手试一试门是否热,如是冷的,可开门逃生;2、准备好湿毛巾;3、切勿随意跳楼,自制救生绳索后再设法安全着落;4、利用自然条件作为救生滑道。","o":{},"a":["正确"],"e":"门先试温，冷才开门逃生；湿毛巾捂口鼻，不轻易跳楼，用绳索、床单或自然条件设法安全下降。"},{"id":466,"c":"安全通识","l":"I","t":2,"q":"在遇到高压电线断落地面时,导线断落点20米内,禁止人员进入。如果不慎在此范围内,应背朝电线断落点,采用单脚跳或双脚并跳,撤离现场。","o":{},"a":["正确"],"e":"高压线落地会形成跨步电压，二十米内不能进；已在范围内就背向落点，单脚跳或双脚并跳撤出去。"},{"id":467,"c":"安全通识","l":"I","t":2,"q":"在照明电路上可以不用安装漏电保护器。","o":{},"a":["错误"],"e":"错在可以不装，照明线路同样会漏电伤人，按规定应装漏电保护器，多一道保护多一分安全。"},{"id":468,"c":"安全通识","l":"I","t":2,"q":"在着火和救火时,若衣服着火,要赶紧跑到空旷处用灭火器扑灭。","o":{},"a":["错误"],"e":"错在赶紧跑，跑动带风助燃，火会烧得更旺；应立即就地打滚，或用灭火器、厚衣物压灭火焰。"},{"id":469,"c":"安全通识","l":"I","t":2,"q":"早晨、中饭、晚上等几个人员稀少的时间段,要特别注意随手关门,确保实验室财产和个人物品的安全。","o":{},"a":["正确"],"e":"人少的时候最容易被顺手牵羊，进出随手关门、离开锁门，养成习惯比装监控还管用。"},{"id":470,"c":"安全通识","l":"I","t":2,"q":"针头、玻璃、一次性手术刀等利器应在使用后放在耐扎容器中,尖利物容器应在内容物达到三分之二前进行置换处置。","o":{},"a":["正确"],"e":"针头、刀片、碎玻璃用完就丢进耐扎容器，装到三分之二前更换，太满容易扎手、洒漏。"},{"id":471,"c":"安全通识","l":"I","t":2,"q":"只要插线板质量符合要求,就可以随意串联很多个,不影响使用。","o":{},"a":["错误"],"e":"插线板串联越多，线路越长、接触点越多，电阻和发热越大，质量再好也扛不住，一个插座别接一串。"},{"id":472,"c":"安全通识","l":"I","t":2,"q":"中毒事故中救护人员进入现场,应先抢救中毒者,再采取措施切断毒物来源。","o":{},"a":["错误"],"e":"错在顺序，进现场先做好自身防护、切断毒物来源并通风，再救人；不然救护者也会中毒倒下。"},{"id":473,"c":"安全通识","l":"I","t":2,"q":"重金属如铅、镉、汞等对人体有害。","o":{},"a":["正确"],"e":"铅、镉、汞等重金属会在体内蓄积，伤神经、伤肝肾，接触时要防护，废液更不能随便倒。"},{"id":474,"c":"安全通识","l":"I","t":2,"q":"不要超过要求功率负荷,否则可能会出现过载发热起火等事故,损坏插板,设备,发生安全事故。","o":{},"a":["正确"],"e":"插板有额定功率，超过就过载发热，轻则烧插板烧设备，重则起火，用前先算一算总功率。"},{"id":475,"c":"电气安全","l":"II","t":0,"q":"在有电阻、电容、电感的电路中,电源电压是几十伏,电容或电感的电压可以是:","o":{"A":"几十伏","B":"不超过电源电压","C":"超过百伏","D":"不会触死人"},"a":["C"],"e":"电感电容会储能，谐振或能量交换时元件两端电压可比电源高很多，几十伏供电也能冒出上百伏，误触很危险。"},{"id":476,"c":"电气安全","l":"II","t":0,"q":"在需要带电操作的低电压电路实验时,下列哪种是正确的？","o":{"A":"双手操作比单手操作安全","B":"单手操作比双手操作安全","C":"单手操作和双手操作一样安全","D":"操作与空气湿度有关"},"a":["B"],"e":"单手操作时电流只在手与脚间流过，不经过心脏；双手同时触及两点，电流横穿心脏，致命风险大得多。"},{"id":477,"c":"电气安全","l":"II","t":0,"q":"预防电击（触电）的一条重要措施是用电设备的金属外壳要有效接地。请从下列选项中选择可靠的接地点:","o":{"A":"单相供电的2根线分别称为火线和地线,选择其中的地线接地","B":"三相供电中的中性点电压应该为零,可以选择这个中性点来接地","C":"专门埋设地下、保证接地电阻很小专用地线","D":"实验室内的自来水管（暖气管）是埋设于地下的金属管相连的,可用来接地"},"a":["C"],"e":"只有专门埋入地下、接地电阻很小的地线才可靠；单相里的“地线”其实是零线，中性点和自来水管都可能带电或断开。"},{"id":478,"c":"电气安全","l":"II","t":0,"q":"引发电气火灾的初始原因是:","o":{"A":"电源保险丝不起作用","B":"带电改接电气线路","C":"线路或设备过电流运行","D":"没有保护性接零或接地"},"a":["C"],"e":"过电流使导线和设备温度不断升高，热量积累引燃绝缘和周围可燃物，这是电气火灾最常见的起点，其他选项只是诱因或后果。"},{"id":479,"c":"电气安全","l":"II","t":0,"q":"移动式电动工具及其开关板（箱）的电源线必须采用:","o":{"A":"双层塑料铜芯绝缘导线","B":"双股铜芯塑料软线","C":"铜芯橡皮绝缘护套或铜芯聚氯乙烯绝缘护套软线","D":"单股铜芯塑料软线"},"a":["C"],"e":"移动工具常被拖动弯折，必须用带橡皮或聚氯乙烯护套的铜芯软线，既耐磨又绝缘；双股塑料线和单股硬线都易破皮漏电。"},{"id":480,"c":"电气安全","l":"II","t":0,"q":"下列有关使用漏电保护器的说法,哪种是正确的？","o":{"A":"漏电保护器既可用来保护人身安全,还可用来对低压系统或设备的对地绝缘状况起到监督作用","B":"漏电保护器安装点以后的线路不可对地绝缘","C":"漏电保护器在日常使用中不可在通电状态下按动实验按钮来检验其是否可靠","D":"对两相触电起保护作用"},"a":["A"],"e":"漏电保护器检测对地漏电流，既护人身又能反映线路绝缘；它要求后面线路绝缘良好，还要定期按试验按钮，两相触电它不动作。"},{"id":481,"c":"电气安全","l":"II","t":0,"q":"下列哪些是预防电气火灾的基本措施？","o":{"A":"禁止非电工改接电气线路,禁止乱拉临时用电线路","B":"做电气类实验时应该2人及以上在场","C":"从工作现场清除易燃易爆材料","D":"以上都是"},"a":["D"],"e":"禁非电工改线、清除现场易燃易爆物、实验两人以上在场，都切断了电气火灾的点燃和扩大条件，所以三项全选。"},{"id":482,"c":"电气安全","l":"II","t":0,"q":"为了减少电击（触电）事故对人体的损伤,经常用到电流型漏电保护开关,其保护指标设置为≤30mAS。请从下列选项中选择其正确含义。","o":{"A":"流经人体的电流（以毫安为单位）和时间（以秒为单位）的乘积小于30。例如电流为30m则持续的时间必须小于1秒","B":"流经人体的电流必须小于30毫安","C":"流经人体电流的持续时间必须小于1秒","D":"流经人体的电流必须小于30微安"},"a":["A"],"e":"30mA·s指电流与通电时间的乘积上限，30mA时最多1秒；单看电流或单看时间都不全面，微安这个单位也不对。"},{"id":483,"c":"电气安全","l":"II","t":0,"q":"为防止静电火花引起事故,凡是用来加工、贮存、运输各种易燃气、液、粉体的设备金属管、非导电材料管都必须:","o":{"A":"有足够大的电阻","B":"有足够小的电阻","C":"可靠接地"},"a":["C"],"e":"静电靠接地把电荷导入大地，设备管道只要可靠接地就不会积累电荷打火；电阻大小不是关键，绝缘反而更危险。"},{"id":484,"c":"电气安全","l":"II","t":0,"q":"使用手持电动工具时,下列哪个措施不正确？","o":{"A":"使用静电防护毯","B":"带防护手套","C":"使用漏电保护器","D":"穿绝缘鞋"},"a":["A"],"e":"静电毯是防静电用的，与防触电无关；戴手套、穿绝缘鞋、装漏电保护器才是手持电动工具的防触电措施。"},{"id":485,"c":"电气安全","l":"II","t":0,"q":"使用电烙铁应注意:","o":{"A":"不能乱甩焊锡","B":"及时放回烙铁架,用完及时切断电源","C":"周围不得放置易燃物品","D":"以上都是"},"a":["D"],"e":"电烙铁温度高，乱甩焊锡、随手乱放、靠近易燃物都可能烫伤或引燃，所以用完断电、放回架子、清空周围都要做到。"},{"id":486,"c":"电气安全","l":"II","t":0,"q":"三孔插座上（ ）孔是火线。","o":{"A":"右下","B":"左下","C":"上"},"a":["A"],"e":"面对三孔插座，左边零线、右边火线、上面接地，是固定的“左零右火上地”接法，火线就在右下孔。"},{"id":487,"c":"电气安全","l":"II","t":0,"q":"任何电气设备在未验明无电之前,一律认为:","o":{"A":"无电","B":"也许有电","C":"有电","D":"也许无电"},"a":["C"],"e":"没验电就当作有电，是保命的底线思维；误判无电去碰触，一旦实际带电就没有第二次机会。"},{"id":488,"c":"电气安全","l":"II","t":0,"q":"静电的电量虽然不大,但其放电时产生的静电火花有可能引起爆炸和火灾,比较常见的是放电时瞬间的电流造成精密实验仪器损坏,不正确的预防措施有:","o":{"A":"适当提高工作场所的湿度","B":"进行特殊危险实验时,操作人员应先接触设置在安全区内的金属接地棒,以消除人体电位","C":"在易产生静电的场所梳理头发","D":"计算机进行维护时,使用防静电毯"},"a":["C"],"e":"梳理头发会摩擦起电，在易产生静电的场所等于主动制造放电火花；增湿、先摸接地棒、用防静电毯都是正确做法。"},{"id":489,"c":"电气安全","l":"II","t":0,"q":"工作地点相对湿度大于75%时,属于什么环境？","o":{"A":"危险、易触电","B":"不危险","C":"一般","D":"特殊"},"a":["A"],"e":"湿度超过75%时，人体表面和绝缘物受潮，电阻明显下降，同样电压下电流更大，属于危险易触电环境。"},{"id":490,"c":"电气安全","l":"II","t":0,"q":"动力配电线五线制U、V、W、零线、地线的色标分别为:","o":{"A":"蓝、双色线、黄、绿、红","B":"黄、绿、红、蓝、双色线","C":"双色线、黄、绿、红、蓝","D":"红、蓝、双色线、黄、绿"},"a":["B"],"e":"三相五线制里U、V、W三根相线用黄、绿、红，零线用蓝，地线用黄绿双色，这个顺序要记牢。"},{"id":491,"c":"电气安全","l":"II","t":0,"q":"电气设备的外壳应有什么防护措施？","o":{"A":"无","B":"保护性接地","C":"防锈漆","D":"绝缘"},"a":["B"],"e":"金属外壳一旦漏电就会带电，做保护性接地后漏电电流被导入大地，外壳电位被钳住，人碰到也不易致命。"},{"id":492,"c":"电气安全","l":"II","t":0,"q":"电分强电和弱电。下列说法正确的是:","o":{"A":"强电和弱电开关等元件可通用","B":"弱电开关等元件不可用在强电电路","C":"开关不分强弱","D":"弱电开关等元件可用在强电电路"},"a":["B"],"e":"弱电元件耐压、载流能力都小，接到强电上会击穿、发热甚至起火，两者不能互换通用。"},{"id":493,"c":"电气安全","l":"II","t":0,"q":"低压电笔一般适用于多少伏以下的交流电压？","o":{"A":"220","B":"380","C":"500"},"a":["C"],"e":"低压电笔的绝缘和量程按500V设计，测220V、380V都安全；超过500V必须换用相应电压等级的验电器。"},{"id":494,"c":"电气安全","l":"II","t":0,"q":"长期搁置不用的手持电动工具,在使用前必须测量绝缘电阻,要求手持电动工具带电部分与外壳之间绝缘电阻不低于多少MΩ？","o":{"A":"2","B":"0.5","C":"1"},"a":["B"],"e":"长期搁置的工具绝缘可能受潮老化，带电部分与外壳间绝缘电阻低于0.5MΩ就不能再用，须烘干或维修后复测。"},{"id":495,"c":"电气安全","l":"II","t":0,"q":"测量绝缘电阻可用:","o":{"A":"万用表","B":"兆欧表","C":"示波器","D":"电笔"},"a":["B"],"e":"兆欧表自带高压电源，能测出兆欧级绝缘电阻；万用表电阻档电压低、量程小，示波器和电笔更测不了绝缘。"},{"id":496,"c":"电气安全","l":"II","t":0,"q":"安装使用漏电保护器,是属于哪种安全技术措施？","o":{"A":"基本安全措施","B":"辅助安全措施","C":"绝对安全措施","D":"应急安全措施"},"a":["A"],"e":"漏电保护器在设备漏电时快速断电，直接防止人身触电，属于基本安全技术措施；说辅助、绝对或应急都不准确。"},{"id":497,"c":"电气安全","l":"II","t":1,"q":"在下列选项中,电气火灾的火源主要有（ ）。","o":{"A":"电火花","B":"可燃性气体（如天然气、煤气等）","C":"可燃性液体（如汽油、煤油等）","D":"电热高温（在导体中的大电流、或电磁材料中的磁损耗、或绝缘介质中的电损耗产生的热量导致的高温）","E":"电热器（如电炉、热得快等）","F":"明火（如燃烧的煤炉、木材等）"},"a":["A","D","E"],"e":"电火花、电热高温和电热器都是电能直接转化的点火源；可燃气体、液体只是被点燃的对象，明火不属于电气火源。"},{"id":498,"c":"电气安全","l":"II","t":1,"q":"下列选项中,（ ）是预防电气火灾最重要的基本措施。","o":{"A":"实验室建设时要全面地规划电气需求,正确地设计方案,容量留有余地","B":"从工作现场清除易燃易爆材料","C":"禁止非电工改接电气线路,禁止乱拉临时用电线路","D":"工作现场禁止吸烟,禁止带火柴、打火机等进入","E":"规范使用操作,制定并严格执行用电和电气设备使用安全操作规程","F":"做电气实验时应该2人及以上在场"},"a":["A","C","E"],"e":"电气防火的根本在用电本身：容量规划留余量、禁止乱接线、按规程操作；清易燃物、禁烟、两人在场只是辅助管理措施。"},{"id":499,"c":"电气安全","l":"II","t":1,"q":"使用电钻或手持电动工具时应注意哪些安全问题？","o":{"A":"所有的导电部分必须有良好的绝缘。","B":"所有的导线必须是坚韧耐用的软胶皮线。在导线进入电机的壳体处,应用胶皮圈加以保护,以防电线的绝缘层被磨损。","C":"电机进线应装有接地或接零的装置。","D":"在使用时,必须穿绝缘鞋;戴绝缘手套等防护用品。","E":"每次使用工具时,都必须严格检查。"},"a":["A","B","C","D","E"],"e":"电动工具要导电部分绝缘好、导线用坚韧软胶皮并在入壳处加胶圈保护、进线接地或接零，还要穿绝缘鞋戴手套并每次检查。"},{"id":500,"c":"电气安全","l":"II","t":1,"q":"大量集中使用气瓶应注意哪些问题","o":{"A":"不必要设置符合要求的集中存放室","B":"根据气瓶介质情况采取必要的防火、防爆、防电打火（包括静电）、防毒、防辐射等措施","C":".通风要良好,要有必要的报警装置"},"a":["B","C"],"e":"气瓶集中存放必须设符合要求的专用存放室，并按介质做防火防爆防静电防毒等措施，同时保证通风和报警装置。"},{"id":501,"c":"电气安全","l":"II","t":2,"q":"重复接地是指零线上的一处或多处通过接地装置与大地再连接,可提高线路的安全性。","o":{},"a":["正确"],"e":"零线多处再接地就是重复接地，能降低零线断线后外壳带电压的风险，让故障电流更快断开，线路更安全。"},{"id":502,"c":"电气安全","l":"II","t":2,"q":"只要接线板质量符合要求,就可以随意串联很多个,不影响使用。","o":{},"a":["错误"],"e":"接线板串联多了，前级要承担所有后级负荷，容易过载发热，插接点多也易接触不良打火，即使单个合格也不能乱串。"},{"id":503,"c":"电气安全","l":"II","t":2,"q":"在有爆炸和火灾危险场所使用手持式或移动式电动工具时,必须采用有防爆措施的电动工具。","o":{},"a":["正确"],"e":"普通电动工具的换向器和开关动作会冒火花，爆炸和火灾危险场所必须用防爆型，否则火花就可能点燃气源。"},{"id":504,"c":"电气安全","l":"II","t":2,"q":"在易燃、易爆、易灼烧及有静电发生的场所,可以使用化纤防护用品。","o":{},"a":["错误"],"e":"化纤衣物摩擦极易起静电，放电火花足以点燃易燃易爆气体，这类场所必须穿棉质或防静电防护用品。"},{"id":505,"c":"电气安全","l":"II","t":2,"q":"在使用手电钻、电砂轮等手持电动工具时,为保证安全,应该装设漏电保护器。","o":{},"a":["正确"],"e":"手电钻、电砂轮常在潮湿、狭窄处使用，一旦漏电人就是回路，加装漏电保护器能在毫秒级断电保命。"},{"id":506,"c":"电气安全","l":"II","t":2,"q":"在电气类开放性实验或科研实验室,必须二人以上方可开展实验。","o":{},"a":["正确"],"e":"电气实验可能突然带电或起火，一人出事无人施救，所以开放实验和科研实验室都要求至少两人在场。"},{"id":507,"c":"电气安全","l":"II","t":2,"q":"在充满可燃气体的环境中,可以使用手动电动工具。","o":{},"a":["错误"],"e":"手动电动工具工作时会产生电火花和静电，可燃气体环境里这就等于点火源，必须改用防爆工具或先通风检测。"},{"id":508,"c":"电气安全","l":"II","t":2,"q":"在潮湿或高温或有导电灰尘的场所,实验时应该降低电压供电。","o":{},"a":["正确"],"e":"潮湿、高温、导电灰尘会让人体电阻大幅下降，此时应改用安全电压供电，降低触电时流过人体的电流。"},{"id":509,"c":"电气安全","l":"II","t":2,"q":"用电安全的基本要素有:电气绝缘良好、保证安全距离、线路与插座容量与设备功率相适宜、不使用三无产品。","o":{},"a":["正确"],"e":"绝缘良好、保持安全距离、容量与功率匹配、不用三无产品，这四条覆盖了用电安全最关键的几个环节。"},{"id":510,"c":"电气安全","l":"II","t":2,"q":"消除管线上的静电主要是做好屏蔽。","o":{},"a":["错误"],"e":"静电消除靠的是接地，把电荷及时导走；屏蔽只能隔离电磁干扰，对管线积累的静电没有泄放作用。"},{"id":511,"c":"电气安全","l":"II","t":2,"q":"为了防止触电可采用绝缘、防护、隔离等技术措施以保障安全。","o":{},"a":["正确"],"e":"绝缘把带电体包住、防护挡住人体、隔离拉开距离，三者配合就能大幅降低触电概率，是常用的技术措施。"},{"id":512,"c":"电气安全","l":"II","t":2,"q":"万用表电阻档可测量绝缘电阻。","o":{},"a":["错误"],"e":"万用表电阻档电池电压低、量程有限，测不出兆欧级绝缘，还容易误判；测绝缘必须用兆欧表。"},{"id":513,"c":"电气安全","l":"II","t":2,"q":"实验室禁止私拉乱接电线,实验过程中自制非标设备时,应报请实验室管理人员批准,然后请电气专业人员按照标准安全的连接。","o":{},"a":["正确"],"e":"私拉乱接没人把关最易出事；自制非标设备要先报批，再由电气专业人员按标准接线，才能保证绝缘和接地合格。"},{"id":514,"c":"电气安全","l":"II","t":2,"q":"身边有人严重触电,应当首先切断电源,然后进行紧急抢救如人工呼吸,并立即拨打急救电话120。","o":{},"a":["正确"],"e":"救人第一步是断电或用绝缘物挑开电源，否则施救者也触电；断电后立即心肺复苏并拨打120。"},{"id":515,"c":"电气安全","l":"II","t":2,"q":"容易产生静电的场所,要保持空气潮湿;工作人员要穿防静电的衣服和鞋靴。？","o":{},"a":["正确"],"e":"空气潮湿能让静电及时沿表面泄放，防静电服和鞋靴又把人体电荷导走，两者结合可避免电荷积累放电。"},{"id":516,"c":"电气安全","l":"II","t":2,"q":"人体触电,双手触电致死比单手触电致死的概率要大得多。","o":{},"a":["正确"],"e":"双手触电时电流从一只手流到另一只手，直接穿过心脏，极易引起心室颤动；单手触电电流多经肢体，相对轻些。"},{"id":517,"c":"电气安全","l":"II","t":2,"q":"漏电保护器既可用来保护人身安全,还可用来对低压系统或设备的绝缘状况起到监督作用;漏电保护器安装点以后的线路应是对地绝缘良好。","o":{},"a":["正确"],"e":"漏电保护器靠检测对地漏电流工作，既能护人也能反映绝缘状况；它后面的线路必须对地绝缘良好，否则会误跳闸。"},{"id":518,"c":"电气安全","l":"II","t":2,"q":"漏电保护器对两相触电（人体双手触及两相电源）,不起保护作用。","o":{},"a":["正确"],"e":"漏电保护器只比较相线与零线电流差，两相触电电流不流向大地，进出电流相等，它检测不到也不会跳闸。"},{"id":519,"c":"电气安全","l":"II","t":2,"q":"连接在接线板上的用电总负荷不能超过接线板的最大容量。","o":{},"a":["正确"],"e":"接线板和插头都有额定电流，总负荷超过容量就会发热、塑料软化甚至起火，所以要先算功率再插。"},{"id":520,"c":"电气安全","l":"II","t":2,"q":"连接电气设备的开关需安装在火线上。","o":{},"a":["正确"],"e":"开关装在火线上，断开后灯和插座就不带电；若装在零线上，关灯后设备仍带火线电压，检修时容易触电。"},{"id":521,"c":"电气安全","l":"II","t":2,"q":"静电有三大特点:一是电压高;二是静电感应突出;三是尖端放电现象严重。","o":{},"a":["正确"],"e":"静电电压可达几千甚至几万伏，感应使附近导体带电，尖端处场强集中易放电，这三点正是它的危害来源。"},{"id":522,"c":"电气安全","l":"II","t":2,"q":"静电可以引起爆炸、电气绝缘和电子元器件击穿。","o":{},"a":["正确"],"e":"静电放电火花能点燃气液粉尘引起爆炸，高电压还能击穿绝缘和芯片，所以电子和化工场所都要防静电。"},{"id":523,"c":"电气安全","l":"II","t":2,"q":"接电路元器件时,主要应关注元器件的耐压和能承受的功率。","o":{},"a":["正确"],"e":"元器件超压会击穿、超功率会过热烧毁，所以选型先看耐压值和额定功率，留足余量电路才可靠。"},{"id":524,"c":"电气安全","l":"II","t":2,"q":"各种电源是否有电,可用试电笔检验。","o":{},"a":["错误"],"e":"试电笔只适用于低压交流，还得靠人体接地形成回路；高压、直流和悬浮电源它测不准，必须用对应仪表。"},{"id":525,"c":"电气安全","l":"II","t":2,"q":"短路是指电气线路中相线与相线,相线与零线或大地,在未通过负载或电阻很小的情况下相碰,造成电气回路中电流剧增的现象。","o":{},"a":["正确"],"e":"相间或相地之间几乎零阻抗直接连通，回路电流瞬间暴涨到远超额定值，这就是短路；危害在于高温和电动力。"},{"id":526,"c":"电气安全","l":"II","t":2,"q":"短路会使短路处甚至整个电路过热,从而导致线路的绝缘层燃烧,引发火灾。","o":{},"a":["正确"],"e":"短路电流大，短路点和整条线路迅速过热，绝缘层被烤燃，火势沿线路蔓延，这是电气火灾的典型过程。"},{"id":527,"c":"电气安全","l":"II","t":2,"q":"电气检修时,应在配电箱或开关处悬挂“禁止合闸,有人工作”的标示牌。","o":{},"a":["正确"],"e":"检修时别人不知道有人在干活，一合闸就会触电，所以必须在配电箱或开关处挂“禁止合闸，有人工作”牌。"},{"id":528,"c":"电气安全","l":"II","t":2,"q":"电路保险丝熔断,短期内可以用铜丝或铁丝代替。","o":{},"a":["错误"],"e":"铜丝铁丝熔点高、载流大，过载时根本不熔断，线路照样发热起火，等于把保护拆掉，必须换同规格保险丝。"},{"id":529,"c":"电气安全","l":"II","t":2,"q":"电流对人体的伤害有两种类型:即电击和电伤。","o":{},"a":["正确"],"e":"电流伤害分两种：电击是电流通过人体内部破坏器官功能，电伤是电弧、灼伤等外部损伤，两者常同时发生。"},{"id":530,"c":"电气安全","l":"II","t":2,"q":"电击（触电）通常指因为人体接触带电的线路或设备而受到伤害的事故。为了避免电击（触电）事故的发生,设备须可靠接地和人体对地绝缘。","o":{},"a":["正确"],"e":"人体一碰带电体，电流经人体入地就是电击；设备可靠接地、人体对地绝缘，能把通过人体的电流降到安全范围。"},{"id":531,"c":"电气安全","l":"II","t":2,"q":"电分强电和弱电,弱电开关等元件不能用在强电电路。","o":{},"a":["正确"],"e":"弱电元件绝缘和载流能力有限，接进强电电路会击穿短路，所以强弱电开关不能混用。"},{"id":532,"c":"电气安全","l":"II","t":2,"q":"电动工具应定期检修。","o":{},"a":["正确"],"e":"工具用久了绝缘老化、碳刷磨损、接线松动，定期检修能提前发现隐患，避免带病作业时漏电伤人。"},{"id":533,"c":"电气安全","l":"II","t":2,"q":"电动工具的电源引线必须保证接地可靠。","o":{},"a":["正确"],"e":"电源引线是漏电的高发部位，必须保证接地可靠，一旦内部火线碰壳，电流就沿地线走而不会电到人。"},{"id":534,"c":"电气安全","l":"II","t":2,"q":"地线和零线的作用相同。","o":{},"a":["错误"],"e":"地线是保护线，正常不带电，只把漏电流导入大地；零线是工作回路，平时有电流通过，两者绝不能混接。"},{"id":535,"c":"电气安全","l":"II","t":2,"q":"打开含有高压变压器或电容器的电子仪器的盖子是危险的。","o":{},"a":["正确"],"e":"高压变压器和电容器断电后仍存有残余电荷，打开盖子可能直接触电或被储能放电击伤，须先放电再动手。"},{"id":536,"c":"电气安全","l":"II","t":2,"q":"布线时,强、弱电可以合用同一电缆管线。","o":{},"a":["错误"],"e":"强电会干扰弱电信号，更危险的是绝缘击穿后强电窜入弱电线路和外壳，所以两者必须分管分槽敷设。"},{"id":537,"c":"电气安全","l":"II","t":2,"q":"保险丝和空气开关可以有效地防止电气火灾。","o":{},"a":["错误"],"e":"保险丝和空开只在过载、短路时动作，接触不良发热、漏电、静电打火等它管不了，不能当成万能防火措施。"},{"id":538,"c":"电气安全","l":"II","t":2,"q":"50毫安的工频电流就可以使人遭到致命电击。","o":{},"a":["正确"],"e":"工频50mA通过人体已能引起心室颤动，短时间就可能致命，所以安全电流一般按30mA以下控制。"},{"id":539,"c":"辐射安全","l":"II","t":0,"q":"造成内照射的原因:","o":{"A":"是因为吸入放射性物质污染的空气,饮用放射性物质污染的水,吃了放射性物质污染的食物,或者放射性物质从皮肤、伤口进入体内。","B":"体外的电离辐射照射人体造成损伤。","C":"辐射损伤主要来自γ和X射线、中子,其次是β射线。"},"a":["A"],"e":"放射性物质经吸入、食入或皮肤伤口进入体内形成照射，才叫内照射；B、C说的是体外射线照射人体，属于外照射。"},{"id":540,"c":"辐射安全","l":"II","t":0,"q":"在辐射防护中,主要是针对哪四种辐射？","o":{"A":"α粒子、β粒子、γ（X）射线和中子","B":"α粒子、β粒子、γ（X）射线和电磁波","C":"电磁波、β粒子、γ（X）射线和中子","D":"α粒子、电磁波、γ（X）射线和中子"},"a":["A"],"e":"辐射防护主要针对α、β、γ（X）射线和中子这四种电离辐射；电磁波不是独立防护对象，其余选项混入了电磁波，故错。"},{"id":541,"c":"辐射安全","l":"II","t":0,"q":"以下哪个不是减少电磁辐射的方法:","o":{"A":"用布覆盖辐射源","B":"对辐射源进行屏蔽","C":"辐射源远离敏感物体或人","D":"尽量缩短处于辐射区的时间"},"a":["A"],"e":"布挡不住电磁辐射，只是遮住视线；屏蔽、远离、缩短受照时间才有效，所以用布覆盖不属于减少辐射的方法。"},{"id":542,"c":"辐射安全","l":"II","t":0,"q":"外照射防护通常可采用:","o":{"A":"尽量缩短受照射时间,尽量增大与辐射源的距离,在人和辐射源之间加屏蔽物","B":"尽可能地隔断放射性物质进入人体的各种途径","C":"防止放射性物质经呼吸道进入人体内","D":"防止放射性物质经口腔进入人体内"},"a":["A"],"e":"外照射防护就是时间、距离、屏蔽三原则；B、C、D讲的是阻断放射性物质进入人体，属于内照射防护，不符题意。"},{"id":543,"c":"辐射安全","l":"II","t":0,"q":"天然放射性的来源是:","o":{"A":"核武器生产和试验","B":"核能源生产","C":"核技术应用","D":"陆生放射性核素、宇生放射性核素"},"a":["D"],"e":"天然放射性来自陆生放射性核素和宇生放射性核素；核武器试验、核能生产、核技术应用都属于人工放射性来源。"},{"id":544,"c":"辐射安全","l":"II","t":0,"q":"内照射特点是:","o":{"A":"即使不再进行放射性物质的操作,已经进入体内的放射性核素仍然在体内产生有害影响","B":"当机体离开辐射场后,就不再受照射","C":"只有当机体处于辐射场中时,才会引起辐射损伤"},"a":["A"],"e":"核素进入体内后持续照射，人离开辐射场也照样受照，这正是内照射的特点；B、C描述的是外照射。"},{"id":545,"c":"辐射安全","l":"II","t":0,"q":"密封放射源是指:","o":{"A":"除研究堆和动力堆核燃料循环范畴的材料以外,永久密封在容器中或者有严密包层并呈固态的放射性材料","B":"能发射射线的所有物质","C":"非密封在包壳里或者紧密地固结在覆盖层里的放射性物质","D":"未密封的放射性物质,当简单封装后就是密封放射源"},"a":["A"],"e":"密封源是永久密封在容器中或有严密包层、呈固态的放射性材料；只简单封装而未真正密封的不算，故其余错。"},{"id":546,"c":"辐射安全","l":"II","t":0,"q":"各种放射性核素有哪种共同的衰变规律？","o":{"A":"指数衰减规律","B":"线性衰减规律","C":"平方衰减规律"},"a":["A"],"e":"放射性核素衰变服从指数规律，数量随时间按负指数下降；线性衰减、平方衰减都不符合实际衰变规律。"},{"id":547,"c":"辐射安全","l":"II","t":0,"q":"辐射源是指","o":{"A":"放射源","B":"放射性同位素","C":"可以通过发射电离辐射或释放放射性物质而引起辐射照射的一切物质或实体"},"a":["C"],"e":"辐射源指能发射电离辐射或释放放射性物质、从而引起照射的一切物质或实体，范围比放射源和同位素更宽。"},{"id":548,"c":"辐射安全","l":"II","t":0,"q":"放射性同位素和射线装置失控导致3人以上（含3人）急性死亡,属于什么等级的辐射事故？","o":{"A":"一般辐射事故","B":"重大辐射事故","C":"较大辐射事故","D":"特别重大辐射事故"},"a":["D"],"e":"放射性同位素或射线装置失控造成3人以上急性死亡，属特别重大辐射事故，是四级中最严重的一级。"},{"id":549,"c":"辐射安全","l":"II","t":0,"q":"放射性实验需要采取的正确措施是:","o":{"A":"佩戴个人辐射剂量计,可以知道当天接受的剂量和累积剂量,并将其控制在安全水平下","B":"实验时必须带好专用的防护手套、口罩、穿工作服,实验完毕,立即洗手或洗澡。","C":"实验时,力求迅速、熟练,尽量减少被辐射的时间,并应尽可能的利用夹具、机械手来操作,以便远离辐射源,同时应设置隔离屏蔽","D":"以上都是"},"a":["D"],"e":"佩戴剂量计控制剂量、穿戴防护用品并及时清洗、缩短时间加距离加屏蔽，三项都对，故选“以上都是”。"},{"id":550,"c":"辐射安全","l":"II","t":0,"q":"对中子射线的屏蔽可选用:","o":{"A":"低原子序数的材料（铝、塑料或有机玻璃等）","B":"高原子序数的材料（铅。混凝土等）","C":"含氢量较高或含硼的材料（水、石蜡、硼砂等）"},"a":["C"],"e":"中子要靠含氢材料慢化、靠硼吸收，所以选水、石蜡、硼砂；铅和混凝土主要挡γ射线，铝和塑料挡β射线。"},{"id":551,"c":"辐射安全","l":"II","t":0,"q":"对γ.χ射线的屏蔽可选用:","o":{"A":"低原子序数的材料（铝、塑料或有机玻璃等）","B":"高原子序数的材料（铅、混凝土等）","C":"含氢量较高或含硼的材料（水、石蜡、硼砂等）"},"a":["B"],"e":"γ、X射线穿透力强，必须用铅、混凝土这类高原子序数、高密度材料屏蔽，低原子序数材料根本挡不住。"},{"id":552,"c":"辐射安全","l":"II","t":0,"q":"对γ（χ、β）源、中子源的防护主要是:","o":{"A":"内照射防护","B":"外照射防护","C":"不用防护"},"a":["B"],"e":"γ、β射线和中子主要在体外照射人体，防护重点是屏蔽、距离和时间，即外照射防护，而不是内照射防护。"},{"id":553,"c":"辐射安全","l":"II","t":0,"q":"对β射线的屏蔽可选用:","o":{"A":"低原子序数的材料（铝、塑料或有机玻璃等）","B":"高原子序数的材料（铅、混凝土等）","C":"含氢量较高或含硼的材料（水、石蜡、硼砂等）"},"a":["A"],"e":"β射线用铝、塑料等低原子序数材料屏蔽；直接用铅会激发出更强的韧致辐射，反而更危险。"},{"id":554,"c":"辐射安全","l":"II","t":0,"q":"对α源的防护主要是:","o":{"A":"内照射防护","B":"外照射防护","C":"不用防护"},"a":["A"],"e":"α粒子穿透力很弱，一张纸就能挡住，体外照射危害小；但吸入体内后危害大，所以重点是内照射防护。"},{"id":555,"c":"辐射安全","l":"II","t":0,"q":"氡对人的健康危害极大,当它和其衍生物通过呼吸道进入人体后,往往长期滞留在人体的整个呼吸道内,是导致人体罹患肺癌及其他呼吸系统疾病的重要原因之一。应采取:","o":{"A":"使用经过环保认证的绿色材料（建筑、装饰）","B":"将窗户、门和通风口打开","C":"使用空气净化器和粒状活性炭"},"a":["A"],"e":"氡主要从建筑材料和地基中析出，使用环保认证的绿色建材从源头减少析出才是根本；开窗、净化只是辅助手段。"},{"id":556,"c":"辐射安全","l":"II","t":0,"q":"氡（α衰变）半衰期为4天,经过8天后,其剩余量为多少？","o":{"A":"1/2","B":"1/4","C":"1/8"},"a":["B"],"e":"半衰期4天，8天正好经过2个半衰期，剩余量为1/2的平方，即1/4，故选B。"},{"id":557,"c":"辐射安全","l":"II","t":0,"q":"Ⅲ类放射源丢失、被盗、失控,属于什么等级的辐射事故？","o":{"A":"一般辐射事故","B":"较大辐射事故","C":"重大辐射事故","D":"特别重大辐射事故"},"a":["B"],"e":"Ⅲ类放射源丢失、被盗、失控属较大辐射事故；Ⅰ类为特别重大，Ⅱ类为重大，Ⅳ、Ⅴ类为一般辐射事故。"},{"id":558,"c":"辐射安全","l":"II","t":1,"q":"以下对放射性垃圾的安全管理哪些是正确的？","o":{"A":"允许非放射性垃圾混入放射性垃圾;","B":"将放射性垃圾放入专用容器收集、包装、储存,由专业部门统一回收处理。","C":"严禁放射性垃圾放入非放射性垃圾;","D":"放射性垃圾和非放射性垃圾必须分开放置。"},"a":["B","C","D"],"e":"放射性垃圾须用专用容器收集、由专业部门统一收处，严禁混入非放射性垃圾且必须分开存放；A允许混入是错的。"},{"id":559,"c":"辐射安全","l":"II","t":1,"q":"放射性实验应当采取的防护性措施有","o":{"A":"佩戴个人辐射剂量计,可以知道当天接受的剂量和累积剂量,并将其控制在安全水平下","B":"实验时必须带好专用的防护手套、口罩、穿工作服,实验完毕,立即洗手或洗澡。","C":"实验时,力求迅速、熟练,尽量减少被辐射的时间,并应尽可能的利用夹具、机械手来操作,以便远离辐射源,同时应设置隔离屏蔽","D":"粉末物质应在手套箱中进行操作"},"a":["A","B","C","D"],"e":"剂量计监控、穿戴防护用品、缩短时间加屏蔽、粉末在手套箱中操作，四项都是放射性实验该做的防护，全选。"},{"id":560,"c":"辐射安全","l":"II","t":2,"q":"只要有辐射许可证,可以不管其规定的范围从事放射性同位素和射线装置生产、销售、使用活动。","o":{},"a":["错误"],"e":"许可证核定了许可的种类和范围，超范围从事生产、销售、使用就是违法，不能“有证就随便干”，故命题错误。"},{"id":561,"c":"辐射安全","l":"II","t":2,"q":"一定强度的电场,磁场,电磁场都可能对人有损害。","o":{},"a":["正确"],"e":"电场、磁场、电磁场属于非电离辐射，强度达到一定程度会产生热效应等，可能损害人体健康，命题正确。"},{"id":562,"c":"辐射安全","l":"II","t":2,"q":"一定剂量电离辐射会对人体造成损伤,应采取措施进行防护。","o":{},"a":["正确"],"e":"电离辐射达到一定剂量会损伤人体细胞和器官，必须用时间、距离、屏蔽等措施防护，减少不必要的照射。"},{"id":563,"c":"辐射安全","l":"II","t":2,"q":"一定程度的电场、磁场、电磁场都可能答案:对人有损害。","o":{},"a":["正确"],"e":"电场、磁场、电磁场达到一定程度都可能通过热效应、感应电流等损害人体，因此要设限值并做好防护，命题正确。"},{"id":564,"c":"辐射安全","l":"II","t":2,"q":"未经环保部门批准,不得擅自进口、转让放射性同位素。","o":{},"a":["正确"],"e":"放射性同位素的进口、转让须经环保部门批准，未经批准擅自进行属于违法行为，故该说法正确。"},{"id":565,"c":"辐射安全","l":"II","t":2,"q":"外照射是射线照射人体后只造成对人体组织的损伤。例如 γ射线照射造成体内深部损伤,β射线伤害皮肤及眼睛的晶状体。","o":{},"a":["正确"],"e":"外照射是体外射线穿透人体造成组织损伤，γ射线致深部损伤、β射线伤皮肤和晶状体，正符合外照射的特点。"},{"id":566,"c":"辐射安全","l":"II","t":2,"q":"外照射的主要防护方式是:时间防护、距离防护和屏蔽防护措施。","o":{},"a":["正确"],"e":"外照射防护三要素就是时间防护、距离防护和屏蔽防护，三者结合能有效降低受照剂量，命题正确。"},{"id":567,"c":"辐射安全","l":"II","t":2,"q":"同位素实验室和使用固定放射源实验室要在明显位置张贴放射警示标志。定期检测放射污染情况,严防射线污染超标。","o":{},"a":["正确"],"e":"同位素和固定源实验室须在明显位置张贴警示标志，并定期检测放射污染，防止射线污染超标，这是基本管理要求。"},{"id":568,"c":"辐射安全","l":"II","t":2,"q":"同位素32P与 35S可以放在一起,但3H、125I不能放在一起。","o":{},"a":["错误"],"e":"同位素应分别存放，半衰期和射线种类不同的核素混放会造成交叉污染和剂量叠加，32P与35S也不能放一起。"},{"id":569,"c":"辐射安全","l":"II","t":2,"q":"所有操作或接触放射性核素的实验室人员应接受放射性基础知识、相关技术和放射性防护的指导和培训。实行持证上岗,并佩戴个人专用的辐射剂量计。","o":{},"a":["正确"],"e":"涉核人员须接受放射基础知识与防护培训、持证上岗，并佩戴个人专用剂量计监测受照剂量，这是法定要求。"},{"id":570,"c":"辐射安全","l":"II","t":2,"q":"实验过程暂时不使用的放射源不能随便放置,必须放在专门的防护区域内。","o":{},"a":["正确"],"e":"暂不使用的放射源不能随意摆放，必须存入专用防护区域或源库，防止误照射和丢失，命题正确。"},{"id":571,"c":"辐射安全","l":"II","t":2,"q":"涉源单位产生放射性废源废物要及时送贮（一般3个月内）,按规定处置,不得直接排入下水道或混装到普通垃圾中。","o":{},"a":["正确"],"e":"废源废物要在3个月内及时送贮、按规定处置，绝不能排入下水道或混进普通垃圾，否则污染会扩散。"},{"id":572,"c":"辐射安全","l":"II","t":2,"q":"涉源单位产生放射性废源废物可以直接排入下水道或混装到普通垃圾中。","o":{},"a":["错误"],"e":"放射性废源废物严禁排入下水道或混入普通垃圾，必须送贮并按放射性废物处置，否则会污染环境和公众。"},{"id":573,"c":"辐射安全","l":"II","t":2,"q":"涉辐人员必须持有辐射安全与防护培训合格证书,并佩带个人剂量计进行实验。","o":{},"a":["正确"],"e":"涉辐人员必须持有辐射安全与防护培训合格证，并佩戴个人剂量计才能开展实验，这是准入的基本条件。"},{"id":574,"c":"辐射安全","l":"II","t":2,"q":"射线装置、辐射工作场所须安装防盗、防火、防泄漏设施,保证放射性同位素和射线装置的使用安全。辐射工作场所的入口处应放置辐射警示标志和工作信号。","o":{},"a":["正确"],"e":"辐射工作场所要配防盗、防火、防泄漏设施，入口处设辐射警示标志和工作信号，防止误入和事故发生。"},{"id":575,"c":"辐射安全","l":"II","t":2,"q":"内照射指放射性物质呼吸道吸入、消化道进入、皮肤伤口渗入等途径进入体内,造成放出的射线及化学毒性对人体器官的双重损伤。","o":{},"a":["正确"],"e":"内照射是放射性物质经呼吸道、消化道、伤口进入体内，既放出射线又有化学毒性，造成双重损伤。"},{"id":576,"c":"辐射安全","l":"II","t":2,"q":"密封型放射源使用完后,三个月内必须送具有资质的单位进行处理。","o":{},"a":["正确"],"e":"密封型放射源用完不能自行存放，须在三个月内送有资质的单位收贮处理，避免失控和误照射。"},{"id":577,"c":"辐射安全","l":"II","t":2,"q":"离开放射性实验室前必须洗手。","o":{},"a":["正确"],"e":"离开放射性实验室前必须洗手并检测手部污染，防止把放射性物质带出实验室造成扩散。"},{"id":578,"c":"辐射安全","l":"II","t":2,"q":"可以用眼睛近距离直观放射源。","o":{},"a":["错误"],"e":"眼睛晶状体对射线很敏感，近距离直视放射源会受照并可能诱发白内障，绝不能用眼睛直接观看。"},{"id":579,"c":"辐射安全","l":"II","t":2,"q":"可以用手触摸放射源表面。","o":{},"a":["错误"],"e":"手摸源表面会受到强照射，还可能沾上放射性污染，操作要用长柄工具或机械手并保持距离。"},{"id":580,"c":"辐射安全","l":"II","t":2,"q":"核素自发地蜕变为另一种核素,同时放出各种射线,这种现象称作放射性衰变。","o":{},"a":["正确"],"e":"不稳定的核素自发蜕变成另一种核素并放出各种射线，这个过程就叫放射性衰变，是核素的固有性质。"},{"id":581,"c":"辐射安全","l":"II","t":2,"q":"核衰变是原子核自发产生的变化,放射性衰变服从指数规律。","o":{},"a":["正确"],"e":"核衰变是原子核自发发生的变化，不受温度、压强等外界条件影响，其数量随时间服从指数衰减规律。"},{"id":582,"c":"辐射安全","l":"II","t":2,"q":"国务院环境保护主管部门与国务院卫生主管部门根据射线装置对人体健康和环境的潜在危害程度,从高到低将射线装置分为Ⅰ类、Ⅱ类、Ⅲ类。","o":{},"a":["正确"],"e":"射线装置按对人体健康和环境的潜在危害程度，从高到低分为Ⅰ类、Ⅱ类、Ⅲ类，由环保和卫生主管部门划定。"},{"id":583,"c":"辐射安全","l":"II","t":2,"q":"各涉源单位要建立健全放射性同位素保管、领用和消耗的登记制度,做到帐物相符。实验过程必须小心谨慎,严格按照操作规程进行,做好安全防护工作。","o":{},"a":["正确"],"e":"涉源单位要建立保管、领用、消耗登记制度，做到帐物相符，并严格按操作规程实验、做好安全防护。"},{"id":584,"c":"辐射安全","l":"II","t":2,"q":"辐射事故分为特别重大辐射事故、重大辐射事故、较大辐射事故和一般辐射事故四个等级。","o":{},"a":["正确"],"e":"辐射事故按严重程度分为特别重大、重大、较大和一般四个等级，这是《放射性同位素与射线装置安全和防护条例》的规定。"},{"id":585,"c":"辐射安全","l":"II","t":2,"q":"废弃的放射源,必须报资产与实验室管理处,由资产与实验室管理处联系有资质的单位进行收贮,不得私自处理。","o":{},"a":["正确"],"e":"废弃放射源不能私自处理，须报资产与实验室管理处，由其联系有资质单位收贮，防止源流失到社会。"},{"id":586,"c":"辐射安全","l":"II","t":2,"q":"放射性同位素应单独存放,不得与易燃、易爆、腐蚀性物品等一起存放,并采取有效的防火、防盗、防射线泄漏的安全措施,指定专人负责保管。","o":{},"a":["正确"],"e":"放射性同位素要单独存放，不得与易燃易爆、腐蚀性物品混放，并做好防火防盗防泄漏、指定专人保管。"},{"id":587,"c":"辐射安全","l":"II","t":2,"q":"放射性实验室允许带与实验无关的人员进实验室。","o":{},"a":["错误"],"e":"放射性实验室属控制区，无关人员不得进入，以免受到不必要照射或干扰实验，故命题错误。"},{"id":588,"c":"辐射安全","l":"II","t":2,"q":"放射性废物,经过屏蔽处理后可以当作一般垃圾处理。","o":{},"a":["错误"],"e":"放射性废物经屏蔽后仍含放射性核素，必须按放射性废物送贮处置，当作一般垃圾会污染环境，故错误。"},{"id":589,"c":"辐射安全","l":"II","t":2,"q":"当皮肤受到放射源微量污染时,可用肥皂（或EDTA-Na2肥皂）、软毛刷、温水洗刷,到降至污染控制水平以下为止;如果皮肤严重污染,应立即用肥皂、软毛刷清洗（切勿擦破皮肤）,然后根据核素的性质选择合适的去污剂。","o":{},"a":["正确"],"e":"皮肤微量污染用肥皂、软毛刷加温水洗刷至控制水平以下，严重污染切勿擦破皮肤，再按核素性质选去污剂。"},{"id":590,"c":"辐射安全","l":"II","t":2,"q":"参照国际原子能机构的有关规定,国务院环境保护主管部门按照放射源对人体健康和环境的潜在危害程度,从高到低将放射源分为Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ类。","o":{},"a":["正确"],"e":"参照国际原子能机构规定，我国按潜在危害从高到低把放射源分为Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ类，Ⅰ类最危险、Ⅴ类最低。"},{"id":591,"c":"辐射安全","l":"II","t":2,"q":"半衰期短的同位素试剂及其实验废弃物必须用容器密封保存8个半衰期以上,经检测其活度达到安全水平以下,可作为普通实验废弃物处理。","o":{},"a":["正确"],"e":"短半衰期核素废物密封保存8个半衰期以上，活度衰变到安全水平以下并经检测合格，可按普通实验废物处理。"},{"id":592,"c":"辐射安全","l":"II","t":2,"q":"半衰期长的同位素试剂及其实验废弃物必须送具有资质的单位进行处理。","o":{},"a":["正确"],"e":"长半衰期核素短时间内衰变不掉，必须送有资质单位处理，不能自行当作普通实验废弃物丢弃。"},{"id":593,"c":"辐射安全","l":"II","t":2,"q":"α衰变放出带二个正电的氦核,对它的防护是防止它进入体内,即内照射防护。","o":{},"a":["正确"],"e":"α衰变放出带两个正电荷的氦核，穿透力弱、射程短，体外危害小，关键是防止吸入体内造成内照射。"},{"id":594,"c":"辐射安全","l":"II","t":2,"q":"C-14、P-32、H-3、I-125、S-35等是常用的同位素试剂。","o":{},"a":["正确"],"e":"C-14、P-32、H-3、I-125、S-35都是生物医学实验常用的同位素标记试剂，应用十分广泛。"},{"id":595,"c":"辐射安全","l":"II","t":2,"q":"Ⅴ类放射源为极低危险源。不会对人造成永久性损伤。","o":{},"a":["正确"],"e":"Ⅴ类放射源属极低危险源，即使无防护接触也不会对人造成永久性损伤，管理要求相对最低。"},{"id":596,"c":"辐射安全","l":"II","t":2,"q":"Ⅳ类放射源为低危险源。基本不会对人造成永久性损伤,但对长时间、近距离接触这些放射源的人可能造成可恢复的临时性损伤。","o":{},"a":["正确"],"e":"Ⅳ类为低危险源，基本不会造成永久性损伤，但长时间近距离接触可能造成可恢复的临时性损伤。"},{"id":597,"c":"辐射安全","l":"II","t":2,"q":"Ⅲ类放射源为危险源。在没有防护情况下,接触这类源几小时就可对人造成永久性损伤,接触几天至几周也可致人死亡。","o":{},"a":["正确"],"e":"Ⅲ类属危险源，无防护接触几小时可致永久性损伤，接触几天至几周可致人死亡，必须严格防护。"},{"id":598,"c":"辐射安全","l":"II","t":2,"q":"Ⅱ类放射源为高危险源。在没有防护情况下,接触这类源几小时至几天可致人死亡。","o":{},"a":["正确"],"e":"Ⅱ类属高危险源，无防护情况下接触几小时至几天即可致人死亡，需重点监管并采取专门防护。"},{"id":599,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"关于管制类化学品购买,以下要求错误的是（）","o":{"A":"购买前须经学院审核、学校审批,后报公安部门或食品药品监督管理部门批准或备案。","B":"向具有经营许可资质的单位购买,并保留报批及审批记录。","C":"建立购买、验收、使用等台账资料。","D":"可自行从外单位借用管制类化学品,也可给外单位或个人提供管制类化学品。"},"a":["D"],"e":"管制类化学品流向必须全程受控，私自从外单位借用、转给外单位或个人正是监管严防的事。购买走学院学校审核加公安备案、找有资质单位留好记录、建齐台账，才是规范做法。"},{"id":600,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"关于剧毒化学品管理,以下要求正确的是（）","o":{"A":"执行“五双”管理（即双人验收、双人保管、双人发货、双把锁、双本账）。","B":"可与易燃、易爆、腐蚀性物品等一起存放。","C":"实验室人员共同管理并做好贮存、领取、发放情况登记,登记资料至少保存1年。","D":"防盗安全门应符合GB 17565的要求,防盗安全级别为丙级（含）以上,防盗锁应符合GA 73的要求,防盗保险柜应符合《防盗保险柜》GB 10409的要求,监控管控执行公安要求。"},"a":["A"],"e":"剧毒品管理核心是“五双”：双人验收、保管、发货，加双把锁、双本账。混放易燃易爆品违规，人人共管不合专人双管要求，对照规范只有五双这条完整正确。"},{"id":601,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"关于易制爆化学品管理,以下要求错误的是（）","o":{"A":"按要求落实双人双锁保管,可大量存储。","B":"存放场所出入口应设置防盗安全门,或存放在专用储存柜内。","C":"储存场所防盗安全级别应为乙级（含）以上,专用储存柜应具有防盗功能,符合双人双锁管理要求。","D":"购买、验收、使用等台账账册保存期限不少于1年。"},"a":["A"],"e":"错在“可大量存储”——易制爆品要按需购买、限量存放，不能囤货。双人双锁没错但别被带偏；防盗门或专用柜、乙级以上防盗级别、台账存一年以上都得落实。"},{"id":602,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"关于爆炸品管理,以下要求错误的是（）","o":{"A":"单独隔离。","B":"限量存储。","C":"收存和发放民用爆炸物品无需进行登记。","D":"使用、销毁按照公安部门要求执行。"},"a":["C"],"e":"爆炸品收存和发放必须逐笔登记，账物相符才能查清流向，“无需登记”纯属误导。单独隔离、限量存储、按公安要求销毁都是基本规矩，最怕来去不清。"},{"id":603,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"我国易制毒化学品分为（）类","o":{"A":"一","B":"二","C":"三","D":"四"},"a":["C"],"e":"记个数就行：我国易制毒化学品分一、二、三类，不是四类。第一类管控最严，二、三类依次递减，考试就考这个“三”，别被“四”带跑。"},{"id":604,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"以下即属于易制毒化学品也属于易制爆化学品的是（）","o":{"A":"硫酸","B":"高锰酸钾","C":"硝酸","D":"重铬酸钾"},"a":["B"],"e":"高锰酸钾是“两栖选手”：既列入易制毒第三类名录，又列入易制爆名录。硫酸只算易制毒、硝酸只算易制爆、重铬酸钾两边都不沾，所以选高锰酸钾。"},{"id":605,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"实验室仅涉及（）,不认定为Ⅱ级实验室。","o":{"A":"存储第二类精神药品","B":"存储易燃易爆化学品总量为20~50kg或20~50L","C":"存储第二/三类易制毒品","D":"使用第一类、第二类压力容器","E":"生物安全BSL-2、ABSL-2实验室"},"a":["C"],"e":"只存第二、三类易制毒品不算Ⅱ级实验室；存第二类精神药品、易燃易爆品总量20~50kg/L、用一、二类压力容器、BSL-2生物安全都够到Ⅱ级线，所以选C。"},{"id":606,"c":"管制类化学品安全及分级分类管理","l":"III","t":0,"q":"对于Ⅰ级实验室,安全培训应满足以下要求（）","o":{"A":"实验人员完成不少于4学时的准入安全培训,之后每年根据学校实际需要安排适量的安全培训（以上均含应急演练）;每年开展不少于1次应急演练","B":"实验人员完成不少于8学时的准入安全培训,之后每年完成不少于2学时的安全培训（以上均含应急演练）;每年开展不少于1次应急演练","C":"实验人员完成不少于16学时的准入安全培训,之后每年完成不少于4学时的安全培训（以上均含应急演练）;每年开展不少于1次应急演练（含针对重要危险源的应急演练）","D":"实验人员完成不少于24学时的准入安全培训,之后每年完成不少于8学时的安全培训（以上均含应急演练）;每年开展不少于2次应急演练（含针对重要危险源的应急演练）"},"a":["D"],"e":"Ⅰ级风险最高，培训要求也最严：准入不少于24学时，每年再学不少于8学时，每年至少2次应急演练且含针对重要危险源的。等级越高要求越严，记住数字最大的对应Ⅰ级。"},{"id":607,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"关于易制毒化学品管理,以下要求正确的是（）","o":{"A":"储存规范,台账清晰。","B":"应设置专用存储区或者专柜储存并有防盗措施。","C":"第一类易制毒化学品、药品类易制毒化学品实行双人双锁管理。","D":"购买、验收、使用等账册保存期限不少于2年。"},"a":["A","B","C","D"],"e":"四条全是易制毒管理的基本动作：专区专柜加防盗，第一类和药品类双人双锁，台账清晰、账册保存不少于两年。一条都不能少，多选题漏选不得分，全选才稳。"},{"id":608,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"管制类化学品分为（）","o":{"A":"易制毒化学品","B":"易燃化学品","C":"易制爆化学品","D":"剧毒化学品","E":"爆炸品","F":"麻醉药品和第一类精神药品"},"a":["A","C","D","E","F"],"e":"管制类化学品是重点看管名单：易制毒、易制爆、剧毒、爆炸品，再加麻醉药品和第一类精神药品，共五类。易燃化学品虽危险但不在管制类里，别多选B。"},{"id":609,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"以下属于易制毒化学品的是（）","o":{"A":"乙醚","B":"丙酮","C":"三氯甲烷","D":"硝酸","E":"盐酸","F":"硫酸"},"a":["A","B","C","E","F"],"e":"乙醚、丙酮、三氯甲烷、盐酸、硫酸都在易制毒名录里；硝酸只属易制爆，不选D。名录题最容易漏选，逐个过一遍再交卷。"},{"id":610,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"以下不属于易制毒化学品的是（）","o":{"A":"醋酸酐","B":"甲醇","C":"甲苯","D":"氢氟酸","E":"哌啶","F":"溴素"},"a":["B","D"],"e":"反向题，看清“不属于”：甲醇、氢氟酸不在易制毒名录；醋酸酐、甲苯、哌啶、溴素都在列。有人顺手全选就掉坑了，做这类题先把题干圈出来。"},{"id":611,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"以下属于易制爆化学品的是（）","o":{"A":"30%过氧化氢","B":"硝酸","C":"硫酸","D":"水合肼","E":"硝酸钠","F":"钠"},"a":["A","B","D","E","F"],"e":"30%过氧化氢、硝酸、水合肼、硝酸钠、金属钠都列入易制爆名录；硫酸按题库口径只算易制毒不算易制爆，别多选C。名录题靠平时积累，记个大概名单就够用。"},{"id":612,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"以下属于剧毒化学品的是（）","o":{"A":"三正丁胺","B":"叠氮化钠","C":"氰化钠","D":"氯化汞","E":"2-丙炔-1-醇","F":"乙酸汞"},"a":["A","B","C","D","E","F"],"e":"按剧毒化学品目录，这六种全在列：叠氮化钠、氰化钠是老牌剧毒品，氯化汞、乙酸汞是汞盐，三正丁胺、2-丙炔-1-醇容易漏。全选别犹豫，漏一个就丢分。"},{"id":613,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"以下属于爆炸品的是（）","o":{"A":"硝酸钾","B":"2,4,6-三硝基甲苯","C":"硝酸铵","D":"高氯酸锂","E":"2,4,6-三硝基苯酚","F":"硼氢化钠"},"a":["B","C","E"],"e":"TNT、硝酸铵、苦味酸（都是三硝基类或硝酸铵）是典型爆炸品；硝酸钾只是氧化剂，高氯酸锂、硼氢化钠按题库口径不算，选BCE。记牢“三硝基”开头多是爆炸品。"},{"id":614,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"实验室安全等级可分为（）。","o":{"A":"Ⅰ级（红级、重大风险）","B":"Ⅱ级（橙级、高风险）","C":"Ⅲ级（黄级、中风险）","D":"Ⅳ级（蓝级、低风险）","E":"Ⅴ级（绿级、无风险）"},"a":["A","B","C","D"],"e":"实验室安全等级就四级：红、橙、黄、蓝，对应重大到低风险。没有“绿级无风险”——零风险实验室不存在，E是编出来钓人的，只选ABCD。"},{"id":615,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"实验室可划分为（）类别。","o":{"A":"化学类实验室","B":"生物类实验室","C":"辐射类实验室","D":"机电类实验室","E":"其他类实验室"},"a":["A","B","C","D","E"],"e":"实验室按危险源类型分五类：化学、生物、辐射、机电，再加“其他”兜底，所以全选。这五类是安全检查和培训分类的基础框架，记牢。"},{"id":616,"c":"管制类化学品安全及分级分类管理","l":"III","t":1,"q":"实验室有涉及（）,需认定为Ⅰ级实验室。","o":{"A":"使用剧毒化学品","B":"存储易燃易爆化学品总量大于50kg或50L","C":"存储有毒、易燃气体总量为3-6（不含）瓶","D":"使用4、3R、3B类激光设备"},"a":["A","B","D"],"e":"使用剧毒品、易燃易爆品存量超50kg或50L、使用4、3R、3B类激光设备，都够Ⅰ级；有毒易燃气体3~6（不含）瓶按分级标准还够不上Ⅰ级，别多选C。"},{"id":617,"c":"管制类化学品安全及分级分类管理","l":"III","t":2,"q":"对于Ⅰ级和Ⅱ级实验室,实验室做到经常性检查。","o":{},"a":["错误"],"e":"错在“经常性检查”要求偏低。按安全规范，Ⅰ、Ⅱ级高风险实验室要的是日查、周查这类高频次检查，风险越高查得越勤，“经常性”说法太含糊。"},{"id":618,"c":"管制类化学品安全及分级分类管理","l":"III","t":2,"q":"科研项目、学生课题等实验活动应进行安全风险评估。","o":{},"a":["正确"],"e":"对。科研项目、学生课题开展实验前都必须先做安全风险评估，摸清危险源、定好防控措施再动手，这是实验活动准入的基本规矩，评估不是走过场。"},{"id":619,"c":"化学安全","l":"II","t":0,"q":"做加热易燃液体实验时（ ）","o":{"A":"可用电炉加热,要有人看管。","B":"用电热套加热可不用人看管。","C":"用水浴加热要有人看管。"},"a":["C"],"e":"易燃液体蒸气碰上电炉的明火或高温就着，所以电炉不能选；电热套虽然温和，无人看管一样危险。水浴传热平稳、温度可控，但加热全程必须有人守着。"},{"id":620,"c":"化学安全","l":"II","t":0,"q":"装运危险化学品的车辆通过市区时,中途（ ）。","o":{"A":"可以到加油站加油","B":"可以把车存在停车场","C":"不得随便停车"},"a":["C"],"e":"危险品运输车走哪条线、能在哪儿停都有规定，市区人口密集，随意停车一旦泄漏或碰撞后果难控。加油也要按规定到指定地点，不是想停就停。"},{"id":621,"c":"化学安全","l":"II","t":0,"q":"装有挥发性物质或易受热分解放出气体的药品瓶子,是否要用石蜡封住瓶塞？当瓶口因用蜡封住而打不开时,是否能把瓶子放在火上烘烤","o":{"A":"是 否","B":"否 是","C":"是 是","D":"否 否"},"a":["A"],"e":"挥发性、受热易分解的药品要减少挥发和吸潮，所以瓶塞用石蜡封住；而蜡封打不开时绝不能火烤，受热膨胀会炸瓶，只能温水浸润或轻敲。"},{"id":622,"c":"化学安全","l":"II","t":0,"q":"贮存危险化学品的仓库的管理人员必须配备可靠的（ ）。","o":{"A":"劳动保护用品","B":"安全监测仪器","C":"手提消防器材"},"a":["A"],"e":"管理人员天天接触药品，最直接可靠的是个人防护用品，防毒口罩、手套、护目镜都算。安全监测仪器和消防器材属于仓库整体配置，不是管理员随身必备。"},{"id":623,"c":"化学安全","l":"II","t":0,"q":"在作业场所液化气浓度较高时,应该佩戴","o":{"A":"面罩","B":"口罩","C":"眼罩","D":"防毒面罩"},"a":["A"],"e":"液化气浓度高时普通口罩挡不住吸入，眼罩也只护眼睛。要选能罩住口鼻的面罩类防护，把呼吸道护住，这才是这里对应的一项。"},{"id":624,"c":"化学安全","l":"II","t":0,"q":"在装卸易燃易爆品操作中,不能使用( )工具。","o":{"A":"铁制","B":"木制","C":"铜制"},"a":["A"],"e":"铁制工具相互碰撞或敲击容易打出火花，易燃易爆品蒸气遇火星就可能引燃。木制、铜制工具不产生火花，才允许在装卸时使用。"},{"id":625,"c":"化学安全","l":"II","t":0,"q":"在蒸馏低沸点有机化合物时应采取那种方法加热？","o":{"A":"煤气灯","B":"热水浴","C":"电炉","D":"砂浴"},"a":["B"],"e":"低沸点有机物蒸气极易燃，煤气灯属明火，电炉温度也偏高，砂浴升温同样不好控。热水浴温度低而平稳，最不容易把蒸气点着。"},{"id":626,"c":"化学安全","l":"II","t":0,"q":"在蒸馏低沸点有机化合物时应采取哪种方法加热？","o":{"A":"酒精灯","B":"热水浴","C":"电炉","D":"砂浴"},"a":["B"],"e":"低沸点有机物沸点低、蒸气易燃，酒精灯、电炉、砂浴温度都不好控制。热水浴加热温和、上限低，能避免局部过热和蒸气被点燃。"},{"id":627,"c":"化学安全","l":"II","t":0,"q":"在易燃易爆场所穿( )最危险。","o":{"A":"布鞋","B":"胶鞋","C":"带钉鞋"},"a":["C"],"e":"带钉鞋底铁钉与地面摩擦、碰撞会打出火花，是现成的点火源。布鞋、胶鞋不产生火花，在易燃易爆场所相对安全。"},{"id":628,"c":"化学安全","l":"II","t":0,"q":"在使用化学药品前应做好的准备有","o":{"A":"明确药品在实验中的作用","B":"掌握药品的物理性质（如:熔点、沸点、密度等）和化学性质","C":"了解药品的毒性;了解药品对人体的侵入途径和危险特性;了解中毒后的急救措施","D":"以上都是"},"a":["D"],"e":"用什么、什么性质、有多毒、中毒怎么救，四件事都得事先弄明白。只知其一就动手，遇到异常容易误判，三条加起来才是完整准备。"},{"id":629,"c":"化学安全","l":"II","t":0,"q":"在实验中,以下哪种做法是错误的？","o":{"A":"一旦浓硫酸落在人体身上时,用4.5%乙酸或1.5%左右的盐酸中和洗涤","B":"一旦浓硫酸落在人体身上时,以弱碱（2%碳酸钠）或肥皂液中和洗涤","C":"一旦碱液落在皮肤上时,用4.5%乙酸或1.5%左右的盐酸中和洗涤"},"a":["C"],"e":"碱液沾到皮肤上，正确是先大量清水冲，再用稀硼酸或稀乙酸小心中和；C却拿盐酸去洗，方向错还多添刺激。浓硫酸灼伤也要先擦去再冲水，别急着上中和液。"},{"id":630,"c":"化学安全","l":"II","t":0,"q":"在实验内容设计过程中,要尽量选择什么物品做实验？","o":{"A":"无公害、无毒或低毒的物品","B":"实验的残液、残渣较多的物品","C":"实验的残液、残渣不可回收的物品"},"a":["A"],"e":"从源头减毒才是根本：试剂越无毒无害，泄漏、着火、中毒的风险就越小。残液残渣多或不可回收，只会让后续处置更麻烦。"},{"id":631,"c":"化学安全","l":"II","t":0,"q":"在普通冰箱中不可以存放什么物品？","o":{"A":"普通化学试剂","B":"酶溶液","C":"菌体","D":"有机溶剂"},"a":["D"],"e":"普通冰箱内部有温控触点和电火花，有机溶剂挥发后积聚在箱内，遇火花就可能爆燃，必须用防爆冰箱。试剂、酶液、菌体按各自条件冷藏。"},{"id":632,"c":"化学安全","l":"II","t":0,"q":"在进行有毒药品实验时会在哪里进行？","o":{"A":"普通实验台上","B":"通风橱中","C":"露天阳台","D":"实验室任意地方"},"a":["B"],"e":"通风橱把有毒蒸气、粉尘就地抽走，不让人吸进去。普通台面、露天阳台或随便找个地方做，毒物会直接扩散到呼吸带。"},{"id":633,"c":"化学安全","l":"II","t":0,"q":"在进行实验中,是否可以配戴隐形眼镜？","o":{"A":"可以","B":"不可以","C":"不一定"},"a":["B"],"e":"化学品溅入眼中会藏在镜片后面，冲洗冲不到，还可能被镜片摩擦加重角膜损伤。实验时戴隐形眼镜，等于给自己埋了个隐患。"},{"id":634,"c":"化学安全","l":"II","t":0,"q":"遇水发生剧烈反应,容易产生爆炸或燃烧的化学品是","o":{"A":"K、NA、Mg、Ca、Li、AlH3、电石","B":"K、NA、Ca、Li、AlH3、MgO、电石","C":"K、NA、Ca、Li、AlH3、电石","D":"K、NA、Mg、Li、AlH3、电石"},"a":["C"],"e":"钾、钠、钙、锂和氢化铝、电石遇水都放出氢气或乙炔并大量放热，极易燃爆。镁与冷水反应很慢，氧化镁更不反应，把镁列进去的都不对。"},{"id":635,"c":"化学安全","l":"II","t":0,"q":"欲除去氯气时,以下哪一种物质作为吸收剂最为有效？","o":{"A":"氯化钙","B":"稀硫酸","C":"硫代硫酸钠","D":"氢氧化铅"},"a":["C"],"e":"硫代硫酸钠能把氯气还原成氯离子，吸收快、效果好。氯化钙只是干燥剂，稀硫酸和氢氧化铅都不与氯气有效反应。"},{"id":636,"c":"化学安全","l":"II","t":0,"q":"有些固体化学试剂接触空气即能发生强烈氧化作用,如黄磷,应如何保存:","o":{"A":"要保存在水中","B":"放在试剂瓶中保存","C":"用纸包裹存放","D":"放在盒子中"},"a":["A"],"e":"黄磷着火点很低，露在空气中就会自燃，必须浸在水中隔绝空气。纸包、盒子、普通试剂瓶都挡不住它和氧气接触。"},{"id":637,"c":"化学安全","l":"II","t":0,"q":"有些固体化学试剂（如硫化磷、赤磷、镁粉等）与氧化剂接触或在空气中受热、受冲击或磨擦能引起急剧燃烧,甚至爆炸。使用这些化学试剂时,要注意什么:","o":{"A":"要注意周围环境湿度不要太高","B":"周围温度一般不要超过30℃,最好在20℃以下","C":"不要与强氧化剂接触","D":"以上都是"},"a":["D"],"e":"这类物质受热、受冲击或摩擦就会剧烈燃烧：湿度高易受潮发热，温度超过30℃危险增大，接触强氧化剂更是直接引发反应，三条都要防。"},{"id":638,"c":"化学安全","l":"II","t":0,"q":"有机物或能与水发生剧烈化学反应的药品着火,应用 ( )以免扑救不当造成更大损害。","o":{"A":"其他有机物灭火","B":"自来水灭火","C":"灭火器或沙子扑灭"},"a":["C"],"e":"水会和这类药品剧烈反应，甚至放出可燃气体助燃；再拿其他有机物去灭，等于添柴。用灭火器或沙子覆盖隔绝空气才稳妥。"},{"id":639,"c":"化学安全","l":"II","t":0,"q":"用于有机玻璃的粘合的三氯甲烷（氯仿）,应注意:","o":{"A":"不可接触人体","B":"可以接触人体","C":"无所谓","D":"特殊情况可以"},"a":["A"],"e":"氯仿有麻醉性和毒性，皮肤接触、吸入蒸气都会伤肝肾，还能经皮吸收。粘接时戴手套、在通风处操作，别让皮肤沾到。"},{"id":640,"c":"化学安全","l":"II","t":0,"q":"用剩的活泼金属残渣应如何处理:","o":{"A":"连同溶剂一起作为废液处理","B":"缓慢滴加乙醇将所有金属反应完毕后,整体作为废液处理","C":"将金属取出暴露在空气中使其氧化完全"},"a":["B"],"e":"活泼金属直接扔废液桶或暴露在空气中，会与水、氧气剧烈反应着火。缓慢滴加乙醇让它反应完全，再整体按废液交处理，才可控。"},{"id":641,"c":"化学安全","l":"II","t":0,"q":"用过的废洗液应如何处理？","o":{"A":"可直接倒入下水道","B":"作为废液交相关部门统一处理","C":"可以用来洗厕所","D":"随意处置"},"a":["B"],"e":"洗液含强氧化剂和重金属，倒下水道会腐蚀管道、污染水体，拿去洗厕所更不行。分类收集后交有资质部门统一处置。"},{"id":642,"c":"化学安全","l":"II","t":0,"q":"应如何简单辨认有味的化学药品？","o":{"A":"用鼻子对着瓶口去辨认气味","B":"用舌头品尝试剂","C":"将瓶口远离鼻子,用手在瓶口上方扇动,稍闻其味即可","D":"取出一点,用鼻子对着闻"},"a":["C"],"e":"鼻子凑到瓶口深吸，等于把高浓度蒸气直接吸进肺。正确是瓶口离远些，用手在瓶口上方轻轻扇动，让少量气味飘过来。"},{"id":643,"c":"化学安全","l":"II","t":0,"q":"易燃易爆试剂应放在什么地方","o":{"A":"在铁柜中,柜的顶部要有通风口","B":"在木柜中,柜的顶部要有通风口","C":"在铁柜中,并要密封保存","D":"在木柜中,并要密封保存"},"a":["A"],"e":"铁柜防火，顶部通风口让挥发气体有处散出，避免柜内积聚成爆炸性混合气。木柜不防火，一味密封反而容易憋气。"},{"id":644,"c":"化学安全","l":"II","t":0,"q":"易燃易爆场所不能穿","o":{"A":"纯棉工作服","B":"化纤工作服","C":"防静电工作服"},"a":["B"],"e":"化纤衣服摩擦易起静电，放电火花就足以点燃可燃蒸气。纯棉和防静电工作服不积聚静电，才是该穿的。"},{"id":645,"c":"化学安全","l":"II","t":0,"q":"易燃液体加热时可以:","o":{"A":"用电炉加热,有人看管","B":"用电热套加热可不用人看管","C":"用水浴加热,并有人看管","D":"用水浴加热不用人看管"},"a":["C"],"e":"易燃液体蒸气一遇明火就着，电炉不能用；电热套无人看管也不行。水浴温度平稳、不会局部过热，还要全程有人盯着。"},{"id":646,"c":"化学安全","l":"II","t":0,"q":"易燃类液体的特点是:","o":{"A":"闪点在25℃以下的液体,闪点越低,越易燃烧","B":"极易挥发成气体","C":"遇明火即燃烧","D":"以上都是"},"a":["D"],"e":"闪点低、易挥发、遇明火就燃，说的其实是同一类危险性的几个方面：闪点越低越易着，挥发出来的蒸气才是真正烧起来的东西。"},{"id":647,"c":"化学安全","l":"II","t":0,"q":"易燃化学试剂理想存放温度是多少？允许存放最高室温不得超过多少","o":{"A":"0～10℃,30℃","B":"-4～4℃;30℃","C":"0～5℃,20℃","D":"-4～4℃,40℃"},"a":["B"],"e":"低温存放能把挥发和蒸气压压下去，理想是-4～4℃；室温超过30℃挥发加快、瓶内压力升高，风险明显上升。"},{"id":648,"c":"化学安全","l":"II","t":0,"q":"易燃化学试剂存放和使用的注意事项对是:","o":{"A":"要求单独存放于阴凉通风处","B":"放在冰箱中时,要使用防爆冰箱","C":"远离火源,绝对不能使用明火加热","D":"以上都是"},"a":["D"],"e":"阴凉通风单独存放、进防爆冰箱、远离火源不用明火，这三条针对的正是易燃试剂挥发、积聚、被点燃的整条链条。"},{"id":649,"c":"化学安全","l":"II","t":0,"q":"易燃、易爆物品和杂物等应该堆放在:","o":{"A":"烘箱、箱式电阻炉等附近","B":"冰箱、冰柜等附近","C":"单独通风的实验室内"},"a":["C"],"e":"堆在烘箱、电阻炉旁会被烤着，挨着冰箱冰柜也不安全。单独、通风的房间能避开热源和气体积聚，才符合存放要求。"},{"id":650,"c":"化学安全","l":"II","t":0,"q":"以下液体中,投入金属钠最可能发火燃烧的是:","o":{"A":"无水乙醇","B":"苯","C":"水","D":"汽油"},"a":["C"],"e":"钠遇水剧烈反应放出氢气和大量热，热量直接把氢气点着。乙醇反应缓和些，苯和汽油与钠基本不反应。"},{"id":651,"c":"化学安全","l":"II","t":0,"q":"以下药品按毒性从大到小排序正确的是:","o":{"A":"甲醛、苯、苯乙烯、丙酮","B":"苯、甲醛、甲苯、丙酮","C":"甲苯、甲醛、苯、丙酮","D":"苯、丙酮、甲苯、甲醛"},"a":["B"],"e":"苯有明确致癌性，毒性居首；甲醛刺激强、也致癌，排第二；甲苯是苯的同系物，毒性比苯低；丙酮属低毒溶剂，排最后。"},{"id":652,"c":"化学安全","l":"II","t":0,"q":"以下药品 （试剂） 哪个应放在防爆冰箱里保存？","o":{"A":"甲基丙烯酸甲酯","B":"乙醚","C":"苯"},"a":["A"],"e":"甲基丙烯酸甲酯挥发性强、受热还容易自聚放热，必须低温存放且用防爆冰箱。乙醚、苯虽易燃，这里考的是需要低温防聚的那种。"},{"id":653,"c":"化学安全","l":"II","t":0,"q":"以下物质中,哪些应该在通风橱内操作？","o":{"A":"氢气","B":"氮气","C":"氦气","D":"氯化氢"},"a":["D"],"e":"氯化氢遇水汽生成盐酸雾，刺激性很强，必须在通风橱里操作。氢、氮、氦本身无毒，不是这类刺激性气体的代表。"},{"id":654,"c":"化学安全","l":"II","t":0,"q":"以下物品中露天存放最危险的是","o":{"A":"氯化钠","B":"明矾","C":"遇湿燃烧物品"},"a":["C"],"e":"遇湿燃烧的物品一淋雨就着火，露天等于把点火条件交给天气。氯化钠、明矾性质稳定，不怕露天存放。"},{"id":655,"c":"化学安全","l":"II","t":0,"q":"以下危险化学品中,（ ）可以在露天贮存。","o":{"A":"遇潮能引起燃烧.爆炸","B":"遇潮能发生化学反应的","C":"遇火、热、潮能引起化学反应,产生有毒气体的"},"a":["C"],"e":"遇潮能燃爆、遇潮会起化学反应的，一旦淋雨就出事，必须进库房。按本题口径选第三项，实际操作仍要防雨防晒、远离热源，拿不准就别露天。"},{"id":656,"c":"化学安全","l":"II","t":0,"q":"以下是溴灼伤处理方法,其顺序为: ①送医院 ②立即用大量水洗 ③用乙醇擦至灼伤处为白色。","o":{"A":"②③①","B":"②①③","C":"③②①","D":"①②③"},"a":["A"],"e":"溴灼伤先用大量水冲掉残溴，再用乙醇擦洗到皮肤发白，把溴稀释带走，最后送医院。顺序反了，等于让溴在皮肤上多待。"},{"id":657,"c":"化学安全","l":"II","t":0,"q":"以下是酸灼伤的处理方法,其顺序为:①以1～2％NaHCO3溶液洗。 ②立即用大量水洗 ③送医院","o":{"A":"①③②","B":"②①③","C":"③①②","D":"③②①"},"a":["B"],"e":"酸沾到皮肤先大量清水冲，把酸稀释冲走；再用1～2%碳酸氢钠中和；最后送医院。先中和后冲洗，中和热会加重损伤。"},{"id":658,"c":"化学安全","l":"II","t":0,"q":"以下什么物质引起的皮肤灼伤禁用水洗？","o":{"A":"五氧化二磷","B":"五硫化磷","C":"五氯化磷","D":"以上都是"},"a":["D"],"e":"这三种遇水都剧烈反应：五氧化二磷生成磷酸并放热，五硫化磷放出硫化氢，五氯化磷放出氯化氢，冲水等于在伤口上产酸产热，应先干布擦去。"},{"id":659,"c":"化学安全","l":"II","t":0,"q":"以下哪种物质不会灼伤皮肤？","o":{"A":"强碱、强酸","B":"强氧化剂","C":"溴","D":"KBr、NABr水溶液"},"a":["D"],"e":"溴化钾、溴化钠的水溶液是中性的盐溶液，刺激很小。强酸强碱、强氧化剂和溴单质都会直接腐蚀皮肤。"},{"id":660,"c":"化学安全","l":"II","t":0,"q":"以下哪种情况应选用泡沫灭火器进行灭火？","o":{"A":"电石、过氧化钠着火","B":"汽油、苯、丙酮等着火","C":"电器设备或带电系统着火","D":"金属钠、钾、镁、铝粉着火"},"a":["B"],"e":"泡沫能覆盖在油面上隔绝空气，适合汽油、苯、丙酮这类液体火灾。电石、过氧化钠遇水反应，带电设备更不能用水基灭火器。"},{"id":661,"c":"化学安全","l":"II","t":0,"q":"以下哪种情况可以用水进行灭火？","o":{"A":"电石、过氧化钠着火","B":"汽油、苯、丙酮等着火","C":"电器设备或带电系统着火","D":"衣物着火"},"a":["D"],"e":"衣物着火用水浇最直接。电石、过氧化钠遇水放可燃气体，油类会漂在水上继续烧，带电设备用水还有触电危险。"},{"id":662,"c":"化学安全","l":"II","t":0,"q":"以下哪个药品（试剂）在使用时不用注意干燥防潮？","o":{"A":"锂","B":"碳化钙","C":"磷化钙","D":"二氧化硅"},"a":["D"],"e":"二氧化硅性质稳定，不怕吸潮。锂、碳化钙、磷化钙遇水会放出氢气、乙炔或磷化氢，必须干燥密封保存。"},{"id":663,"c":"化学安全","l":"II","t":0,"q":"以下几种气体中,最毒的气体为","o":{"A":"氯气","B":"光气（COCL2）","C":"二氧化硫","D":"三氧化硫"},"a":["B"],"e":"光气吸入后水解产生盐酸，直接灼伤肺泡，少量就能引起肺水肿，毒性远高于氯气和二氧化硫。它无色、带烂草味，更要当心。"},{"id":664,"c":"化学安全","l":"II","t":0,"q":"以下几种气体中,有毒的气体为:","o":{"A":"氧气","B":"氮气","C":"氯气","D":"二氧化碳"},"a":["C"],"e":"氧气、氮气、二氧化碳本身不具毒性，二氧化碳过量是窒息而非中毒。氯气是黄绿色刺激性气体，吸入伤呼吸道，属有毒气体。"},{"id":665,"c":"化学安全","l":"II","t":0,"q":"以下几种气体中,无毒的气体为:","o":{"A":"氧气","B":"一氧化碳","C":"硫化氢","D":"氰化氢"},"a":["A"],"e":"一氧化碳、硫化氢、氰化氢都是典型的窒息性或细胞毒物，吸少量就可能致命。氧气是维持生命的气体，不算毒气。"},{"id":666,"c":"化学安全","l":"II","t":0,"q":"以下关于气体钢瓶使用说法正确的是","o":{"A":"使用气体钢瓶时先开减压阀","B":"不可把气瓶内气体用光,以防重新充气时发生危险","C":"停止使用气体时先关减压阀再关总阀门","D":"开启总阀门时,头或身体对着总阀门没有关系"},"a":["B"],"e":"瓶内留余压，外界杂质和空气才进不去，重新充装也安全。开气先开总阀再调减压阀，停气先关总阀，开阀时人站侧面别对着出气口。"},{"id":667,"c":"化学安全","l":"II","t":0,"q":"乙醇属于何种级别的毒性","o":{"A":"高毒","B":"中等毒性","C":"低毒","D":"微毒"},"a":["D"],"e":"乙醇口服毒性低、代谢快，属微毒类。但它易燃易挥发，高浓度蒸气仍刺激眼鼻，别因为标着微毒就大意。"},{"id":668,"c":"化学安全","l":"II","t":0,"q":"一般无机酸、碱液和稀硫酸不慎滴在皮肤上时,正确的处理方法是:","o":{"A":"用酒精棉球擦","B":"不作处理,马上去医院","C":"用水直接冲洗","D":"用碱液中和后,用水冲洗"},"a":["C"],"e":"稀酸稀碱滴到皮肤上，第一时间用大量流水冲走、稀释最有效。酸碱中和会放热，反而加重损伤，用酒精擦也不合适。"},{"id":669,"c":"化学安全","l":"II","t":0,"q":"一般将闪点在25℃以下的化学试剂列入易燃化学试剂,它们多是极易挥发的液体。以下哪种物质不是易燃化学试剂？","o":{"A":"乙醚","B":"苯","C":"甘油","D":"汽油"},"a":["C"],"e":"乙醚、苯、汽油闪点都远低于25℃，极易挥发易燃。甘油闪点高、挥发性低，不属于易燃化学试剂。"},{"id":670,"c":"化学安全","l":"II","t":0,"q":"液化气发生火灾后不可采用（ ）灭火器。","o":{"A":"清水灭火器","B":"干粉灭火器","C":"二氧化碳灭火器","D":"1121灭火器"},"a":["A"],"e":"液化气是气体火灾，水柱浇不灭还赶不散气云，可能把火苗带开。要用干粉、二氧化碳等灭火器，并先关阀断源。"},{"id":671,"c":"化学安全","l":"II","t":0,"q":"要配制一般精度的三氯化铝的水溶液应选用以下哪个药品配制水溶液","o":{"A":"无水三氯化铝","B":"含结晶水的三氯化铝","C":"铝粉"},"a":["B"],"e":"无水三氯化铝遇水剧烈水解、放热甚至溅出，配溶液不安全；含结晶水的已经水解过一部分，溶解温和。铝粉不溶于水。"},{"id":672,"c":"化学安全","l":"II","t":0,"q":"氧气钢瓶瓶身颜色是什么？","o":{"A":"天蓝色","B":"绿色","C":"黄色","D":"白色"},"a":["A"],"e":"氧气瓶瓶身规定为天蓝色、黑字，氢气淡绿、乙炔白、氮气黑。认准颜色是防止接错气瓶的第一眼办法。"},{"id":673,"c":"化学安全","l":"II","t":0,"q":"眼睛被化学品灼伤后,首先采取的正确方法是:","o":{"A":"点眼药膏","B":"立即开大眼睑,用清水冲洗眼睛","C":"马上到医院看急诊"},"a":["B"],"e":"化学伤眼关键在头几分钟：提开眼睑用流动清水冲十几分钟，把残留物稀释冲走，然后再送医。先上眼药膏会把伤处盖住。"},{"id":674,"c":"化学安全","l":"II","t":0,"q":"盐酸、甲醛溶液、乙醚等易挥发试剂应如何合理存放？","o":{"A":"和其它试剂混放","B":"放在冰箱中","C":"分类存放在干燥通风处","D":"放在密闭的柜子中"},"a":["C"],"e":"盐酸、甲醛、乙醚挥发出来的都是有害气体，放冰箱会把气味带进食物和样品，混放还容易相互反应。分类、干燥通风处才合适。"},{"id":675,"c":"化学安全","l":"II","t":0,"q":"严禁在化验室内存放总量大于多少体积的瓶装易燃液体","o":{"A":"10L","B":"30L","C":"20L","D":"25L"},"a":["C"],"e":"实验室不是仓库，瓶装易燃液体总量超过20L，一旦着火燃烧荷载太大，连疏散都难。超量要存到专用危化品库。"},{"id":676,"c":"化学安全","l":"II","t":0,"q":"学校对危险化学废物的处理的工作原则是:","o":{"A":"自行处理","B":"分类收集、定点存放、专人管理、集中处理","C":"当作生活垃圾处理","D":"以上都不对"},"a":["B"],"e":"危险废物既不能自行处理，也不能混进生活垃圾。分类收集、定点存放、专人管理、集中处理，这十六个字就是学校的管理原则。"},{"id":677,"c":"化学安全","l":"II","t":0,"q":"需要你将硫酸、氢氟酸、盐酸和氢氧化钠各一瓶从化学品柜搬到通风橱内,正确的方法是:","o":{"A":"硫酸和盐酸同一次搬运,氢氟酸和氢氧化钠同一次搬运","B":"硫酸和氢氟酸同一次搬运,盐酸和氢氧化钠同一次搬运","C":"硫酸和氢氧化钠同一次搬运,盐酸和氢氟酸同一次搬运","D":"一次只搬运一瓶"},"a":["D"],"e":"硫酸和氢氧化钠、盐酸和氢氟酸都是强腐蚀品，两手各拿一瓶，一旦跌倒或碰撞就是两瓶一起破。一次一瓶、用托盘，稳当得多。"},{"id":678,"c":"化学安全","l":"II","t":0,"q":"箱式电阻炉使用过程中,当温度升至多少度以上后,不得打开炉门进行激烈冷却,以免烧坏炉衬和电热元件。","o":{"A":"200℃","B":"400℃","C":"550℃","D":"800℃"},"a":["A"],"e":"炉温还高时开门，冷空气急冲进去，炉衬和电热元件受急冷急热容易开裂烧坏。200℃以上别开门，让它自然降温。"},{"id":679,"c":"化学安全","l":"II","t":0,"q":"下面所列试剂不用分开保存的是:","o":{"A":"乙醚与高氯酸","B":"苯与过氧化氢","C":"丙酮与硝基化合物","D":"浓硫酸与盐酸"},"a":["D"],"e":"浓硫酸和盐酸都是酸，性质相近，混放不会剧烈反应。乙醚遇高氯酸、苯遇过氧化氢、丙酮遇硝基化合物都可能燃爆，必须分开。"},{"id":680,"c":"化学安全","l":"II","t":0,"q":"下面哪组溶剂不属易燃类液体？","o":{"A":"甲醇、乙醇","B":"四氯化碳、乙酸","C":"乙酸丁酯、石油醚","D":"丙酮、甲苯"},"a":["B"],"e":"四氯化碳本身不燃，乙酸闪点较高、不算易燃液体。甲醇乙醇、石油醚、丙酮甲苯闪点都很低，是典型易燃溶剂。"},{"id":681,"c":"化学安全","l":"II","t":0,"q":"下面哪些物质彼此混合时,不容易引起火灾？","o":{"A":"活性炭与硝酸铵","B":"金属钾、钠和煤油","C":"磷化氢、硅化氢、烷基金属、白磷等物质与空气接触","D":"可燃性物质（木材、织物等）与浓硫酸"},"a":["B"],"e":"钾、钠本来就浸在煤油里保存，煤油隔绝空气，不会反应起火。活性炭加硝酸铵、白磷接触空气、浓硫酸遇可燃物都容易着火。"},{"id":682,"c":"化学安全","l":"II","t":0,"q":"下面对剧毒品的描述中 （ ）是错误的？","o":{"A":"不准露天堆放","B":"必须双人收发","C":"不能用玻璃瓶储存"},"a":["C"],"e":"剧毒品可以用玻璃瓶装，只要密封、外加防震包装并锁在专柜。真正的要求是不准露天堆放、双人收发、双锁管理。"},{"id":683,"c":"化学安全","l":"II","t":0,"q":"下面( )物质属于自燃物品？","o":{"A":"黄磷","B":"盐酸","C":"丙酮"},"a":["A"],"e":"黄磷着火点只有几十度，常温下接触空气就自燃，是典型的自燃物品。盐酸、丙酮都不会自燃。"},{"id":684,"c":"化学安全","l":"II","t":0,"q":"下列物质应避免与水接触以免发生危险的是:","o":{"A":"氯化钠","B":"氯化钙","C":"四氢化铝","D":"硫酸钙"},"a":["C"],"e":"四氢化铝遇水剧烈反应放出氢气并放热，可能自燃，必须干燥密封保存、远离水。氯化钠、氯化钙、硫酸钙遇水都稳定。"},{"id":685,"c":"化学安全","l":"II","t":0,"q":"下列物质无毒的是:","o":{"A":"乙二醇","B":"硫化氢","C":"乙醇","D":"甲醛"},"a":["C"],"e":"乙二醇误服伤肾，硫化氢是剧毒窒息性气体，甲醛致癌且有强刺激。乙醇毒性很低，属微毒类，但仍然易燃。"},{"id":686,"c":"化学安全","l":"II","t":0,"q":"下列物质哪一个是易燃液体（）","o":{"A":"一氧化碳","B":"甲烷","C":"甲醇"},"a":["C"],"e":"一氧化碳、甲烷常温下是气体，不叫液体。甲醇是低闪点、易挥发的液体，蒸气遇火就着。"},{"id":687,"c":"化学安全","l":"II","t":0,"q":"下列物质不属于剧毒物的是:","o":{"A":"碘甲烷、丙腈","B":"氯乙酸、丙烯醛","C":"五氯苯酚、铊","D":"硫酸钡"},"a":["D"],"e":"硫酸钡极难溶解、几乎不被吸收，医学上还用作造影剂，不属于剧毒品。碘甲烷、丙烯醛、五氯苯酚、铊盐都是明确的剧毒物。"},{"id":688,"c":"化学安全","l":"II","t":0,"q":"下列说法错误的是","o":{"A":"丙酮、乙醇都有较强的挥发性和易燃性,二者都不能在任何有明火的地方使用","B":"丙酮会对肝脏和大脑造成损害,因此避免吸入丙酮气体","C":"强酸强碱等不能与身体接触","D":"弱酸弱碱在使用中可以与身体接触"},"a":["D"],"e":"弱酸弱碱一样有刺激性和渗透性，皮肤接触久了照样灼伤、吸收，防护不能省。丙酮易燃伤肝脑、强酸碱不能接触身体，这几条都对。"},{"id":689,"c":"化学安全","l":"II","t":0,"q":"下列试剂哪个不用放在棕色瓶内保藏？","o":{"A":"硫酸亚铁","B":"高锰酸钾","C":"亚硫酸钠","D":"硫酸钠"},"a":["D"],"e":"硫酸亚铁、亚硫酸钠易被氧化，高锰酸钾见光分解，都要用棕色瓶避光。硫酸钠性质稳定，普通瓶存放就行。"},{"id":690,"c":"化学安全","l":"II","t":0,"q":"下列实验室操作及安全的叙述何者是正确的？","o":{"A":"嗅闻气体的气味时,应将鼻子和容器保持 20 公分以上的距离,并且不可用手挥引其气体。","B":"当强碱溶液溅出时,可先用大量的水稀释后再处理。","C":"温度计破碎流出的汞,宜洒上盐酸使反应为氯化汞后再弃之。","D":"实验后所取用剩余的药品应小心倒回原容器,以免浪费。"},"a":["B"],"e":"强碱溅出先用水大量稀释，降低腐蚀性和飞溅风险，再去中和清理。闻气味不能凑近吸、汞撒了不能洒盐酸、余药不能倒回原瓶。"},{"id":691,"c":"化学安全","l":"II","t":0,"q":"下列实验操作中,说法对的是","o":{"A":"可以对容量瓶、量筒等容器加热","B":"在通风橱操作时, 可将头伸入通风柜内观察","C":"非一次性防护手套脱下前必须冲洗干净,而一次性手套时须从后向前把里面翻出来脱下后再扔掉","D":"可以抓住塑料瓶子或玻璃瓶子的盖子搬运瓶子"},"a":["C"],"e":"手套外面沾着药品，脱之前先冲净，才不会弄脏手腕和桌面；一次性手套由后向前翻着脱，手不接触污染面。量筒容量瓶不能加热，头也别伸进通风柜。"},{"id":692,"c":"化学安全","l":"II","t":0,"q":"下列气体须在通风橱内进行操作的是:","o":{"A":"硫化氢","B":"氟化氢","C":"氯化氢","D":"以上都是"},"a":["D"],"e":"硫化氢剧毒、有臭鸡蛋味，氟化氢腐蚀性强还伤骨，氯化氢遇水成酸雾。三种都是剧毒或强刺激性气体，都必须在通风橱里操作。"},{"id":693,"c":"化学安全","l":"II","t":0,"q":"下列那一项不是发生爆炸的基本因素？","o":{"A":"温度","B":"压力","C":"湿度","D":"着火源"},"a":["C"],"e":"爆炸要有可燃物、助燃物或氧化剂和点火源，温度、压力影响反应速度。湿度不是必要条件，最多间接起作用。"},{"id":694,"c":"化学安全","l":"II","t":0,"q":"下列哪种物质与乙醇混溶时易发生爆炸？","o":{"A":"盐酸","B":"乙醚","C":"高氯酸","D":"丙酮"},"a":["C"],"e":"高氯酸是强氧化剂，与乙醇这种还原性有机物混合会剧烈氧化，量稍大就会爆燃。乙醚、丙酮与乙醇互溶，但不发生这种反应。"},{"id":695,"c":"化学安全","l":"II","t":0,"q":"下列加热热源,化学实验室原则不得使用的是","o":{"A":"明火电炉","B":"水浴、蒸汽浴","C":"油浴、沙浴、盐浴","D":"电热板、电热套"},"a":["A"],"e":"明火电炉有裸露电热丝，遇到可燃蒸气就是现成的点火源，实验室原则上禁用。水浴、油浴、沙浴和电热套、电热板都是可控的间接加热。"},{"id":696,"c":"化学安全","l":"II","t":0,"q":"下列几种物质中的哪一种物质与乙醇混溶时易发生爆炸？","o":{"A":"高氯酸","B":"乙醚","C":"水","D":"丙酮"},"a":["A"],"e":"高氯酸遇乙醇会剧烈氧化放热，量稍大就可能爆燃。乙醚、丙酮、水与乙醇混合都不会发生这种反应。"},{"id":697,"c":"化学安全","l":"II","t":0,"q":"下列几种物质中的（）与乙醇混溶时易发生爆炸。","o":{"A":"高氯酸","B":"乙醚","C":"水","D":"丙酮"},"a":["A"],"e":"高氯酸加乙醇是典型的氧化剂加还原性有机物，极易发生爆炸性反应，两者必须分开存放、分开使用。"},{"id":698,"c":"化学安全","l":"II","t":0,"q":"下列何种物质贮存于空气中易发生爆炸？","o":{"A":"苯乙烯","B":"对二甲苯","C":"苯","D":"甲苯"},"a":["A"],"e":"苯乙烯容易自聚，受热或见光聚合并放热，密闭容器里可能胀裂爆炸，需加阻聚剂低温保存。苯、甲苯、二甲苯相对稳定。"},{"id":699,"c":"化学安全","l":"II","t":0,"q":"下列何者是会发生爆炸的物质？","o":{"A":"氧化锌","B":"三硝基甲苯","C":"四氯化碳","D":"氧化铁"},"a":["B"],"e":"三硝基甲苯就是TNT，本身是炸药，受冲击、摩擦或高温会爆轰。氧化锌、氧化铁、四氯化碳都不会发生爆炸。"},{"id":700,"c":"化学安全","l":"II","t":0,"q":"下列关于混合物的描述错误的是:","o":{"A":"三氧化铬的硫酸溶液与有机物混合,可能爆炸","B":"硝酸氨与活性炭混合可能燃烧","C":"高氯酸与金属盐混合可能爆炸","D":"高氯酸与盐酸混合可能爆炸"},"a":["D"],"e":"高氯酸和盐酸都是强酸，混合不会产生爆炸性反应；它真正危险的是接触有机物、金属盐或还原剂。前三项描述的混合危险都成立。"},{"id":701,"c":"化学安全","l":"II","t":0,"q":"下列陈述正确的是:","o":{"A":"不能对瓶子量筒等容器加热,而圆底烧瓶和锥形瓶都可以加热","B":"在通风橱操作时, 女士必须将长头发整理好","C":"非一次性防护手套脱下前必须冲洗干净,而一次性手套时须从后向前","D":"可以抓住塑料瓶子的塞子搬运瓶子,而不能抓住玻璃瓶子的塞子搬运"},"a":["C"],"e":"手套脱下前冲净、一次性手套由后向前翻脱，避免手碰到污染面，这是标准做法。量筒等量器不耐热，通风柜里也别把头伸进去探看。"},{"id":702,"c":"化学安全","l":"II","t":0,"q":"下列不属于易燃液体的是:","o":{"A":"5%稀硫酸","B":"乙醇","C":"苯","D":"二硫化碳"},"a":["A"],"e":"5%稀硫酸是不燃的水溶液。乙醇、苯、二硫化碳闪点都很低，二硫化碳尤其容易着火。"},{"id":703,"c":"化学安全","l":"II","t":0,"q":"下列不属于危险化学品的是","o":{"A":"汽油、易燃液体","B":"放射性物品;","C":"氧化剂、有机过氧化物、剧毒药品和感染性物品","D":"氯化钾"},"a":["D"],"e":"氯化钾是普通盐类，不属危险化学品。汽油等易燃液体、放射性物品、氧化剂和剧毒药品都在危险化学品目录之内。"},{"id":704,"c":"化学安全","l":"II","t":0,"q":"下列不属于剧毒化学品的是（）","o":{"A":"氰化钾","B":"氯化汞","C":"铊","D":"甲醛"},"a":["D"],"e":"甲醛有毒、致癌、刺激性强，但按分级不列入剧毒化学品。氰化钾、氯化汞、铊盐才是典型剧毒品，管理要求更严。"},{"id":705,"c":"化学安全","l":"II","t":0,"q":"下列不可以放入 105℃干燥箱干燥的是","o":{"A":"烧杯","B":"锥形瓶","C":"量筒","D":"培养皿"},"a":["C"],"e":"量筒是计量器具，受热会变形、刻度失准，不能进105℃干燥箱。烧杯、锥形瓶、培养皿都是耐热玻璃，可以烘干。"},{"id":706,"c":"化学安全","l":"II","t":0,"q":"下列( )有毒气体具有臭鸡蛋气味。","o":{"A":"二氧化硫","B":"硫化氢","C":"二氧化氮"},"a":["B"],"e":"硫化氢有典型臭鸡蛋味，但它会麻痹嗅觉，闻到臭味变淡反而更危险。二氧化硫是刺激性酸味，二氧化氮带刺激性腥味。"},{"id":707,"c":"化学安全","l":"II","t":0,"q":"吸湿性强、遇水释放较多热量的化学品沾染皮肤后应立刻:","o":{"A":"用清水清洗","B":"用冷水清洗","C":"用软纸、软布抹去"},"a":["C"],"e":"这类东西一沾水就放出大量热，直接冲水会把灼伤加重。先用软纸、软布轻轻扫掉，再用大量水冲，顺序不能颠倒。"},{"id":708,"c":"化学安全","l":"II","t":0,"q":"为了防止在开启或关闭玻璃容器时发生危险,下列哪一种瓶塞不适宜作为盛放具有爆炸危险性物质的玻璃容器的瓶塞？","o":{"A":"软木塞","B":"磨口玻璃塞","C":"胶皮塞","D":"橡胶塞"},"a":["B"],"e":"磨口玻璃塞容易和瓶口黏死，装爆炸性物质时打不开，硬撬就可能出事。软木塞、橡胶塞、胶皮塞相对好开。"},{"id":709,"c":"化学安全","l":"II","t":0,"q":"为了安全,须贮存于煤油中的金属是:","o":{"A":"钠","B":"铝","C":"铁","D":"钙"},"a":["A"],"e":"钠遇空气氧化、遇水剧烈反应，浸在煤油里隔绝空气和水才安全。铝、铁表面有致密氧化膜，性质比钠稳定得多。"},{"id":710,"c":"化学安全","l":"II","t":0,"q":"为防止静电火花引起事故,凡是用来加工、贮存、运输各种易燃气、液、粉体的设备金属管、非导电材料管都必须:","o":{"A":"有足够大的电阻","B":"有足够小的电阻","C":"可靠接地"},"a":["C"],"e":"静电要靠接地导走，管道设备不接地，电荷越积越多，放电火花就能点燃可燃气体或粉尘。电阻大小不是关键，接地可靠才是。"},{"id":711,"c":"化学安全","l":"II","t":0,"q":"危险化学品的急性毒性表述中,半致死量LD50代表什么意义？","o":{"A":"致死量","B":"导致一半受试动物死亡的量","C":"导致一半受试动物死亡的浓度","D":"导致全部受试动物死亡的浓度"},"a":["B"],"e":"LD50是半数致死量，指受试动物一半死亡时的剂量，数值越小毒性越大。它是“量”不是浓度，浓度对应的是LC50。"},{"id":712,"c":"化学安全","l":"II","t":0,"q":"危险化学品的毒害包括:","o":{"A":"皮肤腐蚀性/刺激性,眼损伤/眼刺激","B":"急性中毒致死,器官或呼吸系统损伤,生殖细胞突变性,致癌性","C":"水环境危害性, 放射性危害","D":"以上都是"},"a":["D"],"e":"危险化学品的毒害不只是急性中毒，还包括腐蚀刺激、眼损伤、器官损伤、致突变、致癌和环境危害，范围很宽。"},{"id":713,"c":"化学安全","l":"II","t":0,"q":"危险化学品单位应当制定本单位事故（ ）,配备应急救援人员和必要的应急救援器材、设备,并定期组织演练。","o":{"A":"抢险预案","B":"救治预案","C":"控制预案","D":"应急救援预案"},"a":["D"],"e":"危化品单位要编制事故应急救援预案，配人员器材并定期演练，出事才知道谁指挥、怎么撤、怎么救。"},{"id":714,"c":"化学安全","l":"II","t":0,"q":"危险化学品单位发生危险化学品事故造成人员伤亡、财产损失的,应当依法承担（ ）责任。","o":{"A":"保护","B":"事故","C":"肇事","D":"赔偿"},"a":["D"],"e":"造成人员伤亡和财产损失，单位要依法赔偿，这是最直接的法律后果；同时还可能被追究行政乃至刑事责任。"},{"id":715,"c":"化学安全","l":"II","t":0,"q":"危险化学品单位从事生产、经营、储存、运输、使用危险化学品或者处置废弃危险 活动的人员,必须接受有关法律、法规、规章和安全知识、专业技术、职业卫生防护 救援知识的培训,并经（ ）,方可上岗作业。","o":{"A":"培训","B":"教育","C":"考核合格","D":"评议"},"a":["C"],"e":"培训之后必须经考核合格才能上岗，光听过课不算。危化品岗位涉及法规、专业技术和应急防护，考核是底线。"},{"id":716,"c":"化学安全","l":"II","t":0,"q":"危险化学品包括哪些物质？","o":{"A":"爆炸品、易燃气体、易燃喷雾剂, 氧化性气体,加压气体","B":"易燃液体,易燃固体,自反应物质,可自燃液体,自燃自热物质,遇水放出易燃气体的物质","C":"氧化性液体,氧化性固体,有机过氧化物,腐蚀性物质","D":"以上都是"},"a":["D"],"e":"从爆炸品、气体、易燃液体固体、自反应和自燃物质，到氧化剂、有机过氧化物、腐蚀品，都属危险化学品，分类很全。"},{"id":717,"c":"化学安全","l":"II","t":0,"q":"危险化学品（不含压缩气体和液化气体）原则上不应超过（）公升/千克,其中易燃易爆性化学品的存放总量不应超过（）公升/千克,且单一包装容器不应大于（）公升/千克（按50平方米为标准,存放量以实验室面积比考量）","o":{"A":"100 100 50","B":"100 50 50","C":"100 50 20","D":"100 100 20"},"a":["C"],"e":"按50平方米实验室计，危化品总量不超过100公斤或升，其中易燃易爆类不超过50，单个包装不超过20，超了就得进专用库。"},{"id":718,"c":"化学安全","l":"II","t":0,"q":"往玻璃管上套橡皮管（塞）时,不正确的做法是","o":{"A":"管端应烧圆滑","B":"用布裹手或带厚手套,以防割伤手","C":"可以使用薄壁玻管","D":"加点水或润滑剂"},"a":["C"],"e":"薄壁玻璃管套橡皮塞时容易压碎，断口还会割手。要用厚壁管并把管口烧圆滑，戴厚手套、加点水或润滑剂再套。"},{"id":719,"c":"化学安全","l":"II","t":0,"q":"天气较热时,打开腐蚀性液体,应该;","o":{"A":"直接用手","B":"用毛巾包住塞子","C":"戴橡胶手套"},"a":["B"],"e":"天热瓶内压力高，塞子容易突然弹出、液体喷溅伤人，用毛巾包住塞子再慢慢开，别徒手硬拧。"},{"id":720,"c":"化学安全","l":"II","t":0,"q":"塑料、有机玻璃制品的加热温度不能超过（ ）。","o":{"A":"40℃","B":"60℃","C":"80℃"},"a":["B"],"e":"塑料和有机玻璃耐热差，超过60℃会软化变形，有机玻璃还会释放气味。加热这类器皿要用水浴等温和方式并控温。"},{"id":721,"c":"化学安全","l":"II","t":0,"q":"室温较高时,有些试剂如氨水等,打开瓶塞的瞬间很易冲出气液流,应先如何处理,再打开瓶塞？","o":{"A":"先将试剂瓶在热水中浸泡一段时间","B":"振荡一段时间","C":"先将试剂瓶在冷水中浸泡一段时间","D":"先将试剂瓶颠倒一下"},"a":["C"],"e":"室温高时瓶内氨气压力大，先在冷水中降温可让气体收缩、压力下降，再开塞就不会冲出气液流；用热水浸泡反而使内压更高。"},{"id":722,"c":"化学安全","l":"II","t":0,"q":"试剂或异物溅入眼内,处理措施正确的是","o":{"A":"溴:大量水洗,再用1％NAHCO3溶液洗","B":"酸:大量水洗,用1～2％NAHCO3溶液洗","C":"碱:大量水洗,再以1％硼酸溶液洗","D":"以上都对"},"a":["D"],"e":"溴、酸、碱溅入眼内都是先用大量水冲洗，再分别用碳酸氢钠或硼酸溶液中和，三项都对，所以选以上都对。"},{"id":723,"c":"化学安全","l":"II","t":0,"q":"使用易燃易爆的化学药品,不正确的操作是","o":{"A":"可以用明火加热","B":"在通风橱中进行操作","C":"不可猛烈撞击","D":"加热时使用水浴或油浴"},"a":["A"],"e":"易燃易爆药品遇明火就可能燃烧爆炸，只能用水浴、油浴等间接加热，所以“可以用明火加热”是不正确操作。"},{"id":724,"c":"化学安全","l":"II","t":0,"q":"使用离心机时下列哪种操作是错误的？","o":{"A":"离心机必须盖紧盖子","B":"不需要考虑离心管的对角平衡","C":"液体不能超过离心管2/3","D":"每次使用后要清洁离心机腔"},"a":["B"],"e":"离心管必须对角等量配平后才能离心，否则转子剧烈振动甚至飞出伤人，说不需要对角平衡是错误的。"},{"id":725,"c":"化学安全","l":"II","t":0,"q":"使用剧毒化学品必须有两人操作,并在剧毒化学品实验使用登记表上记录？","o":{"A":"用途、使用量、剩余量","B":"成分、种类","C":"特性、组成"},"a":["A"],"e":"剧毒品登记的关键是流向可追溯，记录用途、使用量和剩余量，才能核对账物是否相符、有无流失。"},{"id":726,"c":"化学安全","l":"II","t":0,"q":"使用酒精灯时,灯内燃料是否可以加满？","o":{"A":"是","B":"否"},"a":["B"],"e":"酒精灯装太满时受热溢出，酒精流到桌面遇火会大面积燃烧，一般装到三分之二以下即可，不能加满。"},{"id":727,"c":"化学安全","l":"II","t":0,"q":"实验中用到很多玻璃器皿,容易破碎,为避免造成割伤应该注意什么？","o":{"A":"装配时不可用力过猛,用力处不可远离连接部位","B":"不能口径不合而勉强连接;","C":"玻璃折断面需烧圆滑,不能有棱角","D":"以上都是"},"a":["D"],"e":"装配不用力过猛、口径不合不勉强连接、折断处烧圆滑，这三条都是防止玻璃破碎割伤的有效做法。"},{"id":728,"c":"化学安全","l":"II","t":0,"q":"实验中吸入H2S或CO气体而感不适时,应如何处理？","o":{"A":"进行人工呼吸","B":"立即到室外呼吸新鲜空气","C":"坚持把实验做完","D":"摄取一些蛋白质类的食物和饮料"},"a":["B"],"e":"吸入硫化氢或一氧化碳中毒，首要的是脱离毒源、到室外呼吸新鲜空气，人工呼吸只在呼吸停止时才做。"},{"id":729,"c":"化学安全","l":"II","t":0,"q":"实验中吸入Cl2或HCl气体时,应如何处理？","o":{"A":"人工呼吸","B":"立即到室外呼吸新鲜空气","C":"吸入少量酒精和乙醚的混合蒸气使之解毒","D":"不用管,过一会就好了"},"a":["B"],"e":"氯气、氯化氢刺激呼吸道，处理原则同样是立即离开现场到室外呼吸新鲜空气，靠饮酒或硬撑都不行。"},{"id":730,"c":"化学安全","l":"II","t":0,"q":"实验中溅入口中已下咽的强酸,先饮用大量水,再服用:","o":{"A":"氢氧化铝溶液,鸡蛋白","B":"乙酸果汁,鸡蛋白","C":"硫酸铜溶液（30g溶于一杯水中）催吐"},"a":["A"],"e":"强酸下咽后用弱碱氢氧化铝中和，再用鸡蛋白覆盖保护胃黏膜；果汁本身是酸，硫酸铜催吐会造成二次伤害。"},{"id":731,"c":"化学安全","l":"II","t":0,"q":"实验中溅入口中已下咽的强碱,先饮用大量水,再服用:","o":{"A":"氢氧化铝溶液,鸡蛋白","B":"乙酸果汁,鸡蛋白","C":"硫酸铜溶液（30g溶于一杯水中）催吐"},"a":["B"],"e":"强碱下咽要用弱酸性的食醋或果汁中和，鸡蛋白可保护胃黏膜；氢氧化铝是碱性，会加重对胃的损伤。"},{"id":732,"c":"化学安全","l":"II","t":0,"q":"实验完成后,废弃物及废液应如何处置？","o":{"A":"倒入水槽中","B":"分类收集后,送中转站暂存,然后交有资质的单位处理","C":"倒入垃圾桶中","D":"任意弃置"},"a":["B"],"e":"废液废物要分类收集、贴好标签送中转站暂存，再交有资质单位处置，倒水槽或丢垃圾桶都会污染环境。"},{"id":733,"c":"化学安全","l":"II","t":0,"q":"实验室水泵关闭前,阀门应该:","o":{"A":"全开","B":"全关","C":"半开","D":"无所谓"},"a":["B"],"e":"停水泵前先把阀门全关，可避免管道里的水倒吸回实验装置，造成污染或反应倒灌。"},{"id":734,"c":"化学安全","l":"II","t":0,"q":"实验室内的浓酸、浓碱处理,一般可:","o":{"A":"先中和后倾倒,并用大量的水冲洗管道","B":"不经处理,沿下水道流走","C":"不需中和,直接向下水道倾倒"},"a":["A"],"e":"少量浓酸浓碱要先中和、大量水稀释后再排放，并用大量水冲洗管道；直接倾倒会腐蚀下水管道。"},{"id":735,"c":"化学安全","l":"II","t":0,"q":"实验室内的汞蒸气会造成人员慢性中毒,为了减少汞液面的蒸发,可在汞液面上覆盖什么液体,效果最好？","o":{"A":"水液体","B":"甘油","C":"5%NA2SO4"},"a":["B"],"e":"甘油能在汞液面形成致密覆盖层，抑制蒸发效果最好；水容易被汞顶开，封不住汞蒸气。"},{"id":736,"c":"化学安全","l":"II","t":0,"q":"实验室的正确着装是","o":{"A":"拖鞋","B":"短裤","C":"女生着短裙,高跟鞋","D":"着实验服,长发以及宽松衣服需固定"},"a":["D"],"e":"进实验室要穿实验服，长发和宽松衣物必须束紧固定，避免被卷入设备或沾到火焰、试剂。"},{"id":737,"c":"化学安全","l":"II","t":0,"q":"实验室的废弃化学试剂和实验产生的有毒有害废液、废物,可以:","o":{"A":"集中分类存放,贴好标签,待送中转站集中处理","B":"向下水口倾倒","C":"随垃圾丢弃"},"a":["A"],"e":"有毒有害废物要集中分类存放、贴好标签，再送中转站统一处理，绝不能倒下水口或随垃圾丢弃。"},{"id":738,"c":"化学安全","l":"II","t":0,"q":"实验室存放化学品不得使用哪类冰箱？","o":{"A":"机械温控冰箱","B":"电子温控冰箱","C":"防爆冰箱"},"a":["A"],"e":"机械温控冰箱靠触点通断控温，内部会产生电火花，存放易燃化学品容易引燃爆炸，应使用防爆冰箱。"},{"id":739,"c":"化学安全","l":"II","t":0,"q":"实验室常用溶剂应如何存放","o":{"A":"按药品类别存放","B":"随意摆放","C":"按生产日期存放"},"a":["A"],"e":"溶剂按药品类别分开存放，可避免氧化剂与还原剂、酸碱等混放发生反应，随意摆放或按日期摆放都不安全。"},{"id":740,"c":"化学安全","l":"II","t":0,"q":"实验室冰箱和超低温冰箱使用注意事项错误的是","o":{"A":"定期除霜、清理,清理后要对内表面进行消毒","B":"储存的所有容器,应当标明物品名称、储存日期和储存者姓名","C":"除非有防爆措施,否则冰箱内不能放置易燃易爆化学品溶液,冰箱门上应注明这一点","D":"可以在冰箱内冷冻食品和水"},"a":["D"],"e":"实验室冰箱只能存放试剂样品，严禁冷冻食品和饮用水，否则化学品可能污染食物造成误食中毒。"},{"id":741,"c":"化学安全","l":"II","t":0,"q":"实验室保险丝能不能用铜丝代替？","o":{"A":"能","B":"不能","C":"不一定"},"a":["B"],"e":"铜丝熔点高，电流过大时不会像保险丝那样及时熔断，线路持续过热就可能引发火灾，所以不能代替。"},{"id":742,"c":"化学安全","l":"II","t":0,"q":"实验时废弃的少量金属钠该如何处理？","o":{"A":"直接丢弃","B":"先用乙醇处理,再用大量水冲洗","C":"用水冲洗"},"a":["B"],"e":"钠遇水剧烈反应放出氢气会燃烧爆炸，应先用乙醇缓慢消耗，再用大量水冲洗残渣，不能直接丢进水里。"},{"id":743,"c":"化学安全","l":"II","t":0,"q":"实验人员都要注意防止被实验设备产生的X射线照射,下列能够产生X射线的仪器是","o":{"A":"X射线衍射仪","B":"721分光光度计","C":"液相色谱","D":"气相色谱"},"a":["A"],"e":"四者中只有X射线衍射仪靠X射线工作，分光光度计和色谱仪不产生电离辐射，防护对象就是它。"},{"id":744,"c":"化学安全","l":"II","t":0,"q":"实验开始前应该做好哪些准备？（ ）","o":{"A":"须认真预习,理清实验思路","B":"应仔细检查仪器是否有破损,掌握正确使用仪器的要点,弄清水、电、气的管线开关和标记,保持清醒头脑,避免违规操作","C":"了解实验中使用的药品的性能和有可能引起的危害及相应的注意事项","D":"以上都是"},"a":["D"],"e":"认真预习、检查仪器和水电气、了解药品危害，都是实验前必须做的准备，三项齐全才安全，故选以上都是。"},{"id":745,"c":"化学安全","l":"II","t":0,"q":"实验过程中发生烧烫(灼)伤,错误的处理方法是","o":{"A":"浅表的小面积灼伤,以冷水冲洗15至30分钟至散热止痛","B":"以生理食盐水擦拭（勿以药膏、牙膏、酱油涂抹或以纱布盖住）","C":"若有水泡可自行刺破","D":"大面积的灼伤,应紧急送至医院"},"a":["C"],"e":"水泡自行刺破容易感染并留疤，应保留水泡保护创面；冷水冲洗、生理盐水擦拭和大面积送医都是对的。"},{"id":746,"c":"化学安全","l":"II","t":0,"q":"生石灰烧伤应如何处理","o":{"A":"立即用大量水冲洗","B":"立即用 1%~2%的醋酸冲洗","C":"先用卫生纸或干布尽量清除皮肤上的生石灰,再用大量水清洗 立即去医院处"},"a":["C"],"e":"生石灰遇水放出大量热，先用水冲会加重烧伤，必须先用干布或纸巾清除粉末，再用大量水冲洗并就医。"},{"id":747,"c":"化学安全","l":"II","t":0,"q":"生产、储存、使用除剧毒化学品以外危险化学品的单位,应当对本单位的生产、储存装置每（ ）年进行一次安全评价。","o":{"A":"一","B":"二","C":"三","D":"五"},"a":["B"],"e":"按规定，生产、储存、使用剧毒品以外危险化学品的单位，应当对本单位装置每两年进行一次安全评价。"},{"id":748,"c":"化学安全","l":"II","t":0,"q":"涉及有毒试剂的操作时,应采取的保护措施包括:","o":{"A":"佩戴适当的个人防护器具","B":"了解试剂毒性,在通风橱中操作","C":"做好应急救援预案","D":"以上都是"},"a":["D"],"e":"接触有毒试剂要同时做好三件事：戴好防护器具、了解毒性并在通风橱操作、备好应急预案，缺一不可。"},{"id":749,"c":"化学安全","l":"II","t":0,"q":"闪点越低,越容易燃烧。闪点在-4℃以上的溶剂是:","o":{"A":"甲醇、乙醇、乙腈","B":"乙酸乙酯、乙酸甲酯","C":"乙醚、石油醚","D":"汽油、丙酮、苯"},"a":["A"],"e":"甲醇、乙醇、乙腈闪点分别约为十一、十三、二摄氏度，都高于零下四度；乙醚、石油醚、丙酮等则更低更危险。"},{"id":750,"c":"化学安全","l":"II","t":0,"q":"若某种废液倒入回收桶会发生危险,则应:","o":{"A":"直接向下水口倾倒","B":"随垃圾一起丢弃","C":"单独暂存于容器中,并贴上标签"},"a":["C"],"e":"会与其他废液反应出危险的废液不能倒进回收桶，要单独装容器、贴好标签，等专门处理。"},{"id":751,"c":"化学安全","l":"II","t":0,"q":"如何在实验室放置盛汞的容器？","o":{"A":"密封即可","B":"在汞面上加盖一层硫粉","C":"在汞面上加盖一层水封","D":"放入通风橱中"},"a":["C"],"e":"在汞面上加一层水封，把汞与空气隔开，能明显减少汞蒸气挥发，是存放汞容器的常规做法。"},{"id":752,"c":"化学安全","l":"II","t":0,"q":"如果在试验过程中,闻到烧焦的气味应如何办？","o":{"A":"关机走人","B":"打开通风装置通风","C":"立即关机并报告相关负责人员","D":"请同实验的人帮忙检查"},"a":["C"],"e":"闻到烧焦味多是电器或线路过热，应立即关机断电并报告负责人，继续运行可能引发电气火灾。"},{"id":753,"c":"化学安全","l":"II","t":0,"q":"如果有化学品进入眼睛,应立即","o":{"A":"滴氯霉素眼药水","B":"用大量清水冲洗眼睛","C":"用干净手帕擦拭"},"a":["B"],"e":"化学品入眼要争分夺秒用大量清水持续冲洗，滴眼药水或用手帕擦都不能把化学品冲出来，反而延误。"},{"id":754,"c":"化学安全","l":"II","t":0,"q":"如果打碎温度计或汞掉落在桌面上或者地面上,应该怎么处理？","o":{"A":"当垃圾扫掉","B":"直接撒上硫磺","C":"先用吸汞管尽可能将汞珠收集起来;然后用硫磺盖在汞溅落的地方,并使之生成HgS"},"a":["C"],"e":"汞洒落后先用吸汞管把汞珠尽量收集回收，残迹再用硫磺覆盖生成硫化汞，防止继续蒸发中毒。"},{"id":755,"c":"化学安全","l":"II","t":0,"q":"容器中的溶剂或易燃化学品发生燃烧应如何处理？","o":{"A":"用灭火器灭火或加砂子灭火","B":"加水灭火","C":"用不易燃的瓷砖、玻璃片盖住瓶口","D":"用湿抹布盖住瓶口"},"a":["A"],"e":"溶剂着火要用灭火器或砂子覆盖隔绝空气；直接浇水会让浮在水面的溶剂随水流淌，火势反而扩大。"},{"id":756,"c":"化学安全","l":"II","t":0,"q":"取用化学药品时,以下哪些事项操作是对的？","o":{"A":"取用腐蚀和刺激性药品时,尽可能带上橡皮手套和防护眼镜。","B":"倾倒时,切勿直对容器口俯视;吸取时,应该使用橡皮球。","C":"开启有毒气体容器时应带防毒用具。","D":"以上都是"},"a":["D"],"e":"戴橡皮手套和护目镜、倾倒时不正对容器口俯视、开有毒气体容器戴防毒用具，都是正确的取用规范。"},{"id":757,"c":"化学安全","l":"II","t":0,"q":"清洁分光光度计比色皿的透光面可以用 （ ） 擦拭;","o":{"A":"纱布","B":"毛刷","C":"镜头纸","D":"滤纸"},"a":["C"],"e":"比色皿透光面只能用镜头纸轻擦，纱布、毛刷、滤纸都会留下划痕或纤维，影响透光和读数。"},{"id":758,"c":"化学安全","l":"II","t":0,"q":"倾倒液体试剂时,瓶上标签应朝哪一个方向？","o":{"A":"上方","B":"下方","C":"左方","D":"右方"},"a":["A"],"e":"倾倒时标签朝上，液体不会顺瓶壁流下腐蚀标签，也便于自己核对药名，防止拿错试剂。"},{"id":759,"c":"化学安全","l":"II","t":0,"q":"氢气钢瓶瓶身颜色是什么？","o":{"A":"灰色","B":"天蓝色","C":"绿色","D":"白色"},"a":["C"],"e":"按气瓶颜色规定，氢气瓶为淡绿色，天蓝色是氧气瓶，灰色是氮气瓶，白色多用于乙炔等。"},{"id":760,"c":"化学安全","l":"II","t":0,"q":"氢氟酸有强烈的腐蚀性和危害性,皮肤接触氢氟酸后可出现疼痛及灼伤,随时间疼痛渐剧,皮肤下组织被破坏,这种破坏会传播到骨骼。下面哪个说法是错误的？","o":{"A":"稀的氢氟酸危害性很低,不会产生严重烧伤","B":"氢氟酸蒸气溶于眼球内的液体中会对人的视力造成永久损害","C":"使用氢氟酸一定要戴防护手套,注意不要接触氢氟酸蒸汽","D":"工作结束后要注意用水冲洗手套、器皿等,不能有任何残余留下"},"a":["A"],"e":"稀氢氟酸同样能渗入皮肤深层腐蚀骨骼，疼痛延迟出现，危害并不低，所以“稀的不会严重烧伤”是错的。"},{"id":761,"c":"化学安全","l":"II","t":0,"q":"强氧化剂与有机物、镁粉、铝粉、锌粉可形成爆炸性混合物,以下哪种物质是安全的？","o":{"A":"H2O2","B":"NH4NO3","C":"K2SO4","D":"高氯酸及其盐"},"a":["C"],"e":"硫酸钾是稳定的盐，既不燃也不具强氧化性；双氧水、硝酸铵、高氯酸盐遇有机物都可能燃烧爆炸。"},{"id":762,"c":"化学安全","l":"II","t":0,"q":"强酸灼伤皮肤不能用( )冲洗。","o":{"A":"热水","B":"冷水","C":"弱碱溶液"},"a":["A"],"e":"强酸灼伤要先用大量冷水冲洗降温稀释，热水会扩张血管、加快吸收，使损伤和疼痛加重。"},{"id":763,"c":"化学安全","l":"II","t":0,"q":"强碱烧伤处理错误的是","o":{"A":"立即用稀盐酸冲洗","B":"立即用1%～2%的醋酸冲洗","C":"立即用大量水冲洗","D":"先进行应急处理,再去医院处理"},"a":["A"],"e":"强碱灼伤应用百分之一到二的醋酸等弱酸中和，稀盐酸仍是强酸，会造成第二次化学灼伤。"},{"id":764,"c":"化学安全","l":"II","t":0,"q":"气体钢瓶的使用步骤是","o":{"A":"先开总阀门,再开减压阀","B":"先开减压阀,再开总阀","C":"个阀门同时开"},"a":["A"],"e":"用气瓶应先开总阀门让气体进入减压阀，再调减压阀输出压力；顺序颠倒会冲坏减压阀甚至伤人。"},{"id":765,"c":"化学安全","l":"II","t":0,"q":"普通玻璃制品的加热温度不能超过","o":{"A":"180℃","B":"250℃","C":"140℃"},"a":["A"],"e":"普通玻璃耐热性有限，超过约一百八十摄氏度就容易软化变形、炸裂，需高温时应改用硬质玻璃。"},{"id":766,"c":"化学安全","l":"II","t":0,"q":"扑救燃油类易燃液体火灾时,应（ ）。","o":{"A":"使用干粉灭火器","B":"用水泼","C":"扑打"},"a":["A"],"e":"燃油等易燃液体火灾用水泼，油会浮在水面随水流动，火势蔓延；用干粉覆盖窒息灭火才有效。"},{"id":767,"c":"化学安全","l":"II","t":0,"q":"皮肤若被低温（如固体二氧化碳、液氮）冻伤,应:","o":{"A":"马上送医院","B":"用温水慢慢恢复体温","C":"用火烘烤","D":"应尽快浸入热水"},"a":["B"],"e":"冻伤要用温水缓慢复温，让组织逐渐恢复；用火烤或直接浸热水会使受损皮肤进一步坏死。"},{"id":768,"c":"化学安全","l":"II","t":0,"q":"皮肤接触了高温（热的物体、火焰、蒸气） 、低温（固体二氧化碳、液体氮）和腐蚀性物质,如强酸、强碱、溴等都会造成灼伤。如果发生意外正确的处理方法是","o":{"A":"不管什么情况,马上送医院就医","B":"被碱灼伤时先用水冲洗,然后用3%的硼酸或 2%的醋酸清洗,严重时就医","C":"金属钠溅入眼内,立即用大量水冲洗","D":"浓硫酸沾到皮肤上,直接用水冲洗"},"a":["B"],"e":"碱灼伤先大量水冲，再用硼酸或醋酸中和，严重时就医，这条正确；金属钠入眼遇水会燃烧，不能直接冲水。"},{"id":769,"c":"化学安全","l":"II","t":0,"q":"配制液体时,下列陈述正确的是","o":{"A":"稀释强酸时,必须将酸倒入水中,禁止将水倒入酸中;稀释弱酸时将水倒入酸中也可以","B":"将盛有自配液体的容器做好标记,必须包括成分、浓度、姓名、联系方式、日期等","C":"使用移液管和量筒分别计量,进行配置溶液"},"a":["B"],"e":"自配试剂标签必须写清成分、浓度、姓名、联系方式和日期，别人才能识别；稀释强酸无论强弱都要酸倒入水。"},{"id":770,"c":"化学安全","l":"II","t":0,"q":"配制稀硫酸时, 应如何操作","o":{"A":"将水慢慢分批倒入酸中,并不时搅拌","B":"将浓硫酸慢慢分批加入水中,并不时搅拌","C":"将水和浓硫酸同时倒入容器中,并不时搅拌","D":"将浓硫酸快速加入水中,并迅速搅拌"},"a":["B"],"e":"稀释浓硫酸要把酸慢慢分批加入水中并不断搅拌，让热量及时散出；把水倒进酸会局部沸腾飞溅伤人。"},{"id":771,"c":"化学安全","l":"II","t":0,"q":"能相互反应产生有毒气体的废液,应:","o":{"A":"随垃圾丢弃","B":"向下水口倾倒","C":"不得倒入同一收集桶中"},"a":["C"],"e":"两种废液混合会反应放出有毒气体，混装在同一收集桶里可能中毒甚至爆炸，必须分开收集。"},{"id":772,"c":"化学安全","l":"II","t":0,"q":"钠,钾等碱金属须贮存于:","o":{"A":"水中","B":"酒精中","C":"煤油中","D":"暴露在空气中"},"a":["C"],"e":"钠、钾遇水和空气就剧烈反应燃烧，必须浸没在煤油中，用煤油隔绝水和氧气才能安全贮存。"},{"id":773,"c":"化学安全","l":"II","t":0,"q":"氯气急性中毒可引起严重并发症,如气胸、纵隔气肿等,不会引起什么症状？","o":{"A":"中、重度昏迷","B":"支气管哮喘","C":"慢性支气管炎","D":"严重窒息"},"a":["C"],"e":"氯气急性中毒是短时间高浓度吸入，表现为昏迷、哮喘、严重窒息等；慢性支气管炎属长期反复接触的结果。"},{"id":774,"c":"化学安全","l":"II","t":0,"q":"氯气急性中毒可引起;出现严重并发症,如气胸、纵隔气肿等 ①慢性支气管炎 ②中、 重度昏迷 ③支气管哮喘 ④猝死 ⑤严重窒息","o":{"A":"①②③④⑤","B":"①③④⑤","C":"②③⑤","D":"②④⑤"},"a":["C"],"e":"急性氯气中毒表现为中重度昏迷、支气管哮喘和严重窒息；慢性支气管炎是慢性损害，猝死也不算典型急性症状。"},{"id":775,"c":"化学安全","l":"II","t":0,"q":"氯仿属于何种级别的毒性","o":{"A":"剧毒","B":"高毒","C":"中等毒性","D":"低毒"},"a":["C"],"e":"氯仿大鼠经口半数致死量约每公斤一千毫克左右，属于中等毒性，不是剧毒或高毒，但仍有麻醉和肝毒作用。"},{"id":776,"c":"化学安全","l":"II","t":0,"q":"铝粉、保险粉自燃时应（ ）扑救","o":{"A":"用水灭火","B":"用泡沫灭火器","C":"用干粉灭火器","D":"用干砂子灭火"},"a":["D"],"e":"铝粉、保险粉遇水会放热甚至燃烧，只能用干砂覆盖隔绝空气，用水或泡沫灭火器会助长火势。"},{"id":777,"c":"化学安全","l":"II","t":0,"q":"领取剧毒物品时,必须:","o":{"A":"双人领用(其中一人必须是实验室的教师)","B":"单人领用","C":"双人领用(两人都是实验室的学生)"},"a":["A"],"e":"剧毒品领用必须双人，其中一人须为实验室教师，起到监督和复核作用，单人领用无法互相制约。"},{"id":778,"c":"化学安全","l":"II","t":0,"q":"领取及存放化学药品时,以下说法错误的是:","o":{"A":"确认容器上标示的中文名称是否为需要的实验用药品。","B":"学习并清楚化学药品危害标示和图样。","C":"化学药品应分类存放。","D":"有机溶剂,固体化学药品,酸、碱化合物可以存放于同一药品柜中。"},"a":["D"],"e":"有机溶剂、固体药品和酸碱混放同一柜子，一旦泄漏会相互反应起火或放出毒气，必须分类分柜存放。"},{"id":779,"c":"化学安全","l":"II","t":0,"q":"离心操作时,为防液体溢出,离心管中样品装量不能超过离心管体积的多少？","o":{"A":"2/3","B":"1/3","C":"1/2"},"a":["A"],"e":"离心管装样不超过容积的三分之二，留出空间防止液体甩出、管体受力不均破裂。"},{"id":780,"c":"化学安全","l":"II","t":0,"q":"剧毒物品使用完或残存物处理完的空瓶,应","o":{"A":"随生活垃圾丢弃","B":"交回学校后勤技术物资服务中心","C":"交回学校保卫处"},"a":["B"],"e":"剧毒物品的空瓶仍有残留，不能当生活垃圾丢，要交回学校后勤技术物资服务中心按危废渠道统一处理。"},{"id":781,"c":"化学安全","l":"II","t":0,"q":"剧毒物品必须保管、储存在什么地方？","o":{"A":"铁皮柜","B":"木柜子","C":"带双锁的铁皮保险柜","D":"带双锁的木柜子"},"a":["C"],"e":"剧毒品须双人双锁保管，带双锁的铁皮保险柜既防盗又防火，木柜容易撬开且不防火，不达标。"},{"id":782,"c":"化学安全","l":"II","t":0,"q":"剧毒物品保管人员应做到","o":{"A":"日清月结","B":"帐物相符","C":"手续齐全","D":"以上都对"},"a":["D"],"e":"剧毒品保管要做到日清月结、账物相符、手续齐全，三项都是基本要求，所以选以上都对。"},{"id":783,"c":"化学安全","l":"II","t":0,"q":"具有下列哪些性质的化学品属于化学危险品:","o":{"A":"爆炸","B":"易燃、腐蚀、放射性","C":"毒害","D":"以上都是"},"a":["D"],"e":"爆炸性、易燃、腐蚀、放射性、毒害等性质都属于危险化学品范畴，题中列出的几类都算，故选以上都是。"},{"id":784,"c":"化学安全","l":"II","t":0,"q":"进行危险性实验时,应:","o":{"A":"单人操作","B":"必须要有两人以上","C":"必须要有三人"},"a":["B"],"e":"危险性实验必须两人以上在场，一人操作、一人监护，一旦出事能及时施救和报警，单人操作风险太大。"},{"id":785,"c":"化学安全","l":"II","t":0,"q":"进行危险物质、挥发性有机溶剂,特定化学物质或毒性化学物质等操作实验或研究,说法错误的是:","o":{"A":"必须戴防护口罩","B":"必须戴防护手套","C":"必须戴防护眼镜","D":"无所谓"},"a":["D"],"e":"接触有毒、挥发性物质必须戴口罩、手套和护目镜，说“无所谓
