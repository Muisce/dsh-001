<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>实验安全准入题库 · 解析版</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f1f5f9; color: #1e293b; font-size: 16px; line-height: 1.55;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 680px; margin: 0 auto; min-height: 100vh; }
  .screen { display: none; }
  .screen.active { display: block; }
  .topbar {
    position: sticky; top: 0; z-index: 20; background: #4f46e5; color: #fff;
    padding: calc(4px + env(safe-area-inset-top)) 14px 4px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar h1 { font-size: 16px; margin: 0; font-weight: 700; flex: 1; line-height: 1.25; }
  .topbar .sub { font-size: 11px; opacity: .85; white-space: nowrap; }
  .topbtn {
    background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 10px;
    padding: 5px 10px; font-size: 13px; min-height: 34px;
  }
  .card {
    background: #fff; border-radius: 16px; margin: 12px; padding: 16px;
    box-shadow: 0 2px 12px rgba(15,23,42,.06);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: #334155; }
  .label { display: block; font-size: 13px; color: #64748b; margin: 14px 0 8px; font-weight: 600; }
  .label:first-child { margin-top: 0; }
  select, input[type=number] {
    width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px;
    font-size: 16px; background: #fff; color: #1e293b; min-height: 46px;
  }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button {
    flex: 1; min-width: 62px; padding: 10px 4px; border: 1px solid #cbd5e1;
    background: #fff; color: #475569; border-radius: 10px; font-size: 14px; min-height: 44px;
  }
  .seg button.active { background: #4f46e5; border-color: #4f46e5; color: #fff; font-weight: 600; }
  .primary {
    width: 100%; background: #4f46e5; color: #fff; border: 0; border-radius: 14px;
    padding: 15px; font-size: 17px; font-weight: 700; min-height: 52px; margin-top: 18px;
  }
  .primary:disabled { background: #94a3b8; }
  .ghost {
    width: 100%; background: #fff; color: #475569; border: 1px solid #cbd5e1;
    border-radius: 12px; padding: 12px; font-size: 15px; min-height: 46px;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .mini { font-size: 12px; color: #94a3b8; text-align: center; margin: 14px 0 4px; }
  .stat-line { display: flex; justify-content: space-around; text-align: center; margin-top: 4px; }
  .stat-line b { display: block; font-size: 22px; color: #4f46e5; }
  .stat-line span { font-size: 12px; color: #64748b; }
  /* 答题页 */
  .qmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #eef2ff; color: #4f46e5; }
  .chip.gray { background: #f1f5f9; color: #64748b; }
  .chip.green { background: #dcfce7; color: #15803d; }
  .qtop { display: flex; align-items: center; gap: 8px; }
  .qtop .qmeta { flex: 1; margin-bottom: 0; }
  .favbtn {
    flex: 0 0 auto; min-height: 30px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid #cbd5e1; background: #fff; color: #64748b; font-size: 12px; line-height: 1.2;
  }
  .favbtn.on { border-color: #f59e0b; background: #fffbeb; color: #b45309; font-weight: 600; }
  .pbar { height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 0 12px 4px; }
  .pbar > i { display: block; height: 100%; width: 0; background: #4f46e5; border-radius: 99px; transition: width .2s; }
  .ptxt { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #64748b; padding: 0 16px 4px; }
  .ovbtn { border: 1px solid #c7d2fe; background: #eef2ff; color: #4338ca; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 99px; cursor: pointer; font-family: inherit; }
  .ovmask { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 60; }
  .ovpanel { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: #fff;
    border-radius: 18px 18px 0 0; max-height: 72vh; flex-direction: column; box-shadow: 0 -8px 30px rgba(15,23,42,.18); }
  .ovhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
  .ovhead b { font-size: 16px; }
  .ovstat { flex: 1; font-size: 12px; color: #64748b; }
  .ovlegend { display: flex; gap: 14px; padding: 0 16px 10px; font-size: 12px; color: #475569; flex-wrap: wrap; }
  .ovlegend .lg { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 4px; vertical-align: -1px; }
  .ovlegend .lg.ok { background: #dcfce7; border: 1px solid #86efac; }
  .ovlegend .lg.no { background: #fee2e2; border: 1px solid #fca5a5; }
  .ovlegend .lg.todo { background: #f1f5f9; border: 1px solid #cbd5e1; }
  .ovlegend .lg.cur { background: #eef2ff; border: 2px solid #4f46e5; }
  .ovgrid { overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
    gap: 8px; padding: 4px 16px calc(20px + env(safe-area-inset-bottom)); }
  .ovb { min-height: 44px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; color: #475569;
    font-size: 13px; font-family: inherit; cursor: pointer; }
  .ovb.ok { background: #dcfce7; border-color: #86efac; color: #166534; font-weight: 700; }
  .ovb.no { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; font-weight: 700; }
  .ovb.cur { outline: 2px solid #4f46e5; outline-offset: 1px; }
  .qstem { font-size: 17px; font-weight: 600; line-height: 1.65; margin: 6px 0 18px; white-space: pre-wrap; word-break: break-word; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; border: 2px solid #e2e8f0;
    border-radius: 12px; padding: 12px; margin-bottom: 10px; min-height: 48px;
    cursor: pointer; background: #fff; word-break: break-word;
  }
  .opt .k {
    flex: 0 0 26px; height: 26px; border-radius: 50%; background: #f1f5f9; color: #475569;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .opt .v { flex: 1; line-height: 1.5; padding-top: 2px; }
  .opt.sel { border-color: #4f46e5; background: #eef2ff; }
  .opt.sel .k { background: #4f46e5; color: #fff; }
  .opt.right { border-color: #16a34a; background: #f0fdf4; }
  .opt.right .k { background: #16a34a; color: #fff; }
  .opt.wrong { border-color: #dc2626; background: #fef2f2; }
  .opt.wrong .k { background: #dc2626; color: #fff; }
  .fb { border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
  .fb.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
  .fb.no { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
  .fb .ans { margin-top: 6px; color: #334155; font-weight: 600; }
  .fb .txt { margin-top: 4px; color: #475569; }
  /* 解析框 */
  .explain { border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: 14px;
    background: #fffbeb; border: 1px solid #fde68a; color: #78350f; line-height: 1.7; }
  .explain .etitle { font-weight: 700; font-size: 13px; color: #b45309; margin-bottom: 4px; }
  .qnav { display: flex; gap: 10px; margin-top: 16px; }
  .qnav button {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1;
    background: #fff; color: #475569; font-size: 15px; min-height: 46px;
  }
  .qnav button.main { background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 600; }
  .qnav button:disabled { opacity: .45; }
  /* 结果页 */
  .scorebox { text-align: center; padding: 10px 0 4px; }
  .scorebox .num { font-size: 56px; font-weight: 800; color: #4f46e5; line-height: 1.1; }
  .scorebox .unit { font-size: 16px; color: #64748b; }
  .scorebox .tip { font-size: 14px; color: #64748b; margin-top: 6px; }
  .stats2 { display: flex; justify-content: space-around; margin: 18px 0 4px; text-align: center; }
  .stats2 b { display: block; font-size: 20px; }
  .stats2 span { font-size: 12px; color: #64748b; }
  details { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: #fff; }
  details summary { cursor: pointer; font-size: 14px; font-weight: 600; }
  details .dline { font-size: 13px; margin-top: 8px; color: #475569; word-break: break-word; }
  .errbar { background: #b91c1c; color: #fff; padding: 10px 16px; font-size: 13px; display: none; }
  .storewarn { background: #fff7ed; border-bottom: 1px solid #fed7aa; color: #9a3412; padding: 8px 14px; font-size: 12.5px; line-height: 1.55; display: none; }
  .askmask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 60; }
  .askmask.show { display: flex; }
  .askbox { background: #fff; border-radius: 16px; width: 100%; max-width: 340px; height: 252px; max-height: 82vh;
    padding: 20px 18px 14px; box-shadow: 0 20px 50px rgba(0,0,0,.22);
    display: flex; flex-direction: column; }
  .asktitle { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
  .askmsg { font-size: 14px; line-height: 1.65; color: #475569; white-space: pre-wrap; word-break: break-word; flex: 1; overflow: auto; }
  .askbtns { display: flex; gap: 10px; margin-top: 16px; }
  .askbtns button { flex: 1; min-height: 44px; border-radius: 12px; font-size: 15px; font-weight: 600;
    border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; padding: 10px 8px; }
  .askbtns button.ok { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  /* 错题本 */
  .wb-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .wb-item .wq { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .wb-item .wo { font-size: 13px; color: #475569; margin: 3px 0; }
  .wb-item .wo.hit { color: #15803d; font-weight: 600; }
  .wb-item .wa { font-size: 13px; color: #15803d; margin-top: 6px; }
  .wb-item .we { font-size: 13px; margin-top: 6px; color: #78350f; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 10px; line-height: 1.65; }
  .wb-item .rm { margin-top: 8px; font-size: 12px; color: #94a3b8; background: none; border: 0; padding: 4px 0; text-decoration: underline; }
  @media (max-width: 400px) {
    .card { margin: 10px; padding: 14px; }
    .qstem { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="errbar" class="errbar"></div>
<div id="storewarn" class="storewarn">当前浏览器限制了本地存储，答题进度与错题本可能无法保存。建议点右上角「在浏览器打开」，用系统浏览器（Safari / Chrome）访问。</div>
<div id="askMask" class="askmask"><div class="askbox"><div class="asktitle" id="askTitle"></div><div class="askmsg" id="askMsg"></div><div class="askbtns"><button id="askCancel" type="button">取消</button><button id="askOk" class="ok" type="button">确定</button></div></div></div>
<div class="wrap">

  <!-- 首页 -->
  <section id="home" class="screen active">
    <header class="topbar">
      <h1>实验安全准入 · 解析版</h1>
    </header>

    <div class="card">
      <h2>开始练习</h2>
      <label class="label" for="fCat">题目分类</label>
      <select id="fCat"></select>

      <label class="label">题型</label>
      <div class="seg" id="fType">
        <button data-v="all" class="active">全部</button>
        <button data-v="单选题">单选</button>
        <button data-v="多选题">多选</button>
        <button data-v="判断题">判断</button>
      </div>

      <label class="label">练习模式</label>
      <div class="seg" id="fMode">
        <button data-v="order" class="active">顺序练习</button>
        <button data-v="random">随机练习</button>
        <button data-v="wrong">错题重练</button>
      </div>
      <div class="seg" id="fWrongScope" style="display:none;margin-top:8px">
        <button data-v="wrong" class="active">只练错题</button>
        <button data-v="fav">只练收藏</button>
        <button data-v="both">错题和收藏都练</button>
      </div>

      <label class="label" for="fSize">本组题量（0 表示全部）</label>
      <input id="fSize" type="number" min="0" max="1504" value="0" inputmode="numeric">

      <button id="startBtn" class="primary">开始答题</button>
      <button id="resumeBtn" class="ghost" style="display:none;margin-top:10px">继续上次练习</button>
    </div>

    <div class="card">
      <h2>我的进度</h2>
      <div class="stat-line">
        <div><b id="sTotal">0</b><span>题库总量</span></div>
        <div><b id="sDone">0</b><span>累计练习</span></div>
        <div><b id="sWrong">0</b><span>错题本</span></div>
        <div><b id="sFav">0</b><span>收藏本</span></div>
      </div>
      <div class="row" style="margin-top:16px">
        <button id="wrongbookBtn" class="ghost">查看错题本（带解析）</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="favbookBtn" class="ghost">查看收藏本（带解析）</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="clearBtn" class="ghost">清除本机记录</button>
      </div>
      <div class="mini">答案与解析均按原文档参考答案整理，测试请以文档答案为准；记录仅保存在本机浏览器，离线可用。</div>
    </div>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="screen">
    <header class="topbar">
      <button class="topbtn" id="quitBtn">退出</button>
      <div style="flex:1;text-align:center">
        <h1 style="font-size:16px" id="qCounter">第 1 / 1 题</h1>
      </div>
      <div class="sub" id="timer">00:00</div>
    </header>
    <div class="pbar"><i id="pbarFill"></i></div>
    <div class="ptxt"><span id="pDone">已答 0</span><button id="ovBtn" class="ovbtn">题目总览</button><span id="pRight">答对 0</span></div>

    <div class="card" id="qCard">
      <div class="qtop">
        <div class="qmeta" id="qMeta"></div>
        <button id="favBtn" class="favbtn">☆ 收藏</button>
      </div>
      <div class="qstem" id="qStem"></div>
      <div id="qOptions"></div>
      <div id="qFeedback"></div>
      <div class="qnav">
        <button id="prevBtn">上一题</button>
        <button id="submitBtn" class="main" disabled>提交答案</button>
        <button id="nextBtn" class="main" style="display:none">下一题</button>
      </div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="screen">
    <header class="topbar">
      <button class="topbtn" id="backHomeBtn">返回首页</button>
      <div style="flex:1;text-align:center"><h1 style="font-size:16px">练习结果</h1></div>
      <div class="sub" id="rTimer">00:00</div>
    </header>
    <div class="card">
      <div class="scorebox">
        <div><span class="num" id="rScore">0</span><span class="unit"> 分</span></div>
        <div class="tip" id="rTip"></div>
      </div>
      <div class="stats2">
        <div><b id="rTotal">0</b><span>本组题数</span></div>
        <div><b id="rRight" style="color:#16a34a">0</b><span>答对</span></div>
        <div><b id="rWrong" style="color:#dc2626">0</b><span>答错</span></div>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <button class="ghost" id="againWrongBtn">错题重练</button>
        <button class="ghost" id="againNewBtn">再来一组</button>
      </div>
    </div>
    <div class="card" id="reviewCard">
      <h2>答题回顾（含解析）</h2>
      <div id="reviewList"></div>
    </div>
  </section>

  <!-- 错题本 -->
  <section id="wrongbook" class="screen">
    <header class="topbar">
      <button class="topbtn" id="wbBack">返回首页</button>
      <div style="flex:1;text-align:center"><h1 style="font-size:16px">错题本 · 带解析</h1></div>
      <div class="sub" id="wbCount">0 题</div>
    </header>
    <div class="card" id="wbList"></div>
  </section>

  <!-- 收藏本 -->
  <section id="favbook" class="screen">
    <header class="topbar">
      <button class="topbtn" id="fbBack">返回首页</button>
      <div style="flex:1;text-align:center"><h1 style="font-size:16px">收藏本 · 带解析</h1></div>
      <div class="sub" id="fbCount">0 题</div>
    </header>
    <div class="card" id="fbList"></div>
  </section>

  <!-- 题目总览 -->
  <div id="ovMask" class="ovmask"></div>
  <div id="ovPanel" class="ovpanel">
    <div class="ovhead">
      <b>题目总览</b>
      <span id="ovStat" class="ovstat"></span>
      <button id="ovClose" class="topbtn">关闭</button>
    </div>
    <div class="ovlegend">
      <span><i class="lg ok"></i>答对</span>
      <span><i class="lg no"></i>答错</span>
      <span><i class="lg todo"></i>未答</span>
      <span><i class="lg cur"></i>当前题</span>
    </div>
    <div id="ovGrid" class="ovgrid"></div>
  </div>

</div>

<script>window.QUESTION_BANK=[{"id":1,"c":"安全通识","l":"I","t":0,"q":"《中华人民共和国消防法》规定:消防工作贯彻（ ）的方针,坚持专门机关与群众相结合的原则,实行防火安全责任制。","o":{"A":"谁主管、谁负责","B":"以防为主,以消为辅","C":"预防为主,防消结合"},"a":["C"],"e":"消防法定的方针就是“预防为主、防消结合”，防火在前、防消并重；“谁主管谁负责”是责任制原则，不是方针表述。"},{"id":2,"c":"安全通识","l":"I","t":0,"q":"保证电气检修人员人身安全最有效的措施是（ ）。","o":{"A":"悬挂标示牌","B":"放置遮栏","C":"将检修设备接地并短路"},"a":["C"],"e":"检修设备接地并短路，万一误送电就把电流直接导入大地并让保护动作，是防突然来电最有效的保命措施；挂标示牌、装遮栏只是辅助提醒。"},{"id":3,"c":"安全通识","l":"I","t":0,"q":"被电击的人能否获救,关键在于（ ）。","o":{"A":"触电的方式","B":"能否尽快脱离电源和施行紧急救护","C":"触电电压的高低","D":"人体电阻"},"a":["B"],"e":"触电能否救活，关键在尽快脱离电源并立即心肺复苏，拖得越久越危险；触电方式、电压高低、人体电阻只影响伤害程度。"},{"id":4,"c":"安全通识","l":"I","t":0,"q":"被火困在室内,如何逃生？（ ）","o":{"A":"原地等待救援","B":"到窗口或阳台挥动物品求救、用床单或绳子拴在室内牢固处下到下一层逃生。","C":"躲到床下,等待救援。","D":"打开门,冲出去。"},"a":["B"],"e":"被困室内应到窗口、阳台挥物求救，用床单绳子固定在牢固处下到下层；躲床下、开门硬冲、原地干等都会错失时机或吸入浓烟。"},{"id":5,"c":"安全通识","l":"I","t":0,"q":"触电事故中,绝大部分是( )导致人身伤亡的。","o":{"A":"人体接受电流遭到电击","B":"烧伤","C":"电休克"},"a":["A"],"e":"触电伤亡绝大多数是电流通过人体造成电击，引起心室颤动、呼吸停止；烧伤、电休克是电击后的表现，不是主要原因。"},{"id":6,"c":"安全通识","l":"I","t":0,"q":"从安全角度考虑,设备停电必须有一个明显的（ ）。","o":{"A":"标示牌","B":"接地处","C":"断开点"},"a":["C"],"e":"停电后必须留有明显断开点，让人一眼看出已断电，防止误合闸；标示牌、接地线是配套措施，代替不了断开点。"},{"id":7,"c":"安全通识","l":"I","t":0,"q":"从火灾现场撤离时,应采取（ ）。","o":{"A":"乘坐电梯","B":"用湿毛巾捂住口鼻低姿从安全通道撤离"},"a":["B"],"e":"烟气向上聚集且毒性大，是火灾主要杀手，所以要用湿毛巾捂住口鼻、低姿沿安全通道撤离；乘电梯可能断电被困。"},{"id":8,"c":"安全通识","l":"I","t":0,"q":"大多数情况下,用普通的肥皂和水彻底冲洗对于清除手部污染就足够了。但在高度危险的情况下,建议使用杀菌肥皂。手要完全抹上肥皂,搓洗至少（ ） 秒钟,用干净水冲洗后再用干净的纸巾或毛巾擦干（如果有条件,可以使用暖风干手器）。","o":{"A":"10","B":"15","C":"20"},"a":["A"],"e":"规范要求搓洗至少10秒，让肥皂充分起泡包裹污物再冲净；15秒、20秒当然更好，但最低时限是10秒。"},{"id":9,"c":"安全通识","l":"I","t":0,"q":"大型仪器一般都使用计算机进行控制。计算机与仪器之间的数据传输线一般在（ ）情况下进行装卸。","o":{"A":"任意时刻,想何时就何时装卸","B":"在仪器及计算机电源关闭的情况下装卸数据传输线","C":"在仪器处于工作状态时,装卸数据传输线","D":"在计算机处于工作状态时,装卸数据传输线"},"a":["B"],"e":"数据传输线要在仪器和计算机都断电后装卸，带电插拔易损坏接口、造成数据错乱甚至触电；任意时刻装卸或单方断电都不安全。"},{"id":10,"c":"安全通识","l":"I","t":0,"q":"带电电器设备发生火灾时不能用（ ）扑救。","o":{"A":"卤代烷","B":"水","C":"干粉"},"a":["B"],"e":"水导电，带电灭火会顺水流造成触电并扩大短路，所以带电设备火灾不能用水；卤代烷、干粉不导电，可用于电气火灾。"},{"id":11,"c":"安全通识","l":"I","t":0,"q":"当打开房间闻到煤气气味时,要迅速（ ）。","o":{"A":"打开灯寻找漏气部位","B":"点火查看","C":"打开门窗通风"},"a":["C"],"e":"闻到煤气味要立即开窗通风、关闭阀门让燃气散出；开灯、点火都会产生火花引燃，此时任何电器操作都危险。"},{"id":12,"c":"安全通识","l":"I","t":0,"q":"当实验室发生火灾、爆炸等危险事故时,首先应当如何处理？（ ）","o":{"A":"迅速撤离实验室","B":"自己留下来排查事故原因","C":"打电话求救","D":"切断电源"},"a":["D"],"e":"发生火灾爆炸先切断电源，消除持续点火源和触电风险，再报警、灭火、疏散；先跑开或先查原因都会延误处置。"},{"id":13,"c":"安全通识","l":"I","t":0,"q":"当液化气罐内的气量不足时,应采用（ ）方法获取燃气。","o":{"A":"放在热水中加热","B":"换气","C":"不断摇晃气罐"},"a":["B"],"e":"气量不足应换气，正规充装最安全；用热水加热、不断摇晃会让罐内压力升高、液相窜入灶具，极易泄漏爆燃。"},{"id":14,"c":"安全通识","l":"I","t":0,"q":"当有汞（水银）溅失时,处理现场应（ ）。","o":{"A":"用水擦","B":"用拖把拖","C":"扫干净后倒入垃圾桶","D":"收集水银,用硫磺粉盖上并统一处理"},"a":["D"],"e":"汞溅落要先收集，再用硫磺粉覆盖使其生成硫化汞固定，最后按危废统一处理；用水擦、拖把拖、扫进垃圾桶都会扩散污染。"},{"id":15,"c":"安全通识","l":"I","t":0,"q":"当遇到火灾时,要迅速向（ ）逃生。","o":{"A":"着火相反的方向","B":"人员多的方向","C":"安全出口的方向"},"a":["C"],"e":"逃生要认准安全出口方向沿疏散指示走；朝火相反方向可能进死胡同，跟着人群乱跑易踩踏，都不如认准出口。"},{"id":16,"c":"安全通识","l":"I","t":0,"q":"当做实验时,皮肤不小心被酸灼伤怎么办？（ ）","o":{"A":"用抹布擦干即可","B":"先用大量水冲洗,以免深度受伤,再用稀NaHCO3溶液或稀氨水浸洗,最后用水洗","C":"直接用稀NaHCO3溶液或稀氨水中和","D":"不作任何处理,直接去医院"},"a":["B"],"e":"酸灼伤先大量流水冲洗稀释降温，再用稀碳酸氢钠或稀氨水浸洗中和，最后再冲净；直接中和会放热加重损伤，只擦干更不行。"},{"id":17,"c":"安全通识","l":"I","t":0,"q":"电击（触电）通常指因为人体接触带电的供电线路或设备而受到伤害的事故。为了避免电击（触电）事故的发生,请判断下列措施正确的是（ ）。","o":{"A":"设备可靠接地而人体对地绝缘。","B":"设备和人体都可靠接地。","C":"设备和人体都对地绝缘。","D":"设备对地绝缘而人体可靠接地。"},"a":["A"],"e":"防触电靠“设备接地、人体绝缘”：漏电经接地线入地，人站在绝缘处不构成通路；两者都接地或都绝缘都不成立。"},{"id":18,"c":"安全通识","l":"I","t":0,"q":"电器起火应采取下列哪种措施( )。","o":{"A":"用水浇灭","B":"泡沫灭火器灭火","C":"迅速断开电源开关","D":"用湿布盖灭"},"a":["C"],"e":"电器起火先迅速断开电源开关，断电后再用干粉或二氧化碳扑救；水导电，泡沫也含水，湿布盖灭对带电设备很危险。"},{"id":19,"c":"安全通识","l":"I","t":0,"q":"电线插座损坏时,既不美观也不方便工作,并造成（ ）。","o":{"A":"吸潮漏电","B":"空气开关跳闸","C":"触电伤害","D":"以上都是"},"a":["D"],"e":"插座损坏会吸潮漏电、引起短路跳闸，进而造成触电伤害，三种后果都可能，所以要及时报修更换，不能凑合使用。"},{"id":20,"c":"安全通识","l":"I","t":0,"q":"对（ ）人员进行紧急救护时不能进行人工呼吸。","o":{"A":"有毒气体中毒","B":"触电假死","C":"溺水"},"a":["A"],"e":"有毒气体中毒者口鼻和肺部残留毒物，口对口人工呼吸会让施救者一并中毒；应先脱离毒区、给氧并用简易呼吸器。"},{"id":21,"c":"安全通识","l":"I","t":0,"q":"发生电器着火应（ ）。","o":{"A":"别管它,赶紧跑","B":"保障安全的情况下先灭火,然后关电源","C":"保障安全情况下先关掉电源,然后灭火"},"a":["C"],"e":"电器着火要先断电再灭火，断电后用水基灭火剂也不会导电伤人；先灭火后断电等于带电作业，风险很大。"},{"id":22,"c":"安全通识","l":"I","t":0,"q":"发现燃气泄漏,正确做法是（ ）。","o":{"A":"触动电器开关或拨打电话","B":"使用明火","C":"迅速关阀门,打开门窗"},"a":["C"],"e":"燃气泄漏要迅速关阀门、开窗通风，把可燃气排走；触动开关、打电话、用明火都会产生火花，可能直接引爆。"},{"id":23,"c":"安全通识","l":"I","t":0,"q":"防火防爆的一般原则有( )。","o":{"A":"遵守规章制度,加强安全意识","B":"熟悉实验室容易引起火灾、爆炸的特点,配备合适的防火防爆设施","C":"减少和消除可燃物质,控制或取消点火源","D":"以上都是"},"a":["D"],"e":"防火防爆靠制度意识、熟悉危险特性并配好设施、减少可燃物和控制点火源，三者缺一不可，所以要全选。"},{"id":24,"c":"安全通识","l":"I","t":0,"q":"防止毒物危害的最佳方法是（ ）。","o":{"A":"穿工作服","B":"佩戴呼吸器具","C":"使用无毒或低毒的代替品"},"a":["C"],"e":"防毒最根本是从源头用无毒低毒替代品，让人根本不接触毒物；穿工作服、戴呼吸器只是接触后的被动防护。"},{"id":25,"c":"安全通识","l":"I","t":0,"q":"废电池随处丢弃会造成（ ）的污染。","o":{"A":"白色污染","B":"重金属污染","C":"酸雨"},"a":["B"],"e":"废电池含汞、镉、铅等重金属，随意丢弃会渗入土壤和水体造成重金属污染；白色污染指塑料，酸雨主要来自硫氮氧化物。"},{"id":26,"c":"安全通识","l":"I","t":0,"q":"干粉灭火器适用于:","o":{"A":"电器起火","B":"可燃气体起火","C":"有机溶剂起火","D":"以上都是"},"a":["D"],"e":"干粉灭火器不导电、覆盖面广，对电器起火、可燃气体和有机溶剂火灾都适用，是实验室常备的通用灭火器。"},{"id":27,"c":"安全通识","l":"I","t":0,"q":"公共场所发生火灾时,该公共场所的现场工作人员应（ ）。","o":{"A":"迅速撤离","B":"抢救贵重物品","C":"组织引导在场群众疏散"},"a":["C"],"e":"公共场所火灾时，现场工作人员熟悉通道，有义务组织引导群众疏散，不能只顾自己跑或去抢救贵重物品。"},{"id":28,"c":"安全通识","l":"I","t":0,"q":"关于在实验室做实验,下列做法错误的是（ ）。","o":{"A":"为了熟悉实验室环境,随意翻动实验室内物品","B":"手上有伤口时,可以申请停做生物解剖实验","C":"实验的过程中使用高速离心机等设备时,保证有人看守","D":"进入实验室时,更换规定的实验服"},"a":["A"],"e":"随意翻动实验室物品可能碰倒试剂、误开阀门，是错误做法；换实验服、有人看守离心机、有伤口申请停做解剖都是对的。"},{"id":29,"c":"安全通识","l":"I","t":0,"q":"规范实验室安全管理的目的是( )。","o":{"A":"保护实验室工作人员","B":"保护公众","C":"保护环境","D":"以上都是"},"a":["D"],"e":"规范实验室安全管理是为了保护实验人员、公众和环境，三者都涵盖，既是安全需要也是法定责任。"},{"id":30,"c":"安全通识","l":"I","t":0,"q":"国家颁布的《安全色》标准中,表示警告、注意的颜色为（ ）。","o":{"A":"红色","B":"蓝色","C":"黄色"},"a":["C"],"e":"安全色中黄色表示警告和注意，如“当心触电”；红色表示禁止停止，蓝色表示指令必须遵守，绿色表示安全提示。"},{"id":31,"c":"安全通识","l":"I","t":0,"q":"国内民用照明电路电压为以下哪种？","o":{"A":"直流电压220伏","B":"交流电压280伏","C":"交流电压220伏","D":"交流电压110伏"},"a":["C"],"e":"国内民用照明是交流220伏、50赫兹；说直流220伏、交流280伏或110伏都不符合我国电网实际。"},{"id":32,"c":"安全通识","l":"I","t":0,"q":"火场逃生的原则是 ( ) 。","o":{"A":"抢救国家财产为上","B":"先带上日后生活必需钱财要紧","C":"安全撤离、救助结合","D":"逃命要紧"},"a":["C"],"e":"火场逃生原则是安全撤离与救助相结合，先保自身安全再量力救人；为抢财物返回、只顾逃命都不对。"},{"id":33,"c":"安全通识","l":"I","t":0,"q":"火灾初起阶段是扑救火灾( )的阶段。","o":{"A":"最不利","B":"最有利","C":"较不利"},"a":["B"],"e":"初起阶段燃烧面积小、温度低、烟气少，是最有利的扑救时机，错过就可能失控，所以发现火情要早灭早报。"},{"id":34,"c":"安全通识","l":"I","t":0,"q":"火灾发生时,湿毛巾折叠8层为宜,其烟雾浓度消除率可达（ ）。","o":{"A":"0.4","B":"0.6","C":"0.8"},"a":["B"],"e":"湿毛巾折叠八层可滤去约六成烟雾颗粒，既挡烟又不至于太厚憋气；折得太少过滤差，太多则呼吸费力。"},{"id":35,"c":"安全通识","l":"I","t":0,"q":"火灾事故的防范原则包括预防、（ ）、 灭火、和疏散四个方面。","o":{"A":"限制","B":"报告","C":"检查","D":"医疗救护"},"a":["A"],"e":"火灾防范四原则是预防、限制、灭火、疏散：预防起火、限制蔓延、及时扑灭、安全疏散，四环相扣。"},{"id":36,"c":"安全通识","l":"I","t":0,"q":"检查燃气用具是否漏气时,通常采用（ ）来寻找漏气点。","o":{"A":"划火柴","B":"涂抹肥皂水","C":"闻气味"},"a":["B"],"e":"查漏气要涂肥皂水看接口是否起泡，直观又安全；划火柴会引燃，仅靠鼻子闻既不可靠又有中毒风险。"},{"id":37,"c":"安全通识","l":"I","t":0,"q":"节假日期间,仍然需要进入实验室工作的师生,要严格遵守实验室操作规程,做实验时必须要有人在场,并且在实验完成离开时负责（）,锁好门窗,以防火灾和爆炸、溢水等事故。","o":{"A":"关闭仪器设备","B":"关闭水源、电源、气源","C":"关闭计算机"},"a":["B"],"e":"节假日做完实验离开时，要关水源、电源、气源并锁好门窗，防止跑水、断电起火和气体泄漏；只关电脑远远不够。"},{"id":38,"c":"安全通识","l":"I","t":0,"q":"金属梯子不适于以下什么工作场所？（ ）","o":{"A":"带电作业的工作场所","B":"坑穴或密闭场所","C":"高空作业","D":"静电"},"a":["A"],"e":"金属梯子导电，在带电作业场所使用等于把人体与带电体连通，应改用木梯或绝缘梯；坑穴、高空作业并非金属梯的禁忌。"},{"id":39,"c":"安全通识","l":"I","t":0,"q":"进行危险性实验时,应（ ）。","o":{"A":"单人操作","B":"必须要有两人以上","C":"必须要有三人"},"a":["B"],"e":"危险性实验必须两人以上在场，一人操作一人监护，出事能及时施救报警；单人操作一旦中毒灼伤无人发现。"},{"id":40,"c":"安全通识","l":"I","t":0,"q":"进行照明设施的接电操作,应采取的防触电措施为（ ）。","o":{"A":"湿手操作","B":"切断电源","C":"站在金属登子或梯子上","D":"戴上手套"},"a":["B"],"e":"接照明电路前必须切断电源，在无电状态下作业；湿手、站金属梯、只戴手套都代替不了断电，反而增加风险。"},{"id":41,"c":"安全通识","l":"I","t":0,"q":"静电电压最高可达( ),放电时易产生静电火花,引起火灾。","o":{"A":"50伏","B":"上万伏","C":"220伏","D":"380伏"},"a":["B"],"e":"静电电压可高达上万伏，虽然能量小，但放电火花足以点燃可燃气体和溶剂蒸气，所以要接地、增湿防静电。"},{"id":42,"c":"安全通识","l":"I","t":0,"q":"据统计,火灾中死亡的人有80%以上属于（ ）。","o":{"A":"被火直接烧死","B":"烟气窒息致死","C":"跳楼或惊吓致死"},"a":["B"],"e":"火灾死亡八成以上是烟气窒息和中毒，不是被火烧死；烟气中一氧化碳毒性强，逃生务必防烟、低姿。"},{"id":43,"c":"安全通识","l":"I","t":0,"q":"雷电放电具有（ ）特点。","o":{"A":"电流大,电压高","B":"电流小,电压高","C":"电流大,电压低","D":"电磁波辐射"},"a":["A"],"e":"雷电放电电流极大、电压极高、时间极短，瞬间释放巨大能量，可击穿绝缘并引燃可燃物。"},{"id":44,"c":"安全通识","l":"I","t":0,"q":"雷电由于瞬间的强大电流释放巨大能量,不仅会伤及人员,还会损坏设备,甚至引起火灾。请在下列选项中选择室内防止雷电灾害的最主要的一项措施。（ ）","o":{"A":"在较高建筑的顶端及露天的配电设施要装避雷装置","B":"雷雨时不使用计算机上网,而且尽可能关闭机器,拔掉电源线和网线","C":"雷雨发生时不使用手机","D":"不使用电烙铁"},"a":["A"],"e":"室内防雷最主要措施是在较高建筑顶端和露天配电设施安装避雷装置，把雷电流引入大地；关电脑、不用手机只是辅助。"},{"id":45,"c":"安全通识","l":"I","t":0,"q":"楼内失火应( )。","o":{"A":"从疏散通道逃离","B":"乘坐电梯逃离","C":"在现场等待救援","D":"见到门口就跑"},"a":["A"],"e":"楼内失火应从疏散楼梯通道撤离，电梯可能断电或变成烟囱；在现场干等、见门就跑都不可取。"},{"id":46,"c":"安全通识","l":"I","t":0,"q":"漏电保护器的使用是防止（ ）。","o":{"A":"触电事故","B":"电压波动","C":"电流过大"},"a":["A"],"e":"漏电保护器靠检测火线与零线电流是否平衡来判断漏电，不平衡就跳闸断电，专门防触电；它不管稳压也不管过流。"},{"id":47,"c":"安全通识","l":"I","t":0,"q":"漏电保护器对（ ）情况不起作用。","o":{"A":"单手碰到带电体","B":"人体碰到带电设备","C":"双手碰到两相电线（此时人体作为负载,已触电）","D":"人体碰到漏电机壳"},"a":["C"],"e":"双手各碰一相电线时，电流从一手经身体流到另一手，火线零线电流仍平衡，漏电保护器检测不出，所以不起作用。"},{"id":48,"c":"安全通识","l":"I","t":0,"q":"灭火的四种方法是（ ）。","o":{"A":"捂盖法、扑打法、浇水法、隔开法","B":"扑灭法、救火法、化学法、泡沫法","C":"隔离法、窒息法、冷却法、化学抑制法"},"a":["C"],"e":"灭火四种基本方法是隔离、窒息、冷却、化学抑制，分别对应移走可燃物、隔绝氧气、降温、中断链式反应。"},{"id":49,"c":"安全通识","l":"I","t":0,"q":"灭火器上的压力表用红、黄、绿三色表示灭火器的压力情况,当指针指在绿色区域表示:","o":{"A":"正常","B":"偏高","C":"偏低"},"a":["A"],"e":"压力表指针在绿色区表示压力正常、可以正常使用；红区偏低要充装，黄区偏高，用前看一眼心里有数。"},{"id":50,"c":"安全通识","l":"I","t":0,"q":"泡沫灭火器不能用于扑救（ ）火灾。","o":{"A":"塑料","B":"汽油","C":"金属钠"},"a":["C"],"e":"泡沫灭火器喷出的水溶液导电，与金属钠接触还会反应加剧燃烧甚至爆炸；金属钠火灾要用干砂或专用干粉。"},{"id":51,"c":"安全通识","l":"I","t":0,"q":"配电盘（箱）、开关、变压器等各种电气设备附近不得（ ）。","o":{"A":"设放灭火器","B":"设置围栏","C":"堆放易燃、易爆、潮湿和其他影响操作的物件"},"a":["C"],"e":"配电盘、开关、变压器附近不得堆放易燃易爆、潮湿和影响操作的物件，否则一打火就引燃，还妨碍紧急断电。"},{"id":52,"c":"安全通识","l":"I","t":0,"q":"皮肤若被低温冻伤,应（ ）。","o":{"A":"马上送医院","B":"用温水慢慢恢复体温","C":"用火烘烤","D":"应尽快浸入热水"},"a":["B"],"e":"冻伤要用温水缓慢复温，让组织逐渐恢复；火烤、热水浸泡会造成二次烫伤，送医前也应先做初步复温。"},{"id":53,"c":"安全通识","l":"I","t":0,"q":"扑救电气设备火灾时,不能用（ ）。","o":{"A":"四氯化碳灭火器","B":"二氧化碳灭火器","C":"泡沫灭火器"},"a":["C"],"e":"泡沫灭火器含水导电，扑救电气火灾会造成触电和短路，应选二氧化碳或干粉；四氯化碳虽不导电但已淘汰。"},{"id":54,"c":"安全通识","l":"I","t":0,"q":"扑救烟灰缸里的杂物、废纸篓里的废纸片等初起小火时,错误的做法是（ ）。","o":{"A":"用水或灭火器扑灭","B":"用手拍灭","C":"用湿毛巾覆盖"},"a":["B"],"e":"纸篓杂物起火用手拍会烧伤手，还会把火种甩开；正确是用灭火器、水或湿毛巾覆盖，手不是灭火工具。"},{"id":55,"c":"安全通识","l":"I","t":0,"q":"扑灭电器火灾不宜使用下列何种灭火器材？","o":{"A":"二氧化碳灭火器","B":"干粉灭火器","C":"泡沫灭火器","D":"灭火砂"},"a":["C"],"e":"电器火灾不宜用泡沫灭火器，因其水溶液导电；二氧化碳、干粉都不导电，灭火砂能隔绝空气，均可使用。"},{"id":56,"c":"安全通识","l":"I","t":0,"q":"清除工作场所散布的有害尘埃时,应使用（ ）。","o":{"A":"扫把","B":"吸尘器","C":"吹风机"},"a":["B"],"e":"清除有害尘埃要用吸尘器负压收集，避免扬尘被吸入；扫把会扬起粉尘，吹风机更是把有害物吹散到空气中。"},{"id":57,"c":"安全通识","l":"I","t":0,"q":"请从下列选项中选择万一发生电气火灾后首先应该采取的第一条措施。","o":{"A":"打电话报警","B":"切断电源","C":"扑灭明火","D":"保护现场,分析火因,以便采取措施,杜绝隐患。"},"a":["B"],"e":"电气火灾第一条是切断电源，消除触电危险和持续电能，再灭火报警；先救火可能边灭边复燃，还易触电。"},{"id":58,"c":"安全通识","l":"I","t":0,"q":"人们可能通过下列方式暴露于危险性化学品（ ）","o":{"A":"吸入、接触","B":"食入、针刺","C":"通过破损皮肤","D":"以上均有可能"},"a":["D"],"e":"危险化学品可经吸入、皮肤接触、食入、针刺和破损皮肤进入人体，防护要覆盖呼吸道、皮肤和伤口，不能只防一种途径。"},{"id":59,"c":"安全通识","l":"I","t":0,"q":"人体静电的危害不包括（ ）方面。","o":{"A":"人体电击及由此引起的二次事故","B":"引发爆炸和火灾","C":"对静电敏感的电子产品的工作造成障碍","D":"引起电气装置能耗增大"},"a":["D"],"e":"人体静电的危害是电击及二次事故、引发爆炸火灾、干扰静电敏感电子设备，不包括使电气装置能耗增大。"},{"id":60,"c":"安全通识","l":"I","t":0,"q":"任何单位（ ）都有参加组织的灭火工作的义务。","o":{"A":"男性公民","B":"成年公民","C":"包括少年儿童在内的所有人员"},"a":["B"],"e":"消防法规定任何单位的成年公民都有参加有组织灭火工作的义务；未成年人、少年儿童不在此列，以保护为先。"},{"id":61,"c":"安全通识","l":"I","t":0,"q":"任何电气设备在未验明无电之前,一律认为（ ）。","o":{"A":"无电","B":"也许有电","C":"有电","D":"也许无电"},"a":["C"],"e":"电气设备未验明无电前一律视为有电，按带电作业对待，验电、接地、挂标示牌一步不能少，这是血的教训。"},{"id":62,"c":"安全通识","l":"I","t":0,"q":"如果触电者伤势严重,呼吸停止或心脏停止跳动,应竭力施行( )和胸外心脏挤压。","o":{"A":"按摩","B":"点穴","C":"人工呼吸"},"a":["C"],"e":"触电者呼吸心跳停止，要立即人工呼吸配合胸外心脏按压，边救边等医生；按摩、点穴没有通气效果，只会耽误抢救。"},{"id":63,"c":"安全通识","l":"I","t":0,"q":"如果工作场所潮湿,为避免触电,使用手持电动工具的人应:","o":{"A":"站在铁板上操作","B":"站在绝缘胶板上操作","C":"穿防静电鞋操作","D":"戴上安全帽"},"a":["B"],"e":"潮湿场所用电动工具要站在绝缘胶板上，隔断人体到地的通路；站铁板等于接地，穿防静电鞋反而利于导电，更危险。"},{"id":64,"c":"安全通识","l":"I","t":0,"q":"如果实验出现火情,要立即（ ）。","o":{"A":"停止加热,移开可燃物,切断电源,用灭火器灭火","B":"打开实验室门,尽快疏散、撤离人员","C":"用干毛巾覆盖上火源,使火焰熄灭"},"a":["A"],"e":"出现火情要立即停止加热、移开可燃物、切断电源并用灭火器扑救，把火压在初起阶段；先跑会失去最佳扑救时机。"},{"id":65,"c":"安全通识","l":"I","t":0,"q":"如果睡觉时被烟火呛醒,正确的做法是（ ）。","o":{"A":"寻找逃生通道","B":"往床底下钻","C":"找衣服穿或抢救心爱的东西"},"a":["A"],"e":"被烟火呛醒要立即寻找逃生通道，低姿沿疏散指示撤离；钻床底、找衣服和财物都会耽误宝贵时间。"},{"id":66,"c":"安全通识","l":"I","t":0,"q":"如果在试验过程中,闻到烧焦的气味应（ ）。","o":{"A":"关机走人","B":"打开通风装置通风","C":"立即关机并报告相关负责人员","D":"请同实验的人帮忙检查"},"a":["C"],"e":"闻到烧焦味应立即关机并报告负责人，查明原因排除隐患；只开通风或关机走人，可能让隐患发展成火灾。"},{"id":67,"c":"安全通识","l":"I","t":0,"q":"设备或线路的确认无电,应以（ ）指示作为根据。","o":{"A":"电压表","B":"正常的验电工具","C":"断开信号","D":"电流表"},"a":["B"],"e":"确认无电必须以合格的验电器指示为准，不能凭断开信号、电压表或经验判断；验电是停电作业的法定步骤。"},{"id":68,"c":"安全通识","l":"I","t":0,"q":"涉及有毒试剂的操作时,应采取的保护措施包括（ ）。","o":{"A":"佩戴适当的个人防护器具","B":"了解试剂毒性,在通风橱中操作","C":"做好应急救援预案","D":"以上都是"},"a":["D"],"e":"接触有毒试剂要同时做到戴防护器具、了解毒性并在通风橱操作、备好应急预案，单靠某一项防护都不够。"},{"id":69,"c":"安全通识","l":"I","t":0,"q":"身上着火,最好的做法是:","o":{"A":"就地打滚或用水冲","B":"奔跑","C":"大声呼救","D":"边跑边脱衣服"},"a":["A"],"e":"身上着火应就地打滚或用大量水冲，压灭火焰并降温；奔跑等于给火送风，会烧得更旺更大。"},{"id":70,"c":"安全通识","l":"I","t":0,"q":"身上着火后,下列哪种灭火方法是错误的？（ ）","o":{"A":"就地打滚。","B":"用厚重衣物覆盖压灭火苗。","C":"迎风快跑。","D":"大量水冲或跳入水中。"},"a":["C"],"e":"迎风快跑是错的，风会助燃并扩大烧伤面积；正确做法是就地打滚、用厚重衣物覆盖、水冲或跳入水中。"},{"id":71,"c":"安全通识","l":"I","t":0,"q":"师生进入实验室工作,一定要搞清楚（）等位置,有异常情况,要关闭相应的总开关。","o":{"A":"日光灯开关、水槽、通风橱","B":"电源总开关、水源总开关","C":"通风设备开关、多媒体开关、计算机开关"},"a":["B"],"e":"进实验室要弄清电源总开关和水源总开关的位置，有异常能第一时间切断；只认灯开关、设备开关远远不够。"},{"id":72,"c":"安全通识","l":"I","t":0,"q":"实验大楼安全出口的疏散门应（ ）。","o":{"A":"自由开启","B":"向外开启","C":"向内开启","D":"关闭,需要时可自行开启"},"a":["B"],"e":"疏散门应向外开启，逃生时人群一推即开；向内开会被人流压住打不开，平时上锁或随意自由开启也不符合消防要求。"},{"id":73,"c":"安全通识","l":"I","t":0,"q":"实验大楼因出现火情发生浓烟已穿入实验室内时,以下哪种行为是正确的？（ ）","o":{"A":"沿地面匍匐前进,当逃到门口时,不要站立开门","B":"打开实验室门后不用随手关门","C":"从楼上向楼下外逃时可以乘电梯"},"a":["A"],"e":"浓烟入室要沿地面匍匐前进，开门前先摸门温、不站着开门；不关门会让烟火蔓延，乘电梯可能被困。"},{"id":74,"c":"安全通识","l":"I","t":0,"q":"实验过程中发生烧烫(灼)伤,错误的处理方法是:","o":{"A":"浅表的小面积灼伤,以冷水冲洗15至30分钟至散热止痛","B":"浅表的小面积灼伤,以冷水冲洗15至30分钟至散热止痛","C":"若有水泡可自行刺破","D":"大面积的灼伤,应紧急送至医院"},"a":["C"],"e":"烧烫伤的水泡不能自行刺破，破口容易感染留疤；小面积可用冷水冲15至30分钟，大面积要立即送医。"},{"id":75,"c":"安全通识","l":"I","t":0,"q":"实验开始前应该做好哪些准备","o":{"A":"必须认真预习,理清实验思路","B":"应仔细检查仪器是否有破损,掌握正确使用仪器的要点,弄清水、电、气的管线开关和标记,保持清醒头脑,避免违规操作","C":"了解实验中使用的药品的性能和有可能引起的危害及相应的注意事项","D":"以上都是"},"a":["D"],"e":"实验前要预习理清思路、检查仪器并弄清水电气开关位置、了解药品危害，三方面都得做到，所以要全选。"},{"id":76,"c":"安全通识","l":"I","t":0,"q":"实验室、办公室等用电场所如需增加电器设备,以下说法正确的是（ ）。","o":{"A":"老师自行改装","B":"须经学校有关部门批准,并由学校指派电工安装","C":"学生可以私自改接"},"a":["B"],"e":"增加电器设备须经学校批准并由电工安装，保证线路容量和接地合格；老师自行改装、学生私接都可能超载起火。"},{"id":77,"c":"安全通识","l":"I","t":0,"q":"实验室安全管理实行（ ）管理。","o":{"A":"校、院、实验室三级管理","B":"校、院两级管理","C":"院系、实验室两级管理","D":"实验事自行管理"},"a":["A"],"e":"实验室安全实行校、院、实验室三级管理，层层有人负责；只分两级或实验室自行管理容易留下责任空档。"},{"id":78,"c":"安全通识","l":"I","t":0,"q":"实验室安全管理应坚持（ ）方针","o":{"A":"安全第一,实验第二","B":"安全第一,预防为主","C":"安全为了实验,实验必须安全"},"a":["B"],"e":"实验室安全坚持“安全第一、预防为主”，把风险消除在实验之前；“实验第二”之类提法都不符合安全方针。"},{"id":79,"c":"安全通识","l":"I","t":0,"q":"实验室冰箱和超低温冰箱使用注意事项错误的是（ ）。","o":{"A":"定期除霜、清理,清理后要对内表面进行消毒","B":"储存的所有容器,应当标明物品名称、储存日期和储存者姓名","C":"除非有防爆措施,否则冰箱内不能放置易燃易爆化学品溶液,冰箱门上应注明这一点","D":"可以在冰箱内冷冻食品和水"},"a":["D"],"e":"实验室冰箱不能冷冻食品和饮用水，化学品可能污染食物；定期除霜消毒、容器标明名称日期、防爆要求都是对的。"},{"id":80,"c":"安全通识","l":"I","t":0,"q":"实验室的插座距地面的高度一般不低于（ ）米。","o":{"A":"0.3","B":"0.2","C":"0.1"},"a":["A"],"e":"实验室插座距地面一般不低于0.3米，可防地面水渍溅入和拖地时触电；0.2米、0.1米都偏低。"},{"id":81,"c":"安全通识","l":"I","t":0,"q":"实验室电器设备所引起的火灾,应:","o":{"A":"用水灭火","B":"用二氧化碳或干粉灭火器灭火","C":"用泡沫灭火器灭火"},"a":["B"],"e":"电器设备火灾要用二氧化碳或干粉灭火器，不导电也不损坏设备；水导电，泡沫含水同样导电，都不能用。"},{"id":82,"c":"安全通识","l":"I","t":0,"q":"实验室发生火灾时,实验室工作人员的主要责任是（ ）","o":{"A":"组织人员灭火","B":"撤离实验室","C":"拨打119火警电话","D":"组织现场人员安全撤离"},"a":["D"],"e":"实验室火灾时工作人员主要责任是组织现场人员安全撤离，先保人命；灭火、报警都要在确保自身安全的前提下进行。"},{"id":83,"c":"安全通识","l":"I","t":0,"q":"实验室各种管理规章制度应该（ ）。","o":{"A":"上墙或便于取阅的地方","B":"存放在档案柜中","C":"由相关人员集中保管","D":"保存在计算机内"},"a":["A"],"e":"规章制度应上墙或放在便于取阅的地方，方便随时对照执行；锁进档案柜、只存电脑里等于形同虚设。"},{"id":84,"c":"安全通识","l":"I","t":0,"q":"实验室火灾报警电铃响时,应当（ ）","o":{"A":"立即停止实验,按照紧急预案迅速离开实验室","B":"坚持做完实验后再离开","C":"出去了解情况后再决定","D":"打电话求救。"},"a":["A"],"e":"火警铃响要立即停止实验，按应急预案迅速撤离，不恋物不锁门；坚持做完、出去看看再决定都会延误逃生。"},{"id":85,"c":"安全通识","l":"I","t":0,"q":"实验室内() 。","o":{"A":"使用闸刀开关、木质配电板和花线","B":"自己随意接、拉电线","C":"固定电源插座未经允许不得拆装、改线"},"a":["C"],"e":"固定电源插座未经允许不得拆装改线，防止接错线、接触不良引发触电火灾；闸刀开关、木质配电板、花线、私拉电线都是隐患。"},{"id":86,"c":"安全通识","l":"I","t":0,"q":"实验室钥匙不得私自配置或给他人使用。钥匙的配发、管理由谁负责？","o":{"A":"实验室负责人","B":"指导教师","C":"学生"},"a":["A"],"e":"实验室钥匙由实验室负责人统一配发管理，不得私自配置或转借他人，防止无关人员进入造成事故和物品丢失。"},{"id":87,"c":"安全通识","l":"I","t":0,"q":"实验室仪器设备用电或线路发生故障着火时,应立即（ ）,并组织人员用灭火器进行灭火。","o":{"A":"将贵重仪器设备迅速转移","B":"切断现场电源","C":"将人员疏散"},"a":["B"],"e":"仪器线路故障着火要立即切断现场电源，再组织人员用灭火器扑救；先搬设备或先疏散而不断电，火会借电蔓延。"},{"id":88,"c":"安全通识","l":"I","t":0,"q":"实验中被玻璃划伤,应首先（ ）。","o":{"A":"大量水冲洗","B":"先止血","C":"应先把碎玻璃从伤处挑出","D":"立刻就医"},"a":["C"],"e":"被玻璃划伤要先把碎玻璃从伤口挑出，再止血包扎；玻璃留在体内会加重损伤，直接按压可能把碎片压得更深。"},{"id":89,"c":"安全通识","l":"I","t":0,"q":"使用办公自动化设备时,应当遵守下列规定（ ）。","o":{"A":"不得在没有保密措施的传真机、计算机上传输或者处理涉及国家秘密的信息","B":"使用计算机信息网络国际联网传输信息不得涉及国家秘密","C":"未经原确定密级的国家机关、单位批准,不得复制国家秘密的信息;不得使用手机、无线话筒传达涉及国家秘密的信息","D":"以上都是"},"a":["D"],"e":"涉密信息不得在无保密措施的传真机、计算机上传输处理，不得联网传递，复制须经原定密单位批准，三条都要遵守。"},{"id":90,"c":"安全通识","l":"I","t":0,"q":"使用公用仪器和试剂瓶等应该有下列行为( )。","o":{"A":"立即放回原处","B":"可以随意拿放","C":"试剂瓶中试剂不足时,应自己补充","D":"试剂瓶敞口放置,取用方便"},"a":["A"],"e":"公用仪器和试剂瓶用后立即放回原处，方便他人取用也不易混淆；随意拿放、自行补充、敞口放置都会造成污染和错拿。"},{"id":91,"c":"安全通识","l":"I","t":0,"q":"使用灭火器扑救火灾时要对准火焰（ ）喷射。","o":{"A":"上部","B":"中部","C":"根部"},"a":["C"],"e":"灭火器要对准火焰根部喷射，才能切断燃烧物与氧气的接触；对着上部或中部喷，药剂被热气带走，灭不了火。"},{"id":92,"c":"安全通识","l":"I","t":0,"q":"使用手持电动工具时,下列注意事项正确的是（ ）。","o":{"A":"使用万能插座","B":"使用漏电保护器","C":"身体或衣服潮湿"},"a":["B"],"e":"手持电动工具要配漏电保护器，一漏电就跳闸；万能插座接触不良易过热，身体或衣服潮湿更增加触电风险。"},{"id":93,"c":"安全通识","l":"I","t":0,"q":"疏散楼梯的最小宽度不宜小于( )米。","o":{"A":"1.20米","B":"1.10米","C":"1.00米"},"a":["B"],"e":"疏散楼梯最小宽度不宜小于1.10米，保证两人并行和担架通过；1.00米偏窄，1.20米是更宽的要求而非最小值。"},{"id":94,"c":"安全通识","l":"I","t":0,"q":"停电检修时,在一经合闸即可送电到工作地点的开关或刀闸的操作把手上,应悬挂（ ）标示牌。","o":{"A":"“请勿靠近”","B":"“止步,高压危险”","C":"“禁止合闸,有人工作”"},"a":["C"],"e":"停电检修时在可能送电的开关操作把手上挂“禁止合闸，有人工作”标示牌，直接告诉别人别合闸；“止步，高压危险”是警告不是禁操。"},{"id":95,"c":"安全通识","l":"I","t":0,"q":"脱卸个人防护装备的顺序是（ ）。","o":{"A":"外层手套→防护眼镜→防护服→口罩帽子→内层手套","B":"防护眼镜→外层手套→口罩帽子→防护服→内层手套","C":"防护服→防护眼镜→口罩帽子→外层手套→内层手套","D":"口罩帽子→外层手套→防护眼镜→内层手套→防护服"},"a":["A"],"e":"脱防护装备按外层手套、防护眼镜、防护服、口罩帽子、内层手套的顺序，由污染最重到最轻，最后脱内层手套避免污染双手。"},{"id":96,"c":"安全通识","l":"I","t":0,"q":"往玻璃管上套橡皮管（塞）时,不正确的做法是（ ）。","o":{"A":"管端应烧圆滑","B":"用布裹手或带厚手套,以防割伤手","C":"可以使用薄壁玻管"},"a":["C"],"e":"薄壁玻管强度差，套橡皮管时容易被压碎割手，应选厚壁玻管并把管端烧圆滑；裹布戴手套、烧圆管口都是防割伤的正确做法。"},{"id":97,"c":"安全通识","l":"I","t":0,"q":"为避免误食有毒的化学药品,以下说法正确的是（ ）。","o":{"A":"可把食物、食具带进化验室","B":"在实验室内可吃口香糖","C":"使用化学药品后须先洗净双手方能进食","D":"实验室内可以吸烟"},"a":["C"],"e":"实验室禁带食物食具、禁吃口香糖、禁吸烟，药品会经手口进入体内；接触化学品后先洗净双手再进食，是最基本的防误食措施。"},{"id":98,"c":"安全通识","l":"I","t":0,"q":"为防止静电火花引起事故,凡是用来加工、贮存、运输各种易燃气、液、粉体的金属设备、非导电材料都必须（ ）。","o":{"A":"有足够大的电阻","B":"有足够小的电阻","C":"可靠接地","D":"可靠绝缘"},"a":["C"],"e":"静电靠导体接地把电荷导入大地，接地电阻小才导得快；接地不良或一味绝缘都会让电荷积聚放电打火，故加工贮运易燃物的设备必须可靠接地。"},{"id":99,"c":"安全通识","l":"I","t":0,"q":"为了减少电击（触电）事故对人体的损伤,经常用到电流型漏电保护开关,其保护指标设置为≤30mAS。请从下列选项中选择其正确含义。","o":{"A":"流经人体的电流（以毫安为单位）和时间（以秒为单位）的乘积小于30。例如电流为30mA则持续的时间必须小于1秒","B":"流经人体的电流必须小于 30毫安","C":"流经人体电流的持续时间必须小于1秒"},"a":["A"],"e":"30mAS是电流与持续时间的乘积，衡量人体承受的电击能量；30mA下须小于1秒，乘积越小伤害越轻，不是单纯限流或限时。"},{"id":100,"c":"安全通识","l":"I","t":0,"q":"违反《中华人民共和国消防法》行为,构成犯罪的,应（ ）。","o":{"A":"依法给予行政处罚","B":"依法追究刑事责任","C":"给予罚款或拘留"},"a":["B"],"e":"违反消防法情节严重、构成犯罪的，由司法机关依法追究刑事责任；行政处罚、罚款拘留只适用于尚不构成犯罪的违法行为，代替不了刑罚。"},{"id":101,"c":"安全通识","l":"I","t":0,"q":"我国大陆通用的火警电话号码是（ ）。","o":{"A":"999","B":"119"},"a":["B"],"e":"大陆火警电话是119，报警要讲清地点、火情并留人接应；999是部分地区急救号码，别记混。"},{"id":102,"c":"安全通识","l":"I","t":0,"q":"吸湿性强、遇水释放较多热量的化学品沾染皮肤后应立刻（ ）。","o":{"A":"用清水清洗","B":"用冷水清洗","C":"用软纸、软布抹去"},"a":["C"],"e":"吸湿性强、遇水放热的药品（如生石灰）先用水冲会加剧放热灼伤，应先用软纸软布轻轻抹去，再按规范处理创面并就医。"},{"id":103,"c":"安全通识","l":"I","t":0,"q":"下列灭火器中,最适于扑灭电气火灾的是（ ）。","o":{"A":"二氧化碳灭火器","B":"干粉灭火器","C":"泡沫灭火器"},"a":["A"],"e":"二氧化碳不导电、灭火后不留残渣，最适合电气火灾；泡沫含水导电，干粉虽能用但会污染精密设备，故首选二氧化碳。"},{"id":104,"c":"安全通识","l":"I","t":0,"q":"下列有关使用漏电保护器的说法,正确的是（ ）。","o":{"A":"漏电保护器既可用来保护人身安全,还可用来对低压系统或设备的对地绝缘状况起到监督作用","B":"漏电保护器安装点以后的线路不可对地绝缘","C":"漏电保护器在日常使用中不可在通电状态下按动实验按钮来检验其是否可靠","D":"对两相触电起保护作用"},"a":["A"],"e":"漏电保护器漏电时迅速断电，既护人身，也能反映低压系统对地绝缘状况；它防不了两相触电，安装点后线路仍须对地绝缘，平时要按试验按钮检查。"},{"id":105,"c":"安全通识","l":"I","t":0,"q":"选择实验室设备时应符合一些基本原则,下面哪一项叙述错误（ ）。","o":{"A":"在设计上应能阻止或限制操作人员与感染性物质间的接触","B":"建筑材料应防水、耐腐蚀并符合结构要求","C":"设备装配后应有毛刺、锐角以及不易松动的部件","D":"设备的设计、建造与安装应便于操作、易于维护、清洁、清除污染和进行质量检验"},"a":["C"],"e":"设备装配后应无毛刺、无锐角且部件紧固，C把缺陷当成要求，明显违背原则；其余选项强调防接触、耐腐蚀、易清洁维护，都正确。"},{"id":106,"c":"安全通识","l":"I","t":0,"q":"学校教学楼应配备的灭火器型号是（ ）。","o":{"A":"ABC干粉灭火器","B":"BC干粉灭火器","C":"泡沫灭火器"},"a":["A"],"e":"教学楼有木材纸张、电器和少量液体，ABC干粉能灭固体、液体、气体火灾，适用面广；BC干粉灭不了固体，泡沫导电又伤设备。"},{"id":107,"c":"安全通识","l":"I","t":0,"q":"以下符合急救与防护“四先四后”原则的是（ ）。","o":{"A":"先抢后救","B":"先轻后重","C":"先缓后急","D":"先病后伤"},"a":["A"],"e":"四先四后是先抢后救、先重后轻、先急后缓、先伤后病，核心是先把人从危险环境抢出来再施救；其余三项都把顺序说反了。"},{"id":108,"c":"安全通识","l":"I","t":0,"q":"以下关于用电常识说法错误的是（ ）。","o":{"A":"不用潮湿的手接触电器","B":"电源裸露部分应有绝缘装置","C":"如有人触电,应迅速切断电源,然后进行抢救","D":"可用试电笔去试高压电"},"a":["D"],"e":"试电笔只适用于低压，测高压会击穿绝缘造成触电；不用湿手碰电器、裸露部分加绝缘、触电先断电再抢救都是对的。"},{"id":109,"c":"安全通识","l":"I","t":0,"q":"以下哪项不是呼吸、心跳停止的表现？（ ）。","o":{"A":"意识忽然丧失","B":"颈动脉搏动不能触及","C":"面色苍白转而紫绀","D":"瞳孔缩小"},"a":["D"],"e":"呼吸心跳停止时意识丧失、大动脉摸不到搏动、面唇紫绀，瞳孔是散大固定而非缩小；瞳孔缩小多见于中毒等，不能据此判断。"},{"id":110,"c":"安全通识","l":"I","t":0,"q":"以下有关实验室用电的注意事项中,不正确的是？","o":{"A":"实验前先检查用电设备,再接通电源;实验结束后,先关仪器设备,再关闭电源。","B":"工作人员离开实验室或遇突然断电,应关闭电源,尤其要关闭加热电器的电源开关。","C":"电源或电器设备的保险丝烧断后,可以用其它金属导线代替。","D":"电源开关附近不得存放易燃易爆物品或堆放杂物。"},"a":["C"],"e":"保险丝按额定电流熔断，用铜丝铁丝代替会失去过流保护，线路过热易起火；先接设备后关电源、人走断电、开关旁不堆易燃物都正确。"},{"id":111,"c":"安全通识","l":"I","t":0,"q":"以下止血方法中,（ ）不作为首选应用。","o":{"A":"直接压迫止血法","B":"止血点压迫止血法","C":"填塞止血法","D":"止血带止血法"},"a":["D"],"e":"止血首选直接压迫，其次压迫止血点、填塞；止血带会阻断远端血运、易致组织坏死，只在大出血他法无效时短时使用并记录时间。"},{"id":112,"c":"安全通识","l":"I","t":0,"q":"因实验需要拉接电源线,下列哪种说法是正确的？","o":{"A":"不得任意放置于通道上,以免因绝缘破损造成短路或影响通行","B":"插座不足时,可连续串接","C":"插座不足时,可连续分接","D":"不考虑负荷容量"},"a":["A"],"e":"临时电源线不得横穿通道，绝缘破损会短路、绊人；插座不足只能合理增容，不能串接分接否则超载发热，负荷容量必须核算。"},{"id":113,"c":"安全通识","l":"I","t":0,"q":"引发电气火灾的初始原因是（ ）。","o":{"A":"电源保险丝不起作用","B":"带电改接电气线路","C":"线路或设备过电流运行","D":"没有保护性接零或接地"},"a":["C"],"e":"过电流使导线和设备发热，是引发电气火灾的初始原因；保险丝失效、缺接地、带电改线只是隐患或诱因，不直接产生高温。"},{"id":114,"c":"安全通识","l":"I","t":0,"q":"引发火灾的点火源,其实质是( )。","o":{"A":"助燃","B":"提供初始能量","C":"加剧反应","D":"延长燃烧时间"},"a":["B"],"e":"点火源的作用是把可燃物加热到着火点，提供燃烧所需的初始能量；助燃靠氧气，点火源本身并不助燃，也不延长燃烧。"},{"id":115,"c":"安全通识","l":"I","t":0,"q":"引起电器线路火灾的原因是:","o":{"A":"短路","B":"电火花","C":"负荷过载","D":"以上都是"},"a":["D"],"e":"短路、电火花、过负荷都会使线路局部高温或引燃周围物，都是电气线路火灾的常见原因，要综合防范，不能只盯一项。"},{"id":116,"c":"安全通识","l":"I","t":0,"q":"应怎样处理溅到皮肤上的腐蚀性液体？ ( )","o":{"A":"用干布抹去","B":"用大量清水冲洗","C":"用绷带包扎患处,请医生治疗","D":"用医用酒精清洗"},"a":["B"],"e":"腐蚀性液体溅到皮肤，越早用大量流动清水冲洗越好，可稀释并带走酸碱；干布擦、酒精洗、直接包扎都会加重损伤，冲洗后再就医。"},{"id":117,"c":"安全通识","l":"I","t":0,"q":"用公钥加密,用私钥解密,主是为了保证信息的（ ）。","o":{"A":"保密性","B":"完整性","C":"身份确认性","D":"不可否认性"},"a":["A"],"e":"公钥加密私钥解密，只有持私钥者能解开，保证信息不被他人读取，即保密性；完整性靠哈希，身份确认和不可否认靠数字签名。"},{"id":118,"c":"安全通识","l":"I","t":0,"q":"由于行为人的过失引起火灾,造成严重后果,危害公共安全的行为,构成:","o":{"A":"纵火罪","B":"失火罪","C":"玩忽职守罪","D":"重大责任事故罪"},"a":["B"],"e":"过失引起火灾、造成严重后果并危害公共安全，构成失火罪；故意放火是纵火罪，玩忽职守和重大责任事故罪针对特定职务或生产责任。"},{"id":119,"c":"安全通识","l":"I","t":0,"q":"有人触电时,使触电人员脱离电源的错误方法是:","o":{"A":"借助工具使触电者脱离电源","B":"抓触电人的手","C":"抓触电人的干燥外衣","D":"切断电源"},"a":["B"],"e":"人触电后身上带电，直接抓其手会让施救者一起触电；应先断电，或用干燥木棍、绝缘工具挑开电线，也可抓其干燥外衣拖拉。"},{"id":120,"c":"安全通识","l":"I","t":0,"q":"有异物刺人头部或胸部时,以下哪种急救方法是错误的？","o":{"A":"快速送往医院救治。","B":"用毛巾等物将异物固定住,不让其乱动。","C":"马上拔出,进行止血"},"a":["C"],"e":"异物刺入头胸可能已伤及大血管，贸然拔出会大出血，应固定异物、保持原位并快速送医；固定和送医这两项都是对的。"},{"id":121,"c":"安全通识","l":"I","t":0,"q":"诱发安全事故的原因是（ ）。","o":{"A":"设备的不安全状态和人的不安全行为","B":"不良的工作环境","C":"劳动组织管理的缺陷","D":"以上都是"},"a":["D"],"e":"事故是设备不安全状态、人的不安全行为、不良环境和组织管理缺陷共同作用的结果，查隐患要从人机环管四方面入手。"},{"id":122,"c":"安全通识","l":"I","t":0,"q":"预防电击 （触电） 的一条重要措施是用电设备的金属外壳要有效接地。请从下列选项中选择可靠的接地点。（ ）","o":{"A":"单相供电的2根线分别称为火线和地线,选择其中的地线接地。","B":"三相供电中的中性点电压应该为零,可以选择这个中性点来接地。","C":"实验室内的自来水管（暖气管）是埋设于地下的金属管相连的,可用来接地。","D":"专门埋设地下、保证接地电阻很小专用地线。","E":"避雷针的接地线。"},"a":["D"],"e":"设备外壳接地必须接到接地电阻合格的专用地线；把零线、中性点、自来水管暖气管或避雷针引下线当地线，会引入触电和雷击危险。"},{"id":123,"c":"安全通识","l":"I","t":0,"q":"预防电气火灾的基本措施有（ ）。","o":{"A":"禁止非电工改接电气线路,禁止乱拉临时用电线路","B":"做电气类实验时应该2人及以上在场","C":"从工作现场清除易燃易爆材料","D":"以上都是"},"a":["D"],"e":"防电气火灾要禁止非电工乱拉乱接、带电作业有人监护、清走现场易燃物，三条都是基本措施，缺一不可。"},{"id":124,"c":"安全通识","l":"I","t":0,"q":"遇水燃烧物质起火时,不能用( )扑灭。","o":{"A":"干粉灭火剂","B":"泡沫灭火剂","C":"二氧化碳灭火剂"},"a":["B"],"e":"遇水燃烧物质（如金属钠、电石）遇水会放热并放出可燃气体，泡沫含水会助燃甚至爆炸，应改用干粉、干砂覆盖窒息。"},{"id":125,"c":"安全通识","l":"I","t":0,"q":"在火灾初发阶段,应采取哪种方法撤离？","o":{"A":"乘坐电梯","B":"用湿毛巾捂住口鼻低姿从安全通道撤离","C":"跳楼逃生","D":"跑到楼顶呼救"},"a":["B"],"e":"初起火灾烟气往上聚，湿毛巾捂口鼻、低姿沿安全通道撤离最有效；电梯可能断电停运，跳楼和跑到楼顶都会把自己困住。"},{"id":126,"c":"安全通识","l":"I","t":0,"q":"在火灾逃生方法中,以下不正确的是:","o":{"A":"用湿毛巾捂着嘴巴和鼻子","B":"弯着身子快速跑到安全地点","C":"躲在床底下,等待消防人员救援","D":"马上从最近的消防通道跑到安全地点。"},"a":["C"],"e":"躲在床下会被浓烟高温困住且不易被发现，是错误做法；捂口鼻、弯腰快跑、走消防通道撤离才是正确逃生方式。"},{"id":127,"c":"安全通识","l":"I","t":0,"q":"在进行实验中,是否可以配戴隐形眼镜？（ ）","o":{"A":"可以","B":"不可以","C":"不一定"},"a":["B"],"e":"实验中可能有化学品蒸气、粉尘和高温，隐形眼镜会吸附污染物、妨碍冲洗，还可能被热辐射烤坏，故实验时不宜佩戴。"},{"id":128,"c":"安全通识","l":"I","t":0,"q":"在设备使用之前,是否要按要求进行登记？（ ）","o":{"A":"是","B":"不用","C":"无所谓"},"a":["A"],"e":"设备使用前登记，是为掌握使用人、时间和状态，出故障或事故能追溯，也便于安排维护，属于实验室基本管理要求。"},{"id":129,"c":"安全通识","l":"I","t":0,"q":"在实验室区域内,可以（ ）。","o":{"A":"吸烟、烹饪、用膳","B":"睡觉过夜和进行娱乐活动","C":"做与学习、工作有关的事情"},"a":["C"],"e":"实验室是作业场所，禁止吸烟、烹饪、进食和过夜娱乐，只做与学习工作相关的事，避免引入火源、污染和疲劳操作。"},{"id":130,"c":"安全通识","l":"I","t":0,"q":"在实验室中,应放在第一位的是（ ）。","o":{"A":"实验结果","B":"实验安全","C":"实验创新性","D":"实验可行性"},"a":["B"],"e":"没有安全就没有实验结果，安全是开展一切实验的前提；创新性、可行性都要在保证安全的前提下再谈。"},{"id":131,"c":"安全通识","l":"I","t":0,"q":"在使用设备时,如果发现设备工作异常,应（ ）。","o":{"A":"停机并报告相关负责人员","B":"关机走人","C":"继续使用,注意观察","D":"停机自行维修"},"a":["A"],"e":"设备异常应立即停机断电并报告负责人，防止带病运行扩大故障或伤人；自行维修和继续观察都可能引发事故，关机走人则留下隐患。"},{"id":132,"c":"安全通识","l":"I","t":0,"q":"在室外灭火时,应站在（ ）。","o":{"A":"上风","B":"下风"},"a":["A"],"e":"室外灭火站上风方向，烟火和有害气体被吹离自己，视线也更清楚；站下风会被烟熏、被火苗扑到。"},{"id":133,"c":"安全通识","l":"I","t":0,"q":"在相对封闭的房间里发生火灾时,（ ）。","o":{"A":"不能随便开启门窗","B":"只能开窗","C":"只能开门"},"a":["A"],"e":"封闭房间着火时开门窗会涌入新鲜空气助燃，烟火还会窜出伤人；应先判断火情，需要排烟时由专业人员有控制地进行。"},{"id":134,"c":"安全通识","l":"I","t":0,"q":"造成触电事故的因素是（ ）。","o":{"A":"电流流过人体","B":"电压","C":"电场","D":"磁场"},"a":["A"],"e":"触电伤害由通过人体的电流决定，电流大小和持续时间决定损伤程度；电压只是产生电流的条件，电场磁场并不直接造成电击。"},{"id":135,"c":"安全通识","l":"I","t":0,"q":"长期在高频电磁场作用下,操作者会有（ ）不良反应。","o":{"A":"呼吸困难","B":"神经失常","C":"疲劳无力"},"a":["C"],"e":"长期处于高频电磁场，常见反应是乏力、头昏、失眠、记忆力下降等神经衰弱表现；呼吸困难、神经失常并非典型症状。"},{"id":136,"c":"安全通识","l":"I","t":0,"q":"窒息灭火法是将氧气浓度降低至最低限度,以防止火势继续扩大。其主要工具是（ ）。","o":{"A":"砂子","B":"水","C":"二氧化碳灭火器","D":"干粉灭火器"},"a":["C"],"e":"窒息法靠降低氧浓度灭火，二氧化碳不燃不导电，喷出后迅速排挤空气覆盖火面；砂子也能窒息，但灭火器中典型的是二氧化碳。"},{"id":137,"c":"安全通识","l":"I","t":1,"q":"（ ）不可以直接排放入下水道。","o":{"A":"冷凝水","B":"废酸废碱液","C":"有机溶剂"},"a":["B","C"],"e":"废酸废碱和有机溶剂必须分类收集交专业处置，直接倒下水道会腐蚀管道、污染水体甚至引发反应；冷凝水相对洁净，可按规排放。"},{"id":138,"c":"安全通识","l":"I","t":1,"q":"《中华人民共和国消防法》规定:( ）行为,应当处警告或罚款。","o":{"A":"指使或者强令他人违反消防安全规定,冒险作业,尚未造成严重后果的","B":"埋压、圈占消火栓或者占用防火间距、堵塞消防通道的,或者损坏和擅自挪用、拆除、停用消防设施、器材的","C":"有重大火灾隐患,经公安消防机构通知逾期不改正的","D":"为报复单位或个人,故意纵火的"},"a":["A","B","C"],"e":"指使强令冒险作业、埋压圈占消防设施、重大隐患逾期不改，都是消防法规定可警告或罚款的行为；故意纵火已构成犯罪，要追刑责。"},{"id":139,"c":"安全通识","l":"I","t":1,"q":"《中华人民共和国消防法》规定:任何单位、个人都有（ ）的义务。","o":{"A":"维护消防安全","B":"保护消防设施","C":"预防火灾","D":"报告火警"},"a":["A","B","C","D"],"e":"消防法规定任何单位和个人都有维护消防安全、保护消防设施、预防火灾、报告火警的义务，四项都要选，漏选不得分。"},{"id":140,"c":"安全通识","l":"I","t":1,"q":"干粉灭火器适用于（ ）。","o":{"A":"电器起火","B":"可燃气体起火","C":"有机溶剂起火"},"a":["A","B","C"],"e":"干粉靠粉末覆盖隔绝氧气并抑制链反应，电器、可燃气体和有机溶剂火灾都适用；但金属火灾需专用干粉，不能一概而论。"},{"id":141,"c":"安全通识","l":"I","t":1,"q":"被火困在高楼室内应（ ）","o":{"A":"跳楼","B":"到窗口或阳台挥动物品求救","C":"躲到床下","D":"用床单或绳子拴在室内牢固处下到下一层逃生"},"a":["B","D"],"e":"被火困在高楼，应到窗口阳台挥物呼救，或用床单绳索拴牢下到下一层；跳楼和躲床下都会送命，是错误选项。"},{"id":142,"c":"安全通识","l":"I","t":1,"q":"必须配备以下紧急装备（ ）。","o":{"A":"急救箱,包括常用的和特殊的解毒剂","B":"合适的灭火器和灭火毯","C":"担架","D":"工具,如锤子、斧子、扳手、螺丝刀、梯子和绳子"},"a":["A","B"],"e":"实验室必须配急救箱（含常用及特殊解毒剂）和适用的灭火器、灭火毯，用于第一时间自救；担架和工具属可选配置，不是必备。"},{"id":143,"c":"安全通识","l":"I","t":1,"q":"拨打“119”报火警时,应讲清哪些事项( )。","o":{"A":"要讲清楚起火单位、村镇名称和所处区县、街巷、门牌号码","B":"要讲清什么物品着火、火势大小如何、有无爆炸物品、危险化学品、是否有人员被围困","C":"要讲清报警人的姓名、单位及使用的电话号码","D":"清楚、简洁地回答消防队的询问"},"a":["A","B","C","D"],"e":"报火警要讲清地址、燃烧物与火势、有无爆炸危险品和人员被困，还要留下报警人姓名电话并回答询问，信息越全出警越准。"},{"id":144,"c":"安全通识","l":"I","t":1,"q":"常用的灭火方法有（ ）。","o":{"A":"隔离灭火法","B":"冷却灭火法","C":"窒息灭火法","D":"抑制灭火法"},"a":["A","B","C","D"],"e":"灭火四法即隔离、冷却、窒息、抑制，分别对应移走可燃物、降温、隔氧和中断链反应，四种都要选全。"},{"id":145,"c":"安全通识","l":"I","t":1,"q":"电器线路火灾的基本原因有（ ）。","o":{"A":"短路","B":"过负荷","C":"接触电阻过大","D":"电火花","E":"电弧"},"a":["A","B","C","D","E"],"e":"短路、过负荷、接触电阻过大都会发热，电火花和电弧则直接点燃周围物，五项都是电气线路火灾的基本原因。"},{"id":146,"c":"安全通识","l":"I","t":1,"q":"发生电器火灾时可以使用的灭火设备包括（ ）。","o":{"A":"干粉灭火器","B":"泡沫灭火器","C":"二氧化碳灭火器","D":"灭火水龙"},"a":["A","C"],"e":"电器火灾要先断电，用干粉或二氧化碳这类不导电灭火剂；泡沫和水龙含水导电，会造成触电和设备损坏。"},{"id":147,"c":"安全通识","l":"I","t":1,"q":"发生火灾,在疏散逃生过程中（ ）。","o":{"A":"可以用折叠多层的湿毛巾、口罩捂住口鼻","B":"可用浸湿的棉被、棉大衣等披在身上","C":"尽量将身体贴近地面匍匐（或弯腰低姿）前进","D":"到处乱跑"},"a":["A","B","C"],"e":"逃生时湿毛巾捂口鼻、湿棉被披身、低姿贴地前进，可隔热滤烟；到处乱跑会吸入更多烟气并迷失方向。"},{"id":148,"c":"安全通识","l":"I","t":1,"q":"发生火灾拨通“119”后,应向“119”台报告（ ）,并派人到适当位置迎接消防车到来。","o":{"A":"火灾详细地点","B":"火势大小","C":"燃烧物质及受影响的物质","D":"人员被困情况"},"a":["A","B","C","D"],"e":"报119要说清详细地点、火势大小、燃烧物及受影响物质、有无人员被困，并派人到路口迎接消防车，四项都必要。"},{"id":149,"c":"安全通识","l":"I","t":1,"q":"发生火灾后,如何逃生？（ ）","o":{"A":"发生火灾后,应选择电梯逃生。","B":"逃离火场的路线上遇有浓烟烈火时,必须把自己的衣服淋湿,再找一块湿毛巾捂住口鼻,以起到隔热虑毒的作用。","C":"在有浓烟的情况下,采用低姿势撤离,视线不清时,手摸墙壁徐徐撤离。","D":"楼道内烟雾过浓,无法冲出时,应利用窗户阳台逃生,拴上安全绳或床单逃生。"},"a":["B","C","D"],"e":"逃生要淋湿衣服、湿毛巾捂口鼻、低姿摸墙撤离，通道不通时可结绳从窗台逃生；火灾时乘电梯可能断电被困，绝不能选。"},{"id":150,"c":"安全通识","l":"I","t":1,"q":"高层建筑火灾的特点为( )。","o":{"A":"火势蔓延快,途径多。高层建筑内电梯井,各种管道井比较多,发生火灾能很快形成“烟囱效应”,造成火灾扩大蔓延。","B":"人员疏散困难,伤亡严重。由于高层建筑比较高,火灾时,人员要安全撤离建筑物,需要较长的时间,再加上火灾时,人员极度恐慌,造成疏散困难。","C":"火灾扑救困难。由于高层建筑比较高,发生火灾后,消防车很难达到,只能靠内部的消防设施扑救。","D":"易燃合成材料多,燃烧猛烈。"},"a":["A","B","C","D"],"e":"高层建筑管道井多易形成烟囱效应、人员多疏散慢、消防车难以靠高、合成材料燃烧猛烈，四个特点都成立。"},{"id":151,"c":"安全通识","l":"I","t":1,"q":"火场逃生的方法有（ ）。","o":{"A":"用手巾,手帕捂鼻护嘴","B":"乘坐普通电梯逃生","C":"寻找避难处所","D":"利用疏散通道逃生"},"a":["A","C","D"],"e":"火场逃生可用湿毛巾手帕护口鼻、寻找避难处所、走疏散通道；普通电梯断电会困人，火灾时严禁乘坐。"},{"id":152,"c":"安全通识","l":"I","t":1,"q":"火灾的发展过程可分为（ ）。","o":{"A":"阴燃阶段","B":"初起阶段","C":"发展阶段","D":"下降阶段"},"a":["B","C","D"],"e":"火灾发展分初起、发展、下降（衰减）三个阶段，阴燃只是某些固体燃烧的一种形式，不是普遍阶段。"},{"id":153,"c":"安全通识","l":"I","t":1,"q":"火灾发生时,正确的应对方法是（）","o":{"A":"以湿毛巾掩口鼻呼吸,降低姿势,匍匐前进,以减少吸入浓烟","B":"爬行时将手心、手肘、膝盖紧靠地面,并沿墙壁边缘逃生,以免走错方向","C":"就近逃入电梯,等待救援"},"a":["A","B"],"e":"湿毛巾掩口鼻低姿匍匐可减少烟气吸入，沿墙爬行能辨方向；就近进电梯会被烟火和断电困住，不能选。"},{"id":154,"c":"安全通识","l":"I","t":1,"q":"火灾蔓延的途径有（ ）。","o":{"A":"热传导","B":"热对流","C":"热辐射"},"a":["A","B","C"],"e":"火灾通过热传导、热对流和热辐射三种方式蔓延，管道、热气流和辐射热都能把火引到相邻区域。"},{"id":155,"c":"安全通识","l":"I","t":1,"q":"火灾时如果你被困在室内如何待救？( )","o":{"A":"至易获救处待救（如靠近大马路之窗口附近,或与入口较近之房间等）","B":"设法告知外面的人（用电话、手机通知119你受困的位置,或直接以衣物、灯光于 窗口呼叫）","C":"防阻烟流串进来"},"a":["A","B","C"],"e":"被困室内应到窗口等易被发现处、用电话灯光衣物呼救、堵住门缝防烟流入，三项都是正确待救方法。"},{"id":156,"c":"安全通识","l":"I","t":1,"q":"火灾事故单位在火灾扑灭后,为隐瞒、掩饰起火原因、推卸责任,故意破坏现场或者伪造现场,尚不构成犯罪。对直接负责的主管人员,可以（ ）。","o":{"A":"处以罚款","B":"给予警告","C":"依法追究刑事责任","D":"处15日以下拘留"},"a":["A","B","D"],"e":"尚不构成犯罪的，对直接负责人员可警告、罚款、处十五日以下拘留；追究刑事责任只适用于已构成犯罪的情形，故不选C。"},{"id":157,"c":"安全通识","l":"I","t":1,"q":"火灾事故分为哪些等级？（ ）","o":{"A":"一般火灾","B":"较大火灾","C":"重大火灾","D":"特别重大火灾"},"a":["A","B","C","D"],"e":"按人员伤亡和财产损失，火灾分为一般、较大、重大、特别重大四级，四个等级都要选。"},{"id":158,"c":"安全通识","l":"I","t":1,"q":"火灾预防的的基本措施包括（ ）。","o":{"A":"控制可燃物","B":"隔绝助燃物","C":"消除着火源"},"a":["A","B","C"],"e":"防火的基本措施就是控制可燃物、隔绝助燃物、消除着火源，切断燃烧三要素中的任一环节即可预防火灾。"},{"id":159,"c":"安全通识","l":"I","t":1,"q":"静电的电量虽然不大,但其放电时产生的静电火花会有可能引起爆炸和火灾,比较常见的是放电时瞬间的电流造成精密实验仪器损坏,正确的预防措施有（ ）。","o":{"A":"适当的提高工作场所的湿度","B":"进行特殊危险实验时,操作人员应先接触设置在安全区内的金属接地棒,以消除人体电位","C":"尽量穿不宜产生静电的工作服,不要在易产生静电的场所梳理头发","D":"计算机进行维护时,先将手触摸其他金属导电体,然后再拆机"},"a":["A","B","C","D"],"e":"提高湿度、先触摸接地棒泄放人体电荷、穿防静电服、拆机前摸金属体，都是防静电放电的常用措施，四项全选。"},{"id":160,"c":"安全通识","l":"I","t":1,"q":"面对火灾,以下哪些逃生方法是正确的","o":{"A":"选择逃生通道自救","B":"结绳下滑自救","C":"向外界求救","D":"乘坐电梯逃生"},"a":["A","B","C"],"e":"应走逃生通道、结绳下滑、向外界求救；乘电梯逃生在火灾中可能断电被困，是错误方法。"},{"id":161,"c":"安全通识","l":"I","t":1,"q":"灭火的基本方法有( )。","o":{"A":"窒息灭火法","B":"冷却灭火法","C":"隔离灭火法","D":"抑制灭火法"},"a":["A","B","C","D"],"e":"灭火基本方法有窒息、冷却、隔离、抑制四种，分别对应隔氧、降温、移走可燃物和中断燃烧链反应。"},{"id":162,"c":"安全通识","l":"I","t":1,"q":"灭火的三种基本方法是什么？","o":{"A":"隔离法","B":"通风法","C":"窒息法","D":"冷却法","E":"拆除法"},"a":["A","C","D"],"e":"灭火三法指隔离、窒息、冷却；通风会补充氧气助燃，拆除也不是灭火方法，都不能选。"},{"id":163,"c":"安全通识","l":"I","t":1,"q":"灭火器出现下列（ ）情形,必须报废。","o":{"A":"筒体严重锈蚀的","B":"筒体严重变形的","C":"被火烧过的","D":"无生产厂名称和出厂年月的"},"a":["A","B","C","D"],"e":"筒体严重锈蚀、变形、被火烧过或铭牌与出厂信息缺失，都难以保证耐压和喷射可靠，必须报废，四项都符合。"},{"id":164,"c":"安全通识","l":"I","t":1,"q":"摩擦是产生静电一种主要主要原因,尤其在干燥的环境中,人体的活动和物体的移动都会产生很强的静电。 静电在突然释放的时候会对人体或设备造成损伤。请从下列选项中选择防止静电事故的主要办法。（ ）","o":{"A":"人体接触对静电敏感设备时提前释放自己身体中积累的电荷,例如带静电防护手环、使用静电防护毯","B":"在重要场合铺设防静电地板","C":"增加空气中的湿度,降低静电产生的条件","D":"用电设备都良好接地","E":"保证电路良好的绝缘"},"a":["A","B","C"],"e":"防静电靠泄放电荷、铺防静电地板和增湿降低产生条件；设备接地是防触电，保证绝缘反而使电荷不易泄放，故不选。"},{"id":165,"c":"安全通识","l":"I","t":1,"q":"某学校的一名职工拨打119谎称办公楼起火,按照消防法的规定公安消防机构可以给予（ ）行政处罚。","o":{"A":"警告","B":"二百元以上五千元以下罚款","C":"十日以下拘留","D":"十五日以下拘留"},"a":["A","B","C"],"e":"谎报火警可处警告、二百至五千元罚款或十日以下拘留；十五日以下拘留针对破坏现场等情形，不能混选。"},{"id":166,"c":"安全通识","l":"I","t":1,"q":"全部停电的工作指（ ）。","o":{"A":"室内高压设备全部停电（包括架空线路与电缆引入线在内）","B":"通至邻接高压室的门全部闭锁","C":"以及室外高压设备全部停电（包括架空线路与电缆引入线在内）"},"a":["A","B","C"],"e":"全部停电指室内外高压设备（含架空线和电缆引入线）全部停电，且通邻接高压室的门全部闭锁，三项合起来才算。"},{"id":167,"c":"安全通识","l":"I","t":1,"q":"燃烧三要素是（ ）。","o":{"A":"可燃物质","B":"火源","C":"助燃物质","D":"温度"},"a":["A","B","C"],"e":"燃烧三要素是可燃物、助燃物（氧化剂）和着火源；温度只是燃烧条件之一，本身不算要素。"},{"id":168,"c":"安全通识","l":"I","t":1,"q":"如果不慎发生割伤事故应（ ）处理。","o":{"A":"先将伤口处的玻璃碎片取出","B":"若伤口不大,用蒸馏水洗净伤口,再涂上红药水,撒上止血粉用纱布包扎好","C":"伤口较大或割破了主血管,则应用力按住主血管,防止大出血","D":"及时送医院治疗"},"a":["A","B","C","D"],"e":"割伤先取出玻璃碎片，小伤口用蒸馏水洗净消毒包扎，大出血按住血管近心端，严重时立即送医，四步都正确。"},{"id":169,"c":"安全通识","l":"I","t":1,"q":"如果你第一个发现某实验室着火,可以做哪些事情？","o":{"A":"判断火情,火源及燃烧物种类,若火势较小,容易控制,及时使用相应的灭火器材进行灭火","B":"若火势稍大,及时联系实验室负责人,迅速转移周围的可燃物,避免火势扩大,及时报警,尽可能使用灭火设施进行灭火","C":"若火势过大,不易控制,呼唤他人,正确报警,有序疏散,及时逃生。"},"a":["A","B","C"],"e":"发现着火先判断火情：小火及时扑灭，火势稍大报警并转移可燃物，火势失控则呼救、疏散逃生，三步依情况而定。"},{"id":170,"c":"安全通识","l":"I","t":1,"q":"如果睡觉时被火灾烟气呛醒,在条件允许的情况下,正确的做法是（ ）。","o":{"A":"迅速将门窗打开","B":"在逃出门之前将着火房间的门窗关好","C":"将毛巾淋湿后捂住口鼻,迅速弯腰低姿跑到安全区域","D":"躲在床底下,等待消防队前来救援"},"a":["B","C"],"e":"逃出前关好着火房间门窗可减缓烟火蔓延，湿毛巾捂口鼻低姿撤离最关键；开门窗会助燃，躲床下会被困，都不可取。"},{"id":171,"c":"安全通识","l":"I","t":1,"q":"如何安置、处理实验服（ ）。","o":{"A":"离开实验室时,防护服必须脱下并留在实验室内","B":"实验服不得穿着外出,更不能携带回家","C":"用过的工作服应先在实验室中消毒,然后统一洗涤或丢弃"},"a":["A","B","C"],"e":"实验服只能留在实验室、不得穿出或带回家，用过要先消毒再统一洗涤或丢弃，防止把污染物带出污染环境。"},{"id":172,"c":"安全通识","l":"I","t":1,"q":"实验过程中发生烧烫(灼)伤,正确的处理方法是（ ）","o":{"A":"浅表的小面积灼伤,以冷水冲洗 15 至 30 分钟至散热止痛","B":"以生理食盐水擦拭（勿以药膏、牙膏、酱油涂抹或以纱布盖住）","C":"若有水泡可自行刺破","D":"大面积的灼伤,应紧急送至医院"},"a":["A","B","D"],"e":"小面积灼伤用冷水冲15至30分钟散热止痛，可用生理盐水轻擦，大面积立即送医；水泡不可自行刺破，以免感染。"},{"id":173,"c":"安全通识","l":"I","t":1,"q":"实验开始前应该做好（ ）准备。","o":{"A":"必须认真预习,理清实验思路","B":"应仔细检查仪器是否有破损,掌握正确安装使用仪器的要点","C":"弄清水、电、气的管线开关和标记,保持清醒头脑,避免违规操作","D":"了解实验中使用的药品的性能和有可能引起的危害及相应的注意事项"},"a":["A","B","C","D"],"e":"实验前要预习理清思路、检查仪器并掌握操作规程、弄清水电气管线开关、了解药品性质和危害，四项准备缺一不可。"},{"id":174,"c":"安全通识","l":"I","t":1,"q":"实验室发生火灾后,正确的做法有( )。","o":{"A":"逃离火场的路线上遇有浓烟烈火时,把自己的衣服淋湿,再找一块湿毛巾捂住口鼻","B":"在有浓烟的情况下,采用低姿势撤离,视线不清时,手摸墙壁徐徐撤离","C":"楼道内烟雾过浓,无法冲出时,应利用窗户阳台逃生,拴上安全绳逃生","D":"如所有通道都已不通,应躲在有水源之处等待救援,高层切不可盲目跳楼"},"a":["A","B","C","D"],"e":"淋湿衣物湿毛巾捂口鼻、低姿摸墙撤离、通道不通时结绳从窗台逃生、无路可走时躲有水源处等待且不跳楼，都正确。"},{"id":175,"c":"安全通识","l":"I","t":1,"q":"实验室墙壁、天花板及地面应当（ ）。","o":{"A":"表面平整","B":"容易清洁","C":"耐腐蚀、不渗水","D":"地面防滑无缝、不铺地毯"},"a":["A","B","C","D"],"e":"实验室墙面顶面地面要平整、易清洁、耐腐蚀不渗水，地面防滑无缝且不铺地毯，便于消毒和防积尘藏污。"},{"id":176,"c":"安全通识","l":"I","t":1,"q":"实验室中的各种柜橱、试验台应当（ ）。","o":{"A":"结构牢固","B":"相互之间保持适当距离","C":"表面防水","D":"表面耐热、耐腐蚀"},"a":["A","B","C","D"],"e":"柜橱试验台要结构牢固、彼此留有间距、表面防水耐热耐腐蚀，既防倾倒碰撞，也便于清洁和应急处置。"},{"id":177,"c":"安全通识","l":"I","t":1,"q":"实验室中配备消防设备目的是（ ）。","o":{"A":"局部灭火","B":"帮助人员撤离火","C":"整体灭火","D":"应付消防部门"},"a":["A","B"],"e":"配备消防设备是为在起火初期就地扑救并掩护人员撤离，不是应付检查，也很难承担整体灭火任务。"},{"id":178,"c":"安全通识","l":"I","t":1,"q":"实验完成后离开实验室时应进行检查（ ）。","o":{"A":"切断房间内所有电源","B":"关闭房间内所有水源","C":"观察房间内是否还有灯亮","D":"静听房间内有无声音"},"a":["A","B","C","D"],"e":"离开前断电断水、查看是否还有灯亮、静听有无异常声响，都是确认无遗留隐患的必要检查，四项都要做。"},{"id":179,"c":"安全通识","l":"I","t":1,"q":"实验中用到很多玻璃器皿,容易破碎,为避免造成割伤应该注意（ ）。","o":{"A":"装配仪器时用力过猛或装配不当","B":"装配仪器时用力处远离连接部位","C":"仪器口径不合而勉强连接","D":"玻璃折断面未烧圆滑,有棱角"},"a":["A","B","C","D"],"e":"装配用力过猛、用力点远离接口、口径不合硬接、断口未烧圆滑，都会使玻璃破裂割手，四项都是应避免的情形。"},{"id":180,"c":"安全通识","l":"I","t":1,"q":"实验中造成的创伤应如何处理？（ ）","o":{"A":"伤处不能用手抚摸,也不能用水洗涤","B":"不作处理,直接就医","C":"轻伤可以涂紫药水、红药水、碘酒等","D":"必要时可用消炎药粉涂抹,用绷带包扎"},"a":["C","D"],"e":"轻伤可涂紫药水、红药水、碘酒，必要时用消炎粉并包扎；伤口不能随便抚摸，也不能不作处理直接就医，故不选A、B。"},{"id":181,"c":"安全通识","l":"I","t":1,"q":"使用ABC类干粉灭火器可以扑灭（ ）火灾。","o":{"A":"含碳固体火灾","B":"可燃液体火灾","C":"可燃气体火灾","D":"金属火灾"},"a":["A","B","C"],"e":"ABC干粉适用于含碳固体、可燃液体和可燃气体火灾；金属火灾需专用D类灭火剂，普通干粉灭不了还可能加剧。"},{"id":182,"c":"安全通识","l":"I","t":1,"q":"使用办公设备时,应当遵守下列规定（ ）","o":{"A":"不得在没有保密措施的传真机、计算机上传输或者处理涉及国家秘密的信息。","B":"使用计算机信息网络国际联网传输信息不得涉及国家秘密。","C":"未经原确定密级的国家机关、单位批准,不得复制国家秘密的信息。","D":"不得使用无线话筒传达涉及国家秘密的信息"},"a":["A","B","C","D"],"e":"涉密信息不得在无保密措施的传真机、计算机上处理，不得经国际联网传输，复制须经原定密单位批准，也不得用无线话筒传达。"},{"id":183,"c":"安全通识","l":"I","t":1,"q":"使用大功率电器会造成以下那些后果（ ）。","o":{"A":"会使电力线路负荷太重而发生跳闸事故","B":"长期使用会使电线因长期超负荷输电而老化极易引发火灾","C":"没有不良后果,能给我们带来方便","D":"电灯变暗"},"a":["A","B","D"],"e":"大功率电器会使线路过载跳闸、长期超载使电线老化引发火灾，还会拉低电压使电灯变暗；说没有不良后果是错误的。"},{"id":184,"c":"安全通识","l":"I","t":1,"q":"使用电钻或手持电动工具时应注意（ ）安全问题。","o":{"A":"所有的导电部分必须有良好的绝缘。","B":"所有的导线必须是坚韧耐用的软胶皮线。在导线进入电机的壳体处,应用胶皮圈加以保护,以防电线的绝缘层被磨损。","C":"电机进线应装有接地或接零的装置。","D":"在使用时,必须穿绝缘鞋;戴绝缘手套等防护用品。","E":"每次使用工具时,都必须严格检查。"},"a":["A","B","C","D","E"],"e":"手持电动工具要求导电部分绝缘良好、导线用坚韧胶皮线并加护圈、进线接地或接零、穿戴绝缘鞋手套、每次使用前检查，五项全对。"},{"id":185,"c":"安全通识","l":"I","t":1,"q":"使用供电延长线应注意（ ）。","o":{"A":"不得任意放置于通道上,以免因绝缘破损造成短路。","B":"必要时应加保护管并黏贴于地面。","C":"插座不足时,不能连续串接, 以免造成超载或接触不良。","D":"插座不足时,不能连续分接,以免造成超载或接触不良。"},"a":["A","B","C","D"],"e":"延长线不得放通道，必要时加保护管并固定，插座不足不能串接也不能分接，否则超载发热、接触不良打火。"},{"id":186,"c":"安全通识","l":"I","t":1,"q":"使用配有计算机的仪器设备时,不应该做的有（ ）。","o":{"A":"更改登机密码和系统设置","B":"自行安装软件","C":"玩各种电脑游戏","D":"将获得的图像、数据等资料存储在未予指定的硬盘分区上"},"a":["A","B","C","D"],"e":"公用仪器上的计算机不得改密码和系统设置、不得自行装软件、不得玩游戏、数据要存指定分区，四项都属于不该做的。"},{"id":187,"c":"安全通识","l":"I","t":1,"q":"室内消火栓箱内一般应配置有（ ）。","o":{"A":"消防水枪","B":"消防水带","C":"消防水喉","D":"消防栓"},"a":["A","B","C","D"],"e":"室内消火栓箱一般配消防水枪、水带、水喉和消火栓本体，缺一都无法正常取水灭火，四项都要选。"},{"id":188,"c":"安全通识","l":"I","t":1,"q":"水是家中最好用的灭火剂,家庭常见的火灾都可以用水扑救。但以下这些特殊火灾不能用水扑灭（ ）。","o":{"A":"带电设备火灾","B":"油类火灾","C":"特殊的化学品火灾","D":"木材火灾"},"a":["A","B","C"],"e":"带电设备用水会触电，油类用水会使油浮起流淌扩大火势，特殊化学品遇水可能反应爆炸；木材火灾可以用水扑救。"},{"id":189,"c":"安全通识","l":"I","t":1,"q":"危险化学品包括（ ）。","o":{"A":"爆炸品易燃气体易燃喷雾剂,氧化性气体,加压气体","B":"易燃液体,易燃固体,自反应物质","C":"可自燃液体,自燃自热物质,遇水放出易燃气体的物质","D":"氧化性液体,氧化性固体,有机过氧化物,金属腐蚀性"},"a":["A","B","C","D"],"e":"危险化学品包括爆炸品、各类气体、易燃液体固体、自反应和自燃物质、遇水放气物质、氧化剂、有机过氧化物及腐蚀品，四项都在其中。"},{"id":190,"c":"安全通识","l":"I","t":1,"q":"危险化学品的毒害包括（ ）方面","o":{"A":"急性毒性,皮肤腐蚀性/刺激性,严重眼损伤/眼刺激","B":"呼吸系统/皮肤过敏反应,生殖细胞突变性,致癌性","C":"生殖毒性,靶器官系统毒性","D":"水环境危害性, 放射性危害"},"a":["A","B","C","D"],"e":"危险化学品的毒害包括急性毒性、腐蚀刺激、致敏、致突变致癌、生殖和靶器官毒性以及环境与放射性危害，四项都属毒害范畴。"},{"id":191,"c":"安全通识","l":"I","t":1,"q":"为了自身安全,进入陌生场所应该先了解什么？( )","o":{"A":"避难逃生方向。","B":"安全门、梯位置,及是否未关闭、是否上锁。","C":"查看消防栓、缓降机、救助袋等各项灭火、避难器具位置。"},"a":["A","B","C"],"e":"进陌生场所先摸清逃生方向、安全门梯是否通畅、灭火与避难器具在哪，这三样决定出事时能不能跑掉，漏选一项都不得分。"},{"id":192,"c":"安全通识","l":"I","t":1,"q":"物料搬运贮存时应当至少做到（ ）。","o":{"A":"不得影响照明","B":"不得妨碍机械设备之操作","C":"不得阻碍交通或出入口","D":"不得依靠墙壁或结构支柱堆放"},"a":["A","B","C","D"],"e":"堆放物料要给照明、设备操作、通道出入口留出空间，也不能靠墙靠柱堆压，四条都是防倾倒防堵塞的基本要求，全选才得分。"},{"id":193,"c":"安全通识","l":"I","t":1,"q":"下列选项中属于防爆的措施有（ ）。","o":{"A":"控制可燃物形成爆炸性混合物","B":"防止形成爆炸性混合物的化学品泄漏","C":"消除火源","D":"安装检测和报警装置"},"a":["A","B","C","D"],"e":"防爆无非三件事：不让可燃物和空气混成爆炸性混合物、堵住泄漏、消除火源，再加检测报警提前预警，四方面配套才管用。"},{"id":194,"c":"安全通识","l":"I","t":1,"q":"心肺复苏操作步骤中的“CAB”分别指（ ）。","o":{"A":"摸颈动脉","B":"胸外按压","C":"畅通气道","D":"人工呼吸"},"a":["B","C","D"],"e":"CAB就是胸外按压、畅通气道、人工呼吸三步，先按压再通气；摸颈动脉是判断循环，不在这三步里，多选了反而错。"},{"id":195,"c":"安全通识","l":"I","t":1,"q":"学校应当加强对学生的消防宣传教育,提高学生的消防安全意识和自防自救能力,做到“三会”,即（ ）。","o":{"A":"会报火警","B":"会扑救初起火灾","C":"会自救逃生","D":"会开展防火检查"},"a":["A","B","C"],"e":"学生要会的是报火警、扑救初起火灾、自救逃生这三会；防火检查是管理人员的活儿，不属学生三会，多选就错了。"},{"id":196,"c":"安全通识","l":"I","t":1,"q":"烟气有哪些危害性（ ）。","o":{"A":"毒性","B":"高温","C":"遮光","D":"窒息性"},"a":["A","B","C","D"],"e":"烟气害人有四条：有毒、高温灼伤、遮光让人辨不清方向、缺氧窒息，低姿捂鼻逃生正是冲着这几点去的。"},{"id":197,"c":"安全通识","l":"I","t":1,"q":"药品中毒的途径有（ ）。","o":{"A":"呼吸器官吸入","B":"由皮肤渗入","C":"吞入"},"a":["A","B","C"],"e":"毒物进人体就三条路：吸进去、从皮肤渗进去、吃进去；通风、戴手套、不在实验室吃喝，正好各堵一条。"},{"id":198,"c":"安全通识","l":"I","t":1,"q":"以下哪几项是诱发安全事故的原因？","o":{"A":"设备的不安全状态。","B":"人的不安全行为。","C":"不良的工作环境。","D":"劳动组织管理的缺陷。"},"a":["A","B","C","D"],"e":"事故往往是设备不安全状态、人的不安全行为、不良环境和管理缺陷凑到一起造成的，四条都要查，只盯人就会漏。"},{"id":199,"c":"安全通识","l":"I","t":1,"q":"以下哪项属于学校“实验室安全十项禁令”内容","o":{"A":"严禁未经培训上岗","B":"严禁擅离实验岗位","C":"严禁使用违禁电器","D":"严禁环境卫生脏乱"},"a":["A","B","C","D"],"e":"未经培训不上岗、不擅离岗位、不用违禁电器、环境保持整洁，都是实验室安全十项禁令的明确要求，全选才对。"},{"id":200,"c":"安全通识","l":"I","t":1,"q":"影响电流对人体伤害程度的主要因素有（ ）。","o":{"A":"电流的大小","B":"人体电阻","C":"通电时间的长短","D":"电流的频率","E":"电压的高低","F":"触电电流经人体的途径"},"a":["A","B","C","D","E","F"],"e":"电流大小、电压高低、人体电阻、通电时间、电流频率和流经途径，六项都影响伤害程度，少选一项就低估了风险。"},{"id":201,"c":"安全通识","l":"I","t":1,"q":"用手提式灭火器灭火的正确方法是（ ）。","o":{"A":"拔去保险插销","B":"一手紧握灭火器喷嘴","C":"一手提灭火器并下压压把","D":"对准火焰猛烈部位喷射"},"a":["A","B","C"],"e":"用灭火器先拔保险销，一手握喷嘴、一手提器身压下压把；要对准火焰根部而不是最猛的地方，所以最后一项错。"},{"id":202,"c":"安全通识","l":"I","t":1,"q":"预防窃案的方法有（ ）。","o":{"A":"不留外人住宿","B":"钥匙妥为保管","C":"随手锁门、关窗配合","D":"搞好防范工作"},"a":["A","B","C","D"],"e":"防盗靠平时：不留外人住宿、钥匙收好、随手锁门窗、日常做好防范，四条都能做到，也都是必要环节。"},{"id":203,"c":"安全通识","l":"I","t":1,"q":"在（ ）情况下,开关、刀闸的操作手柄上须挂“禁止合闸,有人工作”的标示牌？","o":{"A":"一经合闸即可送电到工作地点的开关、刀闸。","B":"已停用的设备,一经合闸即有造成人身触电危险、设备损坏或引起总漏电保护器动作的开关、刀闸","C":"一经合闸会使两个电源系统并列或引起反送电的开关、刀闸"},"a":["A","B","C"],"e":"合闸就能送电到工作地点、停用设备合闸会伤人损设备、合闸会造成两电源并列或反送电，这三种情况都必须挂禁止合闸牌。"},{"id":204,"c":"安全通识","l":"I","t":1,"q":"在进行建筑内部装修时,建筑内的消火栓（ ）。","o":{"A":"其门不应被装饰物遮掩","B":"其门四周的装修材料颜色应与门的颜色有明显区别","C":"可以移动消火栓箱的位置","D":"安装铁门并上锁"},"a":["A","B"],"e":"消火栓门不能被装修遮住，门周颜色要和门有明显区别才认得出；箱体不能挪位，更不能装铁门上锁，火灾时打不开就误事。"},{"id":205,"c":"安全通识","l":"I","t":1,"q":"在有人触电时借助符合相应电压等级的绝缘工具可采用（）使触电人员脱离低压电源。","o":{"A":"切断电源","B":"借助工具使触电者脱离电源","C":"挑拉电源线"},"a":["A","B","C"],"e":"低压触电可以切断电源、用合格绝缘工具挑开电线、挑拉电源线使人脱开，关键是工具绝缘且电压等级相符，徒手绝对不行。"},{"id":206,"c":"安全通识","l":"I","t":1,"q":"遭遇火灾脱险的不正确的方法是（ ）。","o":{"A":"在平房内关闭门窗,隔断火路,等待救援。","B":"使用电梯快速脱离火场。","C":"利用绳索等,顺绳索滑落到地面。","D":"必须跳楼时要尽量缩小高度,做到双脚先落地。"},"a":["A","B"],"e":"问的是不正确做法：平房关门等救援要看火情，坐电梯逃生更危险，这两条错；顺绳下滑、被迫跳楼时缩小高度才是对的。"},{"id":207,"c":"安全通识","l":"I","t":1,"q":"造成电气火灾的原因有可能是（ ）。","o":{"A":"短路","B":"过负荷","C":"电热器具使用不当","D":"漏电"},"a":["A","B","C","D"],"e":"短路、过负荷、电热器具使用不当、漏电，都会让线路局部过热或打火，引燃周围可燃物就成了电气火灾。"},{"id":208,"c":"安全通识","l":"I","t":1,"q":"怎样正确安全使用台灯？（ ）","o":{"A":"灯泡功率不得超过60瓦","B":"不能用纸做灯罩","C":"远离可燃物"},"a":["A","B","C"],"e":"台灯灯泡不超60瓦、不用纸做灯罩、远离可燃物，三条都是防止灯泡高温把附近东西烤着，缺一条都留隐患。"},{"id":209,"c":"安全通识","l":"I","t":2,"q":"一氧化碳急性中毒应立即吸氧,以缓解机体缺氧、排出毒物。","o":{},"a":["正确"],"e":"一氧化碳中毒要赶紧吸氧，提高血氧浓度、促使一氧化碳排出，同时送医，这是急救最关键的一步。"},{"id":210,"c":"安全通识","l":"I","t":2,"q":"安全事故处理应本着快速处置,先人后物的原则,果断地、坚决地做好工作。","o":{},"a":["正确"],"e":"事故处理先人后物，先救人再抢救财产，动作要快、决断要果断，人命永远排在第一位。"},{"id":211,"c":"安全通识","l":"I","t":2,"q":"搬动风扇、照明灯和移动电焊机等电气设备时,应在切断电源的情况下进行。","o":{},"a":["正确"],"e":"搬风扇、照明灯、电焊机这些电气设备必须先断电，带电搬动容易拉扯电线造成短路、触电或摔坏设备。"},{"id":212,"c":"安全通识","l":"I","t":2,"q":"保险丝断了,可以用细铜丝代替。","o":{},"a":["错误"],"e":"保险丝是按额定电流选配的，铜丝铁丝熔点高、过载也不熔断，线路照样发热起火，必须换同规格保险丝。"},{"id":213,"c":"安全通识","l":"I","t":2,"q":"被困在电梯中应尽快扒开门脱险。","o":{},"a":["错误"],"e":"困在电梯里应按警铃、打电话呼救，在轿厢里等救援；硬扒门可能掉进井道或被夹住，非常危险。"},{"id":214,"c":"安全通识","l":"I","t":2,"q":"避雷针、避雷网、消雷器是用于防止直击雷的保护装置。","o":{},"a":["正确"],"e":"避雷针、避雷网、消雷器都是接闪装置，把直击雷引到自身再导入大地，从而保护建筑物和室内设备。"},{"id":215,"c":"安全通识","l":"I","t":2,"q":"玻璃器具在使用前要仔细检查,避免使用有裂痕的仪器。特别用于减压、加压或加热操作的场合,更要认真进行检查。","o":{},"a":["正确"],"e":"玻璃器皿用前要查裂纹和缺口，减压、加压、加热时受力更大，有伤极易炸裂伤人，检查要格外仔细。"},{"id":216,"c":"安全通识","l":"I","t":2,"q":"不得带着实验防护手套开门、翻阅书籍、使用电脑。","o":{},"a":["正确"],"e":"戴过防护手套的手可能沾着化学品，再去开门、翻书、敲键盘，就把污染物带到公共部位和自己身上了。"},{"id":217,"c":"安全通识","l":"I","t":2,"q":"不得独自一人在实验室做有危险的实验。","o":{},"a":["正确"],"e":"危险性实验至少两人在场，一人操作一人监护，万一出事有人施救报警，独自操作风险太大。"},{"id":218,"c":"安全通识","l":"I","t":2,"q":"不得堵塞实验室逃生通道。","o":{},"a":["正确"],"e":"逃生通道是火灾时的生命通道，堆东西堵塞会耽误撤离、引发拥挤踩踏，任何时候都得保持畅通。"},{"id":219,"c":"安全通识","l":"I","t":2,"q":"不得在冰箱、烘箱等加热、产热设备附近放置纸板、化学试剂、气体钢瓶等物品。","o":{},"a":["正确"],"e":"冰箱、烘箱周围散热产热，放纸板、试剂、气瓶容易被烤燃或受热升压，必须留出安全距离。"},{"id":220,"c":"安全通识","l":"I","t":2,"q":"不论误食酸或碱,都可以灌注牛奶,不要吃呕吐剂。","o":{},"a":["正确"],"e":"误食酸碱可先喝牛奶护住胃黏膜、稀释腐蚀，但别催吐，免得食道被二次灼伤，严重时马上送医。"},{"id":221,"c":"安全通识","l":"I","t":2,"q":"不能携带易燃易爆物品进入教室、宿舍、图书馆等人员聚集场所。","o":{},"a":["正确"],"e":"教室、宿舍、图书馆人多、疏散慢，带易燃易爆品进去一旦出事伤亡很大，所以明令禁止。"},{"id":222,"c":"安全通识","l":"I","t":2,"q":"不能用铁柄毛刷清扫电源开关和用湿布擦电源开关。","o":{},"a":["正确"],"e":"铁柄毛刷导电、湿布也导电，清扫带电开关容易触电或短路，应先断电，再用干燥工具清理。"},{"id":223,"c":"安全通识","l":"I","t":2,"q":"不使用绝缘损坏或接地不良的电器设备。","o":{},"a":["正确"],"e":"绝缘破损就会漏电，接地不良故障电流导不走，人一碰就可能触电，这类设备必须停用报修。"},{"id":224,"c":"安全通识","l":"I","t":2,"q":"不应用双手同时触及电器,防止触电时电流通过心脏。","o":{},"a":["正确"],"e":"双手同时碰带电体，电流可能经左手、心脏到右手形成回路，最易引起心室颤动，单手操作更安全。"},{"id":225,"c":"安全通识","l":"I","t":2,"q":"测试数据应进行异地备份。","o":{},"a":["正确"],"e":"数据异地备份，本地硬盘坏了、丢了或中毒，还有另一份可用，免得多年实验数据一次全没。"},{"id":226,"c":"安全通识","l":"I","t":2,"q":"产生有害废气的实验室必须按规定安装通风、排风设施,必要时须安装废气吸收系统,保持通风和空气新鲜。","o":{},"a":["正确"],"e":"产生有害废气的实验必须在通风橱或排风系统下做，必要时加吸收装置，防止毒气积聚被吸入。"},{"id":227,"c":"安全通识","l":"I","t":2,"q":"初次进入实验室的操作人员应了解实验室具体的潜在危险,认真阅读、理解实验室安全管理制度、《实验室安全手册》和安全操作规程。","o":{},"a":["正确"],"e":"初次进实验室先弄清本室有哪些危险源，读制度、手册和操作规程，知道怎么防、出事怎么办再动手。"},{"id":228,"c":"安全通识","l":"I","t":2,"q":"除非特殊需要并采取一定的安全保护措施,否则空调、计算机、饮水机等不得无人开机过夜。","o":{},"a":["正确"],"e":"空调、电脑、饮水机无人看管长时间运行，可能过热短路起火；除非特殊需要并做好防护，否则应断电。"},{"id":229,"c":"安全通识","l":"I","t":2,"q":"触电时,不可人去拉（可用木棒把伤员挑开）,应立即切断电源,然后先做人工呼吸,再做心脏按压,同时报120送医院进行处理。","o":{},"a":["正确"],"e":"触电急救先断电或用绝缘物挑开电源，人一脱开就连续做人工呼吸和胸外按压，同时报120送医，分秒必争。"},{"id":230,"c":"安全通识","l":"I","t":2,"q":"创伤伤口内有玻璃碎片等大块异物时,应在去医院救治前尽快取出。","o":{},"a":["错误"],"e":"伤口里的大块玻璃等异物别自己拔，拔出可能大出血或加重损伤，应先固定包扎，交给医生处理。"},{"id":231,"c":"安全通识","l":"I","t":2,"q":"创造安全、卫生的实验室工作环境,仅仅是实验工作人员的责任。","o":{},"a":["错误"],"e":"实验室安全卫生是全体人员的共同责任，老师、学生、管理人员都要管，不能只压在实验人员身上。"},{"id":232,"c":"安全通识","l":"I","t":2,"q":"从事粉尘作业时,可以不戴防尘口罩。","o":{},"a":["错误"],"e":"粉尘作业必须戴防尘口罩，粉尘吸进肺里会沉积造成尘肺，口罩是最起码的个体防护，不能省。"},{"id":233,"c":"安全通识","l":"I","t":2,"q":"大火封门无路可逃时,可用浸湿的被褥、衣物堵塞门缝,向门上泼水降温,以延缓火灾蔓延时间,呼叫待援。","o":{},"a":["正确"],"e":"大火封门出不去时，用湿被褥堵住门缝、往门上泼水降温，能拖住烟火蔓延，再呼叫待援争取时间。"},{"id":234,"c":"安全通识","l":"I","t":2,"q":"大型仪器设备应认真填写:开机时间、实验内容、指导人员、操作人员、使用维修情况等。","o":{},"a":["正确"],"e":"大型仪器要记开机时间、实验内容、指导人和操作人、维修情况，既方便管理追溯，也便于查故障责任。"},{"id":235,"c":"安全通识","l":"I","t":2,"q":"当被烧伤时,正确的急救方法应该是以最快的速度用冷水冲洗烧伤部位。","o":{},"a":["正确"],"e":"烧伤后越快用冷水冲越好，能带走余热、减轻损伤和疼痛，这是现场急救的第一步。"},{"id":236,"c":"安全通识","l":"I","t":2,"q":"当电气设备发生火灾后,如果可能应当先断电后灭火。","o":{},"a":["正确"],"e":"电气火灾要先断电再灭火，带电灭火容易触电，水和泡沫还可能导电，把事故闹得更大。"},{"id":237,"c":"安全通识","l":"I","t":2,"q":"当发生火情时尽快沿着疏散指示标志和安全出口方向迅速离开火场。","o":{},"a":["正确"],"e":"发生火情按疏散指示标志往安全出口走，标志就是照最短逃生路线设的，别盲目乱跑耽误时间。"},{"id":238,"c":"安全通识","l":"I","t":2,"q":"当可燃烧液体呈流淌状燃烧时,应将灭火剂的喷流对准火焰根部由近而远并左右扫射,向前快速推进,直至火焰扑灭。","o":{},"a":["正确"],"e":"液体流淌火要对准火焰根部，由近而远左右扫射、逐步推进，才能压住火势不留残火复燃。"},{"id":239,"c":"安全通识","l":"I","t":2,"q":"当手、脚或身体沾湿或站在潮湿的地板上时,切勿启动电源开关和触摸电器用具。","o":{},"a":["正确"],"e":"手脚潮湿或站在湿地板上，人体电阻变小，这时碰开关和电器最容易触电，先擦干再说。"},{"id":240,"c":"安全通识","l":"I","t":2,"q":"当有人呼吸系统中毒时,应迅速使中毒者离开现场,移到通风良好的环境,令中毒者呼吸新鲜空气,情况严重者应及时送医院治疗。","o":{},"a":["正确"],"e":"呼吸中毒要马上把人挪到通风处呼吸新鲜空气，松开衣领保持呼吸道通畅，重的立即送医院。"},{"id":241,"c":"安全通识","l":"I","t":2,"q":"当自己身上着火时,应就地打滚,进行自救。","o":{},"a":["正确"],"e":"身上着火别跑，跑动会让火苗更旺；就地打滚压灭火焰，或用湿衣物覆盖，是最有效的自救办法。"},{"id":242,"c":"安全通识","l":"I","t":2,"q":"电动工具的电源引线必须保证接地可靠。","o":{},"a":["正确"],"e":"电动工具电源引线要有可靠接地，一旦漏电电流能导入大地，人不至于被电到，接地线绝不能省。"},{"id":243,"c":"安全通识","l":"I","t":2,"q":"电动工具应定期检修。","o":{},"a":["正确"],"e":"电动工具要定期检修，碳刷、绝缘、电缆都会老化，早发现早处理，才能避免带病作业出事故。"},{"id":244,"c":"安全通识","l":"I","t":2,"q":"电加热设备必须有专人负责使用和监督,离开时要切断电源。","o":{},"a":["正确"],"e":"电加热设备必须专人负责、人走断电，长时间无人看管最易过热，把周围物品烤燃。"},{"id":245,"c":"安全通识","l":"I","t":2,"q":"电路保险丝(片)熔断,短期内可以用铜丝或铁丝代替。","o":{},"a":["错误"],"e":"保险丝熔断是线路过载或短路的警报，用铜丝铁丝代替等于拆了保护，过载也不熔断，极易起火。"},{"id":246,"c":"安全通识","l":"I","t":2,"q":"电路或电器着火时,可用泡沫灭火器灭火","o":{},"a":["错误"],"e":"电器着火不能用水和泡沫，二者导电，可能触电或引起爆炸；应先断电，再用二氧化碳或干粉灭火器。"},{"id":247,"c":"安全通识","l":"I","t":2,"q":"电路或电器着火时,使用二氧化碳灭火器灭火","o":{},"a":["正确"],"e":"二氧化碳不导电、灭火后不留残渣，正适合电器和精密仪器火灾，所以电路着火用它是对的。"},{"id":248,"c":"安全通识","l":"I","t":2,"q":"电气设备发生火灾时,应注意:1、电气设备可能带电,可能发生触电事故;2、某些电气设备充有大量的油,可能发生喷油甚至爆炸。","o":{},"a":["正确"],"e":"电气火灾有两个特殊危险：设备可能还带电，碰了会触电；充油设备受热可能喷油甚至爆炸，救火前先想到这两点。"},{"id":249,"c":"安全通识","l":"I","t":2,"q":"电气设备和大型仪器须接地良好,对电线老化等隐患要定期检查并及时排除,注意仪器设备的电磁辐射、网络等安全事项,避免事故发生。","o":{},"a":["正确"],"e":"电气设备和大型仪器接地要可靠，电线老化等隐患定期查、及时改，还要留意电磁辐射和网络安全，才能少出事。"},{"id":250,"c":"安全通识","l":"I","t":2,"q":"电气设备可以短时间超载、超负荷运行。","o":{},"a":["错误"],"e":"电气设备不能超载超负荷运行，短时间也不保险，过载会让线路过热，绝缘老化甚至起火。"},{"id":251,"c":"安全通识","l":"I","t":2,"q":"电气设备引起火灾的原因有①短路;②过负荷;③接触电阻热;④电火花和电弧;⑤照明灯具、电热元件、电热工具的表面热;⑥过电压;⑦涡流热。","o":{},"a":["正确"],"e":"短路、过负荷、接触电阻发热、电火花电弧、灯具电热元件表面热、过电压、涡流热，都是电气火灾的常见成因。"},{"id":252,"c":"安全通识","l":"I","t":2,"q":"电气设备着火,首先必须采取的措施是灭火。","o":{},"a":["错误"],"e":"电气设备着火第一步是切断电源，不是先灭火；带电灭火既易触电，也可能扩大事故。"},{"id":253,"c":"安全通识","l":"I","t":2,"q":"电器或线路着火,要先切断电源,再用干粉灭火器或气体灭火器灭火,不可直接泼水灭火,以防触电或电器爆炸伤人。","o":{},"a":["正确"],"e":"电器线路着火先断电，再用干粉或气体灭火器，绝不能直接泼水，水和泡沫导电会造成触电或爆炸。"},{"id":254,"c":"安全通识","l":"I","t":2,"q":"电线接头裸露部分可用医用胶布等包裹绝缘。","o":{},"a":["错误"],"e":"医用胶布不是绝缘材料，耐压和耐热都不够，接头裸露必须用合格绝缘胶带按规范包好。"},{"id":255,"c":"安全通识","l":"I","t":2,"q":"电源插座、接线板、电线的容量应满足电器功率的需要","o":{},"a":["正确"],"e":"插座、接线板、电线的容量要跟电器功率匹配，小马拉大车会过载发热，是常见的起火原因。"},{"id":256,"c":"安全通识","l":"I","t":2,"q":"电源插座附近不应堆放易燃物等杂物。","o":{},"a":["正确"],"e":"插座附近堆纸箱、布料等易燃物，插拔时打火花就可能引燃，保持周边清爽才安全。"},{"id":257,"c":"安全通识","l":"I","t":2,"q":"配电箱的闸刀开关可以带负荷拉开。","o":{},"a":["错误"],"e":"闸刀开关带负荷拉开会产生强烈电弧，灼伤人或引起短路，必须先断电再操作。"},{"id":258,"c":"安全通识","l":"I","t":2,"q":"对容易产生静电的场所,要保持地面潮湿,或者铺设导电性能好的地面;工作人员要穿防静电的衣服和鞋靴,静电及时导人大地,防止静电积聚,产生火花。","o":{},"a":["正确"],"e":"防静电要地面导电或保持潮湿、人穿防静电服和鞋，让电荷及时导入大地，不积聚就不会打火花。"},{"id":259,"c":"安全通识","l":"I","t":2,"q":"对已污染的仪器、器械、台面等要做标签说明,不得有隐瞒。","o":{},"a":["正确"],"e":"被污染的仪器、器械、台面要挂牌标明，让别人知道有危险，隐瞒不报最容易造成二次污染和伤害。"},{"id":260,"c":"安全通识","l":"I","t":2,"q":"对有异味或挥发性的废液或废物要丢弃在远离人群的地方。","o":{},"a":["错误"],"e":"有异味或挥发性的废液废物不能随便丢到远处，应按危废分类收集、密闭存放，交由有资质单位处置。"},{"id":261,"c":"安全通识","l":"I","t":2,"q":"对于触电事故,应立即切断电源或用有绝缘性能的木棍棒挑开和隔绝电流,救护人不得接触触电者的皮肤。","o":{},"a":["正确"],"e":"触电急救第一步是断电或用绝缘木棒挑开电线，救护人绝不能直接碰触电者皮肤，否则自己也导电。"},{"id":262,"c":"安全通识","l":"I","t":2,"q":"对于触电事故,应立即切断电源或用有绝缘性能的木棍棒挑开和隔绝电流,如果触电者的衣服干燥,又没有紧缠住身上,可以用一只手抓住他的衣服,拉离带电体;但救护人不得接触触电者的皮肤,也不能抓他的鞋。","o":{},"a":["正确"],"e":"断电后若衣服干燥又没缠紧身体，可单手抓衣服把人拉开；但别碰皮肤、别抓鞋，防止电流经自己身上过。"},{"id":263,"c":"安全通识","l":"I","t":2,"q":"对沾染过有毒物质的仪器和用具,实验完毕应立即采取适当方法处理以破坏或消除其毒性。","o":{},"a":["正确"],"e":"沾染过毒物的仪器用具用完后要立刻处理，破坏或消除其毒性，免得残留毒物伤到下一个使用者。"},{"id":264,"c":"安全通识","l":"I","t":2,"q":"二氧化碳灭火剂是扑救精密仪器火灾的最佳选择","o":{},"a":["正确"],"e":"二氧化碳灭火后不留残渣、不导电，不会损坏精密仪器，所以是扑救这类火灾的首选。"},{"id":265,"c":"安全通识","l":"I","t":2,"q":"二氧化碳灭火器使用不当,可能会造成冻伤。","o":{},"a":["正确"],"e":"二氧化碳喷出时温度很低，手握喇叭筒或贴近喷射容易冻伤，使用时要握木柄、别碰金属筒。"},{"id":266,"c":"安全通识","l":"I","t":2,"q":"发生触电时,应对患者进行人工呼吸,可以适量使用兴奋剂。","o":{},"a":["错误"],"e":"触电急救不能乱用兴奋剂，应立刻做人工呼吸和胸外按压并送医，药物可能加重心脏负担。"},{"id":267,"c":"安全通识","l":"I","t":2,"q":"发生各类案件时应立即报案,妥善保护案发现场,若有人受伤,在救人时应尽可能记住现场破坏前的情况（如手机拍照等）。","o":{},"a":["正确"],"e":"发生案件先报案、保护好现场，救人的同时尽量用拍照等办法记住现场原貌，方便后续调查。"},{"id":268,"c":"安全通识","l":"I","t":2,"q":"发生意外后先对伤员进行必要的止血、包扎、固定等处理,然后尽可能用担架搬运,搬运时病人始终处脚朝前,头朝后,以便于随时观察伤者情况变化,及时实施急救处理。","o":{},"a":["正确"],"e":"意外伤害先止血、包扎、固定再搬运，抬担架时脚在前头在后，便于随时观察伤者面色和呼吸变化。"},{"id":269,"c":"安全通识","l":"I","t":2,"q":"发现火灾时,单位或个人应该先自救,当自救无效、火越着越大时,再拨打火警电话119。","o":{},"a":["错误"],"e":"发现火灾应立即打119报警，同时组织自救，不能等自救无效火大了才报，耽误的是最佳扑救时机。"},{"id":270,"c":"安全通识","l":"I","t":2,"q":"发现实验楼的电闸箱起火,可以用楼内的消火栓灭火。","o":{},"a":["错误"],"e":"电闸箱起火不能用水或消火栓，水导电会触电，应先断电再用二氧化碳或干粉灭火器。"},{"id":271,"c":"安全通识","l":"I","t":2,"q":"发现有人触电,不能直接接触触电者,应用木棒或其它绝缘物将电源线挑开,使触电者脱离电源。","o":{},"a":["正确"],"e":"发现有人触电，救护人不能直接上手拉，要用木棒等绝缘物把电源线挑开，先让人脱离电源。"},{"id":272,"c":"安全通识","l":"I","t":2,"q":"发现有人触电,应立即切断电源,使触电人脱离电源,然后进行急救,如在高处,要做好防止坠落的措施。","o":{},"a":["正确"],"e":"有人触电先断电使其脱离电源再急救；若在高处，还要防止断电后坠落摔伤，这一步常被忽略。"},{"id":273,"c":"安全通识","l":"I","t":2,"q":"凡进行有危险性的实验,应先检查防护措施,确证防护妥当后,才可进行实验。","o":{},"a":["正确"],"e":"有危险性的实验要先查防护措施是否到位，确认妥当再开始，防护没落实就动手等于拿命试。"},{"id":274,"c":"安全通识","l":"I","t":2,"q":"干粉灭火剂是扑救精密仪器火灾的最佳选择。","o":{},"a":["错误"],"e":"干粉灭火后会留下粉末残渣，可能污染、损坏精密仪器，精密仪器火灾应首选二氧化碳。"},{"id":275,"c":"安全通识","l":"I","t":2,"q":"高校实验室发生安全事故的主要原因有:操作不慎、粗心大意、设施老化、缺少防护设施等。","o":{},"a":["正确"],"e":"高校实验室事故多为操作不慎、粗心大意、设施老化、缺少防护设施，说到底还是人的疏忽加条件欠缺。"},{"id":276,"c":"安全通识","l":"I","t":2,"q":"高校实验室科研教学活动中产生和排放的废气、废液、固体废物、噪声、放射性等污染物,应按环境保护行政主管部门的要求进行申报登记、收集、运输和处置。严禁把废气、废液、废渣和废弃化学品等污染物直接向外界排放。","o":{},"a":["正确"],"e":"实验室废气废液废渣和噪声、放射性污染物都要申报登记、分类收集、合规处置，绝不能直接外排。"},{"id":277,"c":"安全通识","l":"I","t":2,"q":"各种电源是否有电,可用试电笔检验。","o":{},"a":["错误"],"e":"试电笔只能判断有无电压，不能确认电源是否真断电，检修必须按规程验电并挂牌，不能只靠试电笔。"},{"id":278,"c":"安全通识","l":"I","t":2,"q":"国家秘密载体是指以文字、数据、符号、图形、图像、声音等方式记载国家秘密信息的纸介质、磁介质、光盘等各类物品。磁介质载体包括计算机硬盘、软盘和录音带、录像带等。","o":{},"a":["正确"],"e":"国家秘密载体包括纸介质、磁介质、光盘等，硬盘、软盘、录音录像带都算，管理上都要按密件对待。"},{"id":279,"c":"安全通识","l":"I","t":2,"q":"护送病人时,应取掉口中异物,采用平卧位,头部稍低,保持呼吸畅通。","o":{},"a":["正确"],"e":"护送病人先清除口中异物，取平卧位、头稍低，保持呼吸道通畅，防止呕吐物误吸。"},{"id":280,"c":"安全通识","l":"I","t":2,"q":"火或热水等引起的大面积烧伤、烫伤,必须用湿毛巾、湿布、湿棉被覆盖,然后送医院进行处理。","o":{},"a":["正确"],"e":"大面积烧伤烫伤要用湿毛巾、湿布、湿棉被覆盖保护创面再送医，别乱涂东西，也别强行撕扯衣物。"},{"id":281,"c":"安全通识","l":"I","t":2,"q":"火或热水等引起的小面积烧伤、烫伤,必须用冷水冲洗30分钟以上,然后用烧伤膏涂抹,切不可用牙膏、酱油、盐等覆盖。","o":{},"a":["正确"],"e":"小面积烧伤先用冷水冲30分钟以上降温，再涂烧伤膏；牙膏、酱油、盐都不管用还可能感染。"},{"id":282,"c":"安全通识","l":"I","t":2,"q":"火灾发生后,穿过浓烟逃生时,必须尽量贴近地面,并用湿毛巾捂住口鼻。","o":{},"a":["正确"],"e":"浓烟中逃生要贴近地面，因为热烟往上走、低处空气相对好，再用湿毛巾捂住口鼻减少吸入。"},{"id":283,"c":"安全通识","l":"I","t":2,"q":"火灾发生后,当所有的逃生线路被大火封锁时,应立即退回室内,用手电筒、挥舞衣物、呼叫等方式向窗外发送求救信号,等待救援。","o":{},"a":["正确"],"e":"逃生路线全被封住时，退回室内关好门，用手电、挥衣物、呼叫向窗外发信号，等人来救。"},{"id":284,"c":"安全通识","l":"I","t":2,"q":"火灾发生后,受到火势威胁时,要当机立断披上浸湿的衣物、被褥等向安全出口方向冲去。","o":{},"a":["正确"],"e":"受到火势威胁要果断行动，披上浸湿的衣物被褥往安全出口冲，湿物能挡一下热辐射和火星。"},{"id":285,"c":"安全通识","l":"I","t":2,"q":"及时淘汰老化、性能不稳又具有安全隐患的仪器设备（如冰箱10年以上,烘箱12年以上）。","o":{},"a":["正确"],"e":"老化、性能不稳又有隐患的仪器要及时淘汰，比如冰箱用10年、烘箱用12年以上，超期服役最容易出事。"},{"id":286,"c":"安全通识","l":"I","t":2,"q":"急救时伤口包扎松劲适度,不可过紧或过松,以防滑脱或压迫神经和血管,影响远端血液循环,甚至造成肢体坏死。","o":{},"a":["正确"],"e":"包扎太紧会压迫血管神经、影响远端供血甚至坏死，太松又容易滑脱，松紧适度才稳妥。"},{"id":287,"c":"安全通识","l":"I","t":2,"q":"急性中毒发生时,毒物多由呼吸系统或皮肤进入体内;因此救护人员在抢救前要做好自身呼吸系统和皮肤的防护,以免自身中毒、使事故扩大。","o":{},"a":["正确"],"e":"急性中毒多由呼吸道、皮肤侵入，救护者不先戴好防毒面具、穿好防护服，救人反成第二个中毒者。"},{"id":288,"c":"安全通识","l":"I","t":2,"q":"急性中毒发生时,救护人员在抢救前要做好自身呼吸系统和皮肤的防护,以免自身中毒、使事故扩大。","o":{},"a":["正确"],"e":"抢救前先做好呼吸系统和皮肤防护，是防止施救者中毒、避免事故扩大的前提，别急着上手。"},{"id":289,"c":"安全通识","l":"I","t":2,"q":"计算机使用完毕后,应将显示器的电源关闭,以避免电源接通,产生瞬间的冲击电流。","o":{},"a":["正确"],"e":"用完关掉显示器电源，既省电，也能避免长期待机通电时的瞬间冲击电流损伤设备。"},{"id":290,"c":"安全通识","l":"I","t":2,"q":"加强计算机的安全管理,建立病毒防护系统并不断加以更新,重要的数据资料应定期进行备份。","o":{},"a":["正确"],"e":"装好并及时更新防病毒软件，重要数据定期备份，病毒破坏或误删后才能把损失降到最低。"},{"id":291,"c":"安全通识","l":"I","t":2,"q":"假期使用实验室必须经实验室负责人批准,并报学院备案。","o":{},"a":["正确"],"e":"假期人员少、监管弱，使用实验室须先经负责人批准并向学院备案，出事才有人知道、有人负责。"},{"id":292,"c":"安全通识","l":"I","t":2,"q":"建立健全安全管理规章制度,完善逐级安全责任制,贯彻执行“谁使用,谁管理”、“谁主管,谁负责”的安全工作原则。","o":{},"a":["正确"],"e":"安全责任要逐级落实到人，谁使用谁管理、谁主管谁负责，责任不清就没人真管，制度也落不了地。"},{"id":293,"c":"安全通识","l":"I","t":2,"q":"溅入口中已下咽的毒物,应根据毒物的性质服解毒剂,并立即送医院。","o":{},"a":["正确"],"e":"误咽毒物要先弄清性质，按性质服解毒剂，同时立即送医院，别自行催吐或拖延。"},{"id":294,"c":"安全通识","l":"I","t":2,"q":"溅入口中已下咽的强碱,先饮用大量水,再服用乙酸果汁,鸡蛋清。","o":{},"a":["正确"],"e":"强碱灼伤食道，先大量清水稀释，再用食醋果汁中和、鸡蛋清保护黏膜，处理后仍要尽快就医。"},{"id":295,"c":"安全通识","l":"I","t":2,"q":"溅入口中已下咽的强酸,先饮用大量水,再服用氢氧化铝膏,鸡蛋清。","o":{},"a":["正确"],"e":"强酸入口先大量清水冲洗稀释，再服氢氧化铝膏中和、鸡蛋清覆盖保护，切忌用强碱去中和。"},{"id":296,"c":"安全通识","l":"I","t":2,"q":"接临时电源要用合格的电源线,电源插头、插座要安全可靠,损坏的不能使用,电源线接头要用绝缘胶布包好。","o":{},"a":["正确"],"e":"临时用电也要用合格电源线和可靠的插头插座，破损的不能用，接头必须用绝缘胶布包好。"},{"id":297,"c":"安全通识","l":"I","t":2,"q":"进行电气维修必须先关掉电源,在设置“禁止合闸,有人工作”的标示牌后,方可进行。","o":{},"a":["正确"],"e":"电气维修先断电，再挂“禁止合闸，有人工作”标示牌，防止他人误合闸，这是保命的一步。"},{"id":298,"c":"安全通识","l":"I","t":2,"q":"进行电器维修必须先关掉电源再进行修理。","o":{},"a":["正确"],"e":"修电器前必须先切断电源，确认无电再动手，带电作业是触电事故最常见的起因。"},{"id":299,"c":"安全通识","l":"I","t":2,"q":"进行需要戴防护眼镜的实验时,戴隐形眼镜的近视者可不戴防护眼镜。","o":{},"a":["错误"],"e":"错在把隐形眼镜当护目镜。化学溅入后镜片会滞留药液加重损伤，戴隐形眼镜也要加戴防护镜。"},{"id":300,"c":"安全通识","l":"I","t":2,"q":"进入实验室要严格遵守实验室各项规章制度和操作规程","o":{},"a":["正确"],"e":"实验室规章制度和操作规程是事故教训换来的，进门就遵守，别凭经验想当然。"},{"id":301,"c":"安全通识","l":"I","t":2,"q":"禁止邮寄属于国家秘密的文件、资料和其他物品出境,禁止非法携运属于国家秘密的文件、资料和其他物品出境。","o":{},"a":["正确"],"e":"国家秘密文件资料严禁邮寄或非法携带出境，这是保密法规的硬性要求，没有变通余地。"},{"id":302,"c":"安全通识","l":"I","t":2,"q":"静电可以引起爆炸、电气绝缘和电子元器件击穿。","o":{},"a":["正确"],"e":"静电放电火花能点燃可燃气体引发爆炸，也能击穿绝缘和电子元器件，别小看这点“静电”。"},{"id":303,"c":"安全通识","l":"I","t":2,"q":"酒精灯内的酒精量最多可加七分满。","o":{},"a":["正确"],"e":"酒精灯装七分满最合适：太满易溢出、点燃时喷火，太少灯芯吸不到酒精还容易烧空。"},{"id":304,"c":"安全通识","l":"I","t":2,"q":"可将食物储藏在实验室的冰箱或冷柜内。","o":{},"a":["错误"],"e":"实验室冰箱可能存放化学品、菌种，交叉污染风险大，食物饮料一律不得放入，也不得在实验室饮食。"},{"id":305,"c":"安全通识","l":"I","t":2,"q":"可以用试电笔去试高压电。","o":{},"a":["错误"],"e":"试电笔只适用于低压，测高压会击穿绝缘、引发弧光触电，高压必须用专用验电器并保持安全距离。"},{"id":306,"c":"安全通识","l":"I","t":2,"q":"可以在开启的紫外灯下工作。","o":{},"a":["错误"],"e":"紫外灯开着时人不能在下面工作，紫外线会灼伤眼睛和皮肤，需关灯或做好遮挡后再操作。"},{"id":307,"c":"安全通识","l":"I","t":2,"q":"空调电源必须单独拉线,不得使用接线板。","o":{},"a":["正确"],"e":"空调功率大，必须单独拉专线，用接线板转接容易过载发热起火，这是常见的电气隐患。"},{"id":308,"c":"安全通识","l":"I","t":2,"q":"雷电发生时,如果作业人员孤立处于暴露区并感到头发竖起时,应该立即双膝下蹲,向前弯曲,双手抱膝。","o":{},"a":["正确"],"e":"头发竖起说明即将被雷击，应立即双脚并拢下蹲、抱膝低头，降低高度并减少跨步电压。"},{"id":309,"c":"安全通识","l":"I","t":2,"q":"冷却灭火法是将可燃物冷却到其燃点以下,停止燃烧反应。","o":{},"a":["正确"],"e":"冷却法就是把燃烧物温度降到燃点以下，反应自然停止，用水浇灭固体火灾就是这个道理。"},{"id":310,"c":"安全通识","l":"I","t":2,"q":"离开实验室前应检查门、窗、水龙头是否关好,通风设备、饮水设施、计算机、空调等是否已切断电源。","o":{},"a":["正确"],"e":"离开前查门窗、水龙头，断掉通风、饮水、计算机、空调电源，把隐患留在门内就是留下事故。"},{"id":311,"c":"安全通识","l":"I","t":2,"q":"离开实验室时,实验服不得穿着外出,必须脱下并留在实验室内,更不能携带回家。","o":{},"a":["正确"],"e":"实验服沾着化学试剂和污染物，穿出实验室或带回家会把污染扩散到生活区，必须脱下留在室内。"},{"id":312,"c":"安全通识","l":"I","t":2,"q":"连接在插线板上的用电器总功率不能超过插线板的最大负荷。","o":{},"a":["正确"],"e":"插线板有额定功率，所接电器总功率超了就会过载发热、烧毁甚至起火，别把大功率设备全堆一块。"},{"id":313,"c":"安全通识","l":"I","t":2,"q":"连接在接线板上的用电总负荷不能超过接线板的最大容量。","o":{},"a":["正确"],"e":"接线板的容量是上限，所接用电总负荷不得超过，否则线芯发热、绝缘熔化，很容易引发电气火灾。"},{"id":314,"c":"安全通识","l":"I","t":2,"q":"漏电保护器对两相触电（人体双手触及两相电源）,不起保护作用。","o":{},"a":["正确"],"e":"漏电保护器靠检测剩余电流动作，双手同时触及两相时电流不经过大地，它检测不到，因此不动作。"},{"id":315,"c":"安全通识","l":"I","t":2,"q":"煤气用后一定关好,如发现实验室内有煤气味应立即开窗、自然通风,并且此时禁止使用明火。","o":{},"a":["正确"],"e":"煤气用完关阀，闻到气味立刻开窗自然通风，此时严禁明火、严禁开关电器，避免火花引爆。"},{"id":316,"c":"安全通识","l":"I","t":2,"q":"每天下班前检查实验室门、窗是否关好,电气线路、通风设备、饮水设施等是否已切断电源。","o":{},"a":["正确"],"e":"每天下班前查门窗、断电源，是个习惯动作，能把漏水漏电、夜间无人值守的风险挡在门外。"},{"id":317,"c":"安全通识","l":"I","t":2,"q":"灭火的四种方法是隔离法、窒息法、冷却法、化学抑制法。","o":{},"a":["正确"],"e":"隔离、窒息、冷却、化学抑制，分别去掉可燃物、隔绝氧气、降温、中断链反应，扑救都离不开这四条。"},{"id":318,"c":"安全通识","l":"I","t":2,"q":"灭火器按其移动形式可分为:手提式和推车式。","o":{},"a":["正确"],"e":"按移动形式分，灭火器就是手提式和推车式两类，前者灵活、后者容量大，按场所选型。"},{"id":319,"c":"安全通识","l":"I","t":2,"q":"灭火器的操作程序:取出灭火器,带到火灾现场,拔掉保险销,一手握压把,一手握喷管,对准火苗根部喷射（注意人站在上风方向）。","o":{},"a":["正确"],"e":"提、拔、握、压、对准根部，站上风方向，这套动作顺序对，火才压得住、人也不被烟呛。"},{"id":320,"c":"安全通识","l":"I","t":2,"q":"灭火器应定期进行检验","o":{},"a":["正确"],"e":"灭火器压力会泄漏、药剂会失效，必须定期检验，关键时刻喷不出来就等于没有。"},{"id":321,"c":"安全通识","l":"I","t":2,"q":"磨砂接口玻璃器具已标准化且制作良好,一般不需涂抹凡士林等油脂。","o":{},"a":["错误"],"e":"错。磨砂接口靠油脂密封，不涂凡士林等润滑脂容易粘死打不开、也会漏气，标准磨口同样要涂。"},{"id":322,"c":"安全通识","l":"I","t":2,"q":"某人因机械操作不慎,致使左手食指从指根完全离断,急救处理首先是找器皿保存断指,然后包扎残端伤口止血。","o":{},"a":["错误"],"e":"错在顺序。应先压迫包扎残端止血、处理休克，再把断指用洁净敷料包好低温保存，一并送医。"},{"id":323,"c":"安全通识","l":"I","t":2,"q":"皮肤烧伤后如有水泡,应及时将水泡刺破,以利于其恢复。","o":{},"a":["错误"],"e":"水泡皮是天然保护层，刺破易感染；小水泡保持完整避免摩擦，大水泡交由医生处理。"},{"id":324,"c":"安全通识","l":"I","t":2,"q":"破碎的玻璃器皿要小心地彻底清除,戴上厚手套用纸包起来,丢在专用利器盒中。","o":{},"a":["正确"],"e":"碎玻璃要戴厚手套、用纸包好投入利器盒，不能丢普通垃圾桶，防止保洁人员割伤。"},{"id":325,"c":"安全通识","l":"I","t":2,"q":"扑救毒害性、腐蚀性或燃烧产物毒害性较强的火灾时,必须配戴防护面具。","o":{},"a":["正确"],"e":"这类火灾烟气有毒有腐蚀性，必须戴防护面具或空气呼吸器，光靠捂毛巾挡不住。"},{"id":326,"c":"安全通识","l":"I","t":2,"q":"扑救气体火灾切忌盲目扑灭火势,首先应切断火势蔓延途径,然后疏散火势中压力容器或受到火焰辐射热威胁的压力容器,不能疏散的部署水枪进行冷却保护。","o":{},"a":["正确"],"e":"气体火灾别急着扑灭火焰，先切断蔓延途径、疏散或冷却受压容器，否则燃气积聚可能复燃爆炸。"},{"id":327,"c":"安全通识","l":"I","t":2,"q":"扑救液体火灾时,应用灭火器扑救,不能用水扑救或其它物品扑打。","o":{},"a":["正确"],"e":"液体火灾用水冲会使燃油漂浮流淌、火势扩大，应用灭火器或泡沫、干粉覆盖窒息。"},{"id":328,"c":"安全通识","l":"I","t":2,"q":"燃烧必须具备可燃物、助燃物和点火源三大条件,缺一不可。因此,可以采取尽量隔离的方式来防止实验室火灾的发生","o":{},"a":["正确"],"e":"可燃物、助燃物、点火源三者齐备才烧得起来，用隔离的办法去掉其中任何一个，火灾就发生不了。"},{"id":329,"c":"安全通识","l":"I","t":2,"q":"人工呼吸的方法是捏紧伤者鼻孔,深吸一口气后紧贴伤者的口向口内吹气,时间约为2秒钟,吹气完毕后,立即松开伤者的鼻孔,让他自行呼气,时间约3秒钟。如此以每分钟约12次的速度进行。","o":{},"a":["正确"],"e":"捏鼻、口对口吹气约2秒、松鼻让其呼气约3秒，每分钟约12次，节奏对了人工呼吸才有效。"},{"id":330,"c":"安全通识","l":"I","t":2,"q":"人体触电,双手触电致死比单手触电致死的概率要大得多。","o":{},"a":["正确"],"e":"双手触电时电流经心脏形成回路，更易引起心室颤动，所以比单手触电危险得多。"},{"id":331,"c":"安全通识","l":"I","t":2,"q":"任何单位和个人不得在电子公告系统、聊天室、网络新闻组上发布、谈论和传播国家秘密信息。","o":{},"a":["正确"],"e":"电子公告、聊天室、新闻组都是公开渠道，涉密信息一律不得发布谈论，网上泄密同样违法。"},{"id":332,"c":"安全通识","l":"I","t":2,"q":"任何电气设备在未验明无电时,一律认为有电,不能盲目触及。","o":{},"a":["正确"],"e":"没验明无电之前一律当有电对待，不盲目触摸，这是电气安全最基本的一条信条。"},{"id":333,"c":"安全通识","l":"I","t":2,"q":"如发现水泵漏水,可以不用切断电源,待实验完毕后再报修。","o":{},"a":["错误"],"e":"漏水遇上电极易短路触电，发现水泵漏水应立即断电并报修，不能等实验做完再处理。"},{"id":334,"c":"安全通识","l":"I","t":2,"q":"如果发现有人触电,应立即上前将其拉开,以避免其发生生命危险。","o":{},"a":["错误"],"e":"直接去拉触电者，电流会通过施救者身体。应先切断电源或用干燥绝缘物挑开电线再施救。"},{"id":335,"c":"安全通识","l":"I","t":2,"q":"如有盗窃和意外事故发生,不得隐瞒,应及时报告保卫部门和主管部门,并保护好现场。","o":{},"a":["正确"],"e":"盗窃和意外事故不得隐瞒，及时报保卫部门和主管单位并保护现场，才便于调查处理。"},{"id":336,"c":"安全通识","l":"I","t":2,"q":"身上着火被熄灭后,应马上把粘在皮肤上的衣物脱下来","o":{},"a":["错误"],"e":"烧伤后粘在皮肤上的衣物不能硬脱，会连皮撕下加重创面，应剪开周围衣物、覆盖清洁敷料送医。"},{"id":337,"c":"安全通识","l":"I","t":2,"q":"身上着火后,应迅速用灭火器灭火","o":{},"a":["错误"],"e":"灭火器药剂刺激伤口且干粉难清理，身上着火应就地打滚或用湿衣物覆盖压灭火焰。"},{"id":338,"c":"安全通识","l":"I","t":2,"q":"湿手不能触摸带电的电器,不能用湿布擦拭使用中的电器。","o":{},"a":["正确"],"e":"水导电，湿手摸电器、湿布擦使用中的电器都可能触电，先擦干手、断了电再清洁。"},{"id":339,"c":"安全通识","l":"I","t":2,"q":"实施急救的顺序:若有呼吸心跳停止的,先行复苏,然后是止血、包扎、骨折固定或脱臼复位（固定）、搬运。","o":{},"a":["正确"],"e":"先复苏后止血包扎固定
