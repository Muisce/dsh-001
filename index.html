”是明显错误的说法。"},{"id":786,"c":"化学安全","l":"II","t":0,"q":"进行腐蚀品的装卸作业应该戴（ ）手套。","o":{"A":"帆布","B":"橡胶","C":"棉布"},"a":["B"],"e":"橡胶手套耐酸碱腐蚀、不透液，帆布和棉布手套会被腐蚀品渗透，装卸腐蚀品必须戴橡胶手套。"},{"id":787,"c":"化学安全","l":"II","t":0,"q":"进入化学清洗间,下列陈述哪个是错误的","o":{"A":"使用规定类型的手套时,注意检查手套是否破损","B":"不要用手套碰自己的脸,如果需要扶正眼镜或者整理头发,用胳膊或者肩膀,手套上有可能带有危险化学品","C":"严格禁止将头部伸入通风橱","D":"仅在化学间用自来水或去离子水,不接触化学品,可以不戴防护手套"},"a":["D"],"e":"化学清洗间的水管、器皿都可能残留化学品，即使只接水也要戴手套，认为不接触化学品就免戴是错的。"},{"id":788,"c":"化学安全","l":"II","t":0,"q":"金属钠着火可采用的灭火方式有:","o":{"A":"干砂","B":"水","C":"湿抹布","D":"泡沫灭火器"},"a":["A"],"e":"钠着火遇水生成氢气并放热，火势会更猛，只能用干砂覆盖隔绝空气；湿抹布和泡沫灭火器都含水。"},{"id":789,"c":"化学安全","l":"II","t":0,"q":"金属钾、钠、锂、钙、电石等固体化学试剂,遇水即可发生激烈反应,并放出大量热,也可产生爆炸,它们应如何存放:","o":{"A":"直接放在试剂瓶中保存","B":"浸没在煤油中保存（容器不得渗漏）,附近不得有盐酸、硝酸等散发酸雾的物质存在","C":"用纸密封包裹存放","D":"放在铁盒子里"},"a":["B"],"e":"钾钠锂钙和电石遇水就剧烈反应，必须浸没在煤油中且容器不渗漏，附近还不能有盐酸硝酸散发的酸雾。"},{"id":790,"c":"化学安全","l":"II","t":0,"q":"金属 Hg 常温下","o":{"A":"不挥发","B":"慢慢挥发","C":"很快挥发"},"a":["B"],"e":"汞常温下蒸气压虽不高，但仍会持续缓慢挥发，长期吸入是实验室慢性汞中毒的主要来源。"},{"id":791,"c":"化学安全","l":"II","t":0,"q":"甲醛属于何种级别的毒性","o":{"A":"剧毒","B":"高毒","C":"中等毒性","D":"低毒"},"a":["C"],"e":"甲醛属中等毒性，对眼和呼吸道刺激强、还有致癌性，但达不到剧毒或高毒的等级。"},{"id":792,"c":"化学安全","l":"II","t":0,"q":"甲醇属于何种级别的毒性","o":{"A":"高毒","B":"中等毒性","C":"低毒","D":"微毒"},"a":["C"],"e":"甲醇经口半数致死量在每公斤数千毫克，归为低毒，但它的代谢产物会损害视神经，可致失明。"},{"id":793,"c":"化学安全","l":"II","t":0,"q":"甲苯属于何种级别的毒性","o":{"A":"剧毒","B":"高毒","C":"低毒","D":"微毒"},"a":["C"],"e":"甲苯经口半数致死量约每公斤五千毫克，属低毒，主要危害是挥发性蒸气的神经毒性和易燃性。"},{"id":794,"c":"化学安全","l":"II","t":0,"q":"甲苯在储存时,应远离火种、热源,防止阳光直射,其储存库温度应不超过（ ） 。","o":{"A":"25℃","B":"30℃","C":"35℃","D":"40℃"},"a":["B"],"e":"甲苯易燃易挥发，储存库温度不得超过三十摄氏度，否则蒸气压升高、桶内膨胀，容易泄漏起火。"},{"id":795,"c":"化学安全","l":"II","t":0,"q":"加热和蒸馏有易燃试剂的实验时,不能用:","o":{"A":"水浴锅","B":"明火","C":"通风橱"},"a":["B"],"e":"易燃试剂蒸气遇明火就会闪燃，加热蒸馏必须用水浴、油浴等间接热源，绝不能直接用明火。"},{"id":796,"c":"化学安全","l":"II","t":0,"q":"加热、回流易燃液体,为防止暴沸、喷溅,蒸馏中途;","o":{"A":"应添加适量沸石","B":"不能添加沸石"},"a":["B"],"e":"沸腾中途补加沸石，会瞬间产生大量气泡造成暴沸喷溅，必须停火冷却后再加，所以中途不能添加。"},{"id":797,"c":"化学安全","l":"II","t":0,"q":"活泼金属应存放在何处？","o":{"A":"密封容器中并放入冰箱","B":"密封容器中并放入干燥器","C":"泡在煤油里密封避光保存","D":"密封容器中并放入密闭柜子内"},"a":["C"],"e":"活泼金属遇水遇氧都会反应，泡在煤油里密封避光保存，既隔绝水和空气又防止光照分解。"},{"id":798,"c":"化学安全","l":"II","t":0,"q":"混和时不会生成高敏感、不稳定或者具有爆炸性物质的是:","o":{"A":"醚和醇类","B":"烯烃和空气","C":"氯酸盐和铵盐","D":"亚硝酸盐和铵盐"},"a":["A"],"e":"醚和醇互溶只是稀释，不会生成爆炸性物质；烯烃遇空气生成过氧化物，氯酸盐、亚硝酸盐与铵盐会剧烈反应。"},{"id":799,"c":"化学安全","l":"II","t":0,"q":"混和或相互接触时,不会产生大量热量而着火、爆炸的是:","o":{"A":"KMnO4和浓硫酸","B":"CCl4和碱金属","C":"硝铵和酸","D":"浓HNO4和胺类"},"a":["B"],"e":"高锰酸钾遇浓硫酸、硝铵遇酸、浓硝酸遇胺类都会剧烈放热甚至爆炸，四氯化碳与碱金属相对缓和，故选它。"},{"id":800,"c":"化学安全","l":"II","t":0,"q":"回流和加热时,液体量不能超过烧瓶容量的:","o":{"A":"1/2","B":"2/3","C":"3/4"},"a":["B"],"e":"回流加热时液体不能超过烧瓶容积的三分之二，要留出空间容纳沸腾和泡沫，防止冲料或喷出。"},{"id":801,"c":"化学安全","l":"II","t":0,"q":"黄磷自燃应如何扑救","o":{"A":"用高压水枪","B":"用高压灭火器","C":"用雾状水灭火或用泥土覆盖","D":"以上都对"},"a":["C"],"e":"黄磷燃点很低，用雾状水浸润降温或用泥土覆盖隔绝空气即可；高压水柱会把磷块冲散，扩大燃烧面积。"},{"id":802,"c":"化学安全","l":"II","t":0,"q":"化学药品库中的一般药品应如何分类？","o":{"A":"按生产日期分类","B":"按有机、无机两大类,有机试剂再细分类存放","C":"随意摆放","D":"按购置日期分类"},"a":["B"],"e":"药品库先按有机、无机分成两大类，有机试剂再按官能团细分，能避免性质相抵触的试剂相邻存放。"},{"id":803,"c":"化学安全","l":"II","t":0,"q":"化学药品存放室要有防盗设施,保持通风,试剂存放应:","o":{"A":"按不同类别分类存放","B":"大量危险化学品存放在实验室","C":"可以存放在走廊上"},"a":["A"],"e":"药品存放室要防盗、通风，试剂按不同类别分区分类存放；大量危化品堆在实验室或走廊都属违规。"},{"id":804,"c":"化学安全","l":"II","t":0,"q":"化学危险药品对人身会有刺激眼睛、灼伤皮肤、损伤呼吸道、麻痹神经、燃烧爆炸等危险,一定要注意化学药品的使用安全,以下不正确的做法是:","o":{"A":"了解所使用的危险化学药品的特性,不盲目操作,不违章使用","B":"妥善保管身边的危险化学药品,做到:标签完整,密封保存;避热、避光、远离火种。","C":"室内可存放大量危险化学药品","D":"严防室内积聚高浓度易燃易爆气体"},"a":["C"],"e":"实验室只能存放少量常用危险化学品，室内大量存放一旦泄漏起火后果严重，必须入库储存。"},{"id":805,"c":"化学安全","l":"II","t":0,"q":"化学实验中,为防止（ ）发生氧化自燃,常将其置于水中保存。","o":{"A":"硝化棉","B":"黄磷","C":"稻草"},"a":["B"],"e":"黄磷着火点只有约三十摄氏度，暴露在空气中会氧化自燃，所以必须浸在水中隔绝空气保存。"},{"id":806,"c":"化学安全","l":"II","t":0,"q":"化学强腐蚀烫、烧伤事故发生后,应（ ）保持创伤面的洁净以待医务人员治疗。或用适合于消除这类化学药品的特种溶剂、溶液仔细洗涤烫、烧伤面。","o":{"A":"迅速用大量清水冲洗干净皮肤","B":"迅速解脱伤者被污染衣服,及时用大量清水冲洗干净皮肤","C":"迅速解脱伤者被污染衣服"},"a":["B"],"e":"化学灼伤要先脱去被污染的衣物，再用大量清水冲洗皮肤，否则衣服上的酸碱继续腐蚀创面。"},{"id":807,"c":"化学安全","l":"II","t":0,"q":"化学品的毒性可以通过皮肤吸收、消化道吸收及呼吸道吸收等三种方式对人体健康产生危害,下列不对的预防措施是","o":{"A":"实验过程中使用三氯甲烷时戴防尘口罩","B":"实验过程中移取强酸、强碱溶液应带防酸碱手套","C":"实验场所严禁携带食物;禁止用饮料瓶装化学药品,防止误食","D":"称取粉末状的有毒药品时,要带口罩防止吸入"},"a":["A"],"e":"三氯甲烷是挥发性有机溶剂，吸入危害靠防毒面具防护，防尘口罩挡不住蒸气，所以这条预防措施不对。"},{"id":808,"c":"化学安全","l":"II","t":0,"q":"化工原料电石或乙炔着火时,严禁用（ ）。","o":{"A":"二氧化碳灭火器","B":"四氯化碳灭火器","C":"干粉灭火器","D":"干砂"},"a":["B"],"e":"电石和乙炔遇四氯化碳会生成剧毒光气并可能爆炸，严禁用它灭火，可用干粉、干砂或二氧化碳。"},{"id":809,"c":"化学安全","l":"II","t":0,"q":"何种毒性的化学品为中等毒性药品","o":{"A":"大鼠一次经口 LD50 为1-50","B":"人致死量","C":"大鼠一次经口 LD50 为50-500"},"a":["C"],"e":"按毒性分级，大鼠一次经口半数致死量在五十到五百毫克每公斤之间属中等毒性，数值越小毒性越强。"},{"id":810,"c":"化学安全","l":"II","t":0,"q":"何种毒性的化学品为剧毒品","o":{"A":"大鼠一次经口 LD50 为 1-50","B":"人致死量","C":"大鼠一次经口 LD50 为<50"},"a":["B"],"e":"剧毒品的判定看对人的致死量，极少量即可致人死亡的就列为剧毒，不能只看动物半数致死量。"},{"id":811,"c":"化学安全","l":"II","t":0,"q":"何种毒性的化学品为高毒药品","o":{"A":"大鼠一次经口LD50 为 1-50","B":"人致死量","C":"大鼠一次经口LD50 为<50"},"a":["A"],"e":"高毒药品对应大鼠一次经口半数致死量一至五十毫克每公斤，比中等毒性更强、比剧毒稍弱。"},{"id":812,"c":"化学安全","l":"II","t":0,"q":"何种毒性的化学品为低毒药品","o":{"A":"大鼠一次经口LD50 为>50","B":"人致死量","C":"大鼠一次经口LD50 为 500-5000"},"a":["C"],"e":"低毒品按大鼠一次经口半数致死量五百到五千毫克每公斤界定，超过五千则属微毒。"},{"id":813,"c":"化学安全","l":"II","t":0,"q":"国家对危险化学品实行经营（ ）制度。","o":{"A":"专营","B":"许可证","C":"审批"},"a":["B"],"e":"国家对危险化学品经营实行许可证制度，必须取得经营许可证才能销售，无证经营属违法。"},{"id":814,"c":"化学安全","l":"II","t":0,"q":"国家（标准(GB2893-82)中规定的四种安全色是","o":{"A":"红、蓝、黄、绿","B":"红、蓝、黑、绿","C":"红、青、黄、绿","D":"白、蓝、黄、绿"},"a":["A"],"e":"国标规定的四种安全色是红、蓝、黄、绿，它们分别表示禁止、指令、警告和安全提示，做题时按颜色对应含义记忆即可。"},{"id":815,"c":"化学安全","l":"II","t":0,"q":"关于重铬酸钾洗液,下列说法错误的是:","o":{"A":"将化学反应用过的玻璃器皿不经处理,直接放入重铬酸钾洗液浸泡","B":"浸泡玻璃器皿时,不可以将手直接插入洗液缸里取放器皿","C":"从洗液中捞出器皿后,立即放进清洗杯,避免洗液滴落在洗液缸外等处。然后马上用水连同手套一起清洗。","D":"取放器皿应戴上专用手套,但仍不能在洗液里的时间过长。"},"a":["A"],"e":"玻璃器皿要先清除有机物残渣再泡重铬酸钾洗液，否则洗液很快失效，还会产生有害气体。"},{"id":816,"c":"化学安全","l":"II","t":0,"q":"关于氢氟酸的描述哪个是错误的？","o":{"A":"氢氟酸有强烈的腐蚀性和危害性,皮肤接触氢氟酸后可出现疼痛及灼伤,随时间疼痛渐剧,皮肤下组织被破坏,这种破坏会传播到骨骼;稀的氢氟酸危害性很低,不会产生严重烧伤。","B":"氢氟酸蒸气溶于眼球内的液体中会对人的视力造成永久损害。","C":"使用氢氟酸一定要戴防护手套,工作中注意不要接触氢氟酸蒸汽。","D":"工作结束后要注意用水冲洗手套、器皿等,不能有任何残余留下。"},"a":["A"],"e":"稀氢氟酸也能渗入皮肤深层破坏组织、腐蚀骨骼，疼痛延迟出现，说它危害低不会严重烧伤是错的。"},{"id":817,"c":"化学安全","l":"II","t":0,"q":"关于化学品的使用、管理,下列说法哪个是错误的","o":{"A":"打开塑料瓶的化学品时不要过于用力挤压,否则可能导致液体溢出或迸溅到身体上","B":"有机溶剂可以置于普通冰箱保存","C":"分清标签,认真阅读标签,按标签使用","D":"共用化学品从专用柜里取出,使用时注意保持标签的完整,用后放回专用柜"},"a":["B"],"e":"普通冰箱内部有电火花，有机溶剂蒸气积聚后遇火花会爆炸，有机溶剂必须放防爆冰箱，故这条说法错误。"},{"id":818,"c":"化学安全","l":"II","t":0,"q":"关于化学品的使用、管理,下列陈述哪个是错误的","o":{"A":"打开塑料瓶的化学品时不要过于用力挤压,否则可能导致液体溢出或迸溅到身体上","B":"有机溶剂可以置于冰箱保存 分清标签,认真阅读标签,按标签使用","C":"共用化学品从专用柜里取出,使用时注意保持标签的完整,用后放回专用柜"},"a":["B"],"e":"有机溶剂蒸气比空气重、易积聚，普通冰箱的电气触点会产生火花引燃爆炸，应存防爆冰箱，B说法错误。"},{"id":819,"c":"化学安全","l":"II","t":0,"q":"关于存放自燃性试剂说法错误的是","o":{"A":"单独储存","B":"储存于通风、阴凉、干燥处","C":"存放于试剂架上","D":"远离明火及热源,防止太阳直射"},"a":["C"],"e":"自燃性试剂要单独存放于通风、阴凉、干燥处并远离热源，摆在普通试剂架上会因受热氧化而自燃。"},{"id":820,"c":"化学安全","l":"II","t":0,"q":"关于存储化学品说法错误的是","o":{"A":"化学危险物品应当分类、分项存放,相互之间保持安全距离","B":"遇火、遇潮容易燃烧、爆炸或产生有毒气体的化学危险品,不得在露天、潮湿、漏雨或低洼容易积水的地点存放","C":"受阳光照射易燃烧、易爆炸或产生有毒气体的化学危险品和桶装、罐装等易燃液体、气体应当在密闭地点存放","D":"防护和灭火方法相互抵触的化学危险品,不得在同一仓库或同一储存室存放"},"a":["C"],"e":"怕晒、易爆的危化品和桶装罐装易燃液体气体应存放在阴凉通风处，放在密闭地点会积聚蒸气引发爆炸。"},{"id":821,"c":"化学安全","l":"II","t":0,"q":"购买剧毒药品说法错误的是:","o":{"A":"向学校保卫处申请并批准备案","B":"经过公安局审批","C":"经过环保局审批","D":"通过正常渠道在指定的化学危险品商店购买"},"a":["C"],"e":"购买剧毒品要向保卫处申请备案、经公安局审批，并在指定危化品商店购买，不需要环保局审批，故C错。"},{"id":822,"c":"化学安全","l":"II","t":0,"q":"购买剧毒药品时,必须:","o":{"A":"向单位保卫部门申请并批准备案","B":"经过公安局审批","C":"通过正常渠道在指定的化学危险品商店购买"},"a":["C"],"e":"购买剧毒品必须走正常渠道，到指定的化学危险品经营商店购买，保证来源合法、流向可查。"},{"id":823,"c":"化学安全","l":"II","t":0,"q":"公众上交的危险化学品,由（ ）接收。","o":{"A":"环保部门","B":"质检部门","C":"工商部门","D":"公安部门"},"a":["D"],"e":"公众上交的危险化学品由公安机关接收，因为公安负有危化品管控和处置职责，环保、质检、工商都不负责接收。"},{"id":824,"c":"化学安全","l":"II","t":0,"q":"各种钢瓶的气压表是否可以混用？","o":{"A":"可以","B":"不可以","C":"不一定"},"a":["B"],"e":"钢瓶气压表不能混用：不同气体的压力表量程、材质和接口不同，混用容易漏气、被腐蚀或超压，引发泄漏爆炸。"},{"id":825,"c":"化学安全","l":"II","t":0,"q":"各实验室在运送化学废弃物到各校区临时收集中转仓库之前,可以:","o":{"A":"堆放在走廊上","B":"堆放在过道上","C":"集中分类存放在实验室内,贴好物品标签"},"a":["C"],"e":"化学废弃物送中转仓库前应集中分类存放在实验室内并贴好标签，堆在走廊过道既挡路又易泄漏扩散。"},{"id":826,"c":"化学安全","l":"II","t":0,"q":"高温实验装置使用注意事项错误的是","o":{"A":"注意防护高温对人体的辐射","B":"熟悉高温装置的使用方法,并细心地进行操作","C":"如不得已非将高温炉之类高温装置置于耐热性差的实验台上进行实验时,装置与台面之间要保留一厘米以上的间隙,并加垫隔热层,以防台面着火","D":"使用高温装置的实验,要求在防火建筑内或配备有防火设施的室内进行,并要求密闭,减少热量损失"},"a":["D"],"e":"要求密闭减少热量损失是错的：高温装置密闭会让热量积聚、压力升高，反而增加火灾爆炸风险，应通风散热。"},{"id":827,"c":"化学安全","l":"II","t":0,"q":"钢瓶压力低于（ ）MPa以下时不能再使用。","o":{"A":"1.0 MPA","B":"0.5 MPA","C":"1.5 MpA","D":"0.1 MpA"},"a":["D"],"e":"钢瓶压力低于0.1MPa就不能再用，余压太低会让空气杂质倒吸进瓶，再充装或使用时容易出危险。"},{"id":828,"c":"化学安全","l":"II","t":0,"q":"干燥箱的使用温度范围为（ ） ,常用鼓风式电热箱以加速升温。","o":{"A":"50-350℃","B":"50-150℃","C":"0-250℃"},"a":["C"],"e":"干燥箱使用温度范围为0-250℃，鼓风式电热箱可加速升温，超出范围易损坏设备或烤燃样品。"},{"id":829,"c":"化学安全","l":"II","t":0,"q":"分子结构中含有—C=C—双键的试剂 （药品） 应如何合理存放","o":{"A":"放在冰箱中","B":"放在通风橱内","C":"和其它试剂混放"},"a":["A"],"e":"含C=C双键的试剂易聚合、氧化，应低温放冰箱保存，通风橱和混放都抑制不了它变质放热聚合。"},{"id":830,"c":"化学安全","l":"II","t":0,"q":"分光光度计的吸光值在（ ）范围内准确度最高。","o":{"A":"0.0-1.0","B":"0.6-1.0","C":"0.2-0.7"},"a":["C"],"e":"分光光度计吸光值在0.2-0.7之间准确度最高，太低信号弱、太高透光率小，读数误差都会变大。"},{"id":831,"c":"化学安全","l":"II","t":0,"q":"分光光度计的比色皿盛样品液应为","o":{"A":"2/3左右","B":"1/2左右","C":"装满"},"a":["A"],"e":"比色皿盛样品液约2/3即可，太少光路不充满、太多容易溢出污染，都会影响测定结果。"},{"id":832,"c":"化学安全","l":"II","t":0,"q":"废弃的有害固体药品,应:","o":{"A":"不经处理解毒后就丢弃在生活垃圾处","B":"经处理解毒后,才可丢弃在生活垃圾处","C":"收集起来由专业公司处理"},"a":["C"],"e":"废弃的有害固体药品要收集起来交专业公司处理，解毒后丢生活垃圾仍会污染环境，属于违规处置。"},{"id":833,"c":"化学安全","l":"II","t":0,"q":"废电池随处丢弃会造成（ ）的污染","o":{"A":"白色污染","B":"重金属污染","C":"酸雨"},"a":["B"],"e":"废电池含汞、镉、铅等重金属，随手丢弃会造成重金属污染，与白色污染、酸雨没有关系。"},{"id":834,"c":"化学安全","l":"II","t":0,"q":"放置时间过长的乙醚在使用前应该做什么预备处理？","o":{"A":"用碘化钾检测后,加入还原剂如硫酸亚铁水溶液等除去里面可能产生的过氧化物以防爆炸","B":"重蒸","C":"干燥除水"},"a":["A"],"e":"乙醚久置会生成过氧化物，用碘化钾检测后加硫酸亚铁等还原剂除掉，直接重蒸会因过氧化物受热爆炸。"},{"id":835,"c":"化学安全","l":"II","t":0,"q":"发生危险化学品事故后,应该向什么方向疏散？","o":{"A":"下风","B":"上风","C":"顺风"},"a":["B"],"e":"危化品事故应向上风方向疏散，下风和顺风会把有毒气体、烟气吹向人群，越跑越危险。"},{"id":836,"c":"化学安全","l":"II","t":0,"q":"二氧化碳钢瓶瓶身颜色是什么？","o":{"A":"黄色","B":"天蓝色","C":"黑色","D":"铝白色"},"a":["D"],"e":"二氧化碳钢瓶瓶身是铝白色，黄色、天蓝色、黑色分别是氨、氧、氮等气瓶的标识色，别记混。"},{"id":837,"c":"化学安全","l":"II","t":0,"q":"对于强酸、强碱或剧毒的废液,应如何处置？","o":{"A":"倒入排水系统","B":"集中存放,然后交相关部门处理"},"a":["B"],"e":"强酸强碱和剧毒废液要集中存放交相关部门处理，倒进排水系统会腐蚀管道、污染水体并伤及人员。"},{"id":838,"c":"化学安全","l":"II","t":0,"q":"对于洁净室的工作服是帽子、 衣服、 裤子和袜套分开的, 正确的穿着是","o":{"A":"帽子的披肩在衣服领子外面、衣服下摆在裤子外面、裤腿在袜套外面","B":"帽子的披肩在衣服领子里面、衣服下摆在裤子里面、裤腿在袜套里面","C":"帽子的披肩在衣服领子外面、衣服下摆在裤子里面、裤腿在袜套外面","D":"帽子的披肩在衣服领子里面、衣服下摆在裤子外面、裤腿在袜套里面"},"a":["B"],"e":"洁净服要把帽子披肩塞进衣领、衣服下摆塞进裤子、裤腿塞进袜套，层层包住防止人体尘粒外泄。"},{"id":839,"c":"化学安全","l":"II","t":0,"q":"对于高挥发性化学试剂,正确的储存方式为？","o":{"A":"敞口放置","B":"放在通风橱内","C":"放在防爆冰箱或冰柜之中","D":"放在水浴中"},"a":["B"],"e":"高挥发性试剂应放在通风橱内，敞口会挥发积聚，冰箱和水浴都不合适，要靠通风把蒸气排走。"},{"id":840,"c":"化学安全","l":"II","t":0,"q":"对于比水轻又不溶于水的易燃和可燃液体,如苯、甲苯、汽油、轻柴油等的火灾,不可以（ ）","o":{"A":"用水灭火","B":"用泡沫覆盖","C":"用沙掩埋","D":"用二氧化碳灭火剂"},"a":["A"],"e":"比水轻又不溶于水的易燃液体着火不能用水灭，水沉底后会把液体托起流淌，火势反而扩大。"},{"id":841,"c":"化学安全","l":"II","t":0,"q":"对危险废物的容器和包装物以及收集、贮存、运输、处置危险废物的设施、场所,必须","o":{"A":"设置危险废物识别标志","B":"设置生活垃圾识别标志","C":"不用设置识别标志"},"a":["A"],"e":"危险废物的容器包装以及收集、贮存、运输、处置的设施场所，都必须设置危险废物识别标志。"},{"id":842,"c":"化学安全","l":"II","t":0,"q":"对钠、钾等金属着火用什么扑灭？","o":{"A":"通常用干燥的细沙覆盖","B":"用水灭火","C":"CCl4灭火器","D":"CO2灭火器"},"a":["A"],"e":"钠钾等活泼金属着火用干燥细沙覆盖隔绝空气，水、四氯化碳、二氧化碳都会和它反应，火越烧越旺。"},{"id":843,"c":"化学安全","l":"II","t":0,"q":"对常用的又是易制毒的试剂,应:","o":{"A":"放在试剂架上","B":"放在抽屉里,并由专人管理","C":"锁在实验室的试剂柜中,并由专人管理"},"a":["C"],"e":"易制毒试剂应锁在实验室试剂柜中并由专人管理，放试剂架或抽屉里容易被随意取用、流失。"},{"id":844,"c":"化学安全","l":"II","t":0,"q":"当做实验时,皮肤不小心被酸灼伤怎么办？","o":{"A":"用抹布擦干即可","B":"先用大量水冲洗,以免深度受伤,再用稀NAHCO3溶液或稀氨水浸洗,最后用水洗","C":"直接用稀NAHCO3溶液或稀氨水中和","D":"不作任何处理,直接去医院"},"a":["B"],"e":"酸灼伤皮肤先用大量水冲洗稀释降温，再用稀碳酸氢钠或稀氨水浸洗中和，直接用碱中和会放热加重损伤。"},{"id":845,"c":"化学安全","l":"II","t":0,"q":"当有危害的化学试剂发生泄漏、洒落或堵塞时应如何办？","o":{"A":"首先避开并想好应对的办法再处理","B":"赶紧打扫干净或收拾起来"},"a":["A"],"e":"危化品泄漏洒落时先避开现场、想好处置办法再动手，急着打扫容易受伤，还会让泄漏扩散。"},{"id":846,"c":"化学安全","l":"II","t":0,"q":"当有汞（水银）溅失时,应如何处理现场","o":{"A":"用水擦","B":"用拖把拖","C":"扫干净后倒入垃圾桶","D":"收集颗粒状水银,另在溅失处用硫磺粉盖上并统一处理"},"a":["D"],"e":"汞溅失要收集颗粒状水银，溅落处撒硫磺粉让汞转成硫化汞再统一处理，用水擦、拖把拖只会扩大污染。"},{"id":847,"c":"化学安全","l":"II","t":0,"q":"当油脂等有机物玷污氧气钢瓶时,应立即用（ ）洗净","o":{"A":"乙醇","B":"四氯化碳","C":"水","D":"汽油"},"a":["B"],"e":"油脂玷污氧气钢瓶应立即用四氯化碳洗净，油脂遇高压氧会剧烈氧化甚至爆炸，乙醇、汽油本身也可燃。"},{"id":848,"c":"化学安全","l":"II","t":0,"q":"当实验室发生火灾、爆炸等危险事故时,首先应当如何处理？","o":{"A":"迅速撤离实验室","B":"自己留下来排查事故原因","C":"打电话求救","D":"切断电源"},"a":["D"],"e":"实验室发生火灾爆炸首先切断电源，防止触电和电气线路继续引燃，然后再撤离、报警。"},{"id":849,"c":"化学安全","l":"II","t":0,"q":"当浓硫酸撒到皮肤上时,应如何处理？","o":{"A":"用布擦拭","B":"用大量水冲洗","C":"不能擦,因为擦拭会将硫酸腐蚀范围扩大。应先用干抹布沾去硫酸。","D":"不作处理,立刻就医"},"a":["C"],"e":"浓硫酸沾到皮肤不能擦，擦拭会扩大腐蚀范围，应先用干抹布把硫酸沾去，再大量水冲。"},{"id":850,"c":"化学安全","l":"II","t":0,"q":"当不慎把少量浓硫酸滴在皮肤上(在皮肤上没形成挂液)时,正确的处理方法是:","o":{"A":"用酒精棉球擦","B":"不作处理,马上去医院","C":"用碱液中和后,用水冲洗","D":"用水直接冲洗"},"a":["D"],"e":"少量浓硫酸滴在皮肤且没形成挂液时，直接用大量水冲洗就行，用碱液中和反而放热灼伤。"},{"id":851,"c":"化学安全","l":"II","t":0,"q":"当不慎把大量浓硫酸滴在皮肤上时,正确的处理方法是","o":{"A":"用酒精棉球擦","B":"不作处理,马上去医院","C":"用碱液中和后,用水冲洗","D":"迅速以吸水性强的纸或布吸去后,马上再用大量水冲洗"},"a":["D"],"e":"大量浓硫酸滴到皮肤先用吸水纸或布吸去，再马上大量水冲，直接冲水会让硫酸稀释放热并四处流散。"},{"id":852,"c":"化学安全","l":"II","t":0,"q":"氮氧化物主要伤害人体的:","o":{"A":"眼、上呼吸道","B":"呼吸道深部的细支气管、肺泡","C":"皮肤","D":"消化道"},"a":["B"],"e":"氮氧化物水溶性差，能深入呼吸道深部的细支气管和肺泡引起肺水肿，所以主要伤害深部呼吸道。"},{"id":853,"c":"化学安全","l":"II","t":0,"q":"氮气钢瓶瓶身颜色是什么？","o":{"A":"灰色","B":"天蓝色","C":"黑色","D":"白色"},"a":["C"],"e":"氮气钢瓶瓶身是黑色，灰色常为氩气、天蓝色为氧气，按颜色标识识别气瓶不容易拿错。"},{"id":854,"c":"化学安全","l":"II","t":0,"q":"带油污（如凡士林或石蜡油）的玻璃器皿,在洗前尽量去除油污,然后放在（ ）中煮两次,再用洗涤剂和热水洗刷。","o":{"A":"市售洗涤剂","B":"稀盐酸或铬酸洗涤液","C":"5%的苏打液"},"a":["C"],"e":"带油污的玻璃器皿先尽量除油，再放5%苏打液中煮两次，碱液能皂化油污，然后用洗涤剂和热水刷洗。"},{"id":855,"c":"化学安全","l":"II","t":0,"q":"大量销毁易燃易爆化学物品时,应征得所在地（ ）监督机构的同意。","o":{"A":"化工","B":"人民政府","C":"公安消防"},"a":["C"],"e":"大量销毁易燃易爆化学物品，必须征得所在地公安消防监督机构同意，因为它负责消防监督和灭火救援。"},{"id":856,"c":"化学安全","l":"II","t":0,"q":"大量试剂应放在什么地方？","o":{"A":"试剂架上","B":"实验室内试剂柜中","C":"实验台下柜中","D":"试剂库内"},"a":["D"],"e":"大量试剂应放在试剂库内，实验室只留少量常用试剂，超量存放会加大火灾和中毒风险。"},{"id":857,"c":"化学安全","l":"II","t":0,"q":"大多数氧化剂和（ ）都能发生剧烈反应,放出有毒气体。","o":{"A":"强酸","B":"弱酸","C":"碱"},"a":["A"],"e":"大多数氧化剂遇强酸会发生剧烈反应并放出有毒气体，比如次氯酸盐遇酸放出氯气，所以要与强酸分开。"},{"id":858,"c":"化学安全","l":"II","t":0,"q":"存放剧毒物品必须使用( )保管、储存。","o":{"A":"带锁的铁皮柜","B":"铁皮柜","C":"带双锁的铁皮保险柜"},"a":["C"],"e":"存放剧毒物品必须用带双锁的铁皮保险柜，双人双锁保管，防止一个人就能取用导致流失。"},{"id":859,"c":"化学安全","l":"II","t":0,"q":"醇类及低碳酮类化合物废弃物如何处理？","o":{"A":"可经由大量清水稀释后,由下水道排放","B":"直接排放下水道","C":"倒入有机废液桶"},"a":["C"],"e":"醇类和低碳酮类废液要倒入有机废液桶集中处理，排下水道会污染水体，而且这类废液易燃易爆。"},{"id":860,"c":"化学安全","l":"II","t":0,"q":"处置实验过程产生的剧毒药品废液,说法错误的是:","o":{"A":"妥善保管","B":"不得随意丢弃、掩埋","C":"集中保存,统一处理","D":"稀释后用大量水冲净"},"a":["D"],"e":"剧毒废液稀释后冲入下水道是错误做法，剧毒品应妥善保管、集中保存统一处理，不得随意排放。"},{"id":861,"c":"化学安全","l":"II","t":0,"q":"处理使用后的废液时,下列哪个说法是错误的？","o":{"A":"不明的废液不可混合收集存放","B":"废液不可任意处理","C":"禁止将水以外的任何物质倒入下水道,以免造成环境污染和处理人员危险","D":"少量废液用水稀释后,可直接倒入下水道"},"a":["D"],"e":"少量废液稀释后直接倒下水道是错的，任何废液都不能任意排放，不明废液更不能混合收集存放。"},{"id":862,"c":"化学安全","l":"II","t":0,"q":"超级恒温水浴使用时错误的操作是","o":{"A":"超级恒温水浴内应使用去离子水（或纯净水）","B":"恒温水浴内去离子水未加到“正常水位”严禁通电,防止干烧","C":"可以使用自来水"},"a":["C"],"e":"超级恒温水浴用自来水是错的，自来水含杂质易结垢腐蚀、影响控温，应使用去离子水或纯净水。"},{"id":863,"c":"化学安全","l":"II","t":0,"q":"不需在棕色瓶中或用黑纸包裹,置于低温阴凉处的药品是:","o":{"A":"卤化银","B":"浓硝酸","C":"汞","D":"过氧化氢"},"a":["C"],"e":"汞不需要棕色瓶或黑纸避光低温保存，卤化银、浓硝酸、过氧化氢见光易分解，才需要这样存放。"},{"id":864,"c":"化学安全","l":"II","t":0,"q":"不需要放在密封的干燥器内的药品是:","o":{"A":"过硫酸盐","B":"五氧化二磷","C":"三氯化磷","D":"盐酸"},"a":["D"],"e":"盐酸不需要放密封干燥器，过硫酸盐、五氧化二磷、三氯化磷都易吸潮或遇水反应，必须干燥密封。"},{"id":865,"c":"化学安全","l":"II","t":0,"q":"不是实验室常用于皮肤或普通实验器械的消毒液为？","o":{"A":"0.2%-1% 漂白粉溶液","B":"70%乙醇","C":"2%碘酊","D":"0.2%-0.5%的洗必泰"},"a":["A"],"e":"0.2%-1%漂白粉溶液不是常用的皮肤或器械消毒液，70%乙醇、2%碘酊、洗必泰才是常用消毒剂。"},{"id":866,"c":"化学安全","l":"II","t":0,"q":"不慎发生意外,下列哪个操作是正确的？","o":{"A":"如果不慎将化学品弄洒或污染,立即自行回收或者清理现场,以免对他人产生危险","B":"任何时候见到他人洒落的液体应及时用抹布抹去,以免发生危险","C":"pH值中性即意味着液体是水,自行清理即可","D":"不慎将化学试剂弄到衣物和身体上,立即用大量清水冲洗10-15分钟"},"a":["D"],"e":"化学试剂沾到衣物或身体上，应立即用大量清水冲洗10-15分钟，自行回收、随手抹去都不安全。"},{"id":867,"c":"化学安全","l":"II","t":0,"q":"不具有强酸性和强腐蚀性的物质是:","o":{"A":"氢氟酸","B":"碳酸","C":"稀硫酸","D":"稀硝酸"},"a":["B"],"e":"碳酸是弱酸，腐蚀性弱；氢氟酸、稀硫酸、稀硝酸都有强酸性或强腐蚀性，其中氢氟酸还能蚀玻璃。"},{"id":868,"c":"化学安全","l":"II","t":0,"q":"玻璃电极的玻璃膜表面若粘有油污,使用（ ）浸洗,最后用蒸馏水洗净。","o":{"A":"酒精和四氯化碳","B":"四氯化碳","C":"酒精"},"a":["A"],"e":"玻璃电极膜沾了油污，先用酒精和四氯化碳浸洗，再用蒸馏水洗净，只单用其中一种去污不彻底。"},{"id":869,"c":"化学安全","l":"II","t":0,"q":"丙酮属于何种级别的毒性","o":{"A":"剧毒","B":"高毒","C":"低毒"},"a":["C"],"e":"丙酮属于低毒类化学品，但低毒不等于无害，它易燃又易挥发，通风和防火措施仍然不能少。"},{"id":870,"c":"化学安全","l":"II","t":0,"q":"丙酮属于低毒类化学品,下列叙述正确的是","o":{"A":"它的闪点只有-18℃,具有高度易燃性","B":"对神经系统有麻醉作用,并对黏膜有刺激作用","C":"它的沸点只有56℃,极易挥发","D":"以上都对"},"a":["D"],"e":"丙酮闪点-18℃高度易燃、沸点56℃极易挥发，对神经有麻醉作用并刺激黏膜，所以三项都对。"},{"id":871,"c":"化学安全","l":"II","t":0,"q":"表示危险化学品的急性毒性的LD50的单位是什么？","o":{"A":"mg/kg","B":"g/kg","C":"mL/kg","D":"ug/kg"},"a":["A"],"e":"LD50是半数致死量，单位是mg/kg，即每千克体重多少毫克，g/kg、mL/kg、μg/kg都不是标准单位。"},{"id":872,"c":"化学安全","l":"II","t":0,"q":"苯属于何种级别的毒性","o":{"A":"剧毒","B":"高毒","C":"低毒","D":"微毒"},"a":["B"],"e":"苯属于高毒类化学品，长期接触会损害造血系统，可能引起白血病，所以归为高毒而不是低毒。"},{"id":873,"c":"化学安全","l":"II","t":0,"q":"苯属于高毒类化学品,下列叙述正确的是","o":{"A":"短期接触,苯对中枢神经系统产生麻痹作用,引起急性中毒","B":"长期接触,苯会对血液造成极大伤害,引起慢性中毒","C":"对皮肤、粘膜有刺激作用,是致癌物质","D":"以上都是"},"a":["D"],"e":"苯短期接触会麻痹中枢神经引起急性中毒，长期接触伤血液引起慢性中毒，还刺激皮肤黏膜且致癌。"},{"id":874,"c":"化学安全","l":"II","t":0,"q":"苯属于高毒类化学品,下列叙述对的是:","o":{"A":"短期接触,苯对中枢神经系统产生麻痹作用,引起急性中毒。","B":"长期接触,苯会对血液造成极大伤害,引起慢性中毒。","C":"对皮肤、粘膜有刺激作用,是致癌物质","D":"以上都是"},"a":["D"],"e":"苯急性中毒表现为中枢神经麻痹，慢性中毒伤害血液系统，同时是致癌物，三个说法都正确。"},{"id":875,"c":"化学安全","l":"II","t":0,"q":"苯乙烯、乙酸乙烯酯应如何存放？","o":{"A":"放在防爆冰箱里","B":"和其它试剂混放","C":"放在通风橱内","D":"放在密闭的柜子中"},"a":["A"],"e":"苯乙烯、乙酸乙烯酯容易自聚，应放在防爆冰箱里低温保存，防止受热聚合放热引发事故。"},{"id":876,"c":"化学安全","l":"II","t":0,"q":"苯乙烯、甲基丙烯酸、乙酸乙烯酯应如何存放","o":{"A":"放在防爆冰箱里和其它试剂混放","B":"放在通风橱内","C":"放在试剂柜中"},"a":["A"],"e":"苯乙烯、甲基丙烯酸、乙酸乙烯酯都易自聚，需放防爆冰箱低温存放，避免受热引发剧烈聚合。"},{"id":877,"c":"化学安全","l":"II","t":0,"q":"搬运剧毒化学品后,应该:","o":{"A":"用流动的水洗手","B":"吃东西补充体力","C":"休息"},"a":["A"],"e":"搬运剧毒化学品后要用流动的水洗手，防止毒物经口或皮肤吸收，不能马上吃东西补充体力。"},{"id":878,"c":"化学安全","l":"II","t":0,"q":"把玻璃管或温度计插入橡皮塞或软木塞时,常常会折断而使人受伤。下列不正确的操作方法是","o":{"A":"可在玻璃管上沾些水或涂上碱液、甘油等作润滑剂","B":"橡皮塞等钻孔时,打出的孔比管径略小,可用圆锉把孔锉一下,适当扩大孔径","C":"一手拿着塞子,一手拿着玻璃管,边旋转边慢慢地把玻璃管插入塞子中","D":"操作时双手距离较远"},"a":["D"],"e":"插玻璃管时双手距离较远是不正确的，两手应靠近并旋转插入，距离远容易折断扎伤手。"},{"id":879,"c":"化学安全","l":"II","t":0,"q":"K、 Na、 Mg、 Ca、 Li、 AlH3、 MgO、 电石中, 遇水发生激烈反应的有几种:","o":{"A":"5","B":"6","C":"7"},"a":["B"],"e":"K、Na、Mg、Ca、Li、AlH3和电石遇水都剧烈反应，共6种；MgO与水反应温和，不算在内。"},{"id":880,"c":"化学安全","l":"II","t":0,"q":"HCN无色,气味为:","o":{"A":"无味","B":"大蒜味","C":"苦杏仁味","D":"烂苹果味"},"a":["C"],"e":"HCN有苦杏仁味，无味、大蒜味、烂苹果味都不对，可据此警觉，但不能只靠气味判断有没有中毒风险。"},{"id":881,"c":"化学安全","l":"II","t":0,"q":"CO呈","o":{"A":"酸味","B":"烂苹果味","C":"无味"},"a":["C"],"e":"CO无色无味，正因为没有气味才难以察觉、极易中毒，酸味和烂苹果味都不符合。"},{"id":882,"c":"化学安全","l":"II","t":0,"q":"Cl2、Br2中毒是否可以进行人工呼吸？","o":{"A":"可以","B":"不可以","C":"不一定"},"a":["B"],"e":"氯气溴气中毒不能做人工呼吸，口对口会把毒气吹给施救者，也会刺激呼吸道，应先脱离环境再给氧。"},{"id":883,"c":"化学安全","l":"II","t":0,"q":"Cl2 一般呈什么颜色","o":{"A":"棕色","B":"无色","C":"黄绿色"},"a":["C"],"e":"氯气呈黄绿色并有刺激性气味，棕色和无色都不对，颜色是识别氯气泄漏的直观特征。"},{"id":884,"c":"化学安全","l":"II","t":0,"q":"2,4-二硝基苯甲醚、萘、二硝基萘等可升华固体药品燃烧应如何进行灭火","o":{"A":"用灭火器灭火","B":"火灭后还要不断向燃烧区域上空及周围喷雾水","C":"用水灭火,并不断向燃烧区域上空及周围喷雾水至可燃物完全冷却","D":"以上都是"},"a":["D"],"e":"这类可升华固体燃烧要用水灭火，并不断向燃烧区上空及周围喷雾水至完全冷却，灭火器和事后喷雾也正确。"},{"id":885,"c":"化学安全","l":"II","t":0,"q":"（ ）应和氰化物、氧化剂、遇湿易燃物远离,并不得与碱类共储混运。","o":{"A":"酸类","B":"腐蚀类","C":"还原剂"},"a":["A"],"e":"酸类要和氰化物、氧化剂、遇湿易燃物远离，酸遇氰化物会产生剧毒氰化氢，也不得与碱类共储混运。"},{"id":886,"c":"化学安全","l":"II","t":0,"q":"（ ）是毒物进入人体最主要、最常见、最危险的途径。","o":{"A":"呼吸道","B":"皮肤","C":"眼睛","D":"消化道"},"a":["A"],"e":"呼吸道是毒物进入人体最主要、最常见也最危险的途径，肺泡表面积大、吸收快，中毒来得急。"},{"id":887,"c":"化学安全","l":"II","t":0,"q":"( )能溶解丝、毛和动物组织,所以具有腐蚀性。","o":{"A":"小苏打","B":"汽油","C":"火碱"},"a":["C"],"e":"火碱就是氢氧化钠，能溶解丝、毛和动物组织，所以有强腐蚀性；小苏打和汽油都没有这种作用。"},{"id":888,"c":"化学安全","l":"II","t":0,"q":"( )不能发生爆炸。","o":{"A":"亚麻粉尘","B":"砂尘","C":"面粉"},"a":["B"],"e":"砂尘不能发生爆炸，亚麻粉尘、面粉等可燃粉尘在空气中达到一定浓度时遇火源会爆燃。"},{"id":889,"c":"化学安全","l":"II","t":1,"q":"做普通溶剂蒸馏时应注意的操作是","o":{"A":"充分了解各馏份的沸点","B":"仔细检查装置的密闭情况","C":"蒸馏瓶内可以不用加入沸石且蒸馏速度不用控制","D":"要具有充分的冷却效果（冷却水的温度和气相溶剂有 10℃以上的温差） 并尽量使蒸馏在通风柜里操作。"},"a":["A","B","D"],"e":"蒸馏要了解各馏份沸点、检查装置密闭、保证冷却效果并在通风柜操作；不加沸石、不控速是错误操作。"},{"id":890,"c":"化学安全","l":"II","t":1,"q":"自燃性试剂应如何存放:","o":{"A":"单独储存","B":"储存于通风、阴凉、干燥处","C":"存放于试剂架上","D":"远离明火及热源,防止太阳直射"},"a":["A","B","D"],"e":"自燃性试剂要单独储存于通风、阴凉、干燥处，远离明火、热源和阳光直射，不能随便放在试剂架上。"},{"id":891,"c":"化学安全","l":"II","t":1,"q":"在使用一种不了解的化学药品前应做好的准备有:","o":{"A":"明确这种药品在实验中的作用 , 掌握这种药品的物理性质（如:熔点、沸点、密度等）和化学性质","B":"了解这种药品的毒性","C":"了解这种药品对人体的侵入途径和危险特性","D":"了解中毒后的急救措施"},"a":["A","B","C","D"],"e":"用不熟悉的药品前，要明确它在实验中的作用、掌握理化性质、了解毒性和侵入途径、掌握急救措施。"},{"id":892,"c":"化学安全","l":"II","t":1,"q":"遇水燃烧物质是指与水或酸接触会产生可燃气体,同时放出高热,该热量就能引起可燃气体着火爆炸的物质。下列物质属于遇水燃烧的是:","o":{"A":"碳化钙（电石）","B":"碳酸钙","C":"锌","D":"硝化棉"},"a":["A","C"],"e":"电石遇水生成乙炔并放热，锌遇酸产生氢气，都属于遇水燃烧物质；碳酸钙和硝化棉不属于。"},{"id":893,"c":"化学安全","l":"II","t":1,"q":"有毒化学品对人体的危害途径有哪些:","o":{"A":"呼吸道","B":"消化道","C":"皮肤"},"a":["A","B","C"],"e":"有毒化学品可经呼吸道、消化道和皮肤三条途径进入人体，所以三项都是危害途径。"},{"id":894,"c":"化学安全","l":"II","t":1,"q":"用酒精灯时,以下哪种操作正确:","o":{"A":"点火时要用火柴点","B":"点火时用另一个点着的灯去点","C":"灭灯时可用嘴去吹","D":"灭灯时要用灯帽盖灭"},"a":["A","D"],"e":"酒精灯要用火柴点燃、用灯帽盖灭；用另一盏点着的灯去点易洒酒精起火，用嘴吹可能把火吹进灯里。"},{"id":895,"c":"化学安全","l":"II","t":1,"q":"以下药品中,不宜与水直接接触的是:","o":{"A":"金属钠、钾","B":"电石","C":"白磷","D":"金属氢化物"},"a":["A","B","D"],"e":"金属钠钾、电石、金属氢化物遇水会剧烈反应放热放气，不宜与水直接接触；白磷则要用水封保存。"},{"id":896,"c":"化学安全","l":"II","t":1,"q":"以下药品受震或受热可能发生爆炸的是:","o":{"A":"过氧化物","B":"高氯酸盐","C":"乙炔铜","D":"乙炔"},"a":["A","B","C"],"e":"过氧化物、高氯酸盐、乙炔铜受震或受热容易爆炸；乙炔是气体，要加压溶解储存，不属于这类固体。"},{"id":897,"c":"化学安全","l":"II","t":1,"q":"以下哪些药品（试剂）在使用时必须注意要干燥防潮:","o":{"A":"锂","B":"碳化钙","C":"磷化钙"},"a":["A","B","C"],"e":"锂、碳化钙、磷化钙遇水会反应放热或放出有毒气体，所以使用和保存时都必须干燥防潮。"},{"id":898,"c":"化学安全","l":"II","t":1,"q":"以下哪些酸具有强腐蚀性,使用时须做必要防护:","o":{"A":"硝酸","B":"冰醋酸","C":"硼酸"},"a":["A","B"],"e":"硝酸和冰醋酸有强腐蚀性，使用时须做防护；硼酸酸性很弱、腐蚀性小，一般不用特别防护。"},{"id":899,"c":"化学安全","l":"II","t":1,"q":"以下哪些试剂具有毒性？","o":{"A":"汞","B":"苯","C":"氯仿","D":"双氧水"},"a":["A","B","C"],"e":"汞、苯、氯仿都有明显毒性，属于有毒试剂；双氧水是常用氧化剂和消毒剂，不列入有毒试剂。"},{"id":900,"c":"化学安全","l":"II","t":1,"q":"以下哪些实验室用水不可以直接排放入下水道:","o":{"A":"冷凝水","B":"洗刷用水","C":"废酸废碱液","D":"有机溶剂"},"a":["B","C","D"],"e":"洗刷用水、废酸废碱液和有机溶剂都不能直接排入下水道，冷凝水比较洁净，可以直接排放。"},{"id":901,"c":"化学安全","l":"II","t":1,"q":"以下不能混合的废液是:","o":{"A":"过氧化物与有机物","B":"硝酸盐和硫酸","C":"硫化物和酸类","D":"易燃品和氧化剂"},"a":["A","C","D"],"e":"过氧化物与有机物、硫化物与酸类、易燃品与氧化剂混放会反应放热、放毒气或起火；硝酸盐和硫酸不算典型禁忌。"},{"id":902,"c":"化学安全","l":"II","t":1,"q":"一类固体化学试剂如金属钾、钠、锂、钙、电石等,遇水即可发生激烈反应,并放出大量热,也可产生爆炸,它们应如何存放:","o":{"A":"直接放在试剂瓶中保存","B":"浸没在煤油中保存（容器不得渗漏）","C":"用纸密封包裹存放","D":"附近不得有盐酸、 硝酸等散发酸雾的物质存在"},"a":["B","D"],"e":"钾钠锂钙和电石要浸没在煤油中密封保存，并远离散发酸雾的盐酸硝酸；直接瓶装或纸包都会受潮反应。"},{"id":903,"c":"化学安全","l":"II","t":1,"q":"液氮中保存安瓿瓶的要点是","o":{"A":"安瓿瓶必须严格密封,若熔封不严或稍有破裂,液氮会渗入管内。在常温下,瓶外的温度相对很高,液氮急速气化膨胀,会发生爆炸","B":"处理液氮时,应仔细操作。防止皮肤和液氮接触造成“冷烧伤”","C":"安瓿瓶应存放在液氮的气相中,决不要浸在液氮中","D":"从冷藏条件下取出安瓿瓶时,保护好手和眼等。安瓿瓶最好在超低温冰柜 或干冰中保存"},"a":["A","B","C","D"],"e":"液氮存安瓿瓶要严格密封防液氮渗入气化爆炸、防冷烧伤、放气相不浸泡、取用时护手护眼，四项都对。"},{"id":904,"c":"化学安全","l":"II","t":1,"q":"学生在使用剧毒物品时,必须由（ ）在场指导","o":{"A":"教师","B":"临时工","C":"实验室工作人员","D":"其他人员"},"a":["A","C"],"e":"学生使用剧毒物品必须由教师和实验室工作人员在场指导，临时工和其他人员不具备指导资格。"},{"id":905,"c":"化学安全","l":"II","t":1,"q":"需在棕色瓶中或用黑纸包裹,且置于低温阴凉处的药品有以下几种","o":{"A":"卤化银","B":"浓硝酸","C":"过氧化氢","D":"催化剂"},"a":["A","B","C"],"e":"卤化银、浓硝酸、过氧化氢见光易分解，需用棕色瓶或黑纸包裹并低温阴凉存放；催化剂不需要这样保存。"},{"id":906,"c":"化学安全","l":"II","t":1,"q":"需要进行危险化学品登记的单位为（）","o":{"A":"生产危险化学品的单位","B":"使用其他危险化学品数量构成重大危险源的单位","C":"经营危险化学品的单位","D":"使用剧毒化学品的单位"},"a":["A","B","C","D"],"e":"生产、经营危化品的单位，使用剧毒化学品或使用其他危化品构成重大危险源的单位，都要进行登记。"},{"id":907,"c":"化学安全","l":"II","t":1,"q":"需要放在密封的干燥器内的药品有以下几种:","o":{"A":"过硫酸盐","B":"五氧化二磷","C":"三氯化磷","D":"盐酸"},"a":["A","B","C"],"e":"过硫酸盐、五氧化二磷、三氯化磷易吸潮或遇水反应，必须放在密封干燥器内；盐酸不需要。"},{"id":908,"c":"化学安全","l":"II","t":1,"q":"需要低温保存的安瓿瓶最好放在（ ）中存放。","o":{"A":"液氮的气相","B":"液氮","C":"超低温冰柜","D":"干冰"},"a":["A","C","D"],"e":"需低温保存的安瓿瓶最好放液氮气相、超低温冰柜或干冰中，不能直接浸入液氮，以免液氮渗入后爆炸。"},{"id":909,"c":"化学安全","l":"II","t":1,"q":"新购制的玻璃器皿含有游离碱,先用（ ）浸泡数小时后,再用清水洗净。","o":{"A":"2%的盐酸","B":"铬酸洗涤液","C":"氢氧化钠或碳酸氢钠稀溶液","D":"市售洗涤剂"},"a":["A","B"],"e":"新购玻璃器皿表面含游离碱，用2%盐酸或铬酸洗液浸泡数小时再清水洗净，碱液和洗涤剂除不掉游离碱。"},{"id":910,"c":"化学安全","l":"II","t":1,"q":"下面所列试剂应分开保存的是","o":{"A":"乙醚与高氯酸","B":"苯与过氧化氢","C":"丙酮与硝基化合物","D":"浓硫酸与盐酸"},"a":["A","B","C"],"e":"乙醚与高氯酸、苯与过氧化氢、丙酮与硝基化合物混放易氧化起火爆炸，必须分开；浓硫酸与盐酸可以共存。"},{"id":911,"c":"化学安全","l":"II","t":1,"q":"下面哪组溶剂属易燃类液体（闪点在 25℃以下）","o":{"A":"甲醇、乙醇","B":"四氯化碳、乙酸 乙酸丁酯、石油醚","C":"丙酮、甲苯","D":"异丙醇、二甲苯"},"a":["A","C","D"],"e":"甲醇乙醇、丙酮甲苯、异丙醇二甲苯闪点都低于25℃，属易燃液体；四氯化碳不燃，不能算易燃类。"},{"id":912,"c":"化学安全","l":"II","t":1,"q":"下面哪些行为不能在洁净室里进行:","o":{"A":"抽烟","B":"用烙铁焊接","C":"配制溶液","D":"饮水和进食"},"a":["A","B","C","D"],"e":"洁净室里不能抽烟、用烙铁焊接、配制溶液，也不能饮水和进食，这些都会产生尘粒、烟雾或污染。"},{"id":913,"c":"化学安全","l":"II","t":1,"q":"下面哪些物质彼此混合时,特别容易引起火灾？","o":{"A":"活性炭与硝酸铵","B":"硝酸、硫酸和盐酸","C":"抹布与浓硫酸","D":"可燃性物质（木材、织物等）与浓硫酸"},"a":["A","C","D"],"e":"活性炭与硝酸铵、抹布与浓硫酸、可燃物与浓硫酸混合都易氧化放热起火；三种强酸互混不属于这类情况。"},{"id":914,"c":"化学安全","l":"II","t":1,"q":"下面哪些是职业中毒因素所致职业病:（）","o":{"A":"铅及其化合物中毒（不包括四乙基铅）","B":"镉及其化合物中毒","C":"磷及其化合物中毒","D":"炭疽"},"a":["A","B","C"],"e":"铅、镉、磷及其化合物中毒属于职业中毒因素所致职业病，炭疽是生物因素引起的，不在其列。"},{"id":915,"c":"化学安全","l":"II","t":1,"q":"下面哪些试剂易侵蚀玻璃而影响纯度,应保存在塑料瓶或者涂石蜡的玻璃瓶中:","o":{"A":"浓硫酸","B":"氢氟酸、苛性碱","C":"氟化物","D":"王水"},"a":["B","C"],"e":"氢氟酸、苛性碱和氟化物易侵蚀玻璃，应保存在塑料瓶或涂石蜡的玻璃瓶中；浓硫酸和王水可用玻璃瓶。"},{"id":916,"c":"化学安全","l":"II","t":1,"q":"下列属于易燃液体的是:（ ）","o":{"A":"5%稀硫酸","B":"乙醇","C":"苯","D":"二硫化碳"},"a":["B","C","D"],"e":"乙醇、苯、二硫化碳闪点低、易挥发，都是易燃液体；5%稀硫酸不燃，不属于易燃液体。"},{"id":917,"c":"化学安全","l":"II","t":1,"q":"下列属于易燃液体的是","o":{"A":"乙醚","B":"乙醇","C":"苯","D":"二硫化碳"},"a":["A","B","C","D"],"e":"乙醚、乙醇、苯、二硫化碳闪点都很低，极易挥发燃烧，四项全部属于易燃液体。"},{"id":918,"c":"化学安全","l":"II","t":1,"q":"下列属于危险化学品的是","o":{"A":"易燃液体","B":"氧化剂和有机过氧化物","C":"汽油 放射性物品","D":"剧毒药品和感染性物品"},"a":["A","B","C","D"],"e":"易燃液体、氧化剂和有机过氧化物、汽油和放射性物品、剧毒药品和感染性物品，都属于危险化学品。"},{"id":919,"c":"化学安全","l":"II","t":1,"q":"下列物质属于剧毒物的是:","o":{"A":"氯酸钾","B":"氢氧化钠","C":"三氧化二砷","D":"硫酸钡"},"a":["A","C"],"e":"三氧化二砷就是砒霜，属剧毒物；氯酸钾是强氧化性毒害品也应严管；氢氧化钠是腐蚀品，硫酸钡基本无毒。"},{"id":920,"c":"化学安全","l":"II","t":1,"q":"下列物质有毒的是:（）","o":{"A":"乙二醇","B":"硫化氢","C":"乙醇","D":"甲醛"},"a":["A","B","D"],"e":"乙二醇、硫化氢、甲醛都有毒，硫化氢还是剧毒气体；乙醇是低毒物质，不列入有毒化学品。"},{"id":921,"c":"化学安全","l":"II","t":1,"q":"下列试剂应放在棕色瓶内保藏的是","o":{"A":"硫酸亚铁","B":"高锰酸钾","C":"亚硫酸钠","D":"硫酸钠"},"a":["A","B","C"],"e":"硫酸亚铁、高锰酸钾、亚硫酸钠见光易氧化分解，应放在棕色瓶内避光保存；硫酸钠稳定，不需避光。"},{"id":922,"c":"化学安全","l":"II","t":1,"q":"下列描述中属于诱发安全事故原因的是（ ）","o":{"A":"设备的不安全状态","B":"人的不安全行为","C":"不良的工作环境","D":"劳动组织管理的缺陷"},"a":["A","B","C","D"],"e":"设备的不安全状态、人的不安全行为、不良的工作环境和劳动组织管理缺陷，都是诱发安全事故的原因。"},{"id":923,"c":"化学安全","l":"II","t":1,"q":"下列化学试剂中,毒性较大的是:","o":{"A":"氰化物","B":"氧化砷","C":"氯化钠","D":"汞盐"},"a":["A","B","D"],"e":"氰化物、氧化砷和汞盐毒性都很大，属剧毒或高毒试剂；氯化钠就是食盐，基本无毒。"},{"id":924,"c":"化学安全","l":"II","t":1,"q":"下列粉尘中,哪些粉尘可能会发生爆炸:","o":{"A":"生石灰","B":"面粉","C":"煤粉","D":"铝粉"},"a":["B","C","D"],"e":"面粉、煤粉、铝粉都是可燃粉尘，在空气中达到爆炸浓度遇火源就会爆炸；生石灰不可燃，不会粉尘爆炸。"},{"id":925,"c":"化学安全","l":"II","t":1,"q":"下列陈述哪些是正确的:","o":{"A":"丙酮、乙醇都有较强的挥发性和易燃性,二者都不能在任何有明火的地方使用","B":"丙酮会对肝脏和大脑造成损害,因此避免吸入丙酮气体","C":"强酸强碱等不能与身体接触;弱酸弱碱在使用中可以与身体接触, 从试剂瓶中取出固体化学粉末状试剂时,可以使用专用工具伸入瓶子内部取粉末试剂;移取液体时可以同样操作"},"a":["A","B"],"e":"丙酮和乙醇都易挥发易燃，遇明火危险；丙酮蒸气伤肝伤脑，须避免吸入。C把弱酸碱接触和移液说得太随意，故不选。"},{"id":926,"c":"化学安全","l":"II","t":1,"q":"下列（ ）物质与水作用会出现化学自燃着火:","o":{"A":"钠","B":"氢化钠","C":"硼氢化钠","D":"黄磷"},"a":["A","B","C","D"],"e":"钠、氢化钠、硼氢化钠遇水剧烈反应放热放氢，热量足以自燃；黄磷燃点极低，受潮接触空气即自燃，四项全选。"},{"id":927,"c":"化学安全","l":"II","t":1,"q":"稀释浓硫酸时,正确的操作是:","o":{"A":"稀释浓酸时,应将酸慢慢注入水中","B":"边倒边搅拌,温度过高时应等冷却或降温后再继续进行","C":"稀释少量浓硫酸时,可以将水倒入浓硫酸中","D":"若有酸溅到身上应先用棉布吸取浓硫酸,再用大量温清水冲洗"},"a":["A","B","D"],"e":"浓硫酸必须酸入水、边加边搅拌，过热先冷却；溅到皮肤先用棉布吸去再大量温水冲。水倒入酸会暴沸飞溅，C错。"},{"id":928,"c":"化学安全","l":"II","t":1,"q":"为避免误食有毒的化学药品,应注意做到以下事项()","o":{"A":"不准把食物、食具带进化验室","B":"在实验室内只能吃口香糖","C":"使用化学药品后须先洗净双手方能进食","D":"实验室内禁止吸烟"},"a":["A","C","D"],"e":"实验室禁止饮食，食物食具不带入，操作后洗手再进食，室内禁烟。B允许嚼口香糖仍属进食，同样有误食风险。"},{"id":929,"c":"化学安全","l":"II","t":1,"q":"危险化学品的毒害包括什么方面:","o":{"A":"急性毒性,皮肤腐蚀性/刺激性,严重眼损伤/眼刺激","B":"呼吸系统/皮肤过敏反应,生殖细胞突变性,致癌性","C":"生殖毒性,靶器官系统毒性","D":"水环境危害性, 放射性危害"},"a":["A","B","C","D"],"e":"危化品毒害包括急性毒性、腐蚀与眼刺激、致敏、致突变致癌、生殖及靶器官毒性，还有水环境危害和放射性。"},{"id":930,"c":"化学安全","l":"II","t":1,"q":"危险化学品的储存设施必须与以下（ ）场所、区域之间要符合国家规定的距离标准","o":{"A":"居民区、商业中心、公园等人口密集地区","B":"学校、医院、影剧院、体育场（馆）等公共设施","C":"风景名胜区、自然保护区","D":"军事禁区、军事管理区"},"a":["A","B","C","D"],"e":"储存设施须与人口密集区、公共设施、风景名胜与自然保护区、军事禁区等保持国家规定的外部安全距离，四项都要。"},{"id":931,"c":"化学安全","l":"II","t":1,"q":"危险化学品包括那些种类:","o":{"A":"爆炸品易燃气体易燃喷雾剂, 氧化性气体,加压气体","B":"易燃液体,易燃固体,自反应物质","C":"可自燃液体,自燃自热物质,遇水放出易燃气体的物质","D":"氧化性液体,氧化性固体,有机过氧化物,金属腐蚀性"},"a":["A","B","C","D"],"e":"危化品按危险特性分爆炸品、气体、易燃液体固体、自反应及遇水放气物质、氧化性物质和腐蚀品等，四项都在内。"},{"id":932,"c":"化学安全","l":"II","t":1,"q":"塑料离心管可以盛放:","o":{"A":"有机溶剂","B":"酶溶液","C":"盐溶液","D":"普通水溶液"},"a":["C","D"],"e":"塑料离心管耐盐溶液和水溶液，但有机溶剂会让塑料溶胀变形，酶蛋白易吸附在管壁失活，故只选C、D。"},{"id":933,"c":"化学安全","l":"II","t":1,"q":"试剂或异物溅入眼内,处理措施有","o":{"A":"玻璃:在盆中水洗,切勿用手揉动","B":"溴:大量水洗,再用 1％NAHCO3 溶液洗","C":"酸:大量水洗,用 3~5％NAHCO3 溶液洗","D":"碱:大量水洗,再以 1％硼酸溶液洗 先洗涤、急救后再送医院"},"a":["A","B","D"],"e":"异物入眼忌揉，玻璃用盆水冲洗；溴和碱先大量水冲，再分别用碳酸氢钠、硼酸液中和；先急救再送医，取A、B、D。"},{"id":934,"c":"化学安全","l":"II","t":1,"q":"使用易燃易爆的化学药品应该注意以下哪几点","o":{"A":"避免明火加热","B":"加热时使用水浴或油浴","C":"在通风橱中进行操作","D":"不可猛烈撞击"},"a":["A","B","C","D"],"e":"易燃易爆品要远离明火，用水浴油浴间接加热，在通风橱操作并及时排走蒸气，还忌猛烈撞击摩擦，四项都对。"},{"id":935,"c":"化学安全","l":"II","t":1,"q":"使用剧毒药品时应该:","o":{"A":"佩备个人防护用具","B":"做好应急援救预案"},"a":["A","B"],"e":"剧毒品操作必须配齐个人防护用具，同时事先制定应急援救预案，两者缺一不可，不能只顾防护而忘了应急。"},{"id":936,"c":"化学安全","l":"II","t":1,"q":"使用碱金属引起燃烧应如何处理:","o":{"A":"马上使用灭火器灭火","B":"马上向燃烧处盖砂子或浇水","C":"尽快移去临近其它溶剂,关闭热源和电源,再用灭火器灭火","D":"如远离水源,可马上用石棉布盖住燃烧处"},"a":["C","D"],"e":"碱金属着火不能浇水，也不能直接拿普通灭火器喷，应先移开周围溶剂、断热断电，再用干砂或石棉布覆盖窒息。"},{"id":937,"c":"化学安全","l":"II","t":1,"q":"使用干燥箱和恒温箱,应注意的事项有（ ）。","o":{"A":"使用前检查电源,要有良好的接地线","B":"箱内应保持清洁,放物网篮不得有锈,否则影响待干燥物品的洁净度","C":"塑料、有机玻璃制品的加热温度不能超过60℃,玻璃制品的温度不能超过180℃","D":"用温度不能超过干燥箱的最高允许温度,用毕要及时切断电源"},"a":["A","B","C","D"],"e":"干燥箱要接地良好，箱内清洁无锈，塑料件不超60℃、玻璃不超180℃，且不超过最高允许温度，用完及时断电。"},{"id":938,"c":"化学安全","l":"II","t":1,"q":"实验中造成的创伤应如何处理？（）","o":{"A":"伤处不能用手抚摸,也不能用水洗涤","B":"不作处理,直接就医","C":"轻伤可以涂紫药水、红药水、碘酒等","D":"必要时可用消炎药粉涂抹,用绷带包扎"},"a":["C","D"],"e":"一般创伤先清创，轻伤可涂紫药水、红药水或碘酒，必要时撒消炎粉包扎。A、B不处理或直接就医都不合适。"},{"id":939,"c":"化学安全","l":"II","t":1,"q":"实验中遇到烫伤应如何处理？（）","o":{"A":"伤处不能用手抚摸,也不能用水洗涤","B":"不作处理,直接就医","C":"轻伤可以涂紫药水、红药水、碘酒等","D":"必要时可用消炎药粉涂抹,用绷带包扎"},"a":["C","D"],"e":"烫伤后别用手揉搓，轻伤可涂紫药水、碘酒等，必要时撒消炎粉用绷带包扎；完全不洗或直接就医也不够。"},{"id":940,"c":"化学安全","l":"II","t":1,"q":"实验中用到很多玻璃器皿,容易破碎,为避免造成割伤应该注意哪几点:","o":{"A":"装配仪器时用力过猛或装配不当","B":"装配仪器时用力处远离连接部位","C":"仪器口径不合而勉强连接","D":"玻璃折断面未烧圆滑,有棱角"},"a":["A","B","C","D"],"e":"割伤多因装配用力过猛、用力点远离接口、口径不合硬接，以及玻璃断口未烧圆滑有棱角，四项都是要避免的隐患。"},{"id":941,"c":"化学安全","l":"II","t":1,"q":"实验中碱液溅入眼内,应如何做应急处理？（）","o":{"A":"用干净的毛巾擦拭","B":"用大量水冲洗","C":"必要时去医院诊治","D":"用稀硼酸溶液洗"},"a":["B","C","D"],"e":"碱液入眼要立刻用大量清水冲，再用稀硼酸液中和，随后就医；用毛巾擦会加重损伤并把碱揉进眼内，故A错。"},{"id":942,"c":"化学安全","l":"II","t":1,"q":"实验室内操作大量乙炔气时,应注意的问题有","o":{"A":"室内不可有明火","B":"室内不可有产生电火花的电器","C":"房间应密闭","D":"室内应有高湿度"},"a":["A","B"],"e":"乙炔易燃易爆，室内严禁明火和产生电火花的电器。房间要通风而非密闭，湿度也不是关键，故C、D不选。"},{"id":943,"c":"化学安全","l":"II","t":1,"q":"实验室废液应如何处理:","o":{"A":"直接向环境排放废液","B":"未经处理不应随意向环境排放有毒、有害废物","C":"分别收集,集中预处理,将毒害降低到国家规定的范围,然后排放","D":"应配备专门的废液回收桶,将废液上交有关部门处理回收 有毒化学试剂与腐蚀性化学试剂废弃物应根据性质不同分别单独存放"},"a":["B","C","D"],"e":"废液要分类收集、集中预处理达标后排放，用专用回收桶交有关部门，有毒和腐蚀性废物分开存放。直接排放绝对禁止。"},{"id":944,"c":"化学安全","l":"II","t":1,"q":"实验室常用的加热热源包括几种:","o":{"A":"明火","B":"水浴","C":"蒸汽浴","D":"油浴、沙浴、盐浴"},"a":["A","B","C","D"],"e":"实验室加热可用明火，也常用水浴、蒸汽浴、油浴、沙浴、盐浴等间接加热方式，四类都属常用热源。"},{"id":945,"c":"化学安全","l":"II","t":1,"q":"实验室常可用于手部皮肤消毒的溶液有（ ）。","o":{"A":"70%乙醇","B":"0.3-0.5%碘伏","C":"0.1%的新洁尔灭","D":"60%异丙醇"},"a":["A","B","C","D"],"e":"70%乙醇、0.3%至0.5%碘伏、0.1%新洁尔灭和60%异丙醇都能用于手部皮肤消毒，浓度合适即可，四项全对。"},{"id":946,"c":"化学安全","l":"II","t":1,"q":"实验过程中发生烧烫(灼)伤,正确的处理方法是","o":{"A":"浅表的小面积灼伤,以冷水冲洗 15 至 30 分钟至散热止痛","B":"以生理食盐水擦拭（勿以药膏、牙膏、酱油涂抹或以纱布盖住）","C":"若有水泡可自行刺破","D":"大面积的灼伤,应紧急送至医院"},"a":["A","B","D"],"e":"小面积灼伤用冷水冲15至30分钟散热，再用生理盐水轻擦，别涂牙膏药膏；水泡不可自行刺破，大面积要立即送医。"},{"id":947,"c":"化学安全","l":"II","t":1,"q":"实验过程产生的剧毒药品废液必须:","o":{"A":"妥善保管","B":"不得随意丢弃、掩埋","C":"集中保存,统一处理","D":"稀释后用大量水冲净"},"a":["A","B","C"],"e":"剧毒废液要妥善保管、集中统一处理，绝不能随意丢弃掩埋；稀释后冲入下水道仍会造成污染，故D错。"},{"id":948,"c":"化学安全","l":"II","t":1,"q":"如果不慎发生割伤事故应如何处理？","o":{"A":"先将伤口处的玻璃碎片取出","B":"若伤口不大,用蒸馏水洗净伤口,再涂上红药水,撒上止血粉用纱布包扎好","C":"伤口较大或割破了主血管,则应用力按住主血管,防止大出血","D":"及时送医院治疗"},"a":["A","B","C","D"],"e":"割伤先取出玻璃碎片，小伤口用蒸馏水洗净、涂红药水撒止血粉包扎；伤及主血管要按住止血并尽快送医，四项都对。"},{"id":949,"c":"化学安全","l":"II","t":1,"q":"溶剂溅出并燃烧应如何处理:","o":{"A":"马上使用灭火器灭火","B":"马上向燃烧处盖砂子或浇水","C":"尽快移去临近其它溶剂,关闭热源和电源,再灭火","D":"马上用石棉布 盖住燃烧处"},"a":["C","D"],"e":"溶剂着火应先移走周围溶剂、切断热源电源再灭火，或用石棉布覆盖窒息；直接浇水会让溶剂扩散，故A、B错。"},{"id":950,"c":"化学安全","l":"II","t":1,"q":"燃烧三要素是（ ）","o":{"A":"可燃物质","B":"火源","C":"助燃物质","D":"温度"},"a":["A","B","C"],"e":"燃烧需要可燃物、助燃物和点火源三个条件同时具备，温度只是火源带来的结果，本身不算独立要素。"},{"id":951,"c":"化学安全","l":"II","t":1,"q":"取用试剂时,必须遵守的原则是（ ）。","o":{"A":"不能用手接触试剂,以免危害健康和沾污试剂","B":"瓶塞应倒置桌面上,以免弄脏,取用试剂后,立即盖严,将试剂瓶放回原处,标签朝外","C":"要用干净的药匙取固体试剂,用过的药匙要洗净擦干才能再用","D":"尽量不多取试剂,多取的试剂不能倒回原瓶,以免影响整瓶试剂纯度,应放入其它合适容器中另作处理或供他人使用"},"a":["A","B","C","D"],"e":"取试剂不能徒手接触，瓶塞倒放、用完立即盖严归位，药匙要干净，多取的试剂不能倒回原瓶，四项都是原则。"},{"id":952,"c":"化学安全","l":"II","t":1,"q":"取用化学药品时,以下哪些操作事项是正确的（ ）","o":{"A":"取用腐蚀和刺激性药品时,尽可能带上橡皮手套和防护眼镜","B":"倾倒时,切勿直对容器口俯视;吸取时,应该使用橡皮球","C":"开启有毒气体容器时应带防毒用具","D":"可以裸手直接拿取药品"},"a":["A","B","C"],"e":"取腐蚀刺激性药品要戴手套护目镜，倾倒时不正对瓶口俯视、吸取用橡皮球，开有毒气体容器要戴防毒用具；裸手不行。"},{"id":953,"c":"化学安全","l":"II","t":1,"q":"氢气钢瓶的正确使用方法是什么？（ ）","o":{"A":"氢气瓶应放在远离实验室的专用小屋内","B":"必须使用专用的氢气减压阀,开启气瓶时,操作者应站在阀口的侧后方,动作要轻缓。","C":"直接在反应装置旁边使用","D":"并安装一个防止回火的装置才可以使用"},"a":["A","B","D"],"e":"氢气瓶应放在室外专用小屋，用专用减压阀、站在阀口侧后方缓慢开启，并装回火防止器；放在反应装置旁极易积聚爆炸。"},{"id":954,"c":"化学安全","l":"II","t":1,"q":"强碱烧伤应如何处理","o":{"A":"立即用稀盐酸冲洗","B":"立即用 1%~2%的醋酸冲洗","C":"立即用大量水冲洗","D":"立即去医院处理"},"a":["B","C","D"],"e":"强碱烧伤先用大量水冲，再用1%至2%醋酸中和，然后就医；用稀盐酸会二次灼伤，故A错。"},{"id":955,"c":"化学安全","l":"II","t":1,"q":"气体熏蒸法是在加热条件下使熏蒸剂挥发变为蒸气, 对房间和仪器设备消毒。 当选择甲醛为熏蒸剂时,可采用（）使其挥发。","o":{"A":"取甲醛用量的 1/2高锰酸钾,与其混合置于敞口玻璃容器中","B":"甲醛溶液置于敞口玻璃容器中","C":"甲醛溶液置于敞口玻璃容器中,用电炉加热","D":"甲醛溶液置于敞口玻璃容器中,用水浴加热"},"a":["A","D"],"e":"甲醛熏蒸可用高锰酸钾与甲醛混合自然挥发，或用水浴加热促挥发；直接敞口挥发太慢，电炉明火加热有燃爆风险。"},{"id":956,"c":"化学安全","l":"II","t":1,"q":"气体（）须在通风橱内进行操作。","o":{"A":"硫化氢","B":"氯化氢","C":"氟化氢","D":"溴"},"a":["A","B","C","D"],"e":"硫化氢、氯化氢、氟化氢和溴都是有毒或有强刺激性的气体，操作时都必须在通风橱内进行，四项全选。"},{"id":957,"c":"化学安全","l":"II","t":1,"q":"皮肤接触化学品伤害时所需采取的急救措施指现场作业人员意外受到自救和互救的简要处理办法。下列叙述中正确的是:（）","o":{"A":"剧毒品:立即脱去衣着,用推荐的清洗介质冲洗。就医。","B":"中等剧毒:脱去衣着,用推荐的清洗介质冲洗。就医。","C":"有害品:脱去污染的衣着,按所推荐的介质冲洗皮肤。","D":"腐蚀物:按所推荐的介质冲洗。若有灼伤,就医。"},"a":["A","B","C","D"],"e":"皮肤接触化学品要立即脱去污染衣着并用推荐介质冲洗：剧毒、中等毒和有毒品冲洗后就医，腐蚀物冲洗后灼伤也就医。"},{"id":958,"c":"化学安全","l":"II","t":1,"q":"领取及存放化学药品时,需要做的事情有:","o":{"A":"确认容器上标示的中文名称是否为需要的实验用药品。","B":"学习并清楚化学药品危害标示和图样。","C":"化学药品应分类存放","D":"有机溶剂,固体化学药品,酸、碱化合物可以存放于同一药品柜中。"},"a":["A","B","C"],"e":"领药要核对中文名称、认清危害标识并分类存放；有机溶剂、固体、酸碱不能同柜混放，否则可能相互反应出事。"},{"id":959,"c":"化学安全","l":"II","t":1,"q":"剧毒类化学试剂应如何存放","o":{"A":"应锁在专门的毒品柜中","B":"储存室应配备防毒、防盗、报警及隔离、消除与吸收毒物的设施","C":"应存于实验台下柜中","D":"置于阴凉干燥处,并与酸类试剂隔离","E":"建立双人登记签字领用制度,建立使用、消耗、废物处理等制度"},"a":["A","C","D"],"e":"剧毒品应锁在专用毒品柜，放在阴凉干燥处并与酸类隔离，领用还要建立双人签字登记制度，故取A、C、D。"},{"id":960,"c":"化学安全","l":"II","t":1,"q":"进行剧毒药品实验操作时,应注意哪些事项？","o":{"A":"不在人群集中的地方操作","B":"在通风橱内操作","C":"要经过院系的审批,甚至在公安机关备案","D":"先不告诉周围的人,以免引起恐慌"},"a":["A","B","C"],"e":"剧毒实验要避开人群密集处、在通风橱内做，并经院系审批甚至公安备案；瞒着周围人反而会延误救援，D错。"},{"id":961,"c":"化学安全","l":"II","t":1,"q":"进入实验室工作前,要了解（ ）,发生意外时能做好相应的自救工作","o":{"A":"安全出口的位置","B":"易燃、易爆物品的位置","C":"冲眼器、紧急喷淋、急救药箱的位置"},"a":["A","B","C"],"e":"进实验室先摸清安全出口、易燃易爆品存放点，以及冲眼器、紧急喷淋和急救箱的位置，出事才能迅速自救。"},{"id":962,"c":"化学安全","l":"II","t":1,"q":"金属离心管可以盛放","o":{"A":"有机溶剂","B":"酶溶液","C":"盐溶液","D":"普通水溶液"},"a":["A","B","D"],"e":"金属离心管耐有机溶剂和酶溶液，也能装普通水溶液；但盐溶液对金属有腐蚀，故C不选。"},{"id":963,"c":"化学安全","l":"II","t":1,"q":"机关、团体、企业、事业单位属于消防安全重点单位的,除应履行通用的消防职责外,还应该:","o":{"A":"建立防火档案,确定消防安全重点部位,设置防火标志,实行严格管理","B":"实行每日防火巡查,并建立巡查记录","C":"对职工进行消防安全教育","D":"制定灭火和应急疏散预案,定期组织消防演练"},"a":["A","B","C","D"],"e":"消防安全重点单位要建防火档案、定重点部位设防火标志，每日防火巡查并记录，开展消防教育，还要有灭火疏散预案并演练。"},{"id":964,"c":"化学安全","l":"II","t":1,"q":"火灾事故单位在火灾扑灭后,为隐瞒、掩饰起火原因、推卸责任,故意破坏现场或者伪造现场,尚不构成犯罪。对直接负责的主管人员,可以:","o":{"A":"处以罚款","B":"给予警告","C":"依法追究刑事责任","D":"处15日以下拘留"},"a":["A","B","D"],"e":"尚不构成犯罪时不能追究刑事责任，对直接负责的主管人员可罚款、警告或处15日以下拘留，故C错。"},{"id":965,"c":"化学安全","l":"II","t":1,"q":"火场逃生的方法有:","o":{"A":"用手巾,手帕捂鼻护嘴","B":"乘坐普通电梯逃生","C":"寻找避难处所","D":"利用疏散通道逃生"},"a":["A","C","D"],"e":"逃生用湿毛巾捂口鼻、走疏散通道、到避难处所等待救援；火灾时乘普通电梯可能断电被困，故B错。"},{"id":966,"c":"化学安全","l":"II","t":1,"q":"混和生成高敏感、不稳定或者具有爆炸性物质的有:","o":{"A":"（亚）硝基化合物和碱","B":"醚和醇类","C":"烯烃和空气","D":"氯酸盐和铵盐 亚硝酸盐和铵盐"},"a":["A","C","D"],"e":"硝基化合物遇碱、烯烃与空气、氯酸盐或亚硝酸盐与铵盐混合都可能生成敏感易爆物；醚和醇混合一般不生成爆炸物。"},{"id":967,"c":"化学安全","l":"II","t":1,"q":"混和或相互接触时发生反应、产生大量热量而着火、爆炸的有","o":{"A":"（亚、次）氯酸盐和酸","B":"CrO3和可燃物","C":"KMnO4和可燃物","D":"KMnO4和浓硫酸"},"a":["A","B","C","D"],"e":"氯酸盐遇酸、三氧化铬或高锰酸钾与可燃物、高锰酸钾与浓硫酸混合都会剧烈放热甚至着火爆炸，四项都危险。"},{"id":968,"c":"化学安全","l":"II","t":1,"q":"化学中毒主要是由哪些原因引起？","o":{"A":"由呼吸道吸入有毒物质的蒸气","B":"通过皮肤吸收进入人体","C":"品尝或误食有毒药品","D":"食入被有毒物质污染的食物和饮料"},"a":["A","B","C","D"],"e":"化学中毒主要经呼吸道吸入蒸气、经皮肤吸收、误尝误食以及吃了被污染的食物饮料四条途径进入人体。"},{"id":969,"c":"化学安全","l":"II","t":1,"q":"化学易燃物品的火灾危险性是指（）","o":{"A":"这些物品的闪点,熔点一般比较低,极易引起火灾和爆炸。","B":"有些物质极易挥发,升华,受潮或遇热分解可燃蒸气,能跟空气形成爆炸混合物,遇火星发生燃烧或爆炸。","C":"有些物质性质相抵触的混存在一起发生化学反应,或因摩擦,撞击,聚焦日光等现象发生燃烧或爆炸。","D":"有些物质离开保护剂和空气接触即能燃烧或爆炸。"},"a":["A","B","C","D"],"e":"易燃品闪点低易着火，挥发蒸气可与空气成爆炸混合物，性质抵触的混放或摩擦撞击、日光聚焦也会燃爆，脱离保护剂同样危险。"},{"id":970,"c":"化学安全","l":"II","t":1,"q":"化学危险品应存放的基本规则是什么？","o":{"A":"分类分项存放","B":"避光保存","C":"隔绝空气","D":"保存在水中"},"a":["A","B","C","D"],"e":"危化品要分类分项存放，避光、隔绝空气，个别极活泼物质还需水封保存，故四项都属基本存放规则。"},{"id":971,"c":"化学安全","l":"II","t":1,"q":"化学试剂应根据什么特点,以不同的方式妥善管理和存放:","o":{"A":"毒性","B":"易燃易爆性","C":"腐蚀性","D":"放射性 潮解性"},"a":["A","B","C","D"],"e":"试剂要按毒性、易燃易爆性、腐蚀性、放射性以及潮解性等不同特点分类，用相应方式妥善管理和存放。"},{"id":972,"c":"化学安全","l":"II","t":1,"q":"化学楼主要有哪些消防的设施或设备？","o":{"A":"灭火器","B":"沙箱","C":"防火毯（粗麻布）","D":"消防安全通道"},"a":["A","B","C","D"],"e":"化学楼常配灭火器、沙箱、防火毯和消防安全通道等设施，四项都是常见消防配置。"},{"id":973,"c":"化学安全","l":"II","t":1,"q":"化学爆炸三要素是指（ ）","o":{"A":"反应过程放热性","B":"反应过程的高速度","C":"反应生成物必定含有大量的气态物质","D":"突发性"},"a":["A","B","C"],"e":"化学爆炸必须反应放热、速度极快且生成大量气态产物，三者缺一不可；突发性只是表现，不是要素。"},{"id":974,"c":"化学安全","l":"II","t":1,"q":"恒温箱用于（）","o":{"A":"干燥","B":"微生物培养","C":"干热灭菌","D":"生物材料培养"},"a":["B","D"],"e":"恒温箱用于微生物培养和生物材料培养；干燥和干热灭菌是干燥箱的功能，故A、C不选。"},{"id":975,"c":"化学安全","l":"II","t":1,"q":"过氧化酸、硝酸铵、硝酸钾、高氯酸及其盐、重铬酸及其盐、高锰酸及其盐、过氧化苯甲酸、五氧化二磷等强氧化剂,在适当条件下可放出氧发生爆炸,在使用这类强氧化性化学试剂时,应注意","o":{"A":"环境温度不要高于30℃","B":"通风要良好","C":"不要加热","D":"不要与有机物或还原性物质共同使用","E":"在手套箱内操作"},"a":["A","B","C","D"],"e":"这类强氧化剂要控制环境温度不超30℃、保持通风、不要加热，也不能与有机物或还原性物质混用；一般不需手套箱。"},{"id":976,"c":"化学安全","l":"II","t":1,"q":"关于重铬酸钾洗液,下列陈述哪些是正确的","o":{"A":"重铬酸钾洗液是用于浸泡各类器皿的","B":"重铬酸钾洗液浸泡玻璃器皿时,为防止洗液的迸溅或器皿损坏,可以将手直接插入洗液缸里取放器皿","C":"捞出器皿后,立即放进清洗杯,避免洗液滴落在洗液缸外等处。然后马上用水连同手套一起清洗。","D":"避免用手在洗液缸里取放器皿的时间过长,即便戴上了专用手套。"},"a":["C","D"],"e":"捞取器皿后要立即放进清洗杯，避免洗液滴落，并马上连手套一起冲洗；手绝不能直接伸进洗液缸，戴手套也不能久泡。"},{"id":977,"c":"化学安全","l":"II","t":1,"q":"关于减压蒸馏的操作,正确的是:","o":{"A":"减压蒸馏结束时必须先解除真空,再关泵","B":"减压蒸馏不得用平底、多颈和薄壁瓶","C":"减压蒸馏时应防止爆沸"},"a":["A","B","C"],"e":"减压蒸馏结束要先解除真空再关泵，防止倒吸；不能用平底、多颈或薄壁瓶，操作中还要防爆沸，三项都对。"},{"id":978,"c":"化学安全","l":"II","t":1,"q":"关于干燥箱和恒温箱,下列说法正确的有:","o":{"A":"干燥箱用于物品的干燥和干热灭菌","B":"恒温箱用于微生物和生物材料的培养","C":"干燥箱的使用温度范围为 50-250℃","D":"恒温箱的使用最高温度为 60℃"},"a":["A","B","C","D"],"e":"干燥箱用于干燥和干热灭菌，温度约50至250℃；恒温箱用于微生物和生物材料培养，最高约60℃，四项都正确。"},{"id":979,"c":"化学安全","l":"II","t":1,"q":"高温实验装置使用时应注意","o":{"A":"注意防护高温对人体的辐射","B":"熟悉高温装置的使用方法,并细心地进行操作","C":"不得已非将高温炉之类高温装置, 置于耐热性差的实验台上进行实验时,装置与台面之间要保留一厘米以上的间隙,并加垫隔热层,以防台面着火","D":"使用高温装置的实验, 要求在防火建筑内或配备有防火设施的室内进行,并保持室内通风良好"},"a":["A","B","C","D"],"e":"高温装置要防热辐射、熟悉操作规程，放在不耐热台面上要留间隙加隔热层，实验须在防火通风良好的室内进行。"},{"id":980,"c":"化学安全","l":"II","t":1,"q":"高速离心机使用注意事项是","o":{"A":"各转头不能超过其额定转速使用","B":"离心管在外单独平衡后,直接两两对称地插入转头中,并拧紧转头盖后再 开始离心","C":"操作生物材料样品时,转头的装载、平衡、密封和打开必须在生物安全柜 内进行","D":"离心完毕后,转头必须作消毒灭菌处理,清洗干净后待用"},"a":["A","B","C","D"],"e":"高速离心不得超额定转速，离心管先配平再对称装入并拧紧盖，生物样品装卸要在生物安全柜内，用后消毒清洗转头。"},{"id":981,"c":"化学安全","l":"II","t":1,"q":"干燥箱可以用于物品的（）","o":{"A":"干燥","B":"微生物培养","C":"干热灭菌","D":"生物材料培养"},"a":["A","C"],"e":"干燥箱只能用于干燥和干热灭菌；微生物和生物材料培养需要恒温箱的温和恒温条件，故B、D不选。"},{"id":982,"c":"化学安全","l":"II","t":1,"q":"分光光度计使用注意事项是","o":{"A":"使用光电池作为检测器的仪器连续使用不应超过2h, 每次使用后需要间歇 30min以上","B":"每台仪器所配备的比色皿其透射比是经过配对的,必须配套使用。不能与 其他仪器上的比色皿单个调换,否则影响样品测试精度","C":"测定过程中,不得用手触摸比色皿透光面。其透光面的清洁不可用滤纸、纱布或毛刷擦拭,只能用镜头纸擦拭","D":"分光光度计的吸光值在 0.2-0.7（透光率在20%-60%）准确度最高,低于0.1 或超 1.0 时误差较大。如未知样品的读数不在此范围时,应将样品做 适当稀释。"},"a":["A","B","C","D"],"e":"分光光度计连续用不超2小时、间隔30分钟，比色皿要配套且只用镜头纸擦，吸光值0.2至0.7最准，超范围要稀释。"},{"id":983,"c":"化学安全","l":"II","t":1,"q":"对于一些吸入或食入少量即能中毒至死的化学试剂,生物试验中致死量（LD50）在50mg/kg 以下的称为剧毒化学试剂,以下哪些是剧毒化学试剂:","o":{"A":"氰化钾","B":"三氧化二砷","C":"乙醇","D":"二氯化汞"},"a":["A","B","D"],"e":"氰化钾、三氧化二砷、二氯化汞致死量极低属剧毒；乙醇毒性小，LD50远高于50mg/kg，不算剧毒试剂。"},{"id":984,"c":"化学安全","l":"II","t":1,"q":"对于实验室内所用的高压、高频设备,应注意做到以下事项（ ）。","o":{"A":"定期检修","B":"有可靠的防护措施","C":"凡设备本身要求安全接地的,必须接地","D":"定期检查线路,测量接地电阻"},"a":["A","B","C","D"],"e":"高压高频设备要定期检修、有可靠防护、按要求安全接地，并定期检查线路测量接地电阻，四项都不能少。"},{"id":985,"c":"化学安全","l":"II","t":1,"q":"对实验室冰箱,下列描述正确的是（）","o":{"A":"应放置在通风良好处","B":"实验室工作区内的冰箱禁止存放食物","C":"存放传染性病原微生物的冰箱应配备相应的锁具并粘贴警示标识","D":"存放易挥发有机试剂的容器必须加盖密封,避免试剂挥发在箱体内积聚"},"a":["A","B","C","D"],"e":"冰箱要放在通风处，实验区冰箱禁放食物，存病原体的要加锁并贴警示，易挥发试剂须密封防止蒸气在箱内积聚。"},{"id":986,"c":"化学安全","l":"II","t":1,"q":"对实验室安全的要求,下列正确的是（）","o":{"A":"进入实验室工作的人员均要参加实验室的安全培训","B":"离开实验室前,应切断或关闭水、电、可燃气体阀门,并关好门窗","C":"产生的废弃物要分类,并按规定分别进行处理","D":"有危险性的场所、设备、设施、物品及技术操作要有警示标识"},"a":["A","B","C","D"],"e":"进实验室要参加安全培训，离开前断水断电关气关窗，废弃物分类处理，危险场所设备要有警示标识，四项都对。"},{"id":987,"c":"化学安全","l":"II","t":1,"q":"对化学废液的处理,下列描述正确的是（）","o":{"A":"自行分类收集,存放在专用废液桶中并加贴标签","B":"倒入废液前应仔细查看该收集桶的记录,确认倒入后不会与桶内已有化学物质发生异常反应","C":"装废液的容器存放于实验室较阴凉处、远离火源和热源的位置","D":"收集桶中的废液不应超过容器最大容量的3/4","E":"收集的废液由专人负责送到学院回收点,由学校统一处理"},"a":["A","B","C","D","E"],"e":"废液要分类收集贴标签，倒入前确认不与桶内物质反应，存放在阴凉远离火源处，不超过容器3/4，再由专人送学校统一处理。"},{"id":988,"c":"化学安全","l":"II","t":1,"q":"当出现（）情形时,必须向当地公安部门报告。","o":{"A":"剧毒化学品的生产,储存,使用,经营单位发现剧毒化学品被盗,丢失或者误售,误用。","B":"通过公路运输危险化学品需要进入禁止通行区域,或运输危险化学品途中需要停车留宿,或者无法正常运输。","C":"剧毒化学品在公路运输途中发生被盗,丢失,流散,泄露等情况。","D":"危险化学品押运人员中途下车"},"a":["A","B","C"],"e":"剧毒品被盗丢失误售误用、运输需进禁行区或途中停车留宿无法正常运输、途中发生被盗流散泄漏，都必须报公安。"},{"id":989,"c":"化学安全","l":"II","t":1,"q":"存储化学品,应注意的事项有:","o":{"A":"化学危险物品应当分类、分项存放,相互之间保持安全距离","B":"遇火、遇潮容易燃烧、爆炸或产生有毒气体的化学危险品,不得在露天、 潮湿、漏雨或低洼容易积水的地点存放","C":"受阳光照射易燃烧、易爆炸或产生有毒气体的化学危险品和桶装、罐装等易燃液体、气体应当在阴凉通风地点存放","D":"化学性质防护和灭火方法相互抵触的化学危险品,不得在同一仓库或同一储存室存放"},"a":["A","B","C","D"],"e":"危化品要分类分项并保持安全距离，怕火怕潮的不能露天低洼存放，怕晒的要放阴凉通风处，性质抵触的不能同库。"},{"id":990,"c":"化学安全","l":"II","t":1,"q":"从化学试剂瓶中向烧杯等容器中倒液体时,哪些陈述是正确的:","o":{"A":"为了防止液体滴落到桌面,要用瓶子嘴压住烧杯边缘","B":"倾倒液体时,眼睛远离瓶子","C":"必须使用滤纸、超净间专用绵纸等擦干瓶子外流下的液滴,但是不能盖紧瓶盖后在龙头下冲洗","D":"通常情况下,禁止使用吸管从试剂瓶中向外取液体,这会导致整瓶液体被污染。先将适量的液体倒入烧杯,再使用吸管"},"a":["B","D"],"e":"倒液时眼睛要远离瓶口防溅，且不可用吸管直接从原瓶吸取以免污染整瓶，应先倒入烧杯再取；瓶口压杯沿反而易污染破损。"},{"id":991,"c":"化学安全","l":"II","t":1,"q":"除了高温以外,如下哪些物质会灼伤皮肤:","o":{"A":"液氮","B":"稀草酸","C":"强碱KBr、NABr 溶液","D":"强氧化剂溴"},"a":["A","C","D"],"e":"液氮会造成冻伤，强碱溶液和强氧化剂溴都能灼伤皮肤；稀草酸刺激性弱，一般不列为灼伤物质。"},{"id":992,"c":"化学安全","l":"II","t":1,"q":"超级恒温水浴使用注意事项是","o":{"A":"超级恒温水浴内加热用水一定要使用去离子水（或蒸馏水） ,切勿使用硬水","B":"恒温水浴内去离子水未加到“正常水位”严禁通电,防止干烧","C":"可以使用自来水","D":"无人看管时也可以运转"},"a":["A","B"],"e":"超级恒温水浴要用去离子水或蒸馏水，水位不到正常线严禁通电防干烧；自来水结垢，无人看管运转也易出事故。"},{"id":993,"c":"化学安全","l":"II","t":1,"q":"常用危险化学品按其主要危险特性分为几大类,其中包括以下（）类。","o":{"A":"爆炸品","B":"压缩气体和液化气体","C":"易燃液体和易燃固体","D":"有毒品和腐蚀品"},"a":["A","B","C","D"],"e":"常用危化品按危险特性分为爆炸品、压缩与液化气体、易燃液体和固体、有毒品和腐蚀品等大类，四项都包括。"},{"id":994,"c":"化学安全","l":"II","t":1,"q":"常用的以下物质中,哪些在操作时应该在通风橱中","o":{"A":"氢气","B":"氨水","C":"氦气","D":"盐酸"},"a":["B","D"],"e":"氨水和盐酸挥发刺激性气体，应在通风橱内操作；氢气和氦气无毒无刺激，一般不需要，故C、A不选。"},{"id":995,"c":"化学安全","l":"II","t":1,"q":"常用的灭火方法有:","o":{"A":"隔离灭火法","B":"冷却灭火法","C":"窒息灭火法","D":"抑制灭火法"},"a":["A","B","C","D"],"e":"灭火基本方法有隔离、冷却、窒息和抑制四种，分别对应移走可燃物、降温、隔绝氧气和中断链式反应。"},{"id":996,"c":"化学安全","l":"II","t":1,"q":"常用的化学毒性防护用品有（ ）。","o":{"A":"工作服","B":"防毒面具（配有相应的吸附剂）","C":"橡胶手套","D":"防护眼镜","E":"一次性口罩"},"a":["A","B","C","D"],"e":"化学毒性防护要穿工作服、戴防毒面具、橡胶手套和防护眼镜；一次性口罩挡不住有毒气体和蒸气，故E不选。"},{"id":997,"c":"化学安全","l":"II","t":1,"q":"不适合在化学实验室穿着的鞋有:()","o":{"A":"凉鞋","B":"高跟鞋","C":"拖鞋","D":"球鞋"},"a":["A","B","C"],"e":"凉鞋、高跟鞋和拖鞋会露脚或易绊倒，化学实验室不能穿；球鞋包脚防滑，可以穿。"},{"id":998,"c":"化学安全","l":"II","t":1,"q":"玻璃离心管可以盛放","o":{"A":"有机溶剂","B":"酶溶液","C":"盐溶液","D":"普通水溶液"},"a":["A","B","C","D"],"e":"玻璃离心管化学惰性好，有机溶剂、酶溶液、盐溶液和普通水溶液都能盛放，四类都适合。"},{"id":999,"c":"化学安全","l":"II","t":1,"q":"安置、处理实验服应（ ）。","o":{"A":"离开实验室时,实验服必须脱下并留在实验室内","B":"实验服不得穿着外出,更不能携带回家","C":"用过的实验服应先在实验室中消毒","D":"实验服最好能够完全扣住,长袖、背面开口的隔离衣防护效果更好"},"a":["A","B","C","D"],"e":"实验服只在实验室穿，离开要脱下留下，不得外出或带回家；用过的先消毒，最好长袖、完全扣住、背面开口。"},{"id":1000,"c":"化学安全","l":"II","t":1,"q":"《危险化学品安全管理条例》不适合于（）","o":{"A":"民用爆炸品","B":"放射性物品及核能物质","C":"剧毒化学品","D":"城镇燃气"},"a":["A","B"],"e":"民用爆炸品、放射性物品及核能物质不适用《危险化学品安全管理条例》，由其他法规管理；剧毒化学品则在条例范围内。"},{"id":1001,"c":"化学安全","l":"II","t":2,"q":"做需要搅拌的实验时, 找不到玻璃棒, 可以用温度计代替。","o":{},"a":["错误"],"e":"温度计不是搅拌棒，搅拌时容易碰破，水银或酒精漏出既污染试剂又危险，必须用玻璃棒搅拌。"},{"id":1002,"c":"化学安全","l":"II","t":2,"q":"做危险实验时必须戴防护眼镜,加氢反应、高压反应必须在特种实验室进行","o":{},"a":["正确"],"e":"危险实验戴防护眼镜可防飞溅伤眼；加氢和高压反应有爆炸风险，必须在特种实验室进行，做法正确。"},{"id":1003,"c":"化学安全","l":"II","t":2,"q":"做危险化学实验时应配带各种眼镜进行防护,包括戴隐形眼镜。","o":{},"a":["错误"],"e":"隐形眼镜会吸附化学品并在角膜上滞留，反而加重损伤，危险实验应戴框架防护镜，不能戴隐形眼镜。"},{"id":1004,"c":"化学安全","l":"II","t":2,"q":"做减压蒸馏时,如果没有梨形接收瓶,可用锥形瓶代替。","o":{},"a":["错误"],"e":"锥形瓶是平底薄壁，减压下受力不均容易炸裂，必须用耐压的圆底或梨形接收瓶，不能用锥形瓶代替。"},{"id":1005,"c":"化学安全","l":"II","t":2,"q":"装有易燃液体的器皿可置于日光下。","o":{},"a":["错误"],"e":"日光照射会使易燃液体升温、蒸气增多，遇火星就会着火，应密封后放在阴凉避光处，不能置于日光下。"},{"id":1006,"c":"化学安全","l":"II","t":2,"q":"转速较低的离心机可以在工作时打开机盖观察。","o":{},"a":["错误"],"e":"离心机即使低速，运转中开盖也可能被转头打伤或使样品气溶胶外泄，必须等停稳后再开盖。"},{"id":1007,"c":"化学安全","l":"II","t":2,"q":"中毒事故中救护人员进入现场,应先抢救中毒者,再采取措施切断毒物来源。","o":{},"a":["错误"],"e":"救护人员进入现场应先做好自身防护、切断毒物来源，再抢救中毒者，否则救人者也会中毒。"},{"id":1008,"c":"化学安全","l":"II","t":2,"q":"只有危险化学品生产企业需要制定应急救援预案。","o":{},"a":["错误"],"e":"凡生产、储存、使用、经营危险化学品的单位都要制定应急救援预案，不只是生产企业，故说法错误。"},{"id":1009,"c":"化学安全","l":"II","t":2,"q":"执行有危险性的实验,应先检查防护措施,确证防护妥当后,才可进行实验。","o":{},"a":["正确"],"e":"有危险的实验风险高，先检查防护措施是否到位，确认妥当再动手，可避免盲目操作导致事故。"},{"id":1010,"c":"化学安全","l":"II","t":2,"q":"在使用一些固体化学试剂如:硝化纤维、苦味酸、三硝基甲苯、三硝基苯等,绝不能直接加热或撞击,也要注意周围不要有明火","o":{},"a":["正确"],"e":"硝化纤维、苦味酸、三硝基甲苯等都很敏感，直接加热或撞击可能引爆，周围还须远离明火，说法正确。"},{"id":1011,"c":"化学安全","l":"II","t":2,"q":"在使用硝化纤维、苦味酸、三硝基甲苯、三硝基苯等物质时,绝不能直接加热或撞击,还要注意周围不要有明火。","o":{},"a":["正确"],"e":"这类含硝基化合物对热和撞击极敏感，加热、碰撞都可能引起爆炸，操作周围不能有明火，命题正确。"},{"id":1012,"c":"化学安全","l":"II","t":2,"q":"在实验室允许口尝鉴定试剂和未知物。","o":{},"a":["错误"],"e":"实验室任何试剂和未知物都不能用口尝，很多毒品少量即可致死，鉴别只能靠标签和仪器。"},{"id":1013,"c":"化学安全","l":"II","t":2,"q":"在实验室内一切有可能产生毒性蒸气的工作必须在通风橱中进行,并有良好的排风设备。","o":{},"a":["正确"],"e":"产生毒性蒸气的工作必须在通风橱内做，并保证排风良好，才能及时把毒气排走、不被人吸入。"},{"id":1014,"c":"化学安全","l":"II","t":2,"q":"在实验室进行有机合成时,放热反应不能在密闭的玻璃容器中进行;对反应物进行加热时,也不能将玻璃容器密闭","o":{},"a":["正确"],"e":"放热反应在密闭玻璃容器里压力骤升会炸裂，加热时同样不能密闭，必须留出气路，说法正确。"},{"id":1015,"c":"化学安全","l":"II","t":2,"q":"在实验室不可配戴隐形眼镜,应使用一般眼镜","o":{},"a":["正确"],"e":"隐形眼镜易吸附化学蒸气并滞留在眼内，实验室应改戴框架眼镜或护目镜，所以不可戴隐形眼镜。"},{"id":1016,"c":"化学安全","l":"II","t":2,"q":"在实验过程中必须认真观察反应情况,不得擅自离岗,如有事离岗必须请人代管,并做好防范措施。","o":{},"a":["正确"],"e":"反应过程中离岗可能错过异常，必须全程观察；确需离开要请人代管并交代好防范措施，命题正确。"},{"id":1017,"c":"化学安全","l":"II","t":2,"q":"在具有腐蚀性物品的工作地点,不应饮食和吸烟","o":{},"a":["正确"],"e":"腐蚀性物品会污染手和食物，在该区域饮食吸烟可能把毒物带入口中，所以必须禁止。"},{"id":1018,"c":"化学安全","l":"II","t":2,"q":"在进行萃取或洗涤操作时,为了防止物质高度浓缩而导致内部压力过大,产生爆炸,应该注意及时排出产生的气体。","o":{},"a":["正确"],"e":"萃取或洗涤时剧烈摇晃会使瓶内压力升高，要及时放气，防止冲塞甚至爆瓶，做法正确。"},{"id":1019,"c":"化学安全","l":"II","t":2,"q":"在化学药品管理时,强氧化剂和强还原剂必须分开存放,使用时轻拿轻放,远离热源。","o":{},"a":["正确"],"e":"强氧化剂与强还原剂混合会剧烈反应甚至燃爆，必须分开存放，取用时轻拿轻放并远离热源。"},{"id":1020,"c":"化学安全","l":"II","t":2,"q":"在化（实）验过程中,按照化（实）验的项目,严格控制时间、温度和剂量,防止发生事故;","o":{},"a":["正确"],"e":"按实验项目严格控制时间、温度和剂量，能避免反应失控、过热或超量投料带来的事故，命题正确。"},{"id":1021,"c":"化学安全","l":"II","t":2,"q":"遇水能分解或燃烧、爆炸的药品,如钾、钠、三氯化磷、五氯化磷、浓硫酸等,使用时不准与水接触,不准放置于潮湿的地方储存。","o":{},"a":["正确"],"e":"钾、钠、三氯化磷、五氯化磷和浓硫酸遇水会剧烈反应放热或放气，必须防潮存放、避免接触水。"},{"id":1022,"c":"化学安全","l":"II","t":2,"q":"遇湿易燃物品系指遇（水）或受（潮）时,发生剧烈化学反应,放出大量的易燃气体和热量的物品。有的不需明火,即能燃烧或爆炸。","o":{},"a":["正确"],"e":"遇湿易燃物品遇水或受潮就剧烈反应，放出易燃气体和大量热，有的不用明火也能自燃或爆炸。"},{"id":1023,"c":"化学安全","l":"II","t":2,"q":"遇潮容易燃烧、爆炸或产生有毒气体的化学危险品,不得在露天、潮湿、漏雨或低洼容易积水的地点存放","o":{},"a":["正确"],"e":"怕潮的危化品放在露天、潮湿、漏雨或积水处会受潮反应，必须存在干燥通风的地方，说法正确。"},{"id":1024,"c":"化学安全","l":"II","t":2,"q":"有机溶剂只会经口鼻进入人体,只要正确的使用呼吸防护面具,就可以有效防止危害健康。。","o":{},"a":["错误"],"e":"有机溶剂还能经皮肤渗透进入人体，只靠呼吸防护不够，还要戴手套、穿防护服避免皮肤接触。"},{"id":1025,"c":"化学安全","l":"II","t":2,"q":"有机溶剂能穿过皮肤进入人体,应避免直接与皮肤接触,操作时要戴好手套口罩护目镜等","o":{},"a":["正确"],"e":"有机溶剂可经皮肤吸收，操作时要戴手套、口罩和护目镜，避免直接接触皮肤，说法正确。"},{"id":1026,"c":"化学安全","l":"II","t":2,"q":"有机废液可以考虑中和处理","o":{},"a":["错误"],"e":"有机废液成分复杂，简单中和去不掉有机物和毒性，应分类收集后交专业部门处理，不能只靠中和。"},{"id":1027,"c":"化学安全","l":"II","t":2,"q":"有机废物、浓酸或浓碱废液等倒入水槽,只要加大量的自来水将之冲稀即可","o":{},"a":["错误"],"e":"稀释不等于无害，有机废物和浓酸浓碱会腐蚀管道、污染水体，必须分类收集后交专门机构处理，不能靠自来水一冲了之。"},{"id":1028,"c":"化学安全","l":"II","t":2,"q":"有害或有刺激性气体发生的实验应在通风柜内进行,加强个人防护,不得把头部伸进通风柜内。","o":{},"a":["正确"],"e":"通风柜能把有害气体及时抽走，头伸进去会破坏柜内气流并直接吸入高浓度气体，所以要在柜内操作、柜外观察。"},{"id":1029,"c":"化学安全","l":"II","t":2,"q":"有毒物品应储存在阴凉、通风、干燥的场所,可以露天存放","o":{},"a":["错误"],"e":"露天存放等于日晒雨淋，温度变化和雨水会让有毒物品挥发、泄漏或流失，必须存于阴凉、通风、干燥的专库。"},{"id":1030,"c":"化学安全","l":"II","t":2,"q":"有毒实验废弃物应明确专人负责,使用专用容器和醒目标识,将重金属、氰化物、溴化乙啶（EB）及其结合物进行分类收集,专人管理,定期回收,统一处理。","o":{},"a":["正确"],"e":"有毒废弃物风险高，指定专人、专用容器加醒目标识才能防止混入他物；重金属、氰化物、EB分类收集便于针对性处置。"},{"id":1031,"c":"化学安全","l":"II","t":2,"q":"有毒品在水中的溶解度越大,其危险性越大。","o":{},"a":["正确"],"e":"溶解度越大，毒物越容易溶进体液被吸收扩散，随水迁移的范围也更广，因此危害更大。"},{"id":1032,"c":"化学安全","l":"II","t":2,"q":"有毒化学药品溅在皮肤上时,可用乙醇等有机溶剂擦洗","o":{},"a":["错误"],"e":"有机溶剂会把毒物溶解并带着它更快渗进皮肤，等于帮毒物吸收；应立即用大量流动清水冲洗，不要用乙醇擦洗。"},{"id":1033,"c":"化学安全","l":"II","t":2,"q":"由于金属络合剂能与毒物中的金属离子形成稳定的化合物,随尿液排出体外,故发生金属及其盐类中毒时,可采用各种金属络合剂解毒。","o":{},"a":["正确"],"e":"络合剂与金属离子结合成稳定的可溶物，随尿液排出，从而降低体内金属浓度，所以可用于金属及其盐类中毒的解毒。"},{"id":1034,"c":"化学安全","l":"II","t":2,"q":"用泡沫灭火剂扑灭油罐火灾时,如果火势很大,有时并不能将火完全扑灭会发生闷燃,引起爆炸。","o":{},"a":["正确"],"e":"泡沫盖住油面后，若火势大、泡沫被冲破，罐内油品继续闷燃，油气积聚遇空气就可能爆炸，所以要防复燃。"},{"id":1035,"c":"化学安全","l":"II","t":2,"q":"用活泼金属做除水实验,已观察不到金属的氧化反应,就可以将活泼金属丢弃。","o":{},"a":["错误"],"e":"看不到反应现象不代表金属已失活，残渣遇水或空气仍可能剧烈反应，应按危险废物规定处理，不能随手丢弃。"},{"id":1036,"c":"化学安全","l":"II","t":2,"q":"用低沸点溶剂洗涤过的滤饼,可直接放入烘箱干燥。","o":{},"a":["错误"],"e":"低沸点溶剂易燃，烘箱温度高又有电热元件，蒸气聚集极易闪燃爆炸；应先通风晾干再烘干。"},{"id":1037,"c":"化学安全","l":"II","t":2,"q":"因为乙醚长时间与空气接触可以形成羟乙基过氧化氢,成为一种具有猛烈爆炸性的物质,因此,在蒸馏乙醚时不能将液体蒸干。","o":{},"a":["正确"],"e":"乙醚久置会生成过氧化物，蒸干时残液受热浓缩，过氧化物极易分解爆炸，所以蒸馏时必须留一定残液。"},{"id":1038,"c":"化学安全","l":"II","t":2,"q":"因处理废液费用很高,应将无毒无害试剂与有毒有害试剂分开处理,例如稀HAc、H2SO4、HCL、NaOH、KOH等溶液可进行中和处理。","o":{},"a":["正确"],"e":"无毒废液中和后即可排放，能省下大笔危废处置费用；前提是确实无毒并经检测，酸碱中和后再用水稀释排放。"},{"id":1039,"c":"化学安全","l":"II","t":2,"q":"易燃易爆场所需要进行焊接作业必须办理（动火许可证）,否则,不能进行作业。","o":{},"a":["正确"],"e":"动火许可证要求先清理可燃物、检测气体、落实监护人，从制度上防止焊接火星引燃周围易燃易爆介质。"},{"id":1040,"c":"化学安全","l":"II","t":2,"q":"易燃、易挥发的溶剂不得在敞口容器中加热,应选用水浴加热器,不得用明火直接加热。","o":{},"a":["正确"],"e":"敞口加热时溶剂蒸气直接扩散，遇火源就着，明火更危险；水浴传热温和均匀，可避免局部过热和接触火焰。"},{"id":1041,"c":"化学安全","l":"II","t":2,"q":"易燃、易爆物品要放在远离实验室的阴凉通风处,在实验室内保存的少量易燃易爆试剂要严格管理","o":{},"a":["正确"],"e":"易燃易爆品集中存放量大，一旦起火波及面广，所以主体库存放在专门场所，实验室只留少量并严格管理。"},{"id":1042,"c":"化学安全","l":"II","t":2,"q":"易燃、易爆气体和助燃气体（氧气等）的钢瓶不得混放在一起,并应远离热源和火源,保持通风。","o":{},"a":["正确"],"e":"易燃易爆气体与氧气混放，泄漏相遇就形成爆炸性混合气，遇火源即爆；必须分开存放、远离热源火源并通风。"},{"id":1043,"c":"化学安全","l":"II","t":2,"q":"易挥发药品的保存应:远离热源火源,于避光阴凉处保存,通风良好,不能装满。","o":{},"a":["正确"],"e":"受热见光会加速挥发变质，装得太满则温度升高时液体膨胀、可能胀裂瓶体，所以要阴凉避光并留出空间。"},{"id":1044,"c":"化学安全","l":"II","t":2,"q":"乙炔与氯或次氯酸盐等化合过程中,在日光照射下会发生燃烧和爆炸。","o":{},"a":["正确"],"e":"乙炔与氯、次氯酸盐能发生剧烈加成反应并放热，日光照射提供引发能量，混合物会燃烧甚至爆炸。"},{"id":1045,"c":"化学安全","l":"II","t":2,"q":"乙炔衍生物、乙炔金属盐、1,2-环氧乙烷、偶氮氧化物等都属于易燃和易爆的化学试剂,处理时应该特别小心","o":{},"a":["正确"],"e":"这些物质含不稳定的三键或过氧、偶氮结构，受热、摩擦、撞击即分解放热，容易燃烧爆炸，操作要格外当心。"},{"id":1046,"c":"化学安全","l":"II","t":2,"q":"乙炔气钢瓶的规定涂色为白色、氯气钢瓶为黄色、氢气钢瓶为绿色、氟化氢钢瓶为灰色、液氨钢瓶为黄色。","o":{},"a":["正确"],"e":"气瓶涂色是法定标识：乙炔瓶白色、氯气瓶黄色、氢气瓶绿色、氟化氢瓶灰色、液氨瓶黄色，题干所列对应关系与规定一致，凭颜色即可辨认气体、防止错接混用，故正确。"},{"id":1047,"c":"化学安全","l":"II","t":2,"q":"乙炔金属盐、环氧乙烷、偶氮氧化物等都属于易燃和易爆的化学试剂,处理时应该特别小心。","o":{},"a":["正确"],"e":"乙炔金属盐、环氧乙烷、偶氮化合物结构不稳定，受热、摩擦、撞击易分解放热甚至爆炸，取用存放都要小心。"},{"id":1048,"c":"化学安全","l":"II","t":2,"q":"乙醚的爆炸极限是:1.9％～48％","o":{},"a":["正确"],"e":"乙醚在空气中浓度低到1.9%就能被点燃，高到48%仍能燃爆，范围宽说明极易形成爆炸性混合气，必须密闭通风。"},{"id":1049,"c":"化学安全","l":"II","t":2,"q":"乙醚、酒精、丙酮、二硫化碳、苯等有机溶剂易燃,实验室不得存放过多,切不可倒入下水道,以免集聚引起火灾。","o":{},"a":["正确"],"e":"这些溶剂闪点低、挥发快，存多了蒸气容易积聚，倒进下水道还会在管道低处聚成可燃气体，遇火回燃。"},{"id":1050,"c":"化学安全","l":"II","t":2,"q":"一般将闪点在25&amp;amp;#176;C以下的化学试剂列入易燃化学试剂,它们多是极易挥发的液体。","o":{},"a":["正确"],"e":"闪点低于25℃意味着常温下就能挥发出足够点燃的蒸气，多为一倒就冒气的低沸点液体，故列为易燃试剂。"},{"id":1051,"c":"化学安全","l":"II","t":2,"q":"液氯钢瓶与液氨钢瓶可以在同库存放。","o":{},"a":["错误"],"e":"液氯和液氨相遇会剧烈反应生成爆炸性物质，泄漏后两种气体混合更危险，必须分库隔离存放。"},{"id":1052,"c":"化学安全","l":"II","t":2,"q":"眼睛溅入化学试剂时,应以大量清水冲洗,并翻开上下眼皮继续缓缓冲洗数分钟后,速送医院诊治。","o":{},"a":["正确"],"e":"清水能迅速稀释并冲走眼内残留试剂，翻开眼皮是为了冲净结膜囊，冲够时间再送医可减轻化学灼伤。"},{"id":1053,"c":"化学安全","l":"II","t":2,"q":"眼部碱灼伤时,应立即用大量清水或生理盐水进行彻底冲洗,冲洗时必须将上下眼睑拉开,水不要流经未伤的眼睛,不可直接冲击眼球,然后可用2%～3%硼酸溶液进一步冲洗。","o":{},"a":["正确"],"e":"碱会持续向眼组织深处渗透，必须争分夺秒大量冲洗；拉开眼睑、避开健眼、不直冲眼球是为减少二次损伤，硼酸可中和残碱。"},{"id":1054,"c":"化学安全","l":"II","t":2,"q":"盐水溶液使用后,均可不经处理直接排入下水道","o":{},"a":["错误"],"e":"含盐废液直接排放会腐蚀管道、增加水体盐度，还带出其他杂质，同样要收集起来处理达标后才能排放。"},{"id":1055,"c":"化学安全","l":"II","t":2,"q":"压缩气体和液化气体必须与爆炸物品隔离储存。","o":{},"a":["正确"],"e":"压缩和液化气体受热膨胀压力骤升，若附近有爆炸物品，起火会连锁殉爆，两者必须分开储存并保持安全距离。"},{"id":1056,"c":"化学安全","l":"II","t":2,"q":"压缩气体必须与氧化剂、易燃物品隔离贮存。","o":{},"a":["正确"],"e":"压缩气体泄漏后与氧化剂、易燃物接触，可能助燃或形成爆炸性混合物，因此要隔离贮存、分区管理。"},{"id":1057,"c":"化学安全","l":"II","t":2,"q":"学生不可以单独使用剧毒物品。","o":{},"a":["正确"],"e":"剧毒物品用量小、后果重，学生经验不足，必须由教师指导、双人在场领用，不能独自操作。"},{"id":1058,"c":"化学安全","l":"II","t":2,"q":"悬浮物质的溶液加热时,应加沸石或玻璃珠,以避免爆沸现象产生。","o":{},"a":["正确"],"e":"悬浮液局部过热会突然剧烈沸腾喷出，加沸石或玻璃珠提供汽化中心，使沸腾平稳，避免爆沸伤人。"},{"id":1059,"c":"化学安全","l":"II","t":2,"q":"需要加热的实验装置要选用安全的加热恒温措施,禁止使用电热毯、加热带等不安全的设备","o":{},"a":["正确"],"e":"电热毯、加热带裸露且控温差，容易局部过热引燃试剂或触电，加热要用带控温的规范设备。"},{"id":1060,"c":"化学安全","l":"II","t":2,"q":"性质相抵触的化（实）验项目,应分开进行,（如散发可燃气体与用火操作）防止发生火灾;","o":{},"a":["正确"],"e":"散可燃气体的操作与用火同时进行，等于一边放气一边点火，气体达到爆炸极限就会着火爆炸，必须分开做。"},{"id":1061,"c":"化学安全","l":"II","t":2,"q":"消防器材不得随意搬动,使用后必须及时报告","o":{},"a":["正确"],"e":"消防器材摆位是按灭火需要定的，随意搬动会延误取用；用过后要及时报告并补足，保证随时可用。"},{"id":1062,"c":"化学安全","l":"II","t":2,"q":"箱式电阻炉的使用必须经过实验室管理员的同意,确保安全用电","o":{},"a":["正确"],"e":"箱式电阻炉功率大、表面温度高，须经管理员同意并检查线路与接地，防止过载、短路和烫伤。"},{"id":1063,"c":"化学安全","l":"II","t":2,"q":"吸入有毒的气体、粉尘、蒸气、烟雾会引起呼吸系统中毒","o":{},"a":["正确"],"e":"有毒气体、粉尘、蒸气、烟雾经口鼻吸入后直达肺泡并随血液扩散，是实验室中毒最常见、最隐蔽的途径。"},{"id":1064,"c":"化学安全","l":"II","t":2,"q":"吸滤瓶及一些厚壁玻璃容器,清洗后可直接放入温度较高的烘箱进行干燥。","o":{},"a":["错误"],"e":"厚壁玻璃导热慢、内外温差大，骤然受热易炸裂伤人；吸滤瓶还带内应力，应低温缓慢干燥或自然晾干。"},{"id":1065,"c":"化学安全","l":"II","t":2,"q":"吸滤瓶及一些厚壁玻璃容器,清洗后不可直接放入温度较高的烘箱,否则往往因急剧加热而破裂。","o":{},"a":["正确"],"e":"厚壁容器内外受热不均会产生很大热应力，进高温烘箱骤热往往直接炸裂，所以只能缓慢低温干燥。"},{"id":1066,"c":"化学安全","l":"II","t":2,"q":"误吸入溴蒸气、氯气等有毒气体时,立即吸入少量酒精和乙醚的混合蒸气,以便解毒,同时应到室外呼吸新鲜空气,再送医院","o":{},"a":["正确"],"e":"溴、氯刺激呼吸道，酒精乙醚混合蒸气可缓解刺激并促使排出；到室外换新鲜空气、及时送医才是根本处置。"},{"id":1067,"c":"化学安全","l":"II","t":2,"q":"误吸入煤气等有毒气体时,应立即在室外呼吸新鲜空气。","o":{},"a":["正确"],"e":"煤气主要是一氧化碳，与血红蛋白结合后使人缺氧；立刻到室外呼吸新鲜空气能迅速降低吸入浓度。"},{"id":1068,"c":"化学安全","l":"II","t":2,"q":"误服强酸导致消化道烧灼痛,为防止进一步加重损伤,不能催吐,可口服牛奶、鸡蛋清、植物油等","o":{},"a":["正确"],"e":"强酸已灼伤食管黏膜，催吐会让酸再次经过伤口加重损伤；牛奶、蛋清、植物油可覆盖保护创面。"},{"id":1069,"c":"化学安全","l":"II","t":2,"q":"无毒的试验废液可以不经处理,直接由下水道排放,对环境不会产生污染。","o":{},"a":["错误"],"e":"所谓无毒只是相对，废液里常混有杂质、重金属或生物污染物，直接排放仍会污染环境，必须处理后再排放。"},{"id":1070,"c":"化学安全","l":"II","t":2,"q":"我国通用的化学试剂可分为分析纯和化学纯两个等级, 试剂瓶的标签有相应的颜色标志分别是分析纯红色,化学纯蓝色。","o":{},"a":["正确"],"e":"分析纯红色、化学纯蓝色标签便于一眼分辨等级，避免用错纯度影响实验结果，这是行业通用约定。"},{"id":1071,"c":"化学安全","l":"II","t":2,"q":"为了保持实验室整洁,废试剂和其它化学实验产生的废弃物可以倒入走廊两头的垃圾桶或下水道。","o":{},"a":["错误"],"e":"废试剂属危险废物，倒垃圾桶或下水道会腐蚀管道、污染水体，还可能与其他废物反应起火，必须分类收集。"},{"id":1072,"c":"化学安全","l":"II","t":2,"q":"为防止容器内的易燃易爆品发生燃烧或爆炸,动火检修前应对容器内的易燃易爆品 置换、吹扫、清洗。","o":{},"a":["正确"],"e":"容器内残留的易燃易爆品遇动火火星就会爆燃，所以要先置换、吹扫、清洗并检测合格，才能动火检修。"},{"id":1073,"c":"化学安全","l":"II","t":2,"q":"危险物质用惰性溶剂稀释后比较安全,该溶液若洒到布上,须待溶剂蒸发变干后再使用","o":{},"a":["错误"],"e":"稀释只降低浓度，危险物的量并没减少；溶剂挥发后残留物浓缩在布上，摩擦、堆积反而更容易起火。"},{"id":1074,"c":"化学安全","l":"II","t":2,"q":"危险物品应当分类、分项存放,相互之间保持安全距离。","o":{},"a":["正确"],"e":"不同危险品性质各异，混放可能相互反应放热、产生毒气；分类分项并留安全距离，能把事故限制在局部。"},{"id":1075,"c":"化学安全","l":"II","t":2,"q":"危险化学品贮存方式分为（隔离贮存、隔开贮存、分离贮存）三种。","o":{},"a":["正确"],"e":"隔离、隔开、分离是按间距和隔断程度划分的三种贮存方式，间距越大、隔断越强，贮存就越安全。"},{"id":1076,"c":"化学安全","l":"II","t":2,"q":"危险化学品用完后就可以将安全标签撕下","o":{},"a":["错误"],"e":"空容器里仍可能残留危险化学品，撕掉标签就无从识别，容易误用或误装，标签应保留到容器报废为止。"},{"id":1077,"c":"化学安全","l":"II","t":2,"q":"危险化学品仓库应该设有避雷设施,并且每5年至少检测一次。","o":{},"a":["错误"],"e":"防雷装置会因锈蚀、老化失效，规定每年至少检测一次，五年才检测一次间隔太长，起不到防护作用。"},{"id":1078,"c":"化学安全","l":"II","t":2,"q":"危险废弃物是指有潜在的生物危险、可燃易燃、腐蚀、有毒、放射性的对人环境有害的一切废弃物。","o":{},"a":["正确"],"e":"危险废弃物涵盖生物危险、易燃、腐蚀、有毒、放射性等，凡对人和环境有潜在危害的废弃物都算在内。"},{"id":1079,"c":"化学安全","l":"II","t":2,"q":"万一发生化学品泄漏事故,可用防毒面具、防毒口罩和捂湿毛巾等方法防止通过呼吸道造成伤害。","o":{},"a":["正确"],"e":"泄漏时空气中毒气浓度高，防毒面具、防毒口罩和湿毛巾能过滤部分毒气，为撤离和处置争取时间。"},{"id":1080,"c":"化学安全","l":"II","t":2,"q":"桶装氧化剂不得在水泥地面滚动","o":{},"a":["正确"],"e":"水泥地面粗糙，滚动时摩擦撞击会产生火星或破损桶体，氧化剂遇火、遇杂质极易引发燃烧爆炸。"},{"id":1081,"c":"化学安全","l":"II","t":2,"q":"通风控制措施就是借助于有效的通风,使气体、蒸气或粉尘的浓度低于最高容许浓度","o":{},"a":["正确"],"e":"通风把污染物不断稀释排出，使其浓度降到最高容许浓度以下，人吸入的毒物量才不会超标。"},{"id":1082,"c":"化学安全","l":"II","t":2,"q":"通常有害药品经呼吸器官、消化器官或皮肤吸入体内,引起中毒。因此,我们切忌口尝、鼻嗅及用手触摸药品","o":{},"a":["正确"],"e":"这三条途径都能让毒物进体内，口尝、鼻嗅、手摸等于主动把药品送进口鼻和皮肤，必须严格禁止。"},{"id":1083,"c":"化学安全","l":"II","t":2,"q":"随进口设备附带的剧毒物品须到校保卫处备案,纳入剧毒物品管理。","o":{},"a":["正确"],"e":"进口设备附带的剧毒品同样有流失风险，到保卫处备案才能纳入台账、实行双人管理和定期核查。"},{"id":1084,"c":"化学安全","l":"II","t":2,"q":"塑料制品在烘干过程中温度不能超过100℃,植物样品在烘干过程中不超过70℃。","o":{},"a":["错误"],"e":"题干把两个温度写反了：塑料受热易变形，烘干应控制在70℃以下；植物样品可耐到100℃左右，超过会烤焦。按题干操作会损坏样品，故错误。"},{"id":1085,"c":"化学安全","l":"II","t":2,"q":"水浴加热的上限温度是100℃,油浴加热的上限温度是200℃,用硅油作介质时可加热到300℃。","o":{},"a":["错误"],"e":"水浴上限受水的沸点限制约100℃，油浴上限取决于油品闪点；硅油超温会分解冒烟、超闪点会着火，并不存在固定200℃/300℃的上限，故错误。"},{"id":1086,"c":"化学安全","l":"II","t":2,"q":"水银温度计破了以后对的处理是:洒落出来的汞必须立即用滴管、毛刷收集起来,并用水覆盖（最好用甘油）,然后在污染处撒上硫磺粉,无液体后（一般约一周时间）方可清扫。","o":{},"a":["正确"],"e":"汞滴用滴管毛刷收集可避免散成小珠，水或甘油覆盖能抑制蒸发，硫磺与汞生成硫化汞，一周后再清扫更安全。"},{"id":1087,"c":"化学安全","l":"II","t":2,"q":"受照射易燃烧、易爆炸或产生有毒气体的化学危险品和桶装、罐装等易燃液体、气体应当在阴凉通风的地点存放","o":{},"a":["正确"],"e":"这类物品受热、见光或受撞击就容易燃爆或放出毒气，放在阴凉通风处能降低温度、减少蒸气积聚。"},{"id":1088,"c":"化学安全","l":"II","t":2,"q":"室温下汞的蒸汽压为0.0012 mmHg柱,比安全浓度标准大100倍。","o":{},"a":["正确"],"e":"汞在室温就会持续蒸发，0.0012mmHg的蒸气压换算后已远超安全浓度上百倍，所以汞作业必须通风并防洒落。"},{"id":1089,"c":"化学安全","l":"II","t":2,"q":"试验废液必须集中,交学校统一处理。由专门机构通过化学方法处理,使其变为无害物质,尽量减少对环境的污染。","o":{},"a":["正确"],"e":"实验室没有处理资质和设备，废液集中交学校统一处置，由专门机构做化学处理，才能真正降低环境风险。"},{"id":1090,"c":"化学安全","l":"II","t":2,"q":"试剂瓶必须倾倒空后集中放至走廊每天由专人回收,装有废弃物的试剂瓶必须在实验室集中放置,由院定期回收处理,报废试剂时必须分类。","o":{},"a":["正确"],"e":"倒空的瓶子仍有残液，集中定点回收可避免残留试剂混放反应，分类后便于按性质分别处置。"},{"id":1091,"c":"化学安全","l":"II","t":2,"q":"使用有毒气体（如H2S, Cl2, Br2, NO2, HCl, HF)应在通风橱中进行操作。","o":{},"a":["正确"],"e":"这些气体有毒或强刺激，通风橱能把柜内气体抽走，人在柜外操作就不会直接吸入泄漏出来的气体。"},{"id":1092,"c":"化学安全","l":"II","t":2,"q":"使用强氧化剂时环境温度不宜过高,通风良好,并不要与有机物或还原性物质共同使用","o":{},"a":["正确"],"e":"强氧化剂遇热、遇有机物或还原剂会剧烈反应甚至燃烧爆炸，所以控温、通风、分开使用是基本要求。"},{"id":1093,"c":"化学安全","l":"II","t":2,"q":"使用离心机时,当部分装载时,离心管可随意放在转头中而不用考虑平衡。","o":{},"a":["错误"],"e":"离心时各管重量不等，转头会剧烈振动、损坏轴承，甚至转子飞出伤人；必须对称放置、等重配平。"},{"id":1094,"c":"化学安全","l":"II","t":2,"q":"使用剧毒药品时应该配备个人防护用具,做好应急援救预案","o":{},"a":["正确"],"e":"剧毒品一旦接触后果严重，个人防护用具可减少皮肤和吸入暴露，应急预案能在出事时快速处置。"},{"id":1095,"c":"化学安全","l":"II","t":2,"q":"使用剧毒药品必须严格执行五双制度,即双人保管、双人领取、双人使用、双把锁、双本帐。储存剧毒药品的实验室必须配备保险柜。","o":{},"a":["正确"],"e":"双人双锁、双本帐使剧毒品流向可追溯、互相监督，保险柜则防止被盗或误取，这是硬性管理制度。"},{"id":1096,"c":"化学安全","l":"II","t":2,"q":"使用剧毒品时要精确计量并在学校剧毒化学品实验使用登记表上记录。登记表与化学试剂瓶放在一起储存,在剧毒物品使用完或残存物处理完毕后与空瓶一起交回实验室老师处理。","o":{},"a":["正确"],"e":"精确计量加登记能随时核对库存与用量，登记表与瓶同放、用完后连空瓶一起交回，杜绝私自留存。"},{"id":1097,"c":"化学安全","l":"II","t":2,"q":"食物或是手上沾染了有毒物质,在吸烟、进食、饮水时食入,就会引起消化系统中毒。这类物质一般是剧毒的粉剂,如:氰化物、砷化物、汞盐等","o":{},"a":["正确"],"e":"手或食物被毒物污染后随进食进入消化道，氰化物、砷化物、汞盐这类剧毒粉剂少量即可致命，所以实验区禁食。"},{"id":1098,"c":"化学安全","l":"II","t":2,"q":"实验室中使用臭氧发生设备时,应保证管路气密性,并将尾气用硫代硫酸钠溶液吸收,以免室内臭氧浓度过高。","o":{},"a":["正确"],"e":"臭氧有毒且氧化性强，管路不严会漏进室内；尾气用硫代硫酸钠还原吸收，可避免室内浓度升高。"},{"id":1099,"c":"化学安全","l":"II","t":2,"q":"实验室药品常有毒性,严禁直接舔尝。","o":{},"a":["正确"],"e":"不少试剂外观像食盐、白糖，仅凭颜色气味判断极易误食；尝味既可能中毒，又会污染药品。"},{"id":1100,"c":"化学安全","l":"II","t":2,"q":"实验室内严禁存放大量化学试剂,试剂必须远离烘箱和其他电器,冰箱内不得放与实验无关的物品。","o":{},"a":["正确"],"e":"试剂存多了火灾荷载大，烘箱和电器附近温度高易引燃挥发气体；冰箱里混放杂物会妨碍取用、增加污染。"},{"id":1101,"c":"化学安全","l":"II","t":2,"q":"实验室内可以使用红外取暖器不能使用电炉取暖。","o":{},"a":["错误"],"e":"红外取暖器同样有高温辐射面和电热元件，靠近试剂或蒸气就可能引燃，实验室里任何取暖电器都不允许使用。"},{"id":1102,"c":"化学安全","l":"II","t":2,"q":"实验室内的浓酸、浓碱如果不经处理,沿下水道流走,对管道会产生很强的腐蚀,又造成环境的污染。","o":{},"a":["正确"],"e":"酸碱会腐蚀管道接口造成渗漏，排入水体还会改变pH、伤害水生生物，必须先处理再排放。"},{"id":1103,"c":"化学安全","l":"II","t":2,"q":"实验室内的浓酸、浓碱处理,一般要先中和后倾倒,并用大量的水冲洗管道。","o":{},"a":["正确"],"e":"中和后酸碱性大幅降低，再用大量水冲洗，可避免残酸残碱在管道里积聚腐蚀，也减少对环境的冲击。"},{"id":1104,"c":"化学安全","l":"II","t":2,"q":"实验室内的汞蒸气会造成人员慢性重毒,为了减少汞液面的蒸发,可在汞液面上覆盖化学液体（甘油）。","o":{},"a":["正确"],"e":"汞的蒸发随温度升高明显加快，甘油等液体在汞面形成覆盖层，能显著减少蒸发量，降低慢性中毒风险。"},{"id":1105,"c":"化学安全","l":"II","t":2,"q":"实验室里的溶剂例如乙醚、苯、醋酸乙酯等发生火灾可用水扑救","o":{},"a":["错误"],"e":"有机溶剂比水轻又不溶于水，用水浇会浮在水面随水流扩散火势；应改用干粉、泡沫或二氧化碳灭火。"},{"id":1106,"c":"化学安全","l":"II","t":2,"q":"实验室可以存放大桶有机试剂","o":{},"a":["错误"],"e":"大桶试剂存量集中，一旦泄漏或着火很难控制，实验室只能按需少量存放，用多少领多少。"},{"id":1107,"c":"化学安全","l":"II","t":2,"q":"实验室禁止吸烟和动明火,但可以使用封闭电炉煮水和其他食物。","o":{},"a":["错误"],"e":"封闭电炉照样有高温和电火花，煮食还会引来人员在实验区进食；实验室禁止任何形式的烹饪和电炉加热食物。"},{"id":1108,"c":"化学安全","l":"II","t":2,"q":"实验室进行蒸馏操作时,对于爆炸性物质或不稳定物质,须小心地蒸馏直到剩余少量残渣。","o":{},"a":["错误"],"e":"不稳定物质浓缩到快干时最危险，受热摩擦就可能爆炸，应留足残液，绝不能蒸到只剩少量残渣。"},{"id":1109,"c":"化学安全","l":"II","t":2,"q":"实验室毒物进入人体有三条途径即皮肤、消化道和呼吸道。 实验室防毒应加强个人防护","o":{},"a":["正确"],"e":"皮肤接触、误食和吸入是毒物进人体的三条主要通道，针对性戴手套、口罩、开通风才能有效防毒。"},{"id":1110,"c":"化学安全","l":"II","t":2,"q":"实验室的压力容器灭菌锅属于特种设备的管理,人员需要培训上岗,它的安全阀、压力表应该定期校验","o":{},"a":["正确"],"e":"灭菌锅属压力容器，超压会爆炸，操作者要培训上岗，安全阀和压力表定期校验才能保证超压时可靠泄压。"},{"id":1111,"c":"化学安全","l":"II","t":2,"q":"实验室的废液可以放入同一个废液桶中进行处理。","o":{},"a":["错误"],"e":"不同废液混在一起可能相互反应放热、放出有毒气体甚至爆炸，也会让后续处理更难，必须分类收集。"},{"id":1112,"c":"化学安全","l":"II","t":2,"q":"实验室不能存放过多化学试剂,易燃易爆化学品可以存放在普通冰箱内。","o":{},"a":["错误"],"e":"普通冰箱内有温控器、照明开关等电火花，易燃蒸气进去就可能被点燃；存易燃品必须用防爆冰箱。"},{"id":1113,"c":"化学安全","l":"II","t":2,"q":"实验室冰箱内禁止存放危险化学物品,如果确需存放,则必须注意容器绝对密封,严防泄漏。","o":{},"a":["正确"],"e":"冰箱密闭、温度低，泄漏的蒸气容易积聚到爆炸浓度；确需存放时要保证容器密封，并尽量使用防爆冰箱。"},{"id":1114,"c":"化学安全","l":"II","t":2,"q":"实验后剩余的金属钠,应用大量的水冲洗。","o":{},"a":["错误"],"e":"钠遇水剧烈反应放出氢气和大量热，氢气遇火即燃甚至爆炸；残钠应用无水乙醇分解或回收，绝不能用水冲。"},{"id":1115,"c":"化学安全","l":"II","t":2,"q":"实验过程中长时间使用恒温水浴锅时,应注意及时加水,避免干烧发生危险","o":{},"a":["正确"],"e":"水浴锅水位下降后会干烧，加热管过热可能烧毁甚至引燃周围物品，所以要定时查看、及时补水。"},{"id":1116,"c":"化学安全","l":"II","t":2,"q":"实验产生或剩余的易挥发物,可以倒入废液缸内","o":{},"a":["错误"],"e":"易挥发物倒入敞口废液缸会不断挥发，缸内积聚可燃或有毒蒸气，遇火源就出事，应密闭收集。"},{"id":1117,"c":"化学安全","l":"II","t":2,"q":"实验产生的废液（废酸、废碱等）和废弃固体物质可直接倒入下水道或普通垃圾桶","o":{},"a":["错误"],"e":"废酸废碱和固体废物直接排放会腐蚀管道、污染水体和土壤，必须分类收集后交有资质单位处理。"},{"id":1118,"c":"化学安全","l":"II","t":2,"q":"生产、储存和使用危险化学品的单位,应当在生产、储存和使用场所设置报警装置。","o":{},"a":["正确"],"e":"报警装置能在泄漏初期就发出警报，让人员及时撤离和处置，是危险化学品场所的法定安全设施。"},{"id":1119,"c":"化学安全","l":"II","t":2,"q":"少数易燃固体和自燃物品不能用水和泡沫扑救,如三硫化二磷、铝粉、烷基铝、保险粉等,应根据具体情况区别处理。一般可用干砂或不用压力喷射的干粉扑救。","o":{},"a":["正确"],"e":"三硫化二磷、铝粉、烷基铝、保险粉遇水会反应放热并放出可燃气体甚至自燃，所以用干砂或干粉覆盖窒息灭火。"},{"id":1120,"c":"化学安全","l":"II","t":2,"q":"少量废乙醚、酒精、丙酮、二硫化碳、苯等有机溶剂可倒入下水道","o":{},"a":["错误"],"e":"量少也会在管道低洼处积聚成可燃蒸气，遇火回燃；废溶剂必须收集到专用容器统一处理。"},{"id":1121,"c":"化学安全","l":"II","t":2,"q":"烧杯、烧瓶及试管之类仪器,因其壁薄,机械强度很低,用于加热时,必须小心操作。","o":{},"a":["正确"],"e":"这类玻璃器壁薄，受热不均就会裂，加热时须垫石棉网、小火均匀升温，不能骤冷骤热。"},{"id":1122,"c":"化学安全","l":"II","t":2,"q":"烧杯、烧瓶及试管等加热时比较安全","o":{},"a":["错误"],"e":"玻璃壁薄、导热差，局部骤热会产生应力而炸裂，加热并不安全，必须垫石棉网、均匀缓慢升温。"},{"id":1123,"c":"化学安全","l":"II","t":2,"q":"若在液氮罐中保存安瓿瓶,应放在液氮的气相中,不要浸在液氮中。","o":{},"a":["正确"],"e":"液氮温度极低，安瓿浸入后取出骤热可能炸裂；放在气相中温度较稳定，既冷冻保存又减少炸裂风险。"},{"id":1124,"c":"化学安全","l":"II","t":2,"q":"如溴滴落到皮肤上,应立即用水冲洗,再用1体积25%的氨水,1体积松节油和10体积（75%）酒精混合液涂敷;也可先用苯甘油除去溴,然后用水冲洗。","o":{},"a":["正确"],"e":"溴腐蚀性强，先大量水冲走残留，氨水中和酸性溴，松节油酒精助溶稀释；苯甘油能溶解溴，减轻灼伤。"},{"id":1125,"c":"化学安全","l":"II","t":2,"q":"如铅、镉、汞等对人体有害。","o":{},"a":["正确"],"e":"这三种重金属进入人体后难以排出，会在肝肾和骨骼蓄积造成慢性中毒，所以涉铅镉汞操作要严格防护。"},{"id":1126,"c":"化学安全","l":"II","t":2,"q":"如酚灼伤皮肤,先用浸了甘油或聚乙二醇和酒精混合液（7:3）的棉花除去污物,再用清水冲洗干净,然后用饱和硫酸钠溶液湿敷。但不可用水直接冲洗污物,否则有可能使创伤加重。","o":{},"a":["正确"],"e":"酚易溶于甘油和酒精，先用它们把污物溶掉再冲水，可避免水把酚稀释扩散到更大面积；硫酸钠能中和残酚。"},{"id":1127,"c":"化学安全","l":"II","t":2,"q":"如发现水泵漏水,可以不用切断电源,待实验完毕后再报修","o":{},"a":["错误"],"e":"水泵漏水会浸湿带电部位和地面，人踩上去就可能触电，也会短路起火，必须先断电再检修。"},{"id":1128,"c":"化学安全","l":"II","t":2,"q":"任何时候见到洒落的液体不要认为是水,应按照对待不明液体的应急预案进行科学处理,并通知相关人员,以免发生危险","o":{},"a":["正确"],"e":"洒落的液体可能是酸碱、有机溶剂或传染性物质，当作水去擦可能灼伤、中毒或扩大污染，要按预案处理。"},{"id":1129,"c":"化学安全","l":"II","t":2,"q":"人身上着火后赶快跑。","o":{},"a":["错误"],"e":"奔跑等于给火送风，火苗会烧得更旺，还会把火带到别的可燃物；应立即卧倒打滚或用湿衣物覆盖压灭。"},{"id":1130,"c":"化学安全","l":"II","t":2,"q":"燃点越低的物品越安全。","o":{},"a":["错误"],"e":"燃点低说明更容易被点燃，遇到微小火星就会起火，所以燃点越低越危险，绝不是越安全。"},{"id":1131,"c":"化学安全","l":"II","t":2,"q":"取用有毒、有恶臭味的试剂时,要在通风橱中操作;使用完毕后,将瓶塞蜡封,或用生料带将瓶口封严","o":{},"a":["正确"],"e":"通风橱能及时排走有毒蒸气和臭味，用后蜡封或用生料带把瓶口封严，可防止挥发泄漏伤人。"},{"id":1132,"c":"化学安全","l":"II","t":2,"q":"取用强碱性试剂后的小勺应擦净后存放","o":{},"a":["错误"],"e":"强碱腐蚀性强，只擦不洗会让残留继续腐蚀小勺并污染下次称取的试剂，应先用水彻底冲洗干净再存放。"},{"id":1133,"c":"化学安全","l":"II","t":2,"q":"氰化钾、氰化钠、丙烯腈等是剧毒品,进入人体50毫克即可致死,与皮肤接触经伤口进入人体,即可引起严重中毒。","o":{},"a":["正确"],"e":"氰化钾、氰化钠、丙烯腈属剧毒品，极少量经口或经伤口进入就能抑制细胞呼吸而致命，必须严格防护。"},{"id":1134,"c":"化学安全","l":"II","t":2,"q":"倾倒液体药品时,应将标签朝下,以便看清倒出情形","o":{},"a":["错误"],"e":"标签朝下会被倒出的药液污染、字迹模糊而无法辨认药剂，应让标签朝向手心，瓶口靠紧容器缓慢倾倒。"},{"id":1135,"c":"化学安全","l":"II","t":2,"q":"轻度铅中毒症状为头晕、头痛、失眠、无力、腹痛、腹胀、便秘等。","o":{},"a":["正确"],"e":"轻度铅中毒以头晕、头痛、失眠、乏力以及腹痛、腹胀、便秘等神经和消化道症状为主，符合该描述。"},{"id":1136,"c":"化学安全","l":"II","t":2,"q":"氢氟酸灼伤皮肤后,先立即脱光去污染的衣物,用大量流动清水彻底冲洗后,继用肥皂水或2%～5%碳酸氢钠冲洗,再用葡萄糖酸钙软膏涂敷按摩,然后再涂以33%氧化镁甘油糊剂、维生素AD或可的松软膏等。","o":{},"a":["正确"],"e":"先脱去污染衣物并用大量流动清水冲洗，再用碳酸氢钠中和，涂葡萄糖酸钙软膏补充钙、减轻深层腐蚀。"},{"id":1137,"c":"化学安全","l":"II","t":2,"q":"氢氟酸对皮肤有强烈的腐蚀性,渗透作用强,并对组织蛋白有脱水及溶解作用。皮肤及衣物被腐蚀者,先立即脱去被污染衣物,皮肤用大量流动清水彻底冲洗后,继用肥皂水或2％～5％碳酸氢钠溶液冲洗,再用葡萄糖酸钙软膏涂敷按摩,然后再涂以33％氧化镁甘油糊剂、维生素AD软膏或可的松软膏等","o":{},"a":["正确"],"e":"氢氟酸渗透深、腐蚀强，冲洗后需用碳酸氢钠中和，再涂葡萄糖酸钙软膏把渗入组织的氟离子固定住。"},{"id":1138,"c":"化学安全","l":"II","t":2,"q":"强氧化剂(如硫酸、硝酸、氯酸盐、过氧化物等)不可与强还原剂(如硫、硫化物、甘油等)相混合。","o":{},"a":["正确"],"e":"强氧化剂与硫、甘油等还原剂接触会发生剧烈氧化还原反应，放出大量热甚至燃烧爆炸，故严禁混放。"},{"id":1139,"c":"化学安全","l":"II","t":2,"q":"强酸灼伤时,必须先用大量流水彻底冲洗,然后在皮肤上擦拭碱性药物,否则会加重皮肤损伤。","o":{},"a":["正确"],"e":"先冲洗能带走残留酸并稀释浓度，再用碱性药物中和，可防止酸继续向深层组织渗透而加重损伤。"},{"id":1140,"c":"化学安全","l":"II","t":2,"q":"强酸溅入眼内时,应立即用大量清水或生理盐水进行彻底冲洗,冲洗时必须将上下眼睑拉开,水不要流经未伤的眼睛,不可直接冲击眼球。","o":{},"a":["正确"],"e":"立即用大量清水或生理盐水彻底冲洗，拉开上下眼睑、避开健眼、不直冲眼球，才能尽快冲走酸液。"},{"id":1141,"c":"化学安全","l":"II","t":2,"q":"强酸溅人眼内时,在现场立即就近用大量清水或生理盐水彻底冲洗。冲洗时应将头置于水龙头下,使冲洗后的水自伤眼的一侧流下,这样既避免水直冲眼球,又不至于使带酸的冲洗液进入好眼。冲洗时应拉开上下眼睑,使酸不至于留存眼内和下穹窿而形成留酸死腔。如无冲洗设备,可将眼浸入盛清水的盆内,拉开下眼睑,摆动头部,洗掉酸液,切忌惊慌或因疼痛而紧闭眼睛,冲洗时间应不少于15min。经上述处理后,立即送医院眼科进行治疗。","o":{},"a":["正确"],"e":"就近用大量清水冲洗不少于15分钟，拉开上下眼睑并让水从伤眼一侧流走，可避免酸残留形成留酸死腔。"},{"id":1142,"c":"化学安全","l":"II","t":2,"q":"强酸、强碱、强氧化剂、溴、磷、钠、钾、苯酚、醋酸等物质都会灼伤皮肤;应注意不要让皮肤与之接触,尤其防止溅入眼中。","o":{},"a":["正确"],"e":"这些物质对皮肤和眼睛有强烈腐蚀或灼伤作用，必须避免直接接触，尤其要防止溅入眼中。"},{"id":1143,"c":"化学安全","l":"II","t":2,"q":"铅中毒病情加重症状为腹部阵发性绞痛、肌无力、肢端麻木、贫血","o":{},"a":["正确"],"e":"病情加重时出现腹部阵发性绞痛、肌无力、肢端麻木和贫血，是铅损害神经、造血和消化系统的表现。"},{"id":1144,"c":"化学安全","l":"II","t":2,"q":"铅被加热到 400℃以上就有大量铅蒸汽逸出,在空气中迅速氧化为氧化铅,形成烟尘,易被人体吸入,造成铅中毒。","o":{},"a":["正确"],"e":"铅加热到400℃以上会大量蒸发，在空气中迅速氧化成氧化铅烟尘，吸入后沉积体内造成铅中毒。"},{"id":1145,"c":"化学安全","l":"II","t":2,"q":"汽油的爆炸极限约是:1.0%～5.9%。","o":{},"a":["正确"],"e":"汽油蒸气在空气中达到约1.0%～5.9%的体积分数时遇火即爆，这个浓度范围就是汽油的爆炸极限。"},{"id":1146,"c":"化学安全","l":"II","t":2,"q":"汽油的爆炸极限是:7.6%～1.4%。","o":{},"a":["正确"],"e":"汽油爆炸极限按体积分数为1.4%～7.6%，题干写成7.6%～1.4%只是上下限顺序颠倒，指的仍是同一段易爆浓度区间，故正确。"},{"id":1147,"c":"化学安全","l":"II","t":2,"q":"气体钢瓶使用后,可以不关闭阀门","o":{},"a":["错误"],"e":"用后必须关紧瓶阀，否则余气泄漏遇火源可能燃烧爆炸，也会让空气杂质倒灌污染瓶内气体。"},{"id":1148,"c":"化学安全","l":"II","t":2,"q":"扑救自燃性物质火灾,可用水、干粉、砂土、二氧化碳灭火","o":{},"a":["正确"],"e":"自燃物质靠自身氧化放热起火，用水、干粉、砂土、二氧化碳覆盖降温或隔绝空气都能有效扑灭。"},{"id":1149,"c":"化学安全","l":"II","t":2,"q":"扑救遇水燃烧物质火灾,可用干粉、干砂土","o":{},"a":["正确"],"e":"这类物质遇水剧烈反应放出可燃气体，只能用于粉、干砂土覆盖窒息，绝不能用水或泡沫扑救。"},{"id":1150,"c":"化学安全","l":"II","t":2,"q":"扑救易燃和可燃液体火灾,用泡沫、干粉、二氧化碳扑灭液火焰,同时用水冷却容器四周,防止容器膨胀爆炸。但酸、醚、酮等溶于水的易燃液体火灾,应该用抗溶性泡沫扑救;","o":{},"a":["正确"],"e":"泡沫、干粉、二氧化碳可覆盖液面窒息火焰，同时用水冷却容器防止膨胀爆炸；醇、醚、酮溶于水，须用抗溶性泡沫。"},{"id":1151,"c":"化学安全","l":"II","t":2,"q":"扑救易燃和可燃固体火灾,可用泡沫、干粉、砂土、二氧化碳或雾状水","o":{},"a":["正确"],"e":"固体火灾可用泡沫、干粉、砂土、二氧化碳或雾状水覆盖降温，阻断燃烧并防止阴燃复燃。"},{"id":1152,"c":"化学安全","l":"II","t":2,"q":"扑救氧化剂类的火灾,可用干粉、水、二氧化碳。","o":{},"a":["正确"],"e":"氧化剂本身助燃，扑救以大量水冷却为主，干粉、二氧化碳也可覆盖灭火，故题述用法可以成立。"},{"id":1153,"c":"化学安全","l":"II","t":2,"q":"扑救气体火灾切忌盲目扑灭火势,首先应切断火势蔓延途径,然后疏散火势中压力容器或受到火焰辐射热威胁的压力容器,不能疏散的部署水枪进行冷却保护。","o":{},"a":["正确"],"e":"盲目扑灭火焰会让未燃气体继续泄漏积聚，遇火源二次爆炸；应先切断气源、冷却受威胁的压力容器。"},{"id":1154,"c":"化学安全","l":"II","t":2,"q":"扑救可燃和助燃气体火灾时,要先关闭管道阀门,用水冷却其容器、管道,用干粉、砂土扑灭火焰;","o":{},"a":["正确"],"e":"先关阀门切断气源，再用水冷却容器管道，用干粉、砂土扑灭残火，可防回火和容器超压爆炸。"},{"id":1155,"c":"化学安全","l":"II","t":2,"q":"漂白粉是含氯消毒剂, 它在水中产生次氯酸, 可杀死多种细菌","o":{},"a":["正确"],"e":"漂白粉溶于水生成次氯酸，能氧化破坏细菌的蛋白质和酶，因而具有广谱杀菌消毒作用。"},{"id":1156,"c":"化学安全","l":"II","t":2,"q":"皮肤接触活泼金属(如钾、钠),可用大量水冲洗","o":{},"a":["错误"],"e":"钾、钠遇水剧烈反应放热并放出氢气，会烧伤皮肤甚至引燃氢气，应先用干布擦除再按规程处理。"},{"id":1157,"c":"化学安全","l":"II","t":2,"q":"皮肤被黄磷灼时,应及时脱去污染的衣物,并立即用清水(由五氧化二磷、五硫化磷、五氯化磷引起的灼伤禁用水洗)或5%硫酸铜溶液或3%过氧化氢溶液冲洗,再用5%碳酸氢钠溶液冲洗,中和所形成的磷酸,然后用1:5000高锰酸钾溶液湿敷,或用2%硫酸铜溶液湿敷,以使皮肤上残存的黄磷颗粒形成磷化铜。","o":{},"a":["正确"],"e":"黄磷灼伤先脱去污染衣物、大量清水冲洗，再用碳酸氢钠中和磷酸，硫酸铜使残磷变成磷化铜便于清除。"},{"id":1158,"c":"化学安全","l":"II","t":2,"q":"皮肤被黄磷灼伤时,及时脱去污染的衣物,并立即用清水(由五氧化二磷、五硫化磷、五氯化磷引起的灼伤禁用水洗)或5％硫酸铜溶液或3％过氧化氢溶液冲洗,再用5％碳酸氢钠溶液冲洗,中和所形成的磷酸。然后用1:5 000高锰酸钾溶液湿敷,或用2％硫酸铜溶液湿敷,以使皮肤上残存的黄磷颗粒形成磷化铜。注意,灼伤创面禁用含油敷料。","o":{},"a":["正确"],"e":"同上处理顺序：清水冲洗、碳酸氢钠中和磷酸、硫酸铜生成磷化铜，且创面禁用油性敷料以防磷溶解渗入。"},{"id":1159,"c":"化学安全","l":"II","t":2,"q":"皮肤被黄磷灼伤禁用含油敷料。","o":{},"a":["正确"],"e":"黄磷易溶于油脂，含油敷料会把磷溶解并带入创面深层继续燃烧腐蚀，所以灼伤创面必须禁用。"},{"id":1160,"c":"化学安全","l":"II","t":2,"q":"配制硫酸水溶液时,应将浓硫酸徐徐倒入水中,并不断搅拌。","o":{},"a":["正确"],"e":"浓硫酸溶于水会大量放热，把酸慢慢倒入水中并不断搅拌，热量能及时散开，避免局部沸腾飞溅伤人。"},{"id":1161,"c":"化学安全","l":"II","t":2,"q":"浓硫酸、液碱可用铁制品做容器,因此也可用镀锌铁桶。","o":{},"a":["错误"],"e":"锌是两性金属，既能与酸反应也能与碱反应，镀锌层被腐蚀后铁也受损，还可能放出氢气，故不能用镀锌铁桶。"},{"id":1162,"c":"化学安全","l":"II","t":2,"q":"能相互反应产生有毒气体的废液,不得倒入同一收集桶中。若某种废液倒入收集桶会发生危险,则应单独暂存于一容器中,并贴上标签。","o":{},"a":["正确"],"e":"混倒可能反应生成有毒气体或骤然放热，必须分开单独暂存并贴标签，防止事故和交叉污染。"},{"id":1163,"c":"化学安全","l":"II","t":2,"q":"每日操作完毕,应将试剂收好,工作台面、地面要擦拭干净,防止残留渣、液等引起事故,下班要切断电源、燃气等管道,关闭门窗上锁。","o":{},"a":["正确"],"e":"收好试剂、清洁台面地面、断电断气、关窗锁门，可消除残留物和电气燃气隐患，防止事故和被盗。"},{"id":1164,"c":"化学安全","l":"II","t":2,"q":"领取剧毒物品时,需双人领用(其中一人必须是实验室的教师)","o":{},"a":["正确"],"e":"剧毒品实行双人领取、双人保管，其中一人须为教师，可互相监督，防止流失、被盗和误用。"},{"id":1165,"c":"化学安全","l":"II","t":2,"q":"磷化物（Ca3P2、Zn3P2等）有毒,遇水生成H3P,其在空气中能自燃。","o":{},"a":["正确"],"e":"磷化钙、磷化锌遇水或潮湿空气放出磷化氢，该气体剧毒且在空气中能自燃，操作必须严格防潮。"},{"id":1166,"c":"化学安全","l":"II","t":2,"q":"离心机使用时,针对离心液体的性质选择适宜的离心管。为避免玻璃套管的破裂,有机溶剂和酶溶液选择塑料套管,盐溶液选择金属套管。","o":{},"a":["错误"],"e":"错在把选管规则简单对应：盐溶液用金属套管会被腐蚀，有机溶剂也未必适合塑料管，应按材质耐蚀性选择。"},{"id":1167,"c":"化学安全","l":"II","t":2,"q":"离心管中样品盛放量可以为离心管体积的3/4","o":{},"a":["错误"],"e":"装量过多在离心时容易外溢、造成转子不平衡甚至甩出，一般不超过容积的三分之二，并对称配平放置。"},{"id":1168,"c":"化学安全","l":"II","t":2,"q":"冷凝冷却系统上连接用的橡胶管必须用铁丝等固定住,以防止因水压过高而造成管子脱落。","o":{},"a":["正确"],"e":"水压过高时胶管易从接口脱落，用铁丝或卡箍固定可防止冷却水喷出造成漏水、淹水和触电。"},{"id":1169,"c":"化学安全","l":"II","t":2,"q":"冷凝冷却系统上连接用的橡胶管必须定期检查更换,避免管子老化而引起漏水事故的发生。","o":{},"a":["正确"],"e":"橡胶管老化会变硬开裂，冷却水渗漏可能浸湿电器、损坏设备，定期检查更换可预防漏水事故。"},{"id":1170,"c":"化学安全","l":"II","t":2,"q":"可以在纸上称量过氧化钠。","o":{},"a":["错误"],"e":"过氧化钠是强氧化剂，与纸等可燃物接触可能起火燃烧，应在玻璃器皿或称量瓶中称量。"},{"id":1171,"c":"化学安全","l":"II","t":2,"q":"可以在木质或塑料等实验台上直接使用加热电炉。","o":{},"a":["错误"],"e":"电炉底温很高，木质、塑料台面会被烤焦引燃，应垫隔热板或在阻燃实验台面上使用。"},{"id":1172,"c":"化学安全","l":"II","t":2,"q":"可以用嘴、鼻和手直接接触试剂","o":{},"a":["错误"],"e":"试剂多有毒性、腐蚀性，用嘴、鼻、手直接接触会造成中毒或灼伤，必须用工具取用并做好防护。"},{"id":1173,"c":"化学安全","l":"II","t":2,"q":"可以用普通的冰箱储藏易燃易爆的试剂","o":{},"a":["错误"],"e":"普通冰箱内温控器动作会产生电火花，易燃蒸气积聚后遇火花即爆炸，存放易燃易爆试剂须用防爆冰箱。"},{"id":1174,"c":"化学安全","l":"II","t":2,"q":"可以用烘箱干燥有爆炸危险性的物质。","o":{},"a":["错误"],"e":"烘箱密闭加热，爆炸性物质受热分解或蒸气积聚，遇电热丝火花会爆炸，严禁用烘箱干燥这类物质。"},{"id":1175,"c":"化学安全","l":"II","t":2,"q":"可以使用明火（如:电炉、煤气）或没有控温装置的加热设备直接加热有机溶剂,进行重结晶或溶液浓缩操作。","o":{},"a":["错误"],"e":"有机溶剂蒸气遇明火极易闪燃，没有控温装置还会冲料溢出，应改用水浴、油浴或电热套并控制温度。"},{"id":1176,"c":"化学安全","l":"II","t":2,"q":"可以将乙炔与氧气混放在一个房间。","o":{},"a":["错误"],"e":"乙炔可燃、氧气助燃，一旦泄漏在一个房间里混合，遇火源即发生剧烈爆炸，必须分室隔离存放。"},{"id":1177,"c":"化学安全","l":"II","t":2,"q":"可以将氢气与氧气混放在一个房间","o":{},"a":["错误"],"e":"氢气与氧气混合后遇火源会爆炸，两者必须分开存放，并保持房间通风良好、远离火源。"},{"id":1178,"c":"化学安全","l":"II","t":2,"q":"可以单独使用剧毒物品。","o":{},"a":["错误"],"e":"剧毒品必须双人领取、双人使用，单独操作一旦发生中毒或丢失，无人发现也无人施救。"},{"id":1179,"c":"化学安全","l":"II","t":2,"q":"可以穿拖鞋或凉鞋进入化学实验。","o":{},"a":["错误"],"e":"拖鞋凉鞋露出脚面，药液泼溅或玻璃破碎时无法防护，还容易打滑，须穿包脚防滑的鞋进实验室。"},{"id":1180,"c":"化学安全","l":"II","t":2,"q":"可燃与易燃液体以闪燃（闪点）温度作为区分标准。凡闪燃温度在45摄氏度以下的为易燃液体,闪燃温度在45摄氏度以上的为可燃液体。","o":{},"a":["正确"],"e":"闪点是液体表面蒸气遇火闪燃的最低温度，闪点45℃以下为易燃液体，45℃以上为可燃液体。"},{"id":1181,"c":"化学安全","l":"II","t":2,"q":"开启易挥发液体试剂的瓶塞时,瓶口不能对着眼睛","o":{},"a":["正确"],"e":"瓶内蒸气压大，开塞瞬间气液可能喷出，对着眼睛会造成化学伤，应瓶口朝外、缓慢开启。"},{"id":1182,"c":"化学安全","l":"II","t":2,"q":"开启氨水、浓盐酸瓶应该在通风櫉中进行。","o":{},"a":["正确"],"e":"氨水和浓盐酸挥发出强烈刺激性气体，在通风橱中开启可由排风带走，避免吸入和污染室内空气。"},{"id":1183,"c":"化学安全","l":"II","t":2,"q":"开启氨水、HCl 瓶应该在通风櫉中进行","o":{},"a":["正确"],"e":"氨水、盐酸挥发出的刺激性气体在通风橱内开启会被排走，可防止呛人和腐蚀呼吸道。"},{"id":1184,"c":"化学安全","l":"II","t":2,"q":"剧毒药品如汞盐、镉盐、铅盐等及易制毒品药品,还有菌种应该专人、专库管理,做到帐物相符","o":{},"a":["正确"],"e":"剧毒品和菌种必须专人专库保管、双锁双账，做到账物相符，才能防止流失、被盗和误用。"},{"id":1185,"c":"化学安全","l":"II","t":2,"q":"剧毒物品要按照“五双制”规定严格管理。“五双制”是指:双人保管、双锁、双账、双人领取、双人使用","o":{},"a":["正确"],"e":"五双即双人保管、双锁、双账、双人领取、双人使用，环环互相监督，确保剧毒品全程受控。"},{"id":1186,"c":"化学安全","l":"II","t":2,"q":"剧毒物品可以私自转让、赠送、买卖","o":{},"a":["错误"],"e":"剧毒品属国家管制物品，私自转让、赠送、买卖违法，还会造成流失危害，必须按规定审批调拨。"},{"id":1187,"c":"化学安全","l":"II","t":2,"q":"剧毒物品的库房应使用密闭防护措施。","o":{},"a":["错误"],"e":"错在密闭：库房应通风良好，防止有毒蒸气积聚，需要密闭的是盛装容器而不是整个库房。"},{"id":1188,"c":"化学安全","l":"II","t":2,"q":"剧毒品在取出实验使用量后可以不立即存入保险柜","o":{},"a":["错误"],"e":"取用后剩余剧毒品须立即放回保险柜并登记，随手放置容易丢失、被盗或被误用。"},{"id":1189,"c":"化学安全","l":"II","t":2,"q":"剧毒化学品实验使用登记表应与试剂瓶一起放在保险柜中,在剧毒物品使用完或残存物处理完毕后与空瓶一起交回老师。","o":{},"a":["正确"],"e":"登记表随瓶同柜保存，用完或残液处理完后连同空瓶交回老师，可保证全程可追溯、账物一致。"},{"id":1190,"c":"化学安全","l":"II","t":2,"q":"剧毒化学品除可少量用于生产灭鼠药以外,禁止用于生产其他可能进入人民日常生活的化学产品和日用化学品。","o":{},"a":["错误"],"e":"剧毒品禁止用于生产灭鼠药、杀虫剂等可能进入日常生活的化学品，题中可少量生产灭鼠药的说法不成立。"},{"id":1191,"c":"化学安全","l":"II","t":2,"q":"酒精灯内的酒精量最多可加七分满","o":{},"a":["正确"],"e":"装得太满，点燃后酒精受热膨胀易溢出引起燃烧，一般不超过容积的三分之二到七分满，安全又够用。"},{"id":1192,"c":"化学安全","l":"II","t":2,"q":"久藏的乙醚因可能存在过氧化物,为了预防爆炸,在蒸发时必须有人值守,不能完全蒸干。","o":{},"a":["正确"],"e":"久置乙醚会生成过氧化物，受热或蒸干时过氧化物浓缩，摩擦撞击即爆炸，故蒸发须有人值守且不能蒸干。"},{"id":1193,"c":"化学安全","l":"II","t":2,"q":"久藏的乙醚因可能存在过氧化物,为了爆炸,在蒸发时必须有人值守,不能完全蒸干","o":{},"a":["正确"],"e":"久藏乙醚中的过氧化物在蒸发浓缩时极易爆炸，必须有人值守、留有残液，不能完全蒸干。"},{"id":1194,"c":"化学安全","l":"II","t":2,"q":"久藏的乙醚使用前应该除去其中可能存在的过氧化物。","o":{},"a":["正确"],"e":"用前应检验并用硫酸亚铁等还原性溶液洗涤除去过氧化物，避免蒸馏浓缩时发生爆炸。"},{"id":1195,"c":"化学安全","l":"II","t":2,"q":"经口的 Hg、As、Pb 等急性中毒会引起牙龈出血、牙齿松动、恶心、呕吐、腹痛、腹泻等症状。","o":{},"a":["正确"],"e":"经口摄入汞、砷、铅会引起牙龈出血、牙齿松动，以及恶心呕吐、腹痛腹泻等胃肠道症状。"},{"id":1196,"c":"化学安全","l":"II","t":2,"q":"进行化学类实验,应带防护镜。","o":{},"a":["正确"],"e":"防护镜能挡住飞溅的酸液、试剂和玻璃碎屑，是保护眼睛免受化学伤和异物伤的基本措施。"},{"id":1197,"c":"化学安全","l":"II","t":2,"q":"进行高温操作时,必须佩戴防高温手套。","o":{},"a":["正确"],"e":"高温物件和热辐射容易造成烫伤，戴防高温手套可隔热，避免手部直接接触而被灼伤。"},{"id":1198,"c":"化学安全","l":"II","t":2,"q":"金属钠、钾可以存放在水中,以避免与空气接触。","o":{},"a":["错误"],"e":"钠、钾遇水剧烈反应放出氢气和大量热，会燃烧甚至爆炸，必须浸在煤油中隔绝空气和水分。"},{"id":1199,"c":"化学安全","l":"II","t":2,"q":"金属锂、钠、钾及金属氢化物要注意使用和保存,尤其不能与水直接接触","o":{},"a":["正确"],"e":"这些物质遇水反应放出氢气并放热，容易引起燃烧爆炸，使用和保存都要严格防潮防水。"},{"id":1200,"c":"化学安全","l":"II","t":2,"q":"将醇液直接加入到室温以下的硫酸-硝酸的混酸中不会引起爆炸,而加入到未冷却的硫酸-硝酸的混酸中会引起爆炸。","o":{},"a":["错误"],"e":"无论混酸是否冷却，醇与强氧化性的硫酸-硝酸混酸混合都会剧烈氧化放热，冷却并不能保证安全。"},{"id":1201,"c":"化学安全","l":"II","t":2,"q":"将醇液直接加入到冷却到室温以下的硫酸-硝酸的混酸中不会引起爆炸, 而加入到未冷却的硫酸-硝酸的混酸中会引起爆炸。","o":{},"a":["错误"],"e":"把醇加入强氧化性混酸会剧烈放热甚至爆炸，冷却到室温也不能避免，所以题述判断不成立。"},{"id":1202,"c":"化学安全","l":"II","t":2,"q":"碱灼伤时,必须先用大量流水冲洗至皂样物质消失,然后可用1%～2%醋酸或3%硼酸溶液进一步冲洗。","o":{},"a":["正确"],"e":"先用大量流水冲到皂样感消失，再用1%～2%醋酸或3%硼酸弱酸中和残余碱，减轻继续腐蚀。"},{"id":1203,"c":"化学安全","l":"II","t":2,"q":"碱灼伤皮肤,在现场立即用大量清水冲洗至皂样物质消失为止,然后可用1％～2％醋酸或3％硼酸溶液进一步冲洗。对Ⅱ、Ⅲ度灼伤可用2％醋酸湿敷后,再按一般灼伤进行创面处理和治疗。","o":{},"a":["正确"],"e":"立即大量清水冲至皂样物质消失，再用稀醋酸或硼酸中和，Ⅱ、Ⅲ度灼伤湿敷后按一般灼伤处理。"},{"id":1204,"c":"化学安全","l":"II","t":2,"q":"碱灼伤后应立即用大量水洗,再以1%-2%硼酸液洗,最后用水洗。","o":{},"a":["正确"],"e":"先水冲稀释去除碱液，再用1%～2%硼酸中和残余碱，最后用水冲掉中和产物，顺序正确。"},{"id":1205,"c":"化学安全","l":"II","t":2,"q":"甲苯的危害性是刺激性。","o":{},"a":["错误"],"e":"甲苯不只刺激性，主要表现为麻醉中枢神经和损害造血系统，长期接触可致白细胞减少。"},{"id":1206,"c":"化学安全","l":"II","t":2,"q":"加热试管内物质时,管口应朝向自己,以便看清楚反应过程。","o":{},"a":["错误"],"e":"加热时液体可能暴沸喷出，管口对人会烫伤面部和眼睛，应管口斜向无人处并微开管口。"},{"id":1207,"c":"化学安全","l":"II","t":2,"q":"机械温控冰箱可以存放易燃易爆的化学品。","o":{},"a":["错误"],"e":"机械温控器动作时产生电火花，易燃蒸气达到爆炸浓度遇火花即爆，必须用防爆冰箱存放。"},{"id":1208,"c":"化学安全","l":"II","t":2,"q":"活泼金属钠,钾等不要与水接触或暴露在空气中,应保存在煤油内,取用时要用镊子。","o":{},"a":["正确"],"e":"煤油能隔绝空气和水分，用镊子取用可避免手上汗液接触金属引起反应和灼伤。"},{"id":1209,"c":"化学安全","l":"II","t":2,"q":"回收不便时可以将实验室废弃物掩埋处理。","o":{},"a":["错误"],"e":"掩埋会污染土壤和地下水，不知成分的废物还可能反应放热，必须分类收集交有资质单位处置。"},{"id":1210,"c":"化学安全","l":"II","t":2,"q":"黄磷是自燃点很低、在空气中能很快氧化并自燃的固体。遇黄磷火灾时,首先应切断火势蔓延途径,控制燃烧范围,对着火的黄磷应用低压水或雾状水扑救。高压直流水冲击会引起黄磷飞溅,导致火灾扩大。黄磷熔融液体流淌时应用泥土、沙袋等筑堤拦截,并用雾状水冷却。对磷块和冷却后已固化的黄磷,应用钳子钳人贮水容器中。","o":{},"a":["正确"],"e":"黄磷自燃点低，用低压水或雾状水覆盖降温灭火，高压直流水会使磷飞溅扩大火势，熔磷用沙土筑堤拦截。"},{"id":1211,"c":"化学安全","l":"II","t":2,"q":"化学易燃物品分六类:可燃、易燃液体,可燃、易燃固体,可燃、助燃气体,自燃物质,遇水燃烧物质和氧化剂。此外还有爆炸物质,放射性物质、剧毒和腐蚀物质,这四类均不属于防火管理的内容,但列入危险品安全管理。","o":{},"a":["正确"],"e":"化学易燃物品按形态和燃烧特性分为六类，爆炸、放射性、剧毒、腐蚀品另列入危险品安全管理。"},{"id":1212,"c":"化学安全","l":"II","t":2,"q":"化学易燃物品发生火灾时,应该立即用最方便、马上能实现的方法灭火。","o":{},"a":["错误"],"e":"灭火要针对物质性质选灭火剂，遇水燃烧物用水反而加剧火势，盲目图方便会扩大事故。"},{"id":1213,"c":"化学安全","l":"II","t":2,"q":"化学危险物品,是指中华人民共和国国家标准 GB-86《危险货物分类与品名编号》规定的分类标准中的爆炸品、压缩气体和液化气体、易燃液体、易燃固体、自燃物品和遇湿易燃物品、氧化剂和有机过氧化物、毒害品和腐蚀品七大类。","o":{},"a":["正确"],"e":"按GB-86分类，危险货物包括爆炸品、气体、易燃液体、易燃固体、自燃及遇湿易燃物品、氧化剂和有机过氧化物、毒害和腐蚀品七类。"},{"id":1214,"c":"化学安全","l":"II","t":2,"q":"化学品仓库面积大时,为确保照明效果,可以安装碘钨灯。","o":{},"a":["错误"],"e":"碘钨灯工作温度高、易烤燃物品，仓库应使用防爆防尘的冷光源灯具并远离可燃物。"},{"id":1215,"c":"化学安全","l":"II","t":2,"q":"化学品安全技术说明书国际上称作化学品安全信息卡, 简称 MSDS或 CSDS","o":{},"a":["正确"],"e":"化学品安全技术说明书国际上称作化学品安全信息卡，简称MSDS或CSDS，用于说明其危害和防护要求。"},{"id":1216,"c":"化学安全","l":"II","t":2,"q":"化学品安全技术说明书（MSDS）为化学物质及其制品提供了有关安全、健康和环境保护方面的信息,在使用化学品前应仔细阅读,掌握所使用化学品的个体防护方法、应急处置措施等。","o":{},"a":["正确"],"e":"MSDS载明危害、防护和应急处置信息，使用前阅读可掌握个体防护方法和急救措施，降低风险。"},{"id":1217,"c":"化学安全","l":"II","t":2,"q":"化学泡沫灭火器可扑救一般油质品、油脂等的火灾,但不能扑救醇、酯、醚、酮等引起的火灾和带电设备的火灾","o":{},"a":["正确"],"e":"化学泡沫覆盖油面隔绝空气，但遇醇、酯、醚、酮等水溶性液体泡沫会被破坏，且导电不能用于带电设备。"},{"id":1218,"c":"化学安全","l":"II","t":2,"q":"化学类实验室原则上不得使用明火电炉。确须使用明火电炉进行实验的,须向学院申报,经审核批准备案后,方可使用。","o":{},"a":["正确"],"e":"明火电炉易引燃试剂蒸气，故原则上禁用，确需使用须向学院申报、审批备案并落实防护措施。"},{"id":1219,"c":"化学安全","l":"II","t":2,"q":"化学废液要回收并集中存放,不可倒入下水道。","o":{},"a":["正确"],"e":"废液倒入下水道会腐蚀管道、污染水体，须分类回收、集中存放并贴标签，交有资质单位处理。"},{"id":1220,"c":"化学安全","l":"II","t":2,"q":"化（实）验室有哪些火灾危险性 ①一般都有化学试剂,虽数量不大,但种类繁多。不利于安全储存保管,一旦发生火灾,是扩大蔓延的介质; ②以焦炉煤气、液化石油气为燃料的,由于法兰接头,仪表、灶具跑气,遇明火易发生爆燃; ③在化（实）验过程中,由于使用易燃液体试剂,能散发出可燃气体,达到其爆炸浓度,遇明火能发生爆炸; ④将电炉、焙烧炉、电烘干箱等放在可燃的基座上或靠近可燃物,以及使用不慎,有引起火灾的可能; ⑤电气设备类型与使用环境不相符合,或因年久失修设备绝缘老化、腐蚀、会形成短","o":{},"a":["正确"],"e":"试剂种类繁多、燃气易泄漏、易燃蒸气遇火爆炸、加热设备靠近可燃物、电气老化短路，都是实验室火灾常见诱因。"},{"id":1221,"c":"化学安全","l":"II","t":2,"q":"化（实）验室发生火灾时应该:①及时打119电话和保卫处电话报火警,报警时一定要讲清着火对象的性质;同时切断电源、燃气管道,组织扑救火灾; ②在技术人员指导下,疏散未燃烧的物品,搬运时要注意轻拿轻放;对易燃、易爆、剧毒和腐蚀性物质和重要资料,要放在安全地点,并派专人看守; ③消防队到达火场后,有关技术人员要及时向灭火指挥员介绍情况,以便正确地实施扑救。","o":{},"a":["正确"],"e":"先报警并讲清着火性质，同时断电断气、组织扑救、疏散危险品，消防队到场后主动介绍情况配合扑救。"},{"id":1222,"c":"化学安全","l":"II","t":2,"q":"呼吸防护面具有大小之分,应该选用符合自己脸型且通过密合度测试的呼吸防护具","o":{},"a":["正确"],"e":"面具不密合就会漏气，应按脸型选型并做密合度测试，才能保证防护有效。"},{"id":1223,"c":"化学安全","l":"II","t":2,"q":"呼吸防护面具的选用应以等级最高者为最优先的考量。","o":{},"a":["错误"],"e":"应按危害种类和浓度选匹配的防护等级，等级过高闷热费力反而影响作业，并非越高越好。"},{"id":1224,"c":"化学安全","l":"II","t":2,"q":"烘箱、微波炉、电磁炉、饮水加热器、灭菌锅等高热能电器设备的放置地点应远离易燃、易爆物品。同时,规范操作,避免饮水加热器、灭菌锅等无水干烧。","o":{},"a":["正确"],"e":"烘箱、灭菌锅等功率大、温升高，靠近易燃物容易烤燃，无水干烧还会烧毁设备甚至起火。"},{"id":1225,"c":"化学安全","l":"II","t":2,"q":"含碱性洗涤剂的水可以清洗掉水果蔬菜表面的农药。","o":{},"a":["正确"],"e":"多数有机磷农药在碱性条件下易分解，用含碱性洗涤剂的水浸泡搓洗可去除果蔬表面的残留农药。"},{"id":1226,"c":"化学安全","l":"II","t":2,"q":"过氧化物、高氯酸盐、叠氮铅、乙炔铜、三硝基甲苯等属于易爆物质,受震或受热可发生热爆炸。","o":{},"a":["正确"],"e":"过氧化物、高氯酸盐、叠氮铅、乙炔铜、TNT等对震动和热敏感，受撞击或受热会迅速分解发生爆炸。"},{"id":1227,"c":"化学安全","l":"II","t":2,"q":"过期的、不知名的固体化
