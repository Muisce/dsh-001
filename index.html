<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6efd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<title>化学实验室安全题库 · 2000题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6efd'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%E5%AE%89%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f8; --card:#fff; --ink:#1b2230; --sub:#6b7486; --line:#e5e9f0;
  --blue:#0b6efd; --green:#12a150; --red:#e5484d; --amber:#f5a623; --shadow:0 2px 12px rgba(20,40,80,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* 老版 X5/WebView 不支持 flex gap 与 inset 的降级间距 */
@supports not (gap:8px){
  .stats>*,.chips>*,.row>*,.opts>*,.grid>*,.legend>*,.selfrow>*,.navbar .in>*{margin:4px;}
}
@supports not (inset:0){.mask{top:0;left:0;right:0;bottom:0;}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}
.wrap{max-width:720px;margin:0 auto;min-height:100vh;position:relative;}
.screen{display:none;padding:14px 14px 90px;}
.screen.on{display:block;}
.hd{position:sticky;top:0;z-index:20;background:rgba(242,244,248,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:10px 0 8px;margin:-14px -14px 12px;padding-left:14px;padding-right:14px;
  border-bottom:1px solid var(--line);}
.hd-row{display:flex;align-items:center;gap:10px;}
.hd h1{font-size:17px;margin:0;font-weight:700;}
.hd .sub{font-size:12px;color:var(--sub);margin-top:2px;}
.btn{background:var(--blue);color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;}
.btn:active{opacity:.8;}
.btn.ghost{background:#e8eefc;color:var(--blue);}
.btn.gray{background:#eceff4;color:#445;}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#eceff4;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.icon-btn.fav{background:#fff3d6;color:#e09a00;}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
.hero{background:linear-gradient(135deg,#0b6efd,#5a9bff);color:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 8px 24px rgba(11,110,253,.28);}
.hero h2{margin:0 0 6px;font-size:22px;}
.hero p{margin:0;opacity:.92;font-size:13px;line-height:1.6;}
.stats{display:flex;gap:8px;margin-top:16px;}
.stat{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 4px;text-align:center;}
.stat b{display:block;font-size:20px;}
.stat span{font-size:11px;opacity:.9;}
.sec-t{font-size:14px;font-weight:700;margin:18px 2px 10px;color:#334;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 13px;border-radius:10px;background:#e8eefc;color:var(--blue);font-size:13px;font-weight:600;border:1px solid transparent;}
.chip.sel{background:var(--blue);color:#fff;}
.chip.plain{background:#eceff4;color:#445;}
.chip.plain.sel{background:#334155;color:#fff;}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
.label{font-size:12px;color:var(--sub);margin:0 0 6px 2px;}
.progress-line{height:8px;border-radius:8px;background:#e8ecf2;overflow:hidden;margin-top:6px;}
.progress-line>i{display:block;height:100%;background:linear-gradient(90deg,#12a150,#5cd6a0);width:0;transition:width .25s;}
/* quiz */
.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.qnum{font-size:13px;color:var(--sub);font-weight:600;}
.tags{display:flex;gap:6px;}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:#eef2f8;color:#556;}
.qtext{font-size:17px;line-height:1.7;font-weight:600;white-space:pre-wrap;word-break:break-word;}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px;line-height:1.5;text-align:left;}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#eef2f8;color:#556;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.opt.sel{border-color:var(--blue);background:#f0f6ff;}
.opt.sel .k{background:var(--blue);color:#fff;}
.opt.right{border-color:var(--green);background:#eafaf1;}
.opt.right .k{background:var(--green);color:#fff;}
.opt.wrong{border-color:var(--red);background:#fdeeee;}
.opt.wrong .k{background:var(--red);color:#fff;}
.opt.dis{pointer-events:none;}
.fill{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;margin-top:8px;background:#fff;}
.blanks{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.ans-box{margin-top:14px;padding:13px;border-radius:12px;background:#f7f9fc;border:1px solid var(--line);font-size:14px;line-height:1.7;}
.ans-box .ok{color:var(--green);font-weight:700;}
.ans-box .no{color:var(--red);font-weight:700;}
.ans-box .lbl{color:var(--sub);font-size:12px;}
.selfrow{display:flex;gap:8px;margin-top:12px;}
.selfrow .btn{flex:1;}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:8px max(14px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));}
.navbar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;}
.navbar .btn{flex:1;}
/* overview */
.mask{position:fixed;inset:0;background:rgba(10,18,32,.5);z-index:50;display:none;}
.mask.on{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:18px 18px 0 0;
  max-height:82vh;transform:translateY(100%);transition:transform .22s;display:flex;flex-direction:column;}
.sheet.on{transform:translateY(0);}
.sheet-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);}
.sheet-h h3{margin:0;font-size:16px;}
.grid{overflow-y:auto;padding:12px 14px 30px;display:grid;grid-template-columns:repeat(8,1fr);gap:7px;}
@media(max-width:400px){.grid{grid-template-columns:repeat(7,1fr);gap:6px;}}
.cell{position:relative;aspect-ratio:1;border-radius:9px;background:#eceff4;color:#5a6474;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.cell.ok{background:#dff6e9;color:#0b7a3b;}
.cell.no{background:#fde3e4;color:#c2282d;}
.cell.cur{outline:2px solid var(--blue);outline-offset:1px;}
.cell .dot{position:absolute;top:3px;right:4px;font-size:9px;color:#e09a00;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:8px;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:3px;}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(20,26,38,.9);color:#fff;
  padding:9px 16px;border-radius:20px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.on{opacity:1;}
.empty{text-align:center;color:var(--sub);padding:50px 10px;font-size:14px;}
.mini{font-size:12px;color:var(--sub);}
a{color:var(--blue);}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ HOME ============ -->
<div class="screen on" id="s-home">
  <div class="hero">
    <h2>化学实验室安全题库</h2>
    <p>依据北京大学出版社《化学实验室安全知识教程》· 共 2000 题<br>支持总览切换 · 收藏 · 离线缓存 · 进度自动保存</p>
    <div class="stats">
      <div class="stat"><b id="h-total">2000</b><span>总题数</span></div>
      <div class="stat"><b id="h-done">0</b><span>已作答</span></div>
      <div class="stat"><b id="h-fav">0</b><span>已收藏</span></div>
      <div class="stat"><b id="h-pct">0%</b><span>正确率</span></div>
    </div>
    <div class="progress-line"><i id="h-bar"></i></div>
  </div>

  <div class="sec-t">选择练习方式</div>
  <div class="card">
    <div class="chips" id="modes">
      <div class="chip sel" data-mode="seq">顺序练习</div>
      <div class="chip" data-mode="chap">按章练习</div>
      <div class="chip" data-mode="type">按题型练</div>
      <div class="chip" data-mode="rand">随机练习</div>
      <div class="chip" data-mode="fav">收藏练习</div>
      <div class="chip" data-mode="wrong">错题练习</div>
    </div>
  </div>

  <div class="card" id="filterBox" style="display:none">
    <p class="label" id="filterLabel">选择章节</p>
    <div class="chips" id="filterChips"></div>
  </div>

  <div class="row" style="margin-top:4px">
    <button class="btn" id="startBtn">开始练习</button>
    <button class="btn ghost" id="resumeBtn" style="display:none">继续上次</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn gray" id="reviewBtn">浏览全部题目</button>
    <button class="btn gray" id="resetBtn">清除进度</button>
  </div>

  <div class="sec-t">答题设置</div>
  <div class="card">
    <div class="row" style="align-items:center">
      <div><div style="font-size:14px;font-weight:600">显示解析</div><div class="mini">作答后立即显示答案与解析</div></div>
      <button class="icon-btn" id="optExplain" style="margin-left:auto">✓</button>
    </div>
    <div class="row" style="align-items:center;margin-top:12px">
      <div><div style="font-size:14px;font-weight:600">自动跳下一题</div><div class="mini">答对后自动进入下一题</div></div>
      <button class="icon-btn" id="optAuto" style="margin-left:auto"></button>
    </div>
  </div>
  <p class="mini" style="text-align:center;margin-top:18px;line-height:1.7">
    进度、收藏保存在本机浏览器，无需登录 · 支持 15 人同时独立使用<br>
    <a href="#" id="aboutLink">关于题库 / 缓存说明</a>
  </p>
</div>

<!-- ============ QUIZ ============ -->
<div class="screen" id="s-quiz">
  <div class="hd">
    <div class="hd-row">
      <button class="icon-btn" id="backBtn">‹</button>
      <div style="flex:1;min-width:0">
        <h1 id="q-title">答题中</h1>
        <div class="sub" id="q-sub">—</div>
      </div>
      <button class="icon-btn" id="favBtn">☆</button>
      <button class="icon-btn" id="overBtn">▦</button>
    </div>
  </div>
  <div class="card">
    <div class="qmeta">
      <span class="qnum" id="q-num">第 1 / 2000 题</span>
      <span class="tags"><span class="tag" id="q-type">单选题</span><span class="tag" id="q-chap">第1章</span></span>
    </div>
    <div class="qtext" id="q-text"></div>
    <div class="opts" id="q-opts"></div>
    <div class="blanks" id="q-blanks" style="display:none"></div>
    <div id="q-self" style="display:none">
      <textarea class="fill" id="q-note" rows="4" style="font-size:16px" placeholder="在此写下你的答案（可选，仅自己可见）"></textarea>
      <div class="selfrow">
        <button class="btn ghost" id="selfRight">我答对了</button>
        <button class="btn gray" id="selfWrong">答错了 / 不会</button>
      </div>
    </div>
    <div class="ans-box" id="q-ans" style="display:none"></div>
  </div>
  <div class="card" style="padding:10px">
    <div class="progress-line" style="margin:0"><i id="q-bar"></i></div>
    <div class="mini" style="text-align:center;margin-top:6px" id="q-tip">点击选项作答</div>
  </div>
</div>

<!-- ============ OVERVIEW SHEET ============ -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h">
    <h3>题目总览 <span class="mini" id="ov-stat"></span></h3>
    <div class="row" style="margin:8px 0 4px">
      <button class="btn gray sm" id="ov-prev">上一页</button>
      <span class="mini" id="ov-page" style="text-align:center;line-height:30px">1 / 1</span>
      <button class="btn gray sm" id="ov-next">下一页</button>
    </div>
    <div class="legend">
      <span><i style="background:#eceff4"></i>未答</span>
      <span><i style="background:#dff6e9"></i>正确</span>
      <span><i style="background:#fde3e4"></i>错误</span>
      <span><i style="background:#f7d98a"></i>已收藏</span>
    </div>
  </div>
  <div class="grid" id="ov-grid"></div>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="bank.js"></script>
<script>
(function(){
'use strict';
var BANK = window.BANK || [];
var CH = {1:'绪论',2:'消防安全',3:'消防设施与器材',4:'危险化学品',5:'用电安全',
  6:'压力容器安全',7:'辐射安全与防护',8:'基本安全操作',9:'事故防范与应急',10:'废弃物处理'};
var TN = {s:'单选题',m:'多选题',j:'判断题',b:'填空题',x:'解答题'};
var PKEY='dsh001_prog_v1', SKEY='dsh001_sess_v1', OKEY='dsh001_opt_v1';
var $ = function(id){return document.getElementById(id);};
var storeOK = true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){storeOK=false;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){storeOK=false;return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){storeOK=false;return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

var P = {}, S = null, OPT = {explain:true, auto:false};
try{var p=lsGet(PKEY); if(p) P=JSON.parse(p)||{};}catch(e){P={};}
try{var o=lsGet(OKEY); if(o){var oo=JSON.parse(o); if(oo) OPT=oo;}}catch(e){}
var BYID = {};
for(var i=0;i<BANK.length;i++){ BYID[BANK[i].id]=BANK[i]; }

function saveP(){lsSet(PKEY,JSON.stringify(P));}
function saveS(){if(S) lsSet(SKEY,JSON.stringify(S));}
function toast(msg){var t=$('toast');t.textContent=msg;t.className='toast on';clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},1500);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- home ---------- */
var MODE='seq', FILTER='all';
var FILTERS={
  chap:[['all','全部章节']].concat((function(){var a=[];for(var i=1;i<=10;i++)a.push([i,'第'+i+'章 '+CH[i]]);return a;})()),
  type:[['all','全部题型'],['s','单选题'],['m','多选题'],['j','判断题'],['b','填空题'],['x','解答题']]
};
function renderHome(){
  var done=0,right=0,fav=0;
  for(var k in P){if(!P.hasOwnProperty(k))continue;var r=P[k];if(r.v){done++;if(r.ok)right++;}if(r.f)fav++;}
  $('h-total').textContent=BANK.length;
  $('h-done').textContent=done;
  $('h-fav').textContent=fav;
  $('h-pct').textContent=(done?Math.round(right/done*100):0)+'%';
  $('h-bar').style.width=(done/BANK.length*100)+'%';
  var canResume=!!lsGet(SKEY);
  $('resumeBtn').style.display=canResume?'':'none';
  $('optExplain').textContent=OPT.explain?'✓':'';
  $('optAuto').textContent=OPT.auto?'✓':'';
}
function renderFilter(){
  var box=$('filterBox');
  if(MODE==='chap'||MODE==='type'){
    box.style.display='';
    $('filterLabel').textContent=MODE==='chap'?'选择章节':'选择题型';
    var arr=FILTERS[MODE], html='';
    for(var i=0;i<arr.length;i++){
      html+='<div class="chip plain'+(String(FILTER)===String(arr[i][0])?' sel':'')+'" data-v="'+arr[i][0]+'">'+arr[i][1]+'</div>';
    }
    $('filterChips').innerHTML=html;
    var chips=$('filterChips').children;
    for(var j=0;j<chips.length;j++){chips[j].onclick=function(){FILTER=this.getAttribute('data-v');renderFilter();};}
  }else{box.style.display='none';}
}
(function bindHome(){
  var ms=$('modes').children;
  for(var i=0;i<ms.length;i++){ms[i].onclick=function(){
    for(var j=0;j<ms.length;j++)ms[j].className='chip';
    this.className='chip sel';MODE=this.getAttribute('data-mode');FILTER='all';renderFilter();
  };}
  $('startBtn').onclick=function(){startQuiz(MODE,false);};
  $('resumeBtn').onclick=function(){resumeQuiz();};
  $('reviewBtn').onclick=function(){startQuiz('all',false,true);};
  $('resetBtn').onclick=function(){
    ask('清除进度','将清除本机所有答题记录、收藏和进度（不可恢复），确定继续？',function(ok){
      if(ok){P={};saveP();lsDel(SKEY);renderHome();toast('进度已清除');}
    });
  };
  $('optExplain').onclick=function(){OPT.explain=!OPT.explain;lsSet(OKEY,JSON.stringify(OPT));renderHome();};
  $('optAuto').onclick=function(){OPT.auto=!OPT.auto;lsSet(OKEY,JSON.stringify(OPT));renderHome();};
  $('aboutLink').onclick=function(e){e.preventDefault();about();};
})();

function ask(title,msg,cb){
  var box=document.createElement('div');
  box.innerHTML='<div class="mask" style="display:block;z-index:90"><div style="position:absolute;left:12%;top:32%;width:76%;background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.2)">'+
    '<div style="font-size:16px;font-weight:700;margin-bottom:8px">'+title+'</div>'+
    '<div style="font-size:14px;color:#556;line-height:1.6">'+msg+'</div>'+
    '<div class="row" style="margin-top:16px"><button class="btn gray" id="__no">取消</button><button class="btn" id="__yes">确定</button></div></div></div>';
  document.body.appendChild(box);
  box.querySelector('#__no').onclick=function(){document.body.removeChild(box);cb(false);};
  box.querySelector('#__yes').onclick=function(){document.body.removeChild(box);cb(true);};
}
function about(){
  ask('关于 / 缓存说明',
    '题库共 2000 题，依据北京大学出版社《化学实验室安全知识教程》编写。<br><br>'+
    '• 进度与收藏保存在当前浏览器的 localStorage，不上传服务器。<br>'+
    '• 页面与数据通过 Service Worker 缓存到本地，首次打开后即使断网也能进入（缓存有效期按浏览器策略，通常约一年）。<br>'+
    '• 建议在手机浏览器“添加到主屏幕”，即可像 App 一样一键打开。<br>'+
    '• 具体数值请以教材与现行国标为准。',
    function(){});
}

/* ---------- quiz ---------- */
function buildList(mode,filter,review){
  var arr=[];
  if(mode==='all'||review){for(var i=0;i<BANK.length;i++)arr.push(BANK[i].id);return arr;}
  if(mode==='seq'){for(var i2=0;i2<BANK.length;i2++)arr.push(BANK[i2].id);return arr;}
  if(mode==='rand'){var ids=[];for(var i3=0;i3<BANK.length;i3++)ids.push(BANK[i3].id);return shuffle(ids);}
  if(mode==='fav'){for(var k in P){if(P.hasOwnProperty(k)&&P[k].f&&BYID[k])arr.push(Number(k));}return shuffle(arr);}
  if(mode==='wrong'){for(var k2 in P){if(P.hasOwnProperty(k2)&&P[k2].v&&!P[k2].ok&&BYID[k2])arr.push(Number(k2));}return shuffle(arr);}
  if(mode==='chap'){for(var i4=0;i4<BANK.length;i4++)if(filter==='all'||BANK[i4].ch===Number(filter))arr.push(BANK[i4].id);return arr;}
  if(mode==='type'){for(var i5=0;i5<BANK.length;i5++)if(filter==='all'||BANK[i5].t===filter)arr.push(BANK[i5].id);return arr;}
  return arr;
}
function startQuiz(mode,filter,review){
  var ids=buildList(mode,filter,review);
  if(!ids.length){toast(mode==='fav'?'还没有收藏的题目':mode==='wrong'?'还没有错题':'没有符合条件的题目');return;}
  S={ids:ids,idx:0,mode:mode,review:!!review,title:mode==='fav'?'收藏练习':mode==='wrong'?'错题练习':mode==='all'?'浏览模式':'答题中'};
  saveS();showScreen('s-quiz');renderQ();
}
function resumeQuiz(){
  var raw=lsGet(SKEY);
  if(!raw){toast('没有可继续的进度');return;}
  try{S=JSON.parse(raw);}catch(e){S=null;}
  if(!S||!S.ids||!S.ids.length){toast('进度已失效');return;}
  showScreen('s-quiz');renderQ();
}
function showScreen(id){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++)ss[i].className='screen';
  $(id).className='screen on';window.scrollTo(0,0);
}
function statusOf(id){return P[id]?(P[id].v?(P[id].ok?1:2):0):0;} /* 0未答 1对 2错 */
function isFav(id){return !!(P[id]&&P[id].f);}
function renderQ(){
  if(!S)return;
  var q=BYID[S.ids[S.idx]];
  if(!q){toast('题目不存在');return;}
  $('q-title').textContent=S.title;
  $('q-num').textContent='第 '+(S.idx+1)+' / '+S.ids.length+' 题  ·  '+q.id;
  $('q-sub').textContent=(S.review?'浏览模式':'答题中')+'　已答 '+answeredInList()+' / '+S.ids.length;
  $('q-type').textContent=TN[q.t]||'题目';
  $('q-chap').textContent='第'+q.ch+'章 '+(CH[q.ch]||'');
  $('q-text').textContent=q.q;
  $('favBtn').textContent=isFav(q.id)?'★':'☆';
  $('favBtn').className='icon-btn'+(isFav(q.id)?' fav':'');
  var box=$('q-opts'), blanks=$('q-blanks'), self=$('q-self'), ans=$('q-ans');
  box.innerHTML='';blanks.innerHTML='';ans.innerHTML='';ans.style.display='none';
  blanks.style.display='none';self.style.display='none';
  box.style.display='';
  var rec=P[q.id]||{}, answered=!!rec.v;
  var letters=['A','B','C','D','E'];
  if(q.t==='s'||q.t==='m'||q.t==='j'){
    var opts=q.o||[];
    var chosen=(rec.pick||'').split('');
    for(var i=0;i<opts.length;i++){
      (function(k){
        var d=document.createElement('div');d.className='opt';
        /* 判断题用选项文字本身作为键，其余题型用字母 */
        var key=(q.t==='j')?String(opts[k]):(letters[k]||String(k+1));
        d.innerHTML='<span class="k">'+esc(key)+'</span><span>'+esc(q.t==='j'?('选项 '+(k+1)):opts[k])+'</span>';
        if(answered){
          d.className+=' dis';
          var correct=(q.a||'').indexOf(key)>=0;
          var picked=chosen.indexOf(key)>=0;
          if(correct)d.className+=' right';
          else if(picked)d.className+=' wrong';
        }else if(chosen.indexOf(key)>=0){d.className+=' sel';}
        d.onclick=function(){pick(q,key);};
        box.appendChild(d);
      })(i);
    }
    if(answered)showAns(q,rec);
  }else if(q.t==='b'){
    box.style.display='none';blanks.style.display='';
    var count=(q.q.match(/____/g)||[]).length||(q.a||[]).length;
    var pre=(rec.pick||'').split('\u0001');
    for(var b=0;b<count;b++){
      var inp=document.createElement('input');inp.className='fill';inp.placeholder='第 '+(b+1)+' 空';
      inp.value=pre[b]||'';inp.setAttribute('data-b',b);
      if(answered)inp.disabled=true;
      blanks.appendChild(inp);
    }
    if(answered)showAns(q,rec);
  }else{ /* short */
    box.style.display='none';self.style.display='';
    $('q-note').value=rec.note||'';
    if(answered)showAns(q,rec);
  }
  $('q-bar').style.width=((S.idx+1)/S.ids.length*100)+'%';
  $('q-tip').textContent=S.review?'浏览模式：可自由切换、收藏':'可点击右上角 ▦ 总览并跳转';
  /* self-grade handlers (rebound each render) */
  $('selfRight').onclick=function(){grade(q,true);};
  $('selfWrong').onclick=function(){grade(q,false);};
}
function answeredInList(){var n=0;for(var i=0;i<S.ids.length;i++){var r=P[S.ids[i]];if(r&&r.v)n++;}return n;}
function pick(q,key){
  var rec=P[q.id]||{};
  if(rec.v)return; /* 已答不可改 */
  if(q.t==='j'){
    rec.pick=key;rec.v=true;rec.ok=(q.a===key);
  }else if(q.t==='s'){
    rec.pick=key;rec.v=true;rec.ok=(q.a===key);
  }else{
    /* multi: need submit */
    var cur=(rec.pick||'').split('');var ix=cur.indexOf(key);
    if(ix>=0)cur.splice(ix,1);else cur.push(key);
    cur.sort();rec.pick=cur.join('');
    if(!rec.tmpSubmit){P[q.id]=rec;saveP();renderQ();return;}
  }
  P[q.id]=rec;saveP();renderQ();
  if(OPT.auto&&rec.ok&&S.idx<S.ids.length-1){setTimeout(function(){go(1);},450);}
}
/* multi uses a two-step: tap options, then confirm via a floating button injected into answer area */
function renderMultiConfirm(q){
  var rec=P[q.id]||{};
  if(q.t!=='multi'||rec.v)return;
  var btn=document.createElement('button');btn.className='btn';btn.style.width='100%';btn.style.marginTop='12px';
  btn.textContent='确认答案（已选 '+((rec.pick||'').length||0)+' 项）';
  btn.onclick=function(){
    var r=P[q.id]||{};r.tmpSubmit=true;r.v=true;
    r.ok=((r.pick||'')===(q.a||''));
    P[q.id]=r;saveP();renderQ();
    if(OPT.auto&&r.ok&&S.idx<S.ids.length-1){setTimeout(function(){go(1);},450);}
  };
  $('q-opts').appendChild(btn);
}
/* blank: check button instead of self-grade when inputs present */
function renderBlankCheck(q){
  var rec=P[q.id]||{};
  if(q.t!=='b'||rec.v)return;
  var btn=document.createElement('button');btn.className='btn';btn.style.width='100%';btn.style.marginTop='8px';
  btn.textContent='提交答案';
  btn.onclick=function(){
    var ins=$('q-blanks').getElementsByTagName('input'),vals=[];
    for(var i=0;i<ins.length;i++)vals.push((ins[i].value||'').trim());
    var r=P[q.id]||{};r.pick=vals.join('\u0001');
    var ans=q.a||[],ok=true;
    for(var j=0;j<ans.length;j++){
      var u=vals[j]||'',a=String(ans[j]);
      if(!u||!(a.indexOf(u)>=0||u.indexOf(a)>=0)){ok=false;break;}
    }
    r.v=true;r.ok=ok;P[q.id]=r;saveP();renderQ();
  };
  $('q-blanks').appendChild(btn);
}
function grade(q,ok){
  var r=P[q.id]||{};
  r.note=$('q-note').value||'';
  r.v=true;r.ok=ok;P[q.id]=r;saveP();renderQ();
}
function showAns(q,rec){
  var a=$('q-ans');a.style.display='';
  var correct=(q.t==='j')?(q.a==='对'?'对':'错'):(q.a||'');
  var disp=correct;
  if(q.t==='j'){disp=(q.a==='对')?'对':'错';}
  var head='<span class="'+(rec.ok?'ok':'no')+'">'+(rec.ok?'✓ 回答正确':'✗ 回答错误')+'</span>';
  if(q.t==='b') head+='　<span class="lbl">正确答案：</span>'+esc((q.a||[]).join(' / '));
  else if(q.t==='x') head+='　<span class="lbl">参考答案见下</span>';
  else head+='　<span class="lbl">正确答案：</span>'+esc(disp);
  var body='';
  if(q.t==='x'){
    body='<div style="margin-top:8px;white-space:pre-wrap">'+esc(q.a||'')+'</div>';
  }else if(q.e){body='<div style="margin-top:6px"><span class="lbl">解析：</span>'+esc(q.e)+'</div>';}
  if(q.t==='b') body+='<div style="margin-top:6px;color:#6b7486;font-size:12px">你的答案：'+esc((rec.pick||'').split('\u0001').join(' / '))+'</div>';
  a.innerHTML=head+body;
}
function go(step){
  if(!S)return;
  var n=S.idx+step;
  if(n<0){toast('已经是第一题');return;}
  if(n>=S.ids.length){ask('已完成','本组题目已全部作答/浏览，返回首页？',function(ok){if(ok)showScreen('s-home');renderHome();});return;}
  S.idx=n;saveS();renderQ();window.scrollTo(0,0);
}
function toggleFav(){
  if(!S)return;var q=BYID[S.ids[S.idx]];if(!q)return;
  var r=P[q.id]||{};r.f=!r.f;P[q.id]=r;saveP();renderQ();toast(r.f?'已收藏':'已取消收藏');
}
(function bindQuiz(){
  $('backBtn').onclick=function(){saveS();showScreen('s-home');renderHome();};
  $('favBtn').onclick=toggleFav;
  $('overBtn').onclick=openOverview;
  $('mask').onclick=closeOverview;
  document.addEventListener('keydown',function(e){
    if(!$('s-quiz').classList.contains('on'))return;
    if(e.key==='ArrowLeft'||e.key==='a')go(-1);
    if(e.key==='ArrowRight'||e.key==='d')go(1);
  });
  /* swipe */
  var sx=0,sy=0;
  $('q-text').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  $('q-text').addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){go(dx<0?1:-1);}
  },{passive:true});
})();

/* ---------- overview ---------- */
var OV_PAGE=0, OV_SIZE=100;
function openOverview(){
  OV_PAGE=Math.floor(S.idx/OV_SIZE);
  drawOverview();
  $('mask').className='mask on';$('sheet').className='sheet on';
}
function drawOverview(){
  var g=$('ov-grid');g.innerHTML='';
  var ok=0,no=0,dn=0;
  for(var i=0;i<S.ids.length;i++){
    var st=statusOf(S.ids[i]);
    if(st===1)ok++;else if(st===2)no++;if(st)dn++;
  }
  var pages=Math.max(1,Math.ceil(S.ids.length/OV_SIZE));
  if(OV_PAGE<0)OV_PAGE=0;if(OV_PAGE>=pages)OV_PAGE=pages-1;
  var start=OV_PAGE*OV_SIZE,end=Math.min(start+OV_SIZE,S.ids.length);
  for(var k=start;k<end;k++){
    (function(idx){
      var id=S.ids[idx],st=statusOf(id),r=P[id]||{};
      var d=document.createElement('div');d.className='cell'+(st===1?' ok':st===2?' no':'')+(idx===S.idx?' cur':'');
      d.textContent=idx+1;
      if(r.f){var s=document.createElement('span');s.className='dot';s.textContent='★';d.appendChild(s);}
      d.onclick=function(){S.idx=idx;saveS();renderQ();closeOverview();window.scrollTo(0,0);};
      g.appendChild(d);
    })(k);
  }
  $('ov-page').textContent=(OV_PAGE+1)+' / '+pages;
  $('ov-prev').onclick=function(){OV_PAGE--;drawOverview();};
  $('ov-next').onclick=function(){OV_PAGE++;drawOverview();};
  $('ov-stat').textContent='已答 '+dn+' / '+S.ids.length+'（正确 '+ok+' · 错误 '+no+'）';
}
function closeOverview(){$('mask').className='mask';$('sheet').className='sheet';}

/* ---------- init ---------- */
/* inject multi-confirm / blank-submit into renderQ via hook */
var _render=renderQ;
renderQ=function(){
  _render();
  if(S){var q=BYID[S.ids[S.idx]];if(!q)return;renderMultiConfirm(q);renderBlankCheck(q);}
};
renderHome();renderFilter();
if(!storeOK)toast('当前浏览器禁用了本地存储，进度不会保存');

/* ---------- service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
